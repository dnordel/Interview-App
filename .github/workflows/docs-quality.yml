name: Docs Quality

on:
  pull_request:
    paths:
      - 'docs/**'
      - '**/*.md'
      - '.markdownlint.json'
      - '.lychee.toml'
      - '.lycheeignore'
      - '.proselintrc'
      - '.github/workflows/docs-quality.yml'

permissions:
  contents: read

jobs:
  markdown-lint:
    name: Markdown lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run markdownlint-cli2
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          mapfile -d '' markdown_files < <(
            git diff --name-only --diff-filter=ACMR -z \
              "$BASE_SHA" "$HEAD_SHA" -- '*.md'
          )
          if (( ${#markdown_files[@]} == 0 )); then
            echo "No changed Markdown files to lint."
            exit 0
          fi
          npx --yes markdownlint-cli2 "${markdown_files[@]}"

  markdown-links:
    name: Markdown link check (internal)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run lychee against markdown files
        uses: lycheeverse/lychee-action@v2
        with:
          args: --config .lychee.toml --no-progress "**/*.md"

  prose-style:
    name: Optional prose/style check (maintainer docs)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install proselint
        run: pip install proselint

      - name: Run proselint for maintainer-facing docs
        run: |
          proselint check \
            docs/CONTRIBUTING_DOCS.md \
            docs/README.md \
            docs/accessibility_pr_checklist.md
