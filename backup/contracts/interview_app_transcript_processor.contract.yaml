module:
  name: interview_app_transcript_processor
  language: python
  path: src/interview_app/transcript_processor.py
  version: 1.0.0
  description: Pure transcript processing utilities for JSONL extraction, flow window mapping, and merged transcript output.
functions:
- name: normalize_label
  description: Normalize speaker labels for case-insensitive comparisons.
  locked: false
  inputs:
    value:
      type: Any
      required: true
  returns:
    type: str
  exceptions: []
  side_effects: none
- name: extract_candidate_text_from_jsonl
  description: Read candidate-only text from a transcript JSONL file and return merged text.
  locked: false
  inputs:
    jsonl_path:
      type: Path
      required: true
    candidate_label:
      type: str
      required: true
  returns:
    type: str
  exceptions: []
  side_effects: reads filesystem
- name: load_candidate_segments
  description: Load candidate segments from JSONL with start time and text, skipping malformed records.
  locked: false
  inputs:
    jsonl_path:
      type: Path
      required: true
    candidate_label:
      type: str
      required: true
  returns:
    type: list[dict[str, Any]]
  exceptions: []
  side_effects: reads filesystem
- name: load_jsonl_segments_for_merge
  description: Load raw JSON object segments from JSONL for merged transcript generation.
  locked: false
  inputs:
    jsonl_path:
      type: Path
      required: true
  returns:
    type: list[dict[str, Any]]
  exceptions: []
  side_effects: reads filesystem
- name: build_flow_time_windows
  description: Build flow index start/end windows from recorded flow time marks.
  locked: false
  inputs:
    flow_time_marks:
      type: list[dict[str, Any]]
      required: true
  returns:
    type: list[tuple[int, float, float]]
  exceptions: []
  side_effects: none
- name: map_segments_to_flow_indices
  description: Map candidate segments into flow indices by windowed start-time membership.
  locked: false
  inputs:
    segments:
      type: list[dict[str, Any]]
      required: true
    windows:
      type: list[tuple[int, float, float]]
      required: true
  returns:
    type: dict[int, str]
  exceptions: []
  side_effects: none
- name: write_merged_timestamped_transcript
  description: Write a timestamped interleaved transcript text file from segment records.
  locked: false
  inputs:
    transcript_path:
      type: Path
      required: true
    segments:
      type: list[dict[str, Any]]
      required: true
  returns:
    type: Path
  exceptions: []
  side_effects: writes filesystem
- name: format_seconds_for_transcript
  description: Format seconds into rounded HH:MM:SS transcript timestamps.
  locked: false
  inputs:
    seconds:
      type: Any
      required: true
  returns:
    type: str
  exceptions: []
  side_effects: none
classes: []
data_structures: []
dependencies: []
