module:
  name: setup_and_run
  language: powershell
  path: setup_and_run.ps1
  version: 1.0.5
  description: Windows launcher bootstrap that checks prerequisites, installs Python 3.11 when needed, provisions a per-user virtual environment, and starts the interview app through the runtime wrapper.
functions:
  - name: Write-Log
    description: Append launcher diagnostics to the setup log file.
    locked: false
    inputs:
      msg:
        type: string
        required: true
    returns:
      type: void
    exceptions: []
    side_effects: writes launcher log entries
  - name: Get-ConfigBaseDir
    description: Ensure the per-user configuration directory exists under LOCALAPPDATA and return it.
    locked: false
    inputs: {}
    returns:
      type: string
    exceptions: []
    side_effects: may create the per-user configuration directory
  - name: Get-ConfigPath
    description: Build the path to the persisted setup configuration JSON file.
    locked: false
    inputs: {}
    returns:
      type: string
    exceptions: []
    side_effects: none
  - name: Load-Config
    description: Load the persisted setup configuration and fall back to default values when parsing fails or the file is missing.
    locked: false
    inputs: {}
    returns:
      type: pscustomobject
    exceptions: []
    side_effects: reads the persisted setup configuration and writes diagnostics when parsing fails
  - name: Save-Config
    description: Persist the current setup configuration to disk as JSON.
    locked: false
    inputs:
      cfg:
        type: pscustomobject
        required: true
    returns:
      type: void
    exceptions: []
    side_effects: writes the persisted setup configuration and launcher log entries
  - name: Ensure-ConfigShape
    description: Normalize the configuration object so required nested properties exist before later setup steps run.
    locked: false
    inputs:
      cfg:
        type: pscustomobject
        required: true
    returns:
      type: pscustomobject
    exceptions: []
    side_effects: may mutate the provided configuration object in memory
  - name: Start-PythonGuiApp
    description: Launch the interview application through python or pythonw with optional redirected logging.
    locked: false
    inputs:
      PythonExe:
        type: string
        required: true
      ScriptPath:
        type: string
        required: true
      WorkingDir:
        type: string
        required: true
      ScriptArgs:
        type: string[]
        required: false
        default: []
      LogFile:
        type: string | null
        required: false
        default: null
      ShowConsole:
        type: switch
        required: false
        default: false
    returns:
      type: System.Diagnostics.Process
    exceptions:
      - Exception
    side_effects: starts a child Python process and may write redirected runtime logs
  - name: Run-Proc
    description: Execute a child process, capture stdout and stderr, and append both streams to the setup log.
    locked: false
    inputs:
      File:
        type: string
        required: true
      Args:
        type: string[]
        required: false
        default: []
      WorkingDir:
        type: string
        required: false
        default: $AppDir
    returns:
      type: int
    exceptions: []
    side_effects: starts a child process and writes captured output to the setup log
  - name: Get-CachedPython311
    description: Return the cached Python 3.11 executable path from configuration when present.
    locked: false
    inputs:
      cfg:
        type: pscustomobject
        required: true
    returns:
      type: string | null
    exceptions: []
    side_effects: none
  - name: Set-CachedPython311
    description: Update the cached Python 3.11 executable path in configuration and persist it.
    locked: false
    inputs:
      cfg:
        type: pscustomobject
        required: true
      path:
        type: string
        required: true
    returns:
      type: void
    exceptions: []
    side_effects: mutates configuration and writes the persisted setup configuration
  - name: Test-Python311Exe
    description: Verify that a candidate interpreter exists and reports Python 3.11.
    locked: false
    inputs:
      pythonExe:
        type: string
        required: true
    returns:
      type: bool
    exceptions: []
    side_effects: executes the candidate Python interpreter
  - name: Get-RegistryAppPathsPythonCandidates
    description: Collect Python executable candidates from Windows App Paths registry keys.
    locked: false
    inputs: {}
    returns:
      type: string[]
    exceptions: []
    side_effects: reads Windows registry keys
  - name: Find-Python311
    description: Search cache, launchers, registry entries, common install directories, and PATH for a usable Python 3.11 interpreter.
    locked: false
    inputs:
      Cfg:
        type: pscustomobject
        required: true
    returns:
      type: string | null
    exceptions: []
    side_effects: executes local interpreter probes and writes launcher log entries
  - name: Ensure-Python311
    description: Reuse an existing Python 3.11 interpreter or perform a per-user install from python.org when none is available.
    locked: false
    inputs:
      Cfg:
        type: pscustomobject
        required: true
    returns:
      type: string
    exceptions:
      - Exception
    side_effects: may download and install Python 3.11, update cached configuration, and write launcher log entries
  - name: Find-VBCableDriverEvidence
    description: Detect VB-CABLE installation evidence by checking known driver file locations.
    locked: false
    inputs: {}
    returns:
      type: string[]
    exceptions: []
    side_effects: reads known driver paths from the local filesystem
  - name: Set-VBCableCache
    description: Persist the latest VB-CABLE detection result and supporting evidence in configuration.
    locked: false
    inputs:
      cfg:
        type: pscustomobject
        required: true
      detected:
        type: Nullable[bool]
        required: true
      evidence:
        type: string[]
        required: true
    returns:
      type: void
    exceptions: []
    side_effects: mutates configuration and writes the persisted setup configuration
  - name: Ensure-VBCableStatus
    description: Re-evaluate VB-CABLE detection, cache the result, and mark user confirmation when the driver is present.
    locked: false
    inputs:
      Cfg:
        type: pscustomobject
        required: true
    returns:
      type: pscustomobject
    exceptions: []
    side_effects: updates VB-CABLE cache values and writes launcher log entries
  - name: Test-NvidiaGPU
    description: Detect whether the current Windows machine exposes an NVIDIA GPU for optional audio acceleration dependencies.
    locked: false
    inputs: {}
    returns:
      type: bool
    exceptions: []
    side_effects: queries local executables and WMI and writes launcher log entries
  - name: Ensure-VenvAndDeps
    description: Create or repair the per-user virtual environment, install requirements, and add optional GPU dependencies when supported.
    locked: false
    inputs:
      PyExe:
        type: string
        required: true
    returns:
      type: string
    exceptions:
      - Exception
    side_effects: creates or recreates the per-user virtual environment, installs pip packages, and writes launcher log entries
  - name: Ensure-RequiredDepsInstalled
    description: Validate required Python modules inside the virtual environment and install missing packages individually.
    locked: false
    inputs:
      VenvPy:
        type: string
        required: true
    returns:
      type: void
    exceptions:
      - Exception
    side_effects: executes package checks, may install required packages, and writes launcher log entries
  - name: Find-AppFile
    description: Resolve the interview application entrypoint by using cached configuration, repository defaults, or a user file picker.
    locked: false
    inputs:
      Cfg:
        type: pscustomobject
        required: true
    returns:
      type: string
    exceptions:
      - Exception
    side_effects: may update cached app configuration and open a file picker dialog
  - name: Show-VBCablePrompt
    description: Prompt the user about VB-CABLE installation only when automatic detection does not confirm the driver.
    locked: false
    inputs:
      Cfg:
        type: pscustomobject
        required: true
    returns:
      type: pscustomobject
    exceptions: []
    side_effects: may display a Windows Forms dialog, mutate configuration, and persist prompt preferences
  - name: Set-Progress
    description: Update the installer progress UI and mirror the status text into the launcher log.
    locked: false
    inputs:
      pct:
        type: int
        required: true
      text:
        type: string
        required: true
    returns:
      type: void
    exceptions: []
    side_effects: updates Windows Forms controls and writes launcher log entries
classes: []
data_structures: []
dependencies:
  - runtime_wrapper
  - interview_app
