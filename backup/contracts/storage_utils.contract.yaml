module:
  name: storage_utils
  language: python
  path: src/storage_utils.py
  version: 1.0.0
  description: Shared JSON persistence helpers for atomic writes and safe reads.
functions:
- name: atomic_write_json
  description: Write JSON payload atomically to a filesystem path.
  locked: false
  inputs:
    path:
      type: Path
      required: true
    payload:
      type: Any
      required: true
    indent:
      type: int
      required: false
      default: 2
    ensure_ascii:
      type: bool
      required: false
      default: false
  returns:
    type: None
  exceptions:
  - OSError
  - TypeError
  - ValueError
  side_effects: Creates parent directories and writes/replaces files on disk.
- name: safe_read_json
  description: Read JSON payload with fallback behavior for missing/invalid content.
  locked: false
  inputs:
    path:
      type: Path
      required: true
    default:
      type: Any
      required: true
    expected_type:
      type: type[Any] | None
      required: false
      default: null
  returns:
    type: Any
  exceptions: []
  side_effects: Reads from filesystem.
classes: []
data_structures: []
dependencies: []
