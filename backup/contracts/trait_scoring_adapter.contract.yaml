module:
  name: trait_scoring_adapter
  language: python
  path: src/trait_scoring_adapter.py
  version: 1.7.1
  description: Stable adapter boundary between app trait state and finalize/export
    scoring consumers, using the configured runtime trait-definition JSON files as
    the source of truth.
functions:
- name: build_trait_scoring_payload
  description: Normalize app trait state, invoke scoring, and return the shared finalize/export
    scoring payload.
  locked: false
  inputs:
    rubric:
      type: dict[str, Any]
      required: true
    track_key:
      type: Any
      required: true
    trait_state:
      type: dict[str, dict[str, Any]] | None
      required: true
    engine_module_contract_path:
      type: str | Path
      required: false
      default: contracts/trait_based_scoring_engine.contract.yaml
    engine_runtime_contract_path:
      type: str | Path
      required: false
      default: Trait-Based Scoring/trait_based_scoring_contract.yaml
  returns:
    type: NormalizedTraitScoringPayload
  exceptions:
  - ReportingValidationError
  side_effects: Reads scoring contracts/runtime assets from disk.
- name: load_module_contract_runtime_bundle
  description: Load scoring engine module-contract metadata, runtime bundle metadata,
    and trait definitions resolved from the configured runtime trait-definition source.
  locked: false
  inputs:
    engine_module_contract_path:
      type: str | Path
      required: true
    engine_runtime_contract_path:
      type: str | Path
      required: true
  returns:
    type: RuntimeBundleMetadata
  exceptions: []
  side_effects: Reads YAML scoring assets and configured trait-definition JSON files
    from disk.
- name: load_trait_definitions
  description: Resolve runtime trait definitions from the configured traits directory
    or contract path instead of assuming they are embedded in the runtime bundle payload.
  locked: false
  inputs:
    runtime_bundle:
      type: dict[str, Any]
      required: true
  returns:
    type: list[TraitDefinition]
  exceptions: []
  side_effects: May read configured runtime trait-definition JSON files from disk.
- name: validate_runtime_bundle_metadata
  description: Raise a validation error when runtime bundle metadata indicates scoring
    configuration load failures.
  locked: false
  inputs:
    runtime_bundle:
      type: RuntimeBundleMetadata
      required: true
  returns:
    type: None
  exceptions:
  - ReportingValidationError
  side_effects: none
- name: normalize_skipped
  description: Normalize skipped flag inputs into canonical boolean values.
  locked: false
  inputs:
    value:
      type: Any
      required: true
  returns:
    type: bool
  exceptions: []
  side_effects: none
- name: normalize_absolute_disqualifier
  description: Normalize absolute disqualifier flag inputs into canonical boolean
    values.
  locked: false
  inputs:
    value:
      type: Any
      required: true
  returns:
    type: bool
  exceptions: []
  side_effects: none
- name: coerce_raw_score
  description: Coerce raw-score inputs into canonical integer scores or None.
  locked: false
  inputs:
    value:
      type: Any
      required: true
  returns:
    type: int | None
  exceptions: []
  side_effects: none
- name: normalize_verbatim_notes
  description: Normalize verbatim-note inputs into canonical trimmed strings.
  locked: false
  inputs:
    value:
      type: Any
      required: true
  returns:
    type: str
  exceptions: []
  side_effects: none
- name: normalize_trait_state_item
  description: Produce a canonical normalized trait-state object for one trait input,
    normalizing all accepted checkbox-selection variants into selected_signal_ids.
  locked: false
  inputs:
    state:
      type: dict[str, Any] | None
      required: true
  returns:
    type: NormalizedTraitState
  exceptions: []
  side_effects: none
- name: normalize_app_trait_state
  description: Normalize raw app trait state into canonical trait-state objects keyed
    by canonical rubric trait ids, mapping legacy runtime ids when needed.
  locked: false
  inputs:
    trait_state:
      type: dict[str, dict[str, Any]] | None
      required: true
  returns:
    type: dict[str, NormalizedTraitState]
  exceptions: []
  side_effects: none
- name: validate_normalized_state
  description: Validate canonical normalized trait state before scoring or finalize/export
    mapping while keeping skip/disqualifier semantics explicit.
  locked: false
  inputs:
    normalized_state:
      type: dict[str, NormalizedTraitState]
      required: true
  returns:
    type: None
  exceptions:
  - ReportingValidationError
  side_effects: none
- name: invoke_scoring_engine
  description: Evaluate normalized trait state with the caller-resolved trait runtime
    bundle and contract path only, failing closed after reconciling canonical rubric
    trait ids with legacy runtime aliases.
  locked: false
  inputs:
    rubric:
      type: dict[str, Any]
      required: true
    track_key:
      type: Any
      required: true
    normalized_state:
      type: dict[str, NormalizedTraitState]
      required: true
    runtime_bundle:
      type: RuntimeBundleMetadata
      required: true
    engine_runtime_contract_path:
      type: str | Path
      required: true
  returns:
    type: dict[str, Any]
  exceptions:
  - ReportingValidationError
  side_effects: none
- name: _contract_resolution_base_dir
  description: Return the deterministic repository root used to resolve default scoring
    contract paths independent of the process working directory.
  locked: false
  inputs: {}
  returns:
    type: Path
  exceptions: []
  side_effects: none
- name: _resolve_contract_path_from_base
  description: Resolve a configured filesystem path against the provided deterministic
    base directory when the input path is relative.
  locked: false
  inputs:
    path:
      type: str | Path
      required: true
    base_dir:
      type: Path
      required: true
  returns:
    type: Path
  exceptions: []
  side_effects: none
- name: _resolve_contract_path
  description: Resolve a configured filesystem path to an absolute Path using the
    deterministic module-derived repository root for relative defaults.
  locked: false
  inputs:
    path:
      type: str | Path
      required: true
  returns:
    type: Path
  exceptions: []
  side_effects: none
- name: _raise_for_rubric_runtime_mismatch
  description: Raise when rubric-required trait ids are missing from the runtime trait
    definitions.
  locked: false
  inputs:
    resolved_track_key:
      type: Any
      required: true
    rubric_trait_ids:
      type: Any
      required: true
    runtime_trait_ids:
      type: Any
      required: true
  returns:
    type: None
  exceptions:
  - ReportingValidationError
  side_effects: none
- name: _raise_for_missing_trait_overlap
  description: Raise when finalized trait inputs do not overlap the runtime trait
    definitions.
  locked: false
  inputs:
    input_trait_ids:
      type: Any
      required: true
    runtime_trait_ids:
      type: Any
      required: true
  returns:
    type: None
  exceptions:
  - ReportingValidationError
  side_effects: none
- name: _trait_ids_from_rubric
  description: Collect trait identifiers configured for the resolved rubric track.
  locked: false
  inputs:
    rubric:
      type: Any
      required: true
    resolved_track_key:
      type: Any
      required: true
  returns:
    type: set[str]
  exceptions: []
  side_effects: none
- name: _trait_ids_from_normalized_state
  description: Collect normalized trait identifiers from normalized trait state.
  locked: false
  inputs:
    normalized_state:
      type: Any
      required: true
  returns:
    type: set[str]
  exceptions: []
  side_effects: none
- name: _trait_ids_from_runtime_definitions
  description: Collect normalized trait identifiers from runtime trait definitions.
  locked: false
  inputs:
    trait_definitions:
      type: Any
      required: true
  returns:
    type: set[str]
  exceptions: []
  side_effects: none
- name: _validate_trait_scoring_configuration
  description: Validate rubric, runtime, and normalized trait-state alignment before
    scoring.
  locked: false
  inputs:
    rubric:
      type: dict[str, Any]
      required: true
    track_key:
      type: Any
      required: true
    trait_definitions:
      type: list[TraitDefinition]
      required: true
    normalized_state:
      type: dict[str, NormalizedTraitState]
      required: true
  returns:
    type: None
  exceptions:
  - ReportingValidationError
  side_effects: none
- name: map_engine_output_to_normalized_shape
  description: Convert scoring engine output into the shared finalize/export scoring
    payload shape with explicit critical and override decision metadata.
  locked: false
  inputs:
    rubric:
      type: dict[str, Any]
      required: true
    track_key:
      type: Any
      required: true
    normalized_state:
      type: dict[str, NormalizedTraitState]
      required: true
    engine_output:
      type: dict[str, Any]
      required: true
    runtime_bundle:
      type: RuntimeBundleMetadata
      required: true
  returns:
    type: NormalizedTraitScoringPayload
  exceptions: []
  side_effects: none
- name: _build_summary
  description: Assemble shared scoring summary metrics from engine output.
  locked: false
  inputs:
    engine_output:
      type: dict[str, Any]
      required: true
  returns:
    type: dict[str, Any]
  exceptions: []
  side_effects: none
- name: _resolve_scoring_denominator
  description: Resolve the denominator used for percent display from included or configured
    maximums.
  locked: false
  inputs:
    engine_output:
      type: dict[str, Any]
      required: true
    included_max:
      type: int
      required: true
    configured_max:
      type: int
      required: true
  returns:
    type: int
  exceptions: []
  side_effects: none
- name: _resolve_percent_label
  description: Resolve percent label display text, including N/A handling when no
    denominator is available.
  locked: false
  inputs:
    engine_output:
      type: dict[str, Any]
      required: true
    denominator:
      type: int
      required: true
  returns:
    type: str
  exceptions: []
  side_effects: none
- name: _map_trait_row
  description: Map a compatibility scoring row into the normalized trait payload shape.
  locked: false
  inputs:
    row:
      type: dict[str, Any]
      required: true
  returns:
    type: dict[str, Any]
  exceptions: []
  side_effects: none
- name: _is_invalid_raw_score_input
  description: Determine whether a raw-score input should be treated as invalid before
    validation.
  locked: false
  inputs:
    value:
      type: Any
      required: true
  returns:
    type: bool
  exceptions: []
  side_effects: none
- name: _normalize_selected_signal_ids
  description: Normalize accepted trait checkbox-selection variants into the canonical
    selected_signal_ids list.
  locked: false
  inputs:
    source:
      type: dict[str, Any]
      required: true
  returns:
    type: list[str]
  exceptions: []
  side_effects: none
- name: _normalize_selection_variant
  description: Normalize one selection payload variant into a canonical list of signal
    ids.
  locked: false
  inputs:
    value:
      type: Any
      required: true
  returns:
    type: list[str]
  exceptions: []
  side_effects: none
- name: _normalize_selection_mapping
  description: Normalize mapping-based checkbox selections into canonical signal ids.
  locked: false
  inputs:
    value:
      type: dict[str, Any]
      required: true
  returns:
    type: list[str]
  exceptions: []
  side_effects: none
- name: _normalize_selection_sequence
  description: Normalize sequence-based checkbox selections into canonical signal
    ids.
  locked: false
  inputs:
    value:
      type: list[Any] | tuple[Any, ...] | set[Any]
      required: true
  returns:
    type: list[str]
  exceptions: []
  side_effects: none
- name: _normalize_selection_item
  description: Normalize one checkbox-selection item into a canonical signal id when
    selected.
  locked: false
  inputs:
    item:
      type: Any
      required: true
  returns:
    type: str
  exceptions: []
  side_effects: none
- name: _dedupe_signal_ids
  description: Preserve order while removing blank and duplicate canonical signal
    ids.
  locked: false
  inputs:
    signal_ids:
      type: list[str]
      required: true
  returns:
    type: list[str]
  exceptions: []
  side_effects: none
- name: _normalize_bool
  description: Normalize permissive boolean-like inputs into canonical bool values.
  locked: false
  inputs:
    value:
      type: Any
      required: true
  returns:
    type: bool
  exceptions: []
  side_effects: none
- name: _load_yaml
  description: Load a YAML document from disk, returning an empty mapping for non-mapping
    payloads.
  locked: false
  inputs:
    path:
      type: Path
      required: true
  returns:
    type: dict[str, Any]
  exceptions: []
  side_effects: none
- name: _load_runtime_bundle
  description: Load the trait scoring runtime bundle while capturing runtime-load
    errors as metadata.
  locked: false
  inputs:
    runtime_contract_path:
      type: Path
      required: true
  returns:
    type: dict[str, Any]
  exceptions: []
  side_effects: none
- name: _load_trait_engine_class
  description: Load the external trait scoring engine class from the runtime-adjacent
    module path.
  locked: false
  inputs:
    runtime_contract_path:
      type: Path
      required: true
  returns:
    type: type[Any]
  exceptions: []
  side_effects: none
- name: _has_trait_definition_overlap
  description: Determine whether normalized trait state contains traits defined by
    the runtime bundle.
  locked: false
  inputs:
    trait_definitions:
      type: list[dict[str, Any]]
      required: true
    normalized_state:
      type: dict[str, NormalizedTraitState]
      required: true
  returns:
    type: bool
  exceptions: []
  side_effects: none
- name: _build_trait_engine
  description: Construct the runtime trait scoring engine from loaded bundle metadata.
  locked: false
  inputs:
    runtime_bundle:
      type: dict[str, Any]
      required: true
    runtime_contract_path:
      type: Path
      required: true
  returns:
    type: Any
  exceptions:
  - ReportingValidationError
  side_effects: Loads engine module source from disk.
- name: _build_trait_selections
  description: Translate canonical selected_signal_ids from normalized app trait state
    into selected signal references per trait.
  locked: false
  inputs:
    trait_definitions:
      type: list[dict[str, Any]]
      required: true
    normalized_state:
      type: dict[str, NormalizedTraitState]
      required: true
  returns:
    type: dict[str, list[str]]
  exceptions: []
  side_effects: none
- name: _select_signal_refs_for_state
  description: Select signal references for one trait definition from canonical normalized
    state using selected_signal_ids only.
  locked: false
  inputs:
    trait_definition:
      type: dict[str, Any]
      required: true
    state:
      type: NormalizedTraitState
      required: true
  returns:
    type: list[str]
  exceptions: []
  side_effects: none
- name: _positive_signal_refs
  description: Return positively weighted signal references for a trait definition.
  locked: false
  inputs:
    trait_definition:
      type: dict[str, Any]
      required: true
  returns:
    type: list[str]
  exceptions: []
  side_effects: none
- name: _negative_signal_refs
  description: Return negatively weighted signal references for a trait definition.
  locked: false
  inputs:
    trait_definition:
      type: dict[str, Any]
      required: true
  returns:
    type: list[str]
  exceptions: []
  side_effects: none
- name: _signal_refs_by_weight
  description: Filter trait signal references by positive or negative weight.
  locked: false
  inputs:
    trait_definition:
      type: dict[str, Any]
      required: true
    positive:
      type: bool
      required: true
  returns:
    type: list[str]
  exceptions: []
  side_effects: none
- name: _iter_trait_signals
  description: Flatten core and extended trait signals into one ordered collection.
  locked: false
  inputs:
    trait_definition:
      type: dict[str, Any]
      required: true
  returns:
    type: list[dict[str, Any]]
  exceptions: []
  side_effects: none
- name: _iter_extended_trait_signals
  description: Flatten extended trait signals across grouped and runtime extended schemas.
  locked: false
  inputs:
    trait_definition:
      type: dict[str, Any]
      required: true
  returns:
    type: list[dict[str, Any]]
  exceptions: []
  side_effects: none
- name: _build_compatibility_engine_output
  description: Project trait-engine session output into the reporting-compatible scoring
    shape.
  locked: false
  inputs:
    rubric:
      type: dict[str, Any]
      required: true
    track_key:
      type: Any
      required: true
    normalized_state:
      type: dict[str, NormalizedTraitState]
      required: true
    trait_definitions:
      type: list[dict[str, Any]]
      required: true
    session_result:
      type: dict[str, Any]
      required: true
  returns:
    type: dict[str, Any]
  exceptions:
  - ReportingValidationError
  side_effects: none
- name: _rubric_trait_map
  description: Index rubric trait configuration by trait id for the resolved track.
  locked: false
  inputs:
    rubric:
      type: dict[str, Any]
      required: true
    resolved_track_key:
      type: str
      required: true
  returns:
    type: dict[str, dict[str, Any]]
  exceptions:
  - ReportingValidationError
  side_effects: none
- name: _build_rows
  description: Build reporting-compatible row payloads for normalized trait scoring
    results.
  locked: false
  inputs:
    trait_definitions:
      type: list[dict[str, Any]]
      required: true
    normalized_state:
      type: dict[str, NormalizedTraitState]
      required: true
    session_result:
      type: dict[str, Any]
      required: true
    rubric_traits:
      type: dict[str, dict[str, Any]]
      required: true
  returns:
    type: list[dict[str, Any]]
  exceptions: []
  side_effects: none
- name: _build_trait_row
  description: Build one reporting-compatible row for a scored trait definition.
  locked: false
  inputs:
    trait_definition:
      type: dict[str, Any]
      required: true
    normalized_trait_state:
      type: NormalizedTraitState
      required: true
    trait_result:
      type: dict[str, Any]
      required: true
    rubric_trait:
      type: dict[str, Any]
      required: true
  returns:
    type: dict[str, Any]
  exceptions: []
  side_effects: none
- name: _max_weighted_total
  description: Compute included weighted-total capacity from built scoring rows.
  locked: false
  inputs:
    rows:
      type: list[dict[str, Any]]
      required: true
  returns:
    type: int
  exceptions: []
  side_effects: none
- name: _max_trait_final_score
  description: Compute the maximum final trait score from the trait-engine definition.
  locked: false
  inputs:
    trait_definition:
      type: dict[str, Any]
      required: true
  returns:
    type: float
  exceptions: []
  side_effects: none
- name: _configured_max_weighted_total
  description: Resolve the configured track max weighted total with row-based fallback.
  locked: false
  inputs:
    rubric:
      type: dict[str, Any]
      required: true
    resolved_track_key:
      type: str
      required: true
    rows:
      type: list[dict[str, Any]]
      required: true
  returns:
    type: int
  exceptions:
  - ReportingValidationError
  side_effects: none
- name: _resolve_percent_denominator
  description: Choose the denominator used for percent-of-max calculations.
  locked: false
  inputs:
    included_max_weighted_total:
      type: int
      required: true
    configured_max_weighted_total:
      type: int
      required: true
  returns:
    type: int
  exceptions: []
  side_effects: none
- name: _percent_of_max
  description: Compute percent-of-max from weighted total and denominator.
  locked: false
  inputs:
    weighted_total:
      type: int
      required: true
    max_weighted_total:
      type: int
      required: true
  returns:
    type: float
  exceptions: []
  side_effects: none
- name: _percent_label
  description: Format percent-of-max for operator-facing display.
  locked: false
  inputs:
    percent_of_max:
      type: float
      required: true
    included_max_weighted_total:
      type: int
      required: true
  returns:
    type: str
  exceptions: []
  side_effects: none
classes: []
data_structures:
- name: TraitDefinition
  description: Runtime trait definition loaded from the configured trait JSON files.
  fields:
    trait_id:
      type: str
    core_signals:
      type: list[dict[str, Any]]
    extended_signal_groups:
      type: list[dict[str, Any]]
- name: RuntimeBundleMetadata
  description: Scoring runtime metadata including resolved trait definitions and runtime
    loading status.
  fields:
    config:
      type: dict[str, Any]
    signal_dictionary:
      type: dict[str, Any]
    trait_definitions:
      type: list[TraitDefinition]
    resolved_paths:
      type: dict[str, str]
    runtime_contract_path:
      type: str
    runtime_bundle_loaded:
      type: bool
    runtime_error:
      type: str | None
dependencies:
- reporting
- trait_based_scoring_engine
- trait_definition_loader
- trait_signal_schema
