module:
  name: app_logging
  language: python
  path: src/app_logging.py
  version: 1.0.0
  description: Structured JSON logging with redaction and crash-report support.
functions:
- name: initialize_app_logging
  description: Configure root logging handlers and uncaught exception hooks.
  locked: false
  inputs:
    app_root:
      type: Path | None
      required: false
      default: null
  returns:
    type: Path
  exceptions:
  - OSError
  side_effects: Creates log directories/files and mutates global logging configuration.
- name: get_configured_log_path
  description: Return current configured application log file path.
  locked: false
  inputs: {}
  returns:
    type: Path | None
  exceptions: []
  side_effects: none
- name: write_crash_report
  description: Persist a crash report to disk for unhandled exceptions.
  locked: false
  inputs:
    source:
      type: str
      required: true
    exc_type:
      type: type[BaseException]
      required: true
    exc_value:
      type: BaseException
      required: true
    exc_traceback:
      type: TracebackType | None
      required: true
    app_root:
      type: Path | None
      required: false
      default: null
  returns:
    type: Path | None
  exceptions: []
  side_effects: Creates crash report files under logs.
- name: _build_crash_payload
  description: Build serializable crash metadata payload.
  locked: false
  inputs:
    source:
      type: str
      required: true
    exc_type:
      type: type[BaseException]
      required: true
    exc_value:
      type: BaseException
      required: true
    exc_traceback:
      type: TracebackType | None
      required: true
  returns:
    type: dict[str, Any]
  exceptions: []
  side_effects: none
- name: _traceback_origin
  description: Extract origin metadata from traceback object.
  locked: false
  inputs:
    exc_traceback:
      type: TracebackType | None
      required: true
  returns:
    type: dict[str, Any]
  exceptions: []
  side_effects: none
- name: install_uncaught_exception_hooks
  description: Install process and thread unhandled exception hooks.
  locked: false
  inputs: {}
  returns:
    type: None
  exceptions: []
  side_effects: Mutates sys.excepthook and threading.excepthook.
- name: _attach_handler_once
  description: Attach logging handler if equivalent handler is not already present.
  locked: false
  inputs:
    root_logger:
      type: logging.Logger
      required: true
    handler:
      type: logging.Handler
      required: true
  returns:
    type: None
  exceptions: []
  side_effects: Mutates root logger handler collection.
- name: _resolve_log_level
  description: Resolve effective logging level from environment.
  locked: false
  inputs: {}
  returns:
    type: int
  exceptions: []
  side_effects: Reads process environment variables.
- name: _redact_field
  description: Redact sensitive field values by key.
  locked: false
  inputs:
    key:
      type: str
      required: true
    value:
      type: Any
      required: true
  returns:
    type: Any
  exceptions: []
  side_effects: none
- name: _redact_value
  description: Redact sensitive values recursively.
  locked: false
  inputs:
    value:
      type: Any
      required: true
  returns:
    type: Any
  exceptions: []
  side_effects: none
- name: _redact_text
  description: Redact emails and phone numbers from free-text strings.
  locked: false
  inputs:
    text:
      type: str
      required: true
  returns:
    type: str
  exceptions: []
  side_effects: none
- name: _serialize
  description: Convert arbitrary values into JSON-serializable structures.
  locked: false
  inputs:
    value:
      type: Any
      required: true
  returns:
    type: Any
  exceptions: []
  side_effects: none
classes:
- name: RedactionFilter
  description: Logging filter that redacts sensitive extras, messages, and args.
  locked: false
  attributes: {}
  methods:
  - name: filter
    description: Redact fields on a log record before formatting.
    locked: false
    inputs:
      record:
        type: logging.LogRecord
        required: true
    returns:
      type: bool
    exceptions: []
    side_effects: Mutates the provided log record object.
- name: JsonLogFormatter
  description: JSON formatter for structured log output.
  locked: false
  attributes: {}
  methods:
  - name: format
    description: Format a log record into a JSON string.
    locked: false
    inputs:
      record:
        type: logging.LogRecord
        required: true
    returns:
      type: str
    exceptions: []
    side_effects: none
  - name: _collect_extras
    description: Collect non-standard log record attributes.
    locked: false
    inputs:
      record:
        type: logging.LogRecord
        required: true
    returns:
      type: dict[str, Any]
    exceptions: []
    side_effects: none
data_structures:
- name: _SENSITIVE_KEYS
  type: set[str]
- name: _EMAIL_PATTERN
  type: Pattern[str]
- name: _PHONE_PATTERN
  type: Pattern[str]
dependencies: []
