name: Contract review cycle
description: Run a baseline + section drift review cycle with security gates.
title: "[Contract Review] <scope>: baseline + section passes"
labels:
  - contracts
  - governance
body:
  - type: markdown
    attributes:
      value: |
        Use this template for contract review cycles. Keep work in small single-developer units and include acceptance criteria.
  - type: input
    id: owner
    attributes:
      label: Owner
      description: Single accountable engineer for this cycle.
      placeholder: "@github-handle"
    validations:
      required: true
  - type: textarea
    id: sequence
    attributes:
      label: Sequencing
      description: Describe baseline pass and section-by-section pass order.
      placeholder: |
        1) baseline
        2) locked
        3) schema
        4) coverage matrix
    validations:
      required: true
  - type: textarea
    id: security_gates
    attributes:
      label: Security gates
      description: Confirm each gate status.
      value: |
        - [ ] Boundary checks reviewed
        - [ ] Validation rules verified
        - [ ] Side effects documented and tested
        - [ ] Auth/idempotency controls validated
        - [ ] Dependency integrity checked
    validations:
      required: true
  - type: textarea
    id: unit_tasks
    attributes:
      label: Single-developer units + acceptance criteria
      description: Break work into small units with objective completion criteria.
      placeholder: |
        - Unit: Schema pass for onboarding contracts
          Acceptance: `python tools/check_contract_review.py --section schema` passes.
    validations:
      required: true
