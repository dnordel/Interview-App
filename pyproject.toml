[project]
name = "preschool-teacher-interview-guide"
version = "0.1.0"
description = "Offline desktop applications for preschool teacher interviews and onboarding workflows."
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
  "python-docx==1.2.0",
  "soundfile==0.13.1",
  "faster-whisper==1.2.1",
  "tkcalendar==1.6.1",
  "PySide6==6.8.1.1",
  "transformers",
  "PyYAML==6.0.2",
]

[project.optional-dependencies]
dev = [
  "pytest",
]
gpu = [
  "ctranslate2>=4.5.0",
  "nvidia-cublas-cu12",
  "nvidia-cudnn-cu12",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
