<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="430" viewBox="0 0 1100 430">
  <rect width="1100" height="430" fill="#f1f5f9"/>
  <rect x="15" y="15" width="1070" height="400" rx="10" fill="#fff" stroke="#cbd5e1"/>
  <text x="35" y="48" font-size="32" font-family="Arial" font-weight="700" fill="#111827">Settings</text>
  <g font-family="Arial" font-size="28">
    <rect x="35" y="80" width="120" height="44" rx="22" fill="#dbeafe" stroke="#93c5fd"/><text x="62" y="110">General</text>
    <rect x="165" y="80" width="140" height="44" rx="22" fill="#fff" stroke="#cbd5e1"/><text x="188" y="110">Templates</text>
    <rect x="315" y="80" width="180" height="44" rx="22" fill="#fff" stroke="#cbd5e1"/><text x="339" y="110">Notifications</text>
    <rect x="505" y="80" width="120" height="44" rx="22" fill="#fff" stroke="#cbd5e1"/><text x="534" y="110">Storage</text>
    <rect x="635" y="80" width="120" height="44" rx="22" fill="#fff" stroke="#cbd5e1"/><text x="667" y="110">Security</text>
  </g>
  <rect x="35" y="155" width="1030" height="85" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="50" y="195" font-size="34" font-family="Arial"><tspan font-weight="700">Traversal:</tspan> General → Templates → Notifications → Storage → Security → Save → Cancel</text>
  <rect x="35" y="255" width="1030" height="70" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="50" y="297" font-size="30" font-family="Arial" fill="#166534">Focus-visible state enabled for first widget in each tab.</text>
  <rect x="35" y="340" width="1030" height="55" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="50" y="375" font-size="30" font-family="Arial">Role-based visibility applied for high-risk controls.</text>
</svg>
