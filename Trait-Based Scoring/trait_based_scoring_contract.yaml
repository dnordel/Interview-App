app:
  name: "LPL Interview Scoring System"
  version: "1.0"
  mode: "multi_trait_session"

paths:
  traits_dir: "."
  weighted_signals: "./preschool_teacher_interview_signals_weighted.json"
  output_dir: "./results"

session:
  allow_partial_completion: true
  auto_save: true
  auto_save_interval_seconds: 30

ui:
  layout:
    show_trait_progress: true
    show_running_score: true
    core_first: true

  core_signals:
    display_style: "checkbox"
    highlight: true
    section_label: "Core Signals (Most Important)"

  extended_signals:
    display_style: "checkbox"
    collapsible: true
    default_collapsed: true
    grouped: true
    section_label: "Additional Observations"

  signal_behavior:
    allow_multiple_selection: true
    allow_deselection: true

scoring:

  method: "weighted"
  session_score_mode: "weighted_average_of_trait_scores"
  overall_percent_method: "raw_1_to_5_over_5"

  usage: "interviewer_selected_evidence"

  formula: |
    net_signal_score = sum(base_weight of interviewer-selected evidence signals)
    raw_score = conversion_table(net_signal_score)
    trait_score_1_to_5 = raw_score
    overall_score_1_to_5 = sum(trait_score_1_to_5 * trait_multiplier) / sum(trait_multiplier)
    weighted_trait_percent = (overall_score_1_to_5 / 5) * 100

  signal_score_to_raw_score:
    - min: 7
      max:
      raw_score: 5
    - min: 4
      max: 6
      raw_score: 4
    - min: 1
      max: 3
      raw_score: 3
    - min: -3
      max: 0
      raw_score: 2
    - min:
      max: -4
      raw_score: 1

  trait_multipliers:
    Critical: 3
    High: 2
    Medium: 1

  critical_trait_rules:
    critical_score_1_auto_no_hire: true
    critical_below_3_blocks_hire: true
    recommended_outcome_if_critical_below_3: "No Hire"

  auto_no_hire_rules:
    auto_no_hire_overrides_numeric_score: true
    require_verbatim_quote: true
    continue_scoring_for_documentation: true

  outputs:
    include_raw_score: true
    include_net_signal_score: true
    include_suggested_raw_score: true
    include_final_raw_score: true
    include_signal_counts: true

decision_engine:

  thresholds:
    hire_percent_min: 80
    borderline_percent_min: 65

  override_rules:
    auto_reject_if_auto_no_hire_signal: true
    auto_reject_if_critical_score_1: true
    auto_reject_if_critical_below_3: true

data_model:

  trait_file_schema:
    required_fields:
      - trait_id
      - question
      - core_signals

  signal_resolution:
    use_dictionary: true
    allow_override_weights: true
    allow_custom_signals: true

  signal_fields:
    required:
      - ref
      - weight
    optional:
      - label
      - group
      - is_critical

runtime:

  scoring:
    recalculate_on_change: true
    debounce_ms: 150

  state_management:
    store_selected_signals: true
    store_per_trait_scores: true

  error_handling:
    missing_ref_behavior: "warn_and_skip"
    invalid_weight_behavior: "default_to_zero"

output:

  format: "json"

  structure:
    session_id: string
    candidate_name: string
    timestamp: datetime

    traits:
      - trait_id: string
        core_score: number
        extended_score: number
        selected_signals:
          - ref: string
            weight: number

    totals:
      core_score: number
      extended_score: number
      raw_signal_total: number
      weighted_trait_score_1_to_5: number
      weighted_trait_percent: number
      trait_weight_sum: number

    decision:
      recommendation: string
      triggered_critical: boolean

logging:

  enabled: true
  level: "INFO"
  file: "./logs/app.log"

extensibility:

  allow_new_traits: true
  allow_signal_updates: true
  version_check: true
