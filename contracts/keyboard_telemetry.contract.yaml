module:
  name: keyboard_telemetry
  language: python
  path: src/keyboard_telemetry.py
  version: 1.0.0
  description: Compatibility wrapper for keyboard-path telemetry helper implemented by ui_composition.
functions: []
classes:
- name: KeyboardPathSession
  description: Tracks keyboard navigation activity for one flow/screen and logs completion metadata.
  locked: false
  attributes:
    logger:
      type: Any
    flow_id:
      type: str
    screen_id:
      type: str
    keyboard_step_count:
      type: int
    _last_keyboard_at:
      type: float
  methods:
  - name: bind
    description: Bind keypress tracking to a Tk widget.
    locked: false
    inputs:
      widget:
        type: tk.Misc
        required: true
    returns:
      type: None
    exceptions: []
    side_effects: Binds keypress callback on the widget.
  - name: _on_keypress
    description: Increment keyboard path tracking after a keypress.
    locked: false
    inputs:
      _event:
        type: tk.Event
        required: true
    returns:
      type: None
    exceptions: []
    side_effects: Updates in-memory keyboard tracking state.
  - name: mark_step
    description: Increment keyboard navigation step count and refresh recency timestamp.
    locked: false
    inputs:
      step_count:
        type: int
        required: false
        default: 1
    returns:
      type: None
    exceptions: []
    side_effects: Updates in-memory keyboard tracking state.
  - name: complete
    description: Log keyboard completion telemetry when a logger is available.
    locked: false
    inputs:
      abandoned:
        type: bool
        required: false
        default: false
      screen_id:
        type: str | None
        required: false
        default: null
    returns:
      type: None
    exceptions: []
    side_effects: May write telemetry through provided logger.
  - name: _is_recent_keyboard_activity
    description: Return whether keyboard activity happened inside the recency window.
    locked: false
    inputs:
      recency_s:
        type: float
        required: false
        default: 12.0
    returns:
      type: bool
    exceptions: []
    side_effects: none
data_structures: []
dependencies:
- ui_composition
