module:
  name: interview_app
  language: python
  path: src/interview_app.pyw
  version: 1.2.5
  description: Main Tkinter interview application entrypoint and runtime orchestration.
functions: []
classes:
- name: InterviewApp
  description: Main GUI application class.
  locked: false
  attributes:
    _transcription_executor:
      type: BoundedTranscriptionExecutor | None
      description: Shared executor used for background transcription jobs.
  methods:
  - name: __init__
    description: Initializes GUI state, controllers, and runtime attributes.
    locked: false
    inputs: {}
    returns:
      type: None
    exceptions: []
    side_effects: initializes tkinter root and in-memory runtime state
  - name: _open_draft_path
    description: Load a draft payload via session manager and route UI resume target.
    locked: false
    inputs:
      draft_path:
        type: Path
        required: true
    returns:
      type: None
    exceptions:
    - SessionPayloadValidationError
    side_effects: displays GUI error dialog on load failures
  - name: _resume_from_loaded_state
    description: Render view based on session manager resume instruction.
    locked: false
    inputs:
      manager:
        type: InterviewSessionManager
        required: true
    returns:
      type: None
    exceptions: []
    side_effects: triggers view navigation
  - name: _session_context
    description: Lazily returns the session context helper for instances created outside
      __init__.
    locked: false
    inputs: {}
    returns:
      type: InterviewSessionContext
    exceptions: []
    side_effects: caches session context on the app instance when missing
  - name: _hydrate_state_from_session_store
    description: Merge persisted per-question session snapshots into in-memory state.
    locked: false
    inputs: {}
    returns:
      type: None
    exceptions:
    - SessionPayloadValidationError
    side_effects: mutates interview state maps and transcript cache
  - name: _start_background_question_transcription
    description: Stop the active per-question recording session and enqueue background
      transcription before navigation.
    locked: false
    inputs:
      flow_idx:
        type: int
        required: true
    returns:
      type: None
    exceptions:
    - ReportingValidationError
    side_effects: stops the active recording session, clears active recording pointers,
      and enqueues a transcription job
  - name: _background_transcribe_question
    description: Dispatch a background question transcription request to the audio
      runtime controller.
    locked: false
    inputs:
      flow_idx:
        type: int
        required: true
      session:
        type: Any
        required: true
      base_dir:
        type: Path
        required: true
      base_name:
        type: str
        required: true
      candidate_label:
        type: str
        required: true
      job_timeout_seconds:
        type: float
        required: false
        default: 180.0
    returns:
      type: None
    exceptions: []
    side_effects: lazily initializes audio runtime controller and starts question
      transcription
  - name: _reset_interview_recording_state
    description: Clears recording and transcription runtime state for a new interview
      recording session.
    locked: false
    inputs: {}
    returns:
      type: None
    exceptions: []
    side_effects: shuts down active transcription executor and clears queue state
  - name: _initialize_interview_runtime
    description: Starts interview recording runtime and reports user-facing initialization
      errors.
    locked: false
    inputs: {}
    returns:
      type: bool
    exceptions: []
    side_effects: starts recording runtime and may display dialog warnings
  - name: _flow_transcript_question_block
    description: Build transcript DOCX lines for a flow item using captured transcript
      text and optional evaluator notes.
    locked: false
    inputs:
      item:
        type: dict[str, Any]
        required: true
      idx:
        type: int
        required: true
    returns:
      type: list[str]
    exceptions: []
    side_effects: none
data_structures: []
dependencies:
- interview_app_transcription_executor
- interview_app_transcription_queue
- interview_app_transcript_processor
- interview_app_session_manager
- app_logging
- interview_app_views
- ui_components_history_data_grid
- interview_app_session_context
- transcription_diagnostics
- interview_scoring
