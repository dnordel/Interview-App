module:
  name: interview_app
  language: python
  path: src/interview_app.pyw
  version: 1.2.8
  description: Main Tkinter interview application entrypoint and runtime orchestration.
functions: []
classes:
- name: InterviewApp
  description: Main GUI application class.
  locked: false
  attributes:
    _transcription_executor:
      type: BoundedTranscriptionExecutor | None
      description: Shared executor used for background transcription jobs.
  methods:
  - name: __init__
    description: Initializes GUI state, controllers, and runtime attributes.
    locked: false
    inputs: {}
    returns:
      type: None
    exceptions: []
    side_effects: initializes tkinter root and in-memory runtime state
  - name: _open_draft_path
    description: Load a draft payload via session manager and route UI resume target.
    locked: false
    inputs:
      draft_path:
        type: Path
        required: true
    returns:
      type: None
    exceptions:
    - SessionPayloadValidationError
    side_effects: displays GUI error dialog on load failures
  - name: _resume_from_loaded_state
    description: Render view based on session manager resume instruction.
    locked: false
    inputs:
      manager:
        type: InterviewSessionManager
        required: true
    returns:
      type: None
    exceptions: []
    side_effects: triggers view navigation
  - name: _session_context
    description: Lazily returns the session context helper for instances created outside
      __init__.
    locked: false
    inputs: {}
    returns:
      type: InterviewSessionContext
    exceptions: []
    side_effects: caches session context on the app instance when missing
  - name: _hydrate_state_from_session_store
    description: Merge persisted per-question session snapshots into in-memory state.
    locked: false
    inputs: {}
    returns:
      type: None
    exceptions:
    - SessionPayloadValidationError
    side_effects: mutates interview state maps and transcript cache
  - name: _start_background_question_transcription
    description: Legacy helper that stops an explicitly supplied per-question recording
      session and enqueues background transcription; normal Next navigation now uses
      continuous interview recording instead.
    locked: false
    inputs:
      flow_idx:
        type: int
        required: true
    returns:
      type: None
    exceptions:
    - ReportingValidationError
    side_effects: stops the active recording session, clears active recording pointers,
      and enqueues a transcription job when called by legacy paths
  - name: _background_transcribe_question
    description: Dispatch a background question transcription request to the audio
      runtime controller.
    locked: false
    inputs:
      flow_idx:
        type: int
        required: true
      session:
        type: Any
        required: true
      base_dir:
        type: Path
        required: true
      base_name:
        type: str
        required: true
      candidate_label:
        type: str
        required: true
      job_timeout_seconds:
        type: float
        required: false
        default: 180.0
    returns:
      type: None
    exceptions: []
    side_effects: lazily initializes audio runtime controller and starts question
      transcription
  - name: _reset_interview_recording_state
    description: Clears recording and transcription runtime state for a new interview
      recording session.
    locked: false
    inputs: {}
    returns:
      type: None
    exceptions: []
    side_effects: shuts down active transcription executor and clears queue state
  - name: _initialize_interview_runtime
    description: Starts interview recording runtime and reports user-facing initialization
      errors.
    locked: false
    inputs: {}
    returns:
      type: bool
    exceptions: []
    side_effects: starts continuous interview recording runtime and may display dialog warnings
  - name: _start_continuous_interview_recording
    description: Start one audio recording session for the whole interview; question
      boundaries are captured separately through flow timestamps.
    locked: false
    inputs:
      base_dir:
        type: Path
        required: true
    returns:
      type: None
    exceptions:
    - ReportingValidationError
    side_effects: imports optional audio recorder, starts recording subprocesses, sets
      active recording pointers, and may show a warning when recording dependencies
      are unavailable
  - name: _stop_interview_recording
    description: Stop and transcribe the continuous interview recording once, then
      split candidate transcript text into question records using flow timestamp
      windows.
    locked: false
    inputs:
      show_warning:
        type: bool
        required: false
        default: true
    returns:
      type: dict[str, Any] | None
    exceptions: []
    side_effects: writes transcript artifacts under the configured base directory,
      mutates flow recording/transcript state, persists per-question snapshots, and
      clears active recording pointers
  - name: _apply_continuous_recording_result
    description: Map one full-interview transcription result onto per-flow transcript
      state while leaving skipped questions empty.
    locked: false
    inputs:
      recording_result:
        type: dict[str, Any]
        required: true
    returns:
      type: None
    exceptions: []
    side_effects: mutates flow_recordings and flow_candidate_transcripts and persists
      affected question snapshots
  - name: _queue_transcription_and_transition
    description: Persist current question state, close its timestamp boundary, and
      route immediately without stopping or transcribing audio.
    locked: false
    inputs:
      flow_idx:
        type: int
        required: true
      next_index:
        type: int | None
        required: false
        default: null
      is_last:
        type: bool
        required: false
        default: false
      discard_recording:
        type: bool
        required: false
        default: false
    returns:
      type: None
    exceptions: []
    side_effects: mutates timestamp/session state and may route to another screen or
      start finalization
  - name: exit_current_interview
    description: Confirm early interview exit, then save the current interview as incomplete
      and return to the main screen without strict finalization validation.
    locked: false
    inputs:
      flow_idx:
        type: int
        required: true
      persist_current:
        type: Any
        required: false
        default: None
    returns:
      type: None
    exceptions: []
    side_effects: may show a confirmation dialog, stop/transcribe active recording,
      persist the current question/session, save an incomplete draft payload, clear
      active recording pointers, and route to the start screen
  - name: _save_partial_interview_and_return
    description: Best-effort implementation for confirmed early interview exit.
    locked: false
    inputs:
      flow_idx:
        type: int
        required: true
      persist_current:
        type: Any
        required: false
        default: None
    returns:
      type: None
    exceptions: []
    side_effects: stops/transcribes active recording when present, writes incomplete
      draft/session state, and returns to the start screen
  - name: _flow_transcript_question_block
    description: Build interview-notes transcript lines for a flow item using captured
      transcript text and optional evaluator notes.
    locked: false
    inputs:
      item:
        type: dict[str, Any]
        required: true
      idx:
        type: int
        required: true
    returns:
      type: list[str]
    exceptions: []
    side_effects: none
data_structures: []
dependencies:
- module: interview_app_transcription_executor
- module: interview_app_transcription_queue
- module: interview_app_transcript_processor
- module: interview_app_session_manager
- module: app_logging
- module: interview_app_views
- module: ui_components_history_data_grid
- module: interview_app_session_context
- module: transcription_diagnostics
- module: onboarding_operations
- module: tk_theme
