module:
  name: interview_session_store
  language: python
  path: src/interview_session_store.py
  version: 1.0.0
  description: Deprecated compatibility wrapper for the file-backed interview session snapshot store implemented by interview_runtime.
functions: []
classes:
- name: InterviewSessionStore
  description: File-backed interview session snapshot store with schema migration and path-safe session keys.
  locked: false
  attributes: {}
  methods:
  - name: __init__
    description: Configure the store root under an interview_sessions folder and create it when needed.
    locked: false
    inputs:
      base_dir:
        type: Path
        required: true
    returns:
      type: None
    exceptions: []
    side_effects: Creates the interview session directory when missing.
  - name: session_path
    description: Return the JSON path for an interview session identity.
    locked: false
    inputs:
      interview_id:
        type: str
        required: true
      candidate_name:
        type: str
        required: true
      interview_date:
        type: str
        required: true
    returns:
      type: Path
    exceptions: []
    side_effects: none
  - name: load
    description: Load an interview session payload, returning a default payload when missing or unreadable.
    locked: false
    inputs:
      interview_id:
        type: str
        required: true
      candidate_name:
        type: str
        required: true
      interview_date:
        type: str
        required: true
    returns:
      type: dict[str, Any]
    exceptions: []
    side_effects: Reads a JSON session file when present.
  - name: save_question_snapshot
    description: Persist a normalized per-question snapshot and return the session file path.
    locked: false
    inputs:
      interview_id:
        type: str
        required: true
      candidate_name:
        type: str
        required: true
      interview_date:
        type: str
        required: true
      flow_idx:
        type: int
        required: true
      item_type:
        type: str
        required: true
      item_id:
        type: str
        required: true
      notes:
        type: dict[str, Any] | None
        required: true
      candidate_transcript:
        type: str
        required: true
    returns:
      type: Path
    exceptions: []
    side_effects: Writes the interview session JSON file.
data_structures:
- name: CURRENT_SCHEMA_VERSION
  description: Current persisted interview session snapshot schema version exported for compatibility.
dependencies:
- interview_runtime
