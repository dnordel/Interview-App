module:
  name: interview_app_history_actions
  language: python
  path: src/interview_app/history_actions.py
  version: 1.5.1
  description: Contracts for history_actions module; history retranscription is retired
    and unavailable from interview history.
functions: []
classes:
- name: HistoryActionsService
  description: Coordinates offer workflow actions from history rows and reports retired
    retranscription as unavailable.
  locked: false
  attributes: {}
  methods:
  - name: offer_transition
    description: Return the next offer workflow status and completion message for
      a current status.
    locked: false
    inputs:
      status:
        type: str
        required: true
    returns:
      type: OfferTransitionResult | None
    exceptions: []
    side_effects: none
  - name: update_history_offer_status
    description: Persist a row's offer status and refresh the history table when the
      update succeeds.
    locked: false
    inputs:
      row:
        type: dict[str, Any]
        required: true
      status:
        type: str
        required: true
      offer_path:
        type: str
        required: false
        default: ''''''
    returns:
      type: bool
    exceptions: []
    side_effects: updates persisted history offer state and refreshes history UI
  - name: handle_offer_action_for_row
    description: Route an offer action from a history row through generator, onboarding,
      or status-transition behavior.
    locked: false
    inputs:
      row:
        type: dict[str, Any]
        required: true
    returns:
      type: None
    exceptions: []
    side_effects: may open offer/onboarding UI, draft email, update history state,
      and show an informational dialog
  - name: handle_retranscribe_for_row
    description: Compatibility handler for retired history retranscription action;
      shows an informational dialog and does not modify history.
    locked: false
    inputs:
      row:
        type: dict[str, Any]
        required: true
    returns:
      type: None
    exceptions: []
    side_effects: shows tkinter informational dialog
  - name: _row_key
    description: Build a stable history row key using the configured history store.
    locked: false
    inputs:
      row:
        type: dict[str, Any]
        required: true
    returns:
      type: HistoryRowKey
    exceptions: []
    side_effects: none
data_structures: []
dependencies:
- module: interview_runtime
