  description: Dynamic, fail-closed Staffing Director identity resolution for onboarding attribution.
functions: []
classes:
- name: DirectorIdentity
  description: Unique active Director person snapshot for one school.
  locked: false
  methods: []
- name: StaffingDirectorResolver
  description: Resolves exactly one active person filling a school Director position.
  locked: false
  methods:
  - name: __init__
    inputs:
      store: {type: StaffingStore, required: true}
    returns: {type: None}
    exceptions: []
    side_effects: none
