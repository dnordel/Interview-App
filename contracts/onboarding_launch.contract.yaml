module:
  name: onboarding_launch
  language: python
  path: src/onboarding_launch.py
  version: 1.0.0
  description: Shared onboarding launch context helpers for subprocess handoff.
functions:
- name: build_launch_context
  description: Build a normalized onboarding launch payload with optional candidate seed metadata.
  locked: false
  inputs:
    employee_id:
      type: str | None
      required: false
      default: null
    urgent_only:
      type: bool
      required: false
      default: false
    employee_seed:
      type: LaunchEmployeeSeed | None
      required: false
      default: null
  returns:
    type: dict[str, object]
  exceptions: []
  side_effects: none
- name: write_launch_context_file
  description: Persist onboarding launch metadata to a temporary json file for subprocess use.
  locked: false
  inputs:
    payload:
      type: dict[str, object]
      required: true
  returns:
    type: Path | None
  exceptions: []
  side_effects: writes a temporary json file
- name: read_launch_context_file
  description: Safely read an onboarding launch context json file when present.
  locked: false
  inputs:
    path_value:
      type: str | None
      required: true
  returns:
    type: dict[str, object]
  exceptions: []
  side_effects: reads a json file from disk when available
- name: extract_employee_seed
  description: Recover a LaunchEmployeeSeed from a launch payload when prefill content exists.
  locked: false
  inputs:
    payload:
      type: dict[str, object] | None
      required: true
  returns:
    type: LaunchEmployeeSeed | None
  exceptions: []
  side_effects: none
classes: []
data_structures: []
dependencies:
- onboarding_models
