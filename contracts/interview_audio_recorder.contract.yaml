module:
  name: interview_audio_recorder
  language: python
  path: src/interview_audio_recorder.py
  version: 1.3.0
  description: Records interview audio with ffmpeg and transcribes tracks with
    selectable faster-whisper, OpenVINO GenAI, or whisper.cpp CLI backends.
functions:
- name: start_recording
  description: Start an ffmpeg recording session and return a RecordingSession handle;
    Windows auto-adds a resolved local microphone backup when only system capture
    is configured unless disabled.
  locked: false
  inputs:
    os_name:
      type: str
      required: true
    output_dir:
      type: str | Path
      required: true
    base_name:
      type: str | None
      required: false
      default: null
    whisper_backend:
      type: str
      required: false
      default: faster_whisper
    require_local_mic_backup:
      type: bool
      required: false
      default: true
  returns:
    type: RecordingSession
  exceptions:
  - ValueError
  - SystemExit
  side_effects: starts one or more ffmpeg subprocesses, verifies they remain alive
    briefly, and writes wav files
- name: _resolve_windows_microphone_backup_device
  description: Resolve local Windows microphone backup device through interview runtime
    device probing.
  locked: false
  inputs: {}
  returns:
    type: str
  exceptions: []
  side_effects: probes local ffmpeg audio devices when available
- name: _linux_parent_death_preexec
  description: Configure linux child-process parent-death signal so ffmpeg exits if
    the parent process dies.
  locked: false
  inputs: {}
  returns:
    type: None
  exceptions: []
  side_effects: sets child-process prctl state
- name: _create_windows_kill_on_close_job
  description: Create a Windows Job Object configured to terminate child processes
    when closed.
  locked: false
  inputs: {}
  returns:
    type: Any | None
  exceptions: []
  side_effects: allocates a Windows job handle
- name: _assign_process_to_windows_job
  description: Attach a child process to a Windows Job Object for lifecycle tracking.
  locked: false
  inputs:
    job_handle:
      type: Any
      required: true
    process:
      type: subprocess.Popen
      required: true
  returns:
    type: None
  exceptions: []
  side_effects: associates process handles with job object
- name: _close_windows_handle
  description: Close a Windows native handle if available.
  locked: false
  inputs:
    handle:
      type: Any
      required: true
  returns:
    type: None
  exceptions: []
  side_effects: closes OS handle
- name: transcribe_existing_recordings
  description: Transcribe existing WAV recordings through the selected Whisper backend
    and write interleaved transcript TXT/JSONL outputs, suppressing repeated ASR
    segment floods.
  locked: false
  inputs:
    output_dir:
      type: str | Path
      required: true
    base_name:
      type: str
      required: true
    mic_wav:
      type: str | Path | None
      required: true
    sys_wav:
      type: str | Path | None
      required: true
  returns:
    type: ExistingTranscriptionResult
  exceptions:
  - RuntimeError
  side_effects: reads WAV files, may download/cache OpenVINO models, and writes
    transcript outputs
- name: _normalize_whisper_backend
  description: Normalize a backend setting to a supported backend identifier.
  locked: false
  inputs:
    value:
      type: str | None
      required: true
  returns:
    type: str
  exceptions: []
  side_effects: none
- name: _resolve_openvino_model_path
  description: Resolve a local OpenVINO model path or download an approved OpenVINO
    Whisper model into the LocalAppData model cache.
  locked: false
  inputs:
    model_name:
      type: str
      required: true
  returns:
    type: str
  exceptions:
  - RuntimeError
  side_effects: may create model cache directories and download from Hugging Face
- name: _get_or_create_backend
  description: Load and cache the requested transcription backend.
  locked: false
  inputs:
    backend:
      type: str
      required: true
    model_name:
      type: str
      required: true
    device:
      type: str
      required: true
    compute_type:
      type: str
      required: true
    cache:
      type: dict[tuple[str, str, str, str], Any] | None
      required: false
      default: null
  returns:
    type: Any
  exceptions:
  - RuntimeError
  side_effects: imports backend packages and may initialize model runtimes
- name: _parse_whisper_cpp_timestamp
  description: Parse whisper.cpp timestamp strings or seconds into float seconds.
  locked: false
  inputs:
    value:
      type: Any
      required: true
  returns:
    type: float
  exceptions: []
  side_effects: none
- name: _segments_from_whisper_cpp_json
  description: Convert whisper.cpp JSON transcript output into normalized Segment
    records.
  locked: false
  inputs:
    json_path:
      type: Path
      required: true
    speaker:
      type: str
      required: true
    offset_sec:
      type: float
      required: true
    min_start_sec:
      type: float
      required: true
  returns:
    type: list[Segment]
  exceptions: []
  side_effects: reads whisper.cpp JSON transcript file
- name: _normalize_whisper_transcribe_settings
  description: Normalize Whisper transcription settings with robust anti-hallucination
    defaults including VAD, disabled previous-text conditioning, repeat penalties,
    no-repeat ngram size, and hallucination silence threshold.
  locked: false
  inputs:
    settings:
      type: Mapping[str, Any] | None
      required: true
  returns:
    type: dict[str, Any]
  exceptions: []
  side_effects: none
- name: _suppress_repeated_segment_floods
  description: Collapse excessive consecutive identical ASR segments into a suppression
    marker so one hallucinated phrase cannot flood transcripts.
  locked: false
  inputs:
    segments:
      type: list[Segment]
      required: true
    max_consecutive:
      type: int
      required: false
      default: 2
  returns:
    type: list[Segment]
  exceptions: []
  side_effects: none
classes:
- name: FasterWhisperBackend
  description: faster-whisper transcription backend using CTranslate2.
  locked: false
  attributes:
    model:
      type: Any
  methods:
  - name: transcribe_segments
    inputs:
      wav_path:
        type: Path
      speaker:
        type: str
      language:
        type: str
      offset_sec:
        type: float
      min_start_sec:
        type: float
      whisper_settings:
        type: Mapping[str, Any]
    returns:
      type: list[Segment]
- name: OpenVinoGenAIBackend
  description: OpenVINO GenAI WhisperPipeline backend for Intel GPU/CPU/NPU-capable
    transcription.
  locked: false
  attributes:
    pipeline:
      type: Any
  methods:
  - name: transcribe_segments
    inputs:
      wav_path:
        type: Path
      speaker:
        type: str
      language:
        type: str
      offset_sec:
        type: float
      min_start_sec:
        type: float
      whisper_settings:
        type: Mapping[str, Any]
    returns:
      type: list[Segment]
- name: WhisperCppCliBackend
  description: External whisper.cpp CLI backend, intended for Vulkan-capable AMD
    or cross-vendor local transcription when configured.
  locked: false
  attributes:
    exe:
      type: str
    model_path:
      type: str
  methods:
  - name: transcribe_segments
    inputs:
      wav_path:
        type: Path
      speaker:
        type: str
      language:
        type: str
      offset_sec:
        type: float
      min_start_sec:
        type: float
      whisper_settings:
        type: Mapping[str, Any]
    returns:
      type: list[Segment]
- name: RecordingSession
  description: Manages ffmpeg recording subprocesses and transcription lifecycle.
  locked: false
  attributes:
    _procs:
      type: list[subprocess.Popen]
    _windows_job_handle:
      type: Any | None
    whisper_backend:
      type: str
  methods:
  - name: start
    inputs:
      mic_cmd:
        type: list[str] | None
      sys_cmd:
        type: list[str] | None
    returns:
      type: None
    exceptions:
    - RuntimeError
    side_effects: starts ffmpeg subprocesses and fails if any requested process exits
      immediately
  - name: stop
    inputs: {}
    returns:
      type: None
  - name: stop_and_transcribe
    inputs:
      output_dir:
        type: str | Path
      base_name:
        type: str
      language:
        type: str
    returns:
      type: RecordingResult
data_structures:
- name: RecordingResult
  description: Output artifact paths for a completed recording session transcription.
- name: ExistingTranscriptionResult
  description: Output artifact paths and segment count for retranscribed recordings.
dependencies:
- module: interview_runtime
