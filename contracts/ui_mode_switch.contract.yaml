module:
  name: ui_mode_switch
  language: python
  path: src/ui_mode_switch.py
  version: 2.0.0
  description: PySide-only UI-mode preference and relaunch helper kept for setup-config
    compatibility without rerunning setup prompts.
functions:
- name: normalize_ui_mode
  description: Normalize any legacy or arbitrary UI-mode value to pyside.
  locked: false
  inputs:
    value:
      type: Any
      required: true
  returns:
    type: str
  exceptions: []
  side_effects: none
- name: default_setup_config_path
  description: Resolve the per-user setup_config.json path under LOCALAPPDATA.
  locked: false
  inputs: {}
  returns:
    type: Path
  exceptions: []
  side_effects: none
- name: read_preferred_ui_mode
  description: Read the persisted UI mode from setup config, returning pyside on missing
    or invalid config.
  locked: false
  inputs:
    config_path:
      type: Path | None
      required: false
      default: null
  returns:
    type: str
  exceptions: []
  side_effects: reads setup_config.json when present
- name: write_preferred_ui_mode
  description: Persist selected UI mode and matching app entrypoint into setup config.
  locked: false
  inputs:
    config_path:
      type: Path | None
      required: true
    mode:
      type: str
      required: true
  returns:
    type: str
  exceptions:
  - OSError
  side_effects: writes setup_config.json
- name: build_ui_mode_relaunch_command
  description: Build the Python command used to relaunch the selected sibling desktop
    UI entrypoint directly without rerunning setup_and_run.ps1.
  locked: false
  inputs:
    app_root:
      type: Path
      required: true
    mode:
      type: str
      required: true
    debug:
      type: bool
      required: false
      default: false
      description: Accepted for compatibility with older setup-script launches; direct
        relaunch does not use debug mode.
  returns:
    type: list[str]
  exceptions: []
  side_effects: none
- name: current_python_executable
  description: Return the current Python executable path, falling back to python when
    sys.executable is unavailable.
  locked: false
  inputs: {}
  returns:
    type: str
  exceptions: []
  side_effects: none
- name: switch_to_ui_mode
  description: Persist selected UI mode and start the sibling desktop UI directly.
  locked: false
  inputs:
    mode:
      type: str
      required: true
    app_root:
      type: Path | None
      required: false
      default: null
    config_path:
      type: Path | None
      required: false
      default: null
    debug:
      type: bool
      required: false
      default: false
    popen:
      type: Any
      required: false
      default: subprocess.Popen
  returns:
    type: str
  exceptions:
  - OSError
  side_effects: writes setup_config.json and launches a Python child process
- name: exit_current_process
  description: Exit the current Python process after relaunch when a caller wants
    hard process replacement.
  locked: false
  inputs: {}
  returns:
    type: None
  exceptions:
  - SystemExit
  side_effects: exits current process
classes: []
data_structures: []
dependencies: []
