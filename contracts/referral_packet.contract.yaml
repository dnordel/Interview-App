module:
  name: referral_packet
  language: python
  path: src/referral_packet.py
  version: 1.0.0
  description: Normalize and validate referral packet document fields with canonical single-document interview notes output.
functions:
- name: normalize_referral_packet
  description: Normalize referral packet values to stripped strings and backfill canonical interview_notes_document_path from legacy fields when absent.
  locked: false
  inputs:
    packet:
      type: dict[str, str] | None
      required: true
  returns:
    type: dict[str, str]
  exceptions: []
  side_effects: none
- name: missing_required_docs
  description: Return ordered labels for required referral packet documents that are missing after normalization.
  locked: false
  inputs:
    packet:
      type: dict[str, str] | None
      required: true
  returns:
    type: list[str]
  exceptions: []
  side_effects: none
- name: validate_referral_packet
  description: Validate that required referral packet document fields are populated and return (is_valid, missing_labels).
  locked: false
  inputs:
    packet:
      type: dict[str, str] | None
      required: true
  returns:
    type: tuple[bool, list[str]]
  exceptions: []
  side_effects: none
- name: is_supported_document_path
  description: Check whether a document path suffix is an allowed extension.
  locked: false
  inputs:
    path_text:
      type: str
      required: true
  returns:
    type: bool
  exceptions: []
  side_effects: none
classes: []
data_structures:
- name: REQUIRED_PACKET_DOCS
  type: tuple[tuple[str, str], ...]
  description: Required referral packet keys and labels. resume_path and interview_notes_document_path are required.
- name: OPTIONAL_PACKET_DOCS
  type: tuple[tuple[str, str], ...]
  description: Optional/deprecated keys retained for compatibility. transcript_path is deprecated as a separate transcript-only field under the single-document rule.
- name: ALL_PACKET_DOCS
  type: tuple[tuple[str, str], ...]
  description: Ordered union of required and optional packet keys used for normalization.
- name: ALLOWED_DOC_EXTENSIONS
  type: set[str]
  description: Allowed file suffixes for manually selected referral documents.
dependencies: []
