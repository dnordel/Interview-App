module:
  name: export_interview_ml_dataset
  language: python
  path: tools/export_interview_ml_dataset.py
  version: 1.0.0
  description: Export the derived interview ML dataset to CSV/JSONL files without
    rebuilding source rows or running DeepSeek.
functions:
- name: export_ml_dataset
  description: Export sessions, answers, signals, pending-AI rows, DeepSeek traces,
    and joined answer-level JSONL from interview_ml_dataset.sqlite3.
  locked: false
  inputs:
    ml_path:
      type: Path | None
      required: false
      default: null
    output_dir:
      type: Path | None
      required: false
      default: null
  returns:
    type: dict[str, str]
  exceptions: []
  side_effects: Writes local CSV/JSONL export files and appends export metadata.
- name: main
  description: CLI entrypoint for exporting the interview ML dataset.
  locked: false
  inputs:
    argv:
      type: list[str] | None
      required: false
      default: null
  returns:
    type: int
  exceptions: []
  side_effects: Parses CLI arguments, writes export files, and prints JSON paths.
classes: []
data_structures: []
dependencies:
- data_store
- platform_services
