module:
  name: interview_app_whisper_runtime_policy
  language: python
  path: src/interview_app/whisper_runtime_policy.py
  version: 1.1.0
  description: Deprecated compatibility wrapper for Whisper runtime selection and
    fallback policy implemented by interview_runtime.
functions:
- name: resolve_runtime
  description: Resolve configured Whisper runtime backend/model/device/compute type
    and select CUDA, OpenVINO GenAI, configured whisper.cpp, or CPU fallback from
    setup-published GPU vendor.
  locked: false
  inputs:
    settings:
      type: dict[str, Any]
      required: true
  returns:
    type: RuntimeConfig
  exceptions: []
  side_effects: none
- name: fallback_from_exception
  description: Return CPU fallback runtime for CUDA/NVIDIA, AMD ROCm/HIP, Intel GPU,
    or other device-related Whisper runtime errors.
  locked: false
  inputs:
    exc:
      type: Exception
      required: true
    preferred:
      type: RuntimeConfig
      required: true
    settings:
      type: dict[str, Any]
      required: true
  returns:
    type: RuntimeConfig | None
  exceptions: []
  side_effects: none
- name: persist_runtime_choice
  description: persist_runtime_choice function.
  locked: false
  inputs:
    settings:
      type: dict[str, Any]
      required: true
    runtime_config:
      type: RuntimeConfig
      required: true
    mode:
      type: str
      required: true
  returns:
    type: None
  exceptions: []
  side_effects: none
- name: _value_or_default
  description: _value_or_default function.
  locked: false
  inputs:
    settings:
      type: dict[str, Any]
      required: true
    runtime_key:
      type: str
      required: true
    preferred_key:
      type: str
      required: true
    default_value:
      type: str
      required: true
  returns:
    type: str
  exceptions: []
  side_effects: none
- name: _is_device_runtime_exception
  description: _is_device_runtime_exception function.
  locked: false
  inputs:
    exc:
      type: Exception
      required: true
  returns:
    type: bool
  exceptions: []
  side_effects: none
- name: _contains_runtime_error_marker
  description: _contains_runtime_error_marker function.
  locked: false
  inputs:
    text:
      type: str
      required: true
  returns:
    type: bool
  exceptions: []
  side_effects: none
- name: _resolve_cpu_fallback
  description: _resolve_cpu_fallback function.
  locked: false
  inputs:
    preferred:
      type: RuntimeConfig
      required: true
    settings:
      type: dict[str, Any]
      required: true
  returns:
    type: RuntimeConfig
  exceptions: []
  side_effects: none
classes:
- name: RuntimeConfig
  description: RuntimeConfig class.
  locked: false
  attributes:
    model:
      type: str
    device:
      type: str
    compute_type:
      type: str
    backend:
      type: str
  methods: []
data_structures:
- name: RuntimeConfig
  type: dataclass
dependencies:
- module: interview_runtime
