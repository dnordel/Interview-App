module:
  name: onboarding_scrollable_modal
  language: python
  path: src/onboarding_scrollable_modal.py
  version: 1.0.2
  description: Compatibility wrapper for reusable scrollable modal containers now
    implemented by onboarding_operations.
functions:
- name: build_scrollable_modal_container
  description: Creates a modal shell with a scrollable canvas-backed body and a pinned
    button bar.
  locked: false
  inputs:
    parent:
      type: tk.Misc
      required: true
    title:
      type: str
      required: true
    body_padding:
      type: int | tuple[int, int, int, int]
      required: false
      default: 10
    button_padding:
      type: tuple[int, int, int, int]
      required: false
      default:
      - 10
      - 0
      - 10
      - 10
  returns:
    type: ScrollableModalContainer
  exceptions: []
  side_effects: Creates Tkinter widgets and mouse-wheel bindings for a dialog.
classes:
- name: ScrollableModalContainer
  description: Container object holding the dialog, scrollable body, and pinned button
    bar widgets.
  locked: false
  attributes:
    dialog:
      type: tk.Toplevel
    canvas:
      type: tk.Canvas
    interior:
      type: ttk.Frame
    button_bar:
      type: ttk.Frame
    scrollbar:
      type: ttk.Scrollbar
  methods: []
data_structures: []
dependencies:
- module: onboarding_operations
