module:
  name: interview_app_history_controller
  language: python
  path: src/interview_app/history_controller.py
  version: 1.4.0
  description: Deprecated compatibility wrapper for interview history table controller
    implemented by interview_runtime.
functions: []
classes:
- name: HistoryController
  description: Coordinates history data loading, selected row state, and action callback
    routing.
  locked: false
  attributes: {}
  methods:
  - name: build_history_table
    description: Creates the history table section and mounts the HistoryDataGrid
      widget.
    locked: false
    inputs:
      parent:
        type: ttk.Frame
        required: true
    returns:
      type: None
    exceptions: []
    side_effects: updates in-memory state
  - name: refresh_history_tree
    description: Refreshes row data and filtering for the history grid.
    locked: false
    inputs: {}
    returns:
      type: None
    exceptions: []
    side_effects: updates in-memory state
  - name: selected_history_row
    description: Returns the currently selected history row from the grid.
    locked: false
    inputs: {}
    returns:
      type: dict[str, Any] | None
    exceptions: []
    side_effects: none
  - name: _on_sort_changed
    description: Synchronizes app sort state when grid sorting changes.
    locked: false
    inputs:
      column:
        type: str
        required: true
      desc:
        type: bool
        required: true
    returns:
      type: None
    exceptions: []
    side_effects: updates in-memory state
  - name: _on_row_selected
    description: Captures the currently selected row on the app runtime object.
    locked: false
    inputs:
      row:
        type: dict[str, Any]
        required: true
    returns:
      type: None
    exceptions: []
    side_effects: updates in-memory state
  - name: _on_offer_action
    description: Forwards offer action callback for a selected row.
    locked: false
    inputs:
      row:
        type: dict[str, Any]
        required: true
    returns:
      type: None
    exceptions: []
    side_effects: invokes application service callbacks
  - name: _on_retranscribe_action
    description: Compatibility no-op for retired retranscribe action callback.
    locked: false
    inputs:
      row:
        type: dict[str, Any]
        required: true
    returns:
      type: None
    exceptions: []
    side_effects: none
  - name: _on_delete_action
    description: Forwards delete action callback for a selected history row.
    locked: false
    inputs:
      row:
        type: dict[str, Any]
        required: true
    returns:
      type: None
    exceptions: []
    side_effects: invokes application service callbacks
  - name: _on_open_transcript_link
    description: Opens transcript path for a selected row when available.
    locked: false
    inputs:
      row:
        type: dict[str, Any]
        required: true
    returns:
      type: None
    exceptions: []
    side_effects: opens filesystem path in default app
  - name: _on_open_notes_link
    description: Opens the selected row's existing interview notes immediately, or
      routes to regeneration only when the document is missing.
    locked: false
    inputs:
      row:
        type: dict[str, Any]
        required: true
    returns:
      type: None
    exceptions: []
    side_effects: may open filesystem path in default app or start missing-document
      regeneration flow
  - name: _on_regenerate_notes_action
    description: Starts interview notes regeneration for the selected row from the
      separate Regenerate Notes history-column action.
    locked: false
    inputs:
      row:
        type: dict[str, Any]
        required: true
    returns:
      type: None
    exceptions: []
    side_effects: may show modal choices, update history status, seed progress JSON,
      and start a detached notes regeneration worker
  - name: _open_history_link
    description: Validates and opens a path field from a row.
    locked: false
    inputs:
      row:
        type: dict[str, Any]
        required: true
      key:
        type: str
        required: true
    returns:
      type: None
    exceptions: []
    side_effects: opens filesystem path in default app
  - name: _regenerate_history_notes
    description: Resolve the selected row's persisted DeepSeek job, ask for rerun
      mode, and start interview notes regeneration.
    locked: false
    inputs:
      row:
        type: dict[str, Any]
        required: true
    returns:
      type: None
    exceptions: []
    side_effects: may show warning dialogs, update history status, seed progress JSON,
      start a detached worker, and attach GUI progress polling
  - name: _choose_notes_regeneration_mode
    description: Ask whether notes regeneration should rerun local DeepSeek and rebuild
      the document or rebuild only the document from saved data, using a dedicated
      selection dialog with explicit action buttons.
    locked: false
    inputs:
      row:
        type: dict[str, Any]
        required: true
    returns:
      type: str | None
    exceptions: []
    side_effects: shows modal selection dialog
  - name: _show_notes_regeneration_mode_dialog
    description: Show the owned topmost notes-regeneration selector with Full DeepSeek
      plus Document, Document Only, and Cancel buttons.
    locked: false
    inputs:
      candidate:
        type: str
        required: true
    returns:
      type: str | None
    exceptions: []
    side_effects: creates and destroys a modal tkinter dialog, falling back to a parented
      messagebox if tkinter cannot create the custom dialog
  - name: _deepseek_job_path_for_row
    description: Resolve the persisted DeepSeek job JSON path from a safe stored
      deepseek_job_path when available, otherwise from safe history row id and configured
      history/base directories.
    locked: false
    inputs:
      row:
        type: dict[str, Any]
        required: true
    returns:
      type: Path | None
    exceptions: []
    side_effects: checks local filesystem path existence
data_structures: []
dependencies:
- module: interview_runtime
