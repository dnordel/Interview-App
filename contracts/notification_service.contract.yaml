module:
  name: notification_service
  language: python
  path: src/notification_service.py
  version: 2.6.0
  description: Notification delivery with safe persisted AND conditions, editable school role directory and director names, shared incoming/SMTP account validation, admin-managed shared-config or DPAPI password storage, required attachments, and clock-aware staffing date/permit scheduling.
functions:
- name: candidate_notification_test_recipient
  locked: false
  inputs:
    rule: {type: NotificationRule, required: true}
    requested_email: {type: str, required: false, default: ''}
  returns: {type: str}
  exceptions: [ValueError]
  side_effects: none
- name: missing_email_account_fields
  locked: false
  inputs:
    settings: {type: EmailSettings, required: true}
  returns: {type: 'tuple[str, ...]'}
  exceptions: []
  side_effects: none
- name: verify_email_account_connections
  locked: false
  inputs:
    settings: {type: EmailSettings, required: true}
  returns: {type: None}
  exceptions: [ValueError, OSError, imaplib.IMAP4.error, poplib.error_proto, smtplib.SMTPException]
  side_effects: Authenticates to configured IMAP or POP3 SSL/TLS and SMTP transport without sending email or exposing credentials.
- name: notification_conditions_match
  locked: false
  inputs:
    conditions: {type: 'list[NotificationCondition]', required: true}
    payload: {type: 'dict[str, str]', required: true}
  returns: {type: bool}
  exceptions: []
  side_effects: none
- name: protect_secret
  locked: false
  inputs: {value: {type: str, required: true}}
  returns: {type: str}
  exceptions: [OSError]
  side_effects: Encrypts a non-empty secret with Windows DPAPI scoped to the current user.
- name: unprotect_secret
  locked: false
  inputs: {value: {type: str, required: true}}
  returns: {type: str}
  exceptions: []
  side_effects: Decrypts a DPAPI secret for the current Windows user and fails closed to an empty value.
- name: _send_email_message
  locked: false
  inputs:
    settings:
      type: EmailSettings
      required: true
    recipients:
      type: list[str]
      required: true
    subject:
      type: str
      required: true
    body:
      type: str
      required: true
    attachment_paths:
      type: list[Path] | None
      required: false
      default: null
    html_body:
      type: str | None
      required: false
      default: null
  returns:
    type: None
  exceptions:
  - OSError
  - smtplib.SMTPException
  side_effects: Sends one SMTP message, supports local and onboarding-compatible email settings field names, sanitizes the subject, and may read attachment bytes without logging secrets.
- name: resolve_notification_recipients
  locked: false
  inputs:
    rule:
      type: NotificationRule
      required: true
    payload:
      type: dict[str, str]
      required: true
  returns:
    type: tuple[list[str], str, str]
  exceptions: []
  side_effects: Resolves active email recipients and role recipients including candidate email, school Director, Hiring Manager, and Executive Director, deduping addresses and returning a display summary or sanitized blocked reason.
- name: _notification_attachment_paths
  locked: false
  inputs:
    event_type:
      type: str
      required: true
    payload:
      type: dict[str, str]
      required: true
  returns:
    type: tuple[list[str], str]
  exceptions: []
  side_effects: Validates approved-offer PDF and optional accepted-offer onboarding guide attachment paths without logging file contents or secrets.
- name: emit_notification_event
  locked: false
  inputs:
    event_type:
      type: str
      required: true
    payload:
      type: dict[str, str]
      required: true
    idempotency_key:
      type: str
      required: true
    store_path:
      type: Path
      required: false
      default: NOTIFICATION_RULES_PATH
    email_settings:
      type: EmailSettings | None
      required: false
      default: null
  returns:
    type: list[NotificationSendResult]
  exceptions:
  - ValueError
  side_effects: Reads notification rules, may send email, writes notification audit.
- name: notification_service_from_onboarding
  locked: false
  inputs:
    root_dir:
      type: Path
      required: true
    store_path:
      type: Path
      required: false
      default: NOTIFICATION_RULES_PATH
  returns:
    type: NotificationService
  side_effects: Reads onboarding settings and opens notification SQLite database.
- name: load_email_account_settings
  locked: false
  inputs:
    path:
      type: Path
      required: false
      default: EMAIL_ACCOUNT_SETTINGS_PATH
  returns:
    type: EmailSettings
  side_effects: Reads shared email account JSON settings.
- name: save_email_account_settings
  locked: false
  inputs:
    settings:
      type: EmailSettings
      required: true
    path:
      type: Path
      required: false
      default: EMAIL_ACCOUNT_SETTINGS_PATH
  returns:
    type: None
  side_effects: Writes incoming and SMTP settings with either an admin-selected shared-config password for Dropbox-wide use, a DPAPI-encrypted Windows-user password, or a session-only password.
- name: load_notification_directory
  locked: false
  inputs:
    path: {type: Path, required: false, default: NOTIFICATION_DIRECTORY_PATH}
  returns: {type: NotificationDirectory}
  side_effects: Reads editable notification recipients, director names, and onboarding-guide path.
- name: save_notification_directory
  locked: false
  inputs:
    directory: {type: NotificationDirectory, required: true}
    path: {type: Path, required: false, default: NOTIFICATION_DIRECTORY_PATH}
  returns: {type: None}
  exceptions: [ValueError]
  side_effects: Validates recipient emails and writes the notification directory JSON.
- name: migrate_legacy_onboarding_email_account
  locked: false
  inputs:
    legacy_path: {type: Path, required: true}
    shared_path: {type: Path, required: false, default: EMAIL_ACCOUNT_SETTINGS_PATH}
  returns: {type: bool}
  exceptions: [ValueError, OSError]
  side_effects: Copies a valid legacy onboarding SMTP account only when the shared account has no meaningful configured values.
- name: resolve_onboarding_role_recipient
  locked: false
  inputs:
    directory: {type: NotificationDirectory, required: true}
    school: {type: str, required: true}
    role: {type: str, required: true}
    director_resolver: {type: 'Callable[[str], Any] | None', required: false, default: null}
  returns: {type: str}
  exceptions: [ValueError]
  side_effects: Validates current Staffing Director identity when requested and reads the shared role directory.
- name: send_onboarding_reminder_digest
  locked: false
  inputs:
    settings: {type: EmailSettings, required: true}
    message: {type: Any, required: true}
  returns: {type: None}
  exceptions: [OSError, smtplib.SMTPException]
  side_effects: Sends one PII-safe school-role task-count digest through the shared SMTP account.
- name: notification_service_from_email_account_settings
  locked: false
  inputs:
    settings_path:
      type: Path
      required: false
      default: EMAIL_ACCOUNT_SETTINGS_PATH
    store_path:
      type: Path
      required: false
      default: NOTIFICATION_RULES_PATH
  returns:
    type: NotificationService
  side_effects: Reads shared email settings and opens notification SQLite database.
classes:
- name: NotificationDirectory
  description: Editable recipient addresses, per-school director names, office managers, and onboarding attachment setting.
  locked: false
  methods:
  - name: defaults
    inputs: {}
    returns: {type: NotificationDirectory}
    exceptions: []
    side_effects: none
  - name: from_dict
    inputs: {payload: {type: 'dict[str, Any] | None', required: true}}
    returns: {type: NotificationDirectory}
    exceptions: []
    side_effects: none
  - name: to_dict
    inputs: {}
    returns: {type: 'dict[str, Any]'}
    exceptions: []
    side_effects: none
- name: StaffingNotificationScheduler
  description: Local-clock scanner for exact start/last dates and overdue 50/90-day permit events with rollout filtering.
  locked: false
  methods:
  - name: run
    inputs: {}
    returns: {type: 'list[NotificationSendResult]'}
    exceptions: []
    side_effects: Rechecks current staffing and permit state and emits idempotent due events.
- name: EmailSettings
  description: Lightweight incoming and SMTP settings value including explicit shared-config or Windows-user password storage policy.
  locked: false
  methods:
  - name: from_dict
    inputs:
      payload:
        type: dict[str, Any] | None
        required: true
    returns:
      type: EmailSettings
    exceptions:
    - ValueError
    side_effects: none
  - name: to_dict
    inputs: {}
    returns:
      type: dict[str, Any]
    exceptions: []
    side_effects: none
- name: NotificationService
  description: Emits active notification rules only when all structured conditions match current event or scheduled payload values, with idempotent send audit and due date-offset scheduling.
  locked: false
  methods:
  - name: activate_ready_system_rules
    inputs: {}
    returns: {type: int}
    exceptions: []
    side_effects: Activates system defaults only when sender, recipients, and configured required attachments validate, preserving user disablement.
  - name: emit_event
    inputs:
      event_type:
        type: str
        required: true
      payload:
        type: dict[str, str]
        required: true
      idempotency_key:
        type: str
        required: true
    returns:
      type: list[NotificationSendResult]
    exceptions:
    - ValueError
    side_effects: Reads rules, checks all structured conditions plus event or date-offset trigger timing, may queue
      future date-offset notifications, may send email, writes audit outcomes.
  - name: send_test
    inputs:
      rule_id:
        type: int
        required: true
      payload:
        type: dict[str, str]
        required: true
      idempotency_key:
        type: str
        required: true
    returns:
      type: NotificationSendResult
    exceptions:
    - ValueError
    side_effects: Reads the selected rule by id, replaces all recipients with the shared safe default when the rule targets Candidate, bypasses only the rule active flag and date-offset trigger gate, prefixes the delivered subject with '[THIS IS A TEST]', enforces SMTP settings and template variables, may send email, and writes sanitized audit outcomes.
  - name: send_test_preview
    inputs:
      rule: {type: NotificationRule, required: true}
      payload: {type: 'dict[str, str]', required: true}
      recipient_email: {type: str, required: true}
      idempotency_key: {type: str, required: true}
    returns: {type: NotificationSendResult}
    exceptions: [ValueError]
    side_effects: Uses the shared candidate-test helper to validate or default Candidate-role test recipients, blocks incomplete shared-account settings, otherwise prefixes the delivered subject with '[THIS IS A TEST]' and sends the current draft as multipart plain text and safe HTML to the sole validated test recipient; saved rules write sanitized audit rows while unsaved rules remain session-only.
  - name: run_due_notifications
    inputs: {}
    returns:
      type: list[NotificationSendResult]
    exceptions: []
    side_effects: Reads pending date-offset notification schedules, sends due or
      overdue notifications, records audit outcomes, and marks schedule rows sent,
      blocked, failed, or duplicate.
  - name: render_candidate_event_preview
    inputs:
      event_type: {type: str, required: true}
      payload: {type: 'dict[str, str]', required: true}
    returns: {type: str}
    exceptions: [ValueError]
    side_effects: Reads the first active candidate-targeted rule for the event and renders its configured subject and plain-text body without sending or writing audit state; missing rules or template values fail closed.
data_structures:
- name: CANDIDATE_NOTIFICATION_TEST_EMAIL
  type: str
- name: HIRING_MANAGER_EMAIL
  type: str
- name: EXECUTIVE_DIRECTOR_EMAIL
  type: str
- name: DIRECTOR_EMAILS_BY_SCHOOL
  type: dict[str, str]
- name: SUPPORTED_NOTIFICATION_EVENTS
  type: tuple[str, ...]
- name: NOTIFICATION_TEMPLATE_FIELDS
  type: tuple[str, ...]
- name: NOTIFICATION_RULES_PATH
  type: Path
- name: EMAIL_ACCOUNT_SETTINGS_PATH
  type: Path
dependencies:
- notification_models
- notification_store
- notification_templates
- onboarding_operations
- platform_services
- email_security
- staffing_service
