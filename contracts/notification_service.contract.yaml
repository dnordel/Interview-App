module:
  name: notification_service
  language: python
  path: src/notification_service.py
  version: 1.6.0
  description: Generic checkpoint notification emitter that renders safe dynamic payload templates including staffing, offer, start, notice-given, last-working-day, school-code, reply-by-date, candidate-email, and attachment fields, resolves explicit-email and role recipients including Candidate, school Director, Hiring Manager, and Executive Director, supports event-triggered and queued date-offset rules, supports selected-rule test sends from Staffing v2 without enabling disabled rules, auto-sends via shared company SMTP settings or onboarding SMTP settings, attaches approved-offer PDFs, and records sanitized audit outcomes.
functions:
- name: resolve_notification_recipients
  locked: false
  inputs:
    rule:
      type: NotificationRule
      required: true
    payload:
      type: dict[str, str]
      required: true
  returns:
    type: tuple[list[str], str, str]
  exceptions: []
  side_effects: Resolves active email recipients and role recipients including candidate email, school Director, Hiring Manager, and Executive Director, deduping addresses and returning a display summary or sanitized blocked reason.
- name: _notification_attachment_paths
  locked: false
  inputs:
    event_type:
      type: str
      required: true
    payload:
      type: dict[str, str]
      required: true
  returns:
    type: tuple[list[str], str]
  exceptions: []
  side_effects: Validates approved-offer PDF and optional accepted-offer onboarding guide attachment paths without logging file contents or secrets.
- name: emit_notification_event
  locked: false
  inputs:
    event_type:
      type: str
      required: true
    payload:
      type: dict[str, str]
      required: true
    idempotency_key:
      type: str
      required: true
    store_path:
      type: Path
      required: false
      default: NOTIFICATION_RULES_PATH
    email_settings:
      type: EmailSettings | None
      required: false
      default: null
  returns:
    type: list[NotificationSendResult]
  exceptions:
  - ValueError
  side_effects: Reads notification rules, may send email, writes notification audit.
- name: notification_service_from_onboarding
  locked: false
  inputs:
    root_dir:
      type: Path
      required: true
    store_path:
      type: Path
      required: false
      default: NOTIFICATION_RULES_PATH
  returns:
    type: NotificationService
  side_effects: Reads onboarding settings and opens notification SQLite database.
- name: load_email_account_settings
  locked: false
  inputs:
    path:
      type: Path
      required: false
      default: EMAIL_ACCOUNT_SETTINGS_PATH
  returns:
    type: EmailSettings
  side_effects: Reads shared email account JSON settings.
- name: save_email_account_settings
  locked: false
  inputs:
    settings:
      type: EmailSettings
      required: true
    path:
      type: Path
      required: false
      default: EMAIL_ACCOUNT_SETTINGS_PATH
  returns:
    type: None
  side_effects: Writes shared email account JSON settings without logging credentials.
- name: notification_service_from_email_account_settings
  locked: false
  inputs:
    settings_path:
      type: Path
      required: false
      default: EMAIL_ACCOUNT_SETTINGS_PATH
    store_path:
      type: Path
      required: false
      default: NOTIFICATION_RULES_PATH
  returns:
    type: NotificationService
  side_effects: Reads shared email settings and opens notification SQLite database.
classes:
- name: NotificationService
  description: Emits exact-match notification events for active rules with idempotent send audit and runs due date-offset schedules.
  locked: false
  methods:
  - name: emit_event
    inputs:
      event_type:
        type: str
        required: true
      payload:
        type: dict[str, str]
        required: true
      idempotency_key:
        type: str
        required: true
    returns:
      type: list[NotificationSendResult]
    exceptions:
    - ValueError
    side_effects: Reads rules, checks event or date-offset trigger timing, may queue
      future date-offset notifications, may send email, writes audit outcomes.
  - name: send_test
    inputs:
      rule_id:
        type: int
        required: true
      payload:
        type: dict[str, str]
        required: true
      idempotency_key:
        type: str
        required: true
    returns:
      type: NotificationSendResult
    exceptions:
    - ValueError
    side_effects: Reads the selected rule by id, bypasses only the rule active flag and date-offset trigger gate, enforces recipients, SMTP settings, and template variables, may send email, and writes sanitized audit outcomes.
  - name: run_due_notifications
    inputs: {}
    returns:
      type: list[NotificationSendResult]
    exceptions: []
    side_effects: Reads pending date-offset notification schedules, sends due or
      overdue notifications, records audit outcomes, and marks schedule rows sent,
      blocked, failed, or duplicate.
data_structures:
- name: HIRING_MANAGER_EMAIL
  type: str
- name: EXECUTIVE_DIRECTOR_EMAIL
  type: str
- name: DIRECTOR_EMAILS_BY_SCHOOL
  type: dict[str, str]
- name: SUPPORTED_NOTIFICATION_EVENTS
  type: tuple[str, ...]
- name: NOTIFICATION_TEMPLATE_FIELDS
  type: tuple[str, ...]
- name: NOTIFICATION_RULES_PATH
  type: Path
- name: EMAIL_ACCOUNT_SETTINGS_PATH
  type: Path
dependencies:
- notification_models
- notification_store
- onboarding_operations
- platform_services
- email_security
