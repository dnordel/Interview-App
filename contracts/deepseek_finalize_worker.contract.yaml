module:
  name: deepseek_finalize_worker
  language: python
  path: src/deepseek_finalize_worker.py
  version: 1.10.0
  description: Detached local DeepSeek finalize worker that refreshes interview notes
    documents and history status after the GUI finalize flow returns, keeping DeepSeek
    signal scoring advisory and human raw scores final. Workers serialize processing
    through a per-deepseek_jobs lock file so local Ollama handles one finalize job
    at a time, writes sanitized progress JSON for GUI polling, and checkpoints
    completed DeepSeek stages back into the job file so retry can resume after
    the last completed stage; document-only reruns reuse saved DeepSeek output
    and rebuild only the DOCX. Progress JSON includes an ordered task/status list
    with operator-facing statuses Processing, Finished, Timed-out, or Queued.
functions:
- name: _utc_timestamp
  description: Return current UTC timestamp in persisted Z-suffixed ISO format.
  locked: false
  inputs: {}
  returns:
    type: str
  exceptions: []
  side_effects: none
- name: _load_job
  description: Load and validate one persisted DeepSeek finalize job JSON object.
  locked: false
  inputs:
    job_path:
      type: Path
      required: true
  returns:
    type: dict[str, Any]
  exceptions:
  - ValueError
  - OSError
  side_effects: Reads a local job JSON file.
- name: _history_store
  description: Build an interview history store for a job when a history path is
    present.
  locked: false
  inputs:
    job:
      type: dict[str, Any]
      required: true
  returns:
    type: InterviewHistoryStore | None
  exceptions: []
  side_effects: none
- name: _ml_dataset_store
  description: Build the sibling interview ML dataset store for a DeepSeek job when
    a history path is present.
  locked: false
  inputs:
    job:
      type: dict[str, Any]
      required: true
  returns:
    type: InterviewMLDatasetStore | None
  exceptions: []
  side_effects: none
- name: _update_history
  description: Update the matching interview history row when history identifiers
    are available.
  locked: false
  inputs:
    job:
      type: dict[str, Any]
      required: true
    updates:
      type: dict[str, Any]
      required: true
  returns:
    type: None
  exceptions: []
  side_effects: Updates interview history through InterviewHistoryStore when a row matches.
- name: _update_ml_dataset
  description: Upsert the sibling ML dataset row set for a DeepSeek job using current
    payload/scoring, history updates, source paths, and buffered DeepSeek prompt/output
    trace events. Missing or failed AI analysis creates pending-AI backlog data and
    never starts a new DeepSeek run.
  locked: false
  inputs:
    job:
      type: dict[str, Any]
      required: true
    payload:
      type: dict[str, Any]
      required: true
    scoring:
      type: dict[str, Any]
      required: true
    updates:
      type: dict[str, Any]
      required: true
    config:
      type: Any | None
      required: false
      default: null
  returns:
    type: None
  exceptions: []
  side_effects: Writes interview_ml_dataset.sqlite3 and trace rows when a history
    path and history id are available.
- name: _write_progress
  description: Write sanitized detached DeepSeek progress state for the GUI progress
    popup, using only step/status/task-list/timestamp metadata and no transcript
    content, through the shared atomic JSON writer so transient Windows/Dropbox
    replace denials are retried.
  locked: false
  inputs:
    job:
      type: dict[str, Any]
      required: true
    step:
      type: str
      required: true
    status:
      type: str
      required: false
      default: processing
  returns:
    type: None
  exceptions: []
  side_effects: Writes or replaces a local progress JSON file when progress_path is
    present in the job, preserving prior task rows and marking future rows queued;
    persistent OS write failures are treated as non-fatal so DeepSeek processing can
    continue.
- name: _local_ollama_api_ready
  description: Return whether the configured local Ollama HTTP API is responding,
    treating non-local DeepSeek endpoints as externally managed and ready.
  locked: false
  inputs:
    config:
      type: Any
      required: true
  returns:
    type: bool
  exceptions: []
  side_effects: Sends a bounded local HTTP readiness request to /api/tags for local
    Ollama endpoints.
- name: _resolve_ollama_executable
  description: Resolve the Ollama executable from PATH or common Windows install
    locations, falling back to the platform command name.
  locked: false
  inputs: {}
  returns:
    type: str
  exceptions: []
  side_effects: Reads PATH and local filesystem metadata.
- name: _start_local_ollama_service
  description: Start the local Ollama service process with stdio discarded and no
    shell interpolation.
  locked: false
  inputs:
    ollama_exe:
      type: str
      required: true
  returns:
    type: None
  exceptions:
  - OSError
  side_effects: Starts an ollama serve subprocess.
- name: _ensure_local_deepseek_runtime
  description: For local Ollama-backed DeepSeek config, report readiness progress,
    start Ollama when not responding, and fail closed if the API does not become ready.
  locked: false
  inputs:
    job:
      type: dict[str, Any]
      required: true
    config:
      type: Any
      required: true
  returns:
    type: None
  exceptions:
  - RuntimeError
  - OSError
  side_effects: Writes sanitized progress JSON, may start a local Ollama subprocess,
    and polls the local Ollama API.
- name: _lock_path_for_job
  description: Resolve the DeepSeek finalize lock path beside the persisted job file.
  locked: false
  inputs:
    job_path:
      type: Path
      required: true
  returns:
    type: Path
  exceptions: []
  side_effects: none
- name: _process_is_alive
  description: Return whether a lock-owner process id appears alive on the local OS.
  locked: false
  inputs:
    pid:
      type: int
      required: true
  returns:
    type: bool
  exceptions: []
  side_effects: Probes local process table without logging sensitive data.
- name: _load_lock_metadata
  description: Load non-sensitive lock metadata, returning an empty dict for unreadable
    or invalid lock files.
  locked: false
  inputs:
    lock_path:
      type: Path
      required: true
  returns:
    type: dict[str, Any]
  exceptions: []
  side_effects: Reads a local lock file.
- name: _lock_is_stale
  description: Return whether a DeepSeek lock may be recovered because its owner is
    gone or it exceeded the stale timeout, treating fresh unreadable lock metadata
    as active so concurrent workers do not delete a lock while another process is
    still writing it.
  locked: false
  inputs:
    lock_path:
      type: Path
      required: true
    now:
      type: float | None
      required: false
      default: null
    stale_seconds:
      type: float
      required: false
      default: _LOCK_STALE_SECONDS
  returns:
    type: bool
  exceptions: []
  side_effects: Reads lock metadata and probes local process state.
- name: _write_lock_file
  description: Atomically create the DeepSeek worker lock file with non-sensitive
    owner metadata.
  locked: false
  inputs:
    lock_path:
      type: Path
      required: true
    job_path:
      type: Path
      required: true
  returns:
    type: dict[str, Any]
  exceptions:
  - FileExistsError
  - OSError
  side_effects: Writes a lock file containing pid, timestamps, and job stem only.
- name: _deepseek_worker_lock
  description: Context manager that serializes DeepSeek finalize jobs per job directory,
    waits for active owners, recovers stale locks, and releases only its own lock.
  locked: false
  inputs:
    job_path:
      type: Path
      required: true
  returns:
    type: contextmanager
  exceptions:
  - OSError
  side_effects: Creates, reads, waits on, and removes a local lock file.
- name: _deepseek_status_value
  description: Normalize a DeepSeek status value for aggregate worker status checks.
  locked: false
  inputs:
    value:
      type: Any
      required: true
  returns:
    type: str
  exceptions: []
  side_effects: none
- name: _deepseek_generated
  description: Return whether any summary, suggestion, or advisory scoring output
    was generated or partially generated.
  locked: false
  inputs:
    payload:
      type: dict[str, Any]
      required: true
  returns:
    type: bool
  exceptions: []
  side_effects: none
- name: _deepseek_complete
  description: Return whether summary generation, advisory trait suggestions, and
    advisory trait scoring all completed successfully for worker history status.
  locked: false
  inputs:
    payload:
      type: dict[str, Any]
      required: true
  returns:
    type: bool
  exceptions: []
  side_effects: none
- name: _deepseek_history_status
  description: Map DeepSeek payload status fields to sanitized history status and
    warning text using complete, partial, or failed.
  locked: false
  inputs:
    payload:
      type: dict[str, Any]
      required: true
  returns:
    type: tuple[str, str]
  exceptions: []
  side_effects: none
- name: _require_deepseek_statuses
  description: Fail closed when a caller explicitly requires DeepSeek prompt groups
    to generate before continuing; advisory stages may allow partial/no_transcript
    statuses, while summary failures are handled with document placeholders.
  locked: false
  inputs:
    payload:
      type: dict[str, Any]
      required: true
    required:
      type: tuple[str, ...]
      required: true
    allowed:
      type: tuple[str, ...]
      required: false
      default: ("generated",)
  returns:
    type: None
  exceptions:
  - RuntimeError
  side_effects: none
- name: _trait_advisory_ready
  description: Return whether the trait advisory stage can be considered usable
    for worker resume/continuation; suggestions may be generated, partial, or unavailable
    for no transcript, while advisory scoring must be generated or unavailable for
    no transcript.
  locked: false
  inputs:
    payload:
      type: dict[str, Any]
      required: true
  returns:
    type: bool
  exceptions: []
  side_effects: none
- name: _deepseek_failure_warning
  description: Convert a worker exception into a sanitized operator-facing DeepSeek
    processing warning, preserving incomplete-prompt details while keeping generic
    exception names for other failure classes.
  locked: false
  inputs:
    exc:
      type: Exception
      required: true
  returns:
    type: str
  exceptions: []
  side_effects: none
- name: _checkpoint_job
  description: Persist the latest DeepSeek payload and scoring into the job JSON
    after a stage completes so a later retry can resume from the last checkpoint.
    Uses the shared atomic JSON writer so transient Windows/Dropbox replace denials
    are retried.
  locked: false
  inputs:
    job_path:
      type: Path
      required: true
    job:
      type: dict[str, Any]
      required: true
    payload:
      type: dict[str, Any]
      required: true
    scoring:
      type: dict[str, Any]
      required: true
  returns:
    type: None
  exceptions:
  - OSError
  side_effects: Atomically rewrites the local job JSON file with updated payload
    and scoring fields.
- name: _timestamp_for_filename
  description: Return a UTC timestamp string safe for regenerated report filenames.
  locked: false
  inputs: {}
  returns:
    type: str
  exceptions: []
  side_effects: none
- name: _regenerated_report_path
  description: Resolve a sibling DOCX path with a regenerated timestamp suffix when
    the original interview notes report cannot be overwritten.
  locked: false
  inputs:
    report_path:
      type: Path
      required: true
  returns:
    type: Path
  exceptions: []
  side_effects: Checks local filesystem path existence to avoid overwriting an existing
    regenerated report.
- name: _export_interview_notes
  description: Export refreshed interview notes, falling back to a sibling regenerated
    DOCX path when the original report path is locked by another process.
  locked: false
  inputs:
    job:
      type: dict[str, Any]
      required: true
    job_path:
      type: Path
      required: true
    rubric:
      type: dict[str, Any]
      required: true
    payload:
      type: dict[str, Any]
      required: true
    scoring:
      type: dict[str, Any]
      required: true
  returns:
    type: Path
  exceptions:
  - PermissionError
  - OSError
  side_effects: Writes DOCX output, may create and remove a temporary retry directory,
    and may move regenerated output to a sibling report path.
- name: _delete_superseded_basic_notes
  description: Delete the prior same-folder Basic Interview Notes DOCX after a richer
    DeepSeek interview notes document has been successfully generated at a distinct
    path.
  locked: false
  inputs:
    original_path:
      type: Path
      required: true
    generated_path:
      type: Path
      required: true
  returns:
    type: None
  exceptions: []
  side_effects: May delete one sibling DOCX file whose name contains Basic Interview
    Notes; filesystem delete failures are ignored so history still points at the
    generated DeepSeek document.
- name: _run_job_unlocked
  description: Execute one already-lock-protected DeepSeek finalize job, generating
    or resuming advisory trait suggestions/scoring and recomputed scoring before
    generating or resuming answer/executive summaries; checkpoints completed stages
    to the job JSON so GUI retry can resume after the last completed stage. Uses
    a regenerated sibling report path if the original DOCX is locked. Injects the
    candidate role context into transcript items before DeepSeek calls and exports
    interview notes even when summaries are failed or partial, relying on placeholder
    text and history status to surface failures. For rerun_mode=document_only, skips
    local Ollama and scoring recomputation, exporting from saved payload/scoring.
  locked: false
  inputs:
    job:
      type: dict[str, Any]
      required: true
    job_path:
      type: Path
      required: true
  returns:
    type: None
  exceptions:
  - OSError
  - RuntimeError
  side_effects: May start and call local Ollama except in document-only rerun mode,
    writes DOCX output, deletes a superseded same-folder basic notes DOCX after successful
    rich export, and updates interview history through InterviewHistoryStore.
- name: run_job
  description: Load one persisted DeepSeek finalize job, acquire the per-job-directory
    DeepSeek lock, generate advisory trait signal/scoring output through local Ollama,
    recompute final scoring from human raw scores plus DeepSeek advisory metadata,
    generate answer summaries and executive summary with scoring context, rewrite
    the interview notes DOCX, and mark the matching history row complete, partial,
    or failed based on generated DeepSeek output; document-only rerun jobs skip local
    DeepSeek and rebuild the DOCX from saved job payload/scoring.
  locked: false
  inputs:
    job_path:
      type: Path
      required: true
  returns:
    type: None
  exceptions:
  - ValueError
  - OSError
  side_effects: Reads job JSON, creates/removes the DeepSeek lock, may start and call
    local Ollama, writes DOCX output, deletes a superseded same-folder basic notes
    DOCX after successful rich export, and updates interview history through InterviewHistoryStore.
- name: main
  description: CLI entrypoint for running one detached DeepSeek finalize job.
  locked: false
  inputs:
    argv:
      type: list[str]
      required: true
  returns:
    type: int
  exceptions: []
  side_effects: Runs a job and updates history status on failure.
classes: []
data_structures: []
dependencies:
- module: data_store
- module: interview_runtime
- module: scoring_reporting
