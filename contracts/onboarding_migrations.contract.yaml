    expected_sha256: {type: str, required: false, default: ''}
  returns: {type: LegacyJsonMigrationResult}
  exceptions: [ValueError, PermissionError, OSError, sqlite3.DatabaseError]
  side_effects: Atomically creates a content-addressed backup and inserts missing v2 projections.
