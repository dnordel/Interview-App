  language: python
  path: src/onboarding_migrations.py
  version: 1.2.0
  description: Compatibility metadata migrations plus fail-closed, previewed, backed-up, idempotent legacy JSON import into onboarding v2.
functions:
- name: preview_legacy_json_migration
  description: Validates and summarizes a legacy onboarding JSON file without mutation.
  locked: false
  inputs:
    source_path: {type: Path, required: true}
  returns: {type: LegacyJsonMigrationPreview}
  exceptions: [ValueError, OSError]
  side_effects: Reads and hashes one legacy JSON file.
- name: migrate_legacy_json_to_v2
