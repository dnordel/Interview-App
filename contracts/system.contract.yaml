module_metadata:
  interview_question_flow:
    constraints:
    - Interview question order and question identity are driven by config/rubric.json plus config/question_overrides.json.
    - Scored and custom question screens share one persistent footer contract.
    - Recording/transcription is owned by interview runtime and is question-type agnostic.
  document_flow_rule:
    canonical_field_name: interview_notes_document_path
    merged_interview_notes_contract: true
    description: Finalize, referral, and integration modules must exchange one merged interview-notes artifact that already includes transcription content.
  interview_app_finalize_context:
    constraints:
    - Requires interview_notes_document_path as the only canonical document artifact field.
  interview_app_finalize_pipeline:
    constraints:
    - Finalize processing produces one basic merged interview-notes artifact referenced by interview_notes_document_path.
  interview_app_finalize_gateways:
    constraints:
    - Referral/integration dispatches must read interview_notes_document_path from finalize context payloads.
  pyside_interview_app:
    constraints:
    - Acts as the single PySide desktop parity surface for desktop GUI responsibilities.
    - Hosts admin-only Settings inside the shared Staffing v2 shell and delegates draft validation, backups, and confirmed JSON persistence to admin_studio.
    - Offer generation resolves school-specific full-time or part-time templates and output folders from school_offer_settings_json, requires Mr. or Ms. title selection, preserves existing offers with revision suffixes, and prefills editable shift times from the exact school-scoped completed Director Staffing v2 hire decision.
    - Pending offers expose a direct Review offer action beside the overflow menu; submission generates and persists same-stem DOCX and PDF artifacts together so review reuses the saved PDF, approval review renders the active candidate offer template from Notification Settings, and every initial, edited, or retried candidate delivery attaches only the approved PDF and never the retained Word artifact.
    - Finalize progress is user-closable and does not cancel background transcription or finalize work.
    - Finalize progress renders sanitized task rows with right-side statuses limited to Processing, Finished, Timed-out, or Queued.
    - Completed overview uses existing ScoringEngine totals, marks only ratings of 5 as strengths, marks ratings of 3 or below as review items, treats ratings of 4 as neutral, and shows an explicit empty state when either summary has no score-derived items.
    - Completed overview edits update the existing history artifact set idempotently without duplicate history, application, referral, or notification records.
    - Candidates-owned pipeline/history refreshes after finalize and opens the basic notes document immediately; Interviews contains setup/live/review only.
  scoring_reporting:
    constraints:
    - Referral payload document attachment path must resolve from interview_notes_document_path.
    - Integration payload document references must use interview_notes_document_path as canonical path.
  trait_based_scoring_json:
    constraints:
    - Runtime weighted signal source includes preschool teacher signals and Behavior Support Specialist role signals while preserving existing preschool signal identifiers.
