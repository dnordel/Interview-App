module_metadata:
  interview_question_flow:
    constraints:
    - Interview question order and question identity are driven by config/rubric.json plus config/question_overrides.json.
    - Scored and custom question screens share one persistent footer contract.
    - Recording/transcription is owned by interview runtime and is question-type agnostic.
  document_flow_rule:
    canonical_field_name: interview_notes_document_path
    merged_interview_notes_contract: true
    description: Finalize, referral, and integration modules must exchange one merged interview-notes artifact that already includes transcription content.
  interview_app_finalize_context:
    constraints:
    - Requires interview_notes_document_path as the only canonical document artifact field.
  interview_app_finalize_pipeline:
    constraints:
    - Finalize processing produces one merged interview-notes artifact referenced by interview_notes_document_path.
  interview_app_finalize_gateways:
    constraints:
    - Referral/integration dispatches must read interview_notes_document_path from finalize context payloads.
  pyside_interview_app:
    constraints:
    - Acts as the single PySide desktop parity surface for desktop GUI responsibilities.
    - Delegates Admin Studio draft editing, validation, backups, and confirmed JSON persistence to admin_studio.
    - Finalize progress is user-closable and does not cancel background transcription, finalize, or DeepSeek work.
    - Finalize progress renders sanitized task rows with right-side statuses limited to Processing, Finished, Timed-out, or Queued.
    - Home and Candidates history tables refresh after finalize and show Processing in the Notes column until detached DeepSeek work completes or fails.
  scoring_reporting:
    constraints:
    - Referral payload document attachment path must resolve from interview_notes_document_path.
    - Integration payload document references must use interview_notes_document_path as canonical path.
  trait_based_scoring_json:
    constraints:
    - Runtime weighted signal source includes preschool teacher signals and Behavior Support Specialist role signals while preserving existing preschool signal identifiers.
