module_metadata:
  document_flow_rule:
    canonical_field_name: interview_notes_document_path
    merged_interview_notes_contract: true
    description: Finalize, referral, and integration modules must exchange one merged
      interview-notes artifact that already includes transcription content.
  interview_app_finalize_context:
    constraints:
    - Requires interview_notes_document_path as the only canonical document artifact
      field.
  interview_app_finalize_pipeline:
    constraints:
    - Finalize processing produces one merged interview-notes artifact referenced
      by interview_notes_document_path.
  interview_app_finalize_gateways:
    constraints:
    - Referral/integration dispatches must read interview_notes_document_path from
      finalize context payloads.
  director_referral_service:
    constraints:
    - Referral payload document attachment path must resolve from interview_notes_document_path.
  integration_export:
    constraints:
    - Integration payload document references must use interview_notes_document_path
      as canonical path.
