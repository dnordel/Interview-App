module:
  name: interview_app_transcription_executor
  language: python
  path: src/interview_app/transcription_executor.py
  version: 1.1.1
  description: Deprecated compatibility wrapper for bounded transcription execution
    utilities implemented by interview_runtime.
functions:
- name: recommended_max_workers
  description: Return a hardware-aware default max worker count for transcription
    jobs.
  locked: false
  inputs:
    cpu_count:
      type: int | None
      required: false
      default: null
  returns:
    type: int
  exceptions: []
  side_effects: none
- name: resolve_transcription_max_workers
  description: Resolve configured transcription worker count with safe fallback bounds.
  locked: false
  inputs:
    settings:
      type: dict[str, Any]
      required: true
  returns:
    type: int
  exceptions: []
  side_effects: none
- name: resolve_transcription_job_timeout_seconds
  description: Resolve per-job transcription timeout from settings with bounded fallback
    values.
  locked: false
  inputs:
    settings:
      type: dict[str, Any]
      required: true
  returns:
    type: float
  exceptions: []
  side_effects: none
classes:
- name: TranscriptionJobStatusEvent
  description: Immutable status event emitted for queue/UI progress updates.
  locked: false
  attributes:
    flow_idx:
      type: int
    status:
      type: str
    snapshot:
      type: TranscriptionQueueSnapshot
  methods: []
- name: BoundedTranscriptionExecutor
  description: Executes queued transcription jobs with bounded parallelism and status
    callbacks.
  locked: false
  attributes: {}
  methods:
  - name: __init__
    description: BoundedTranscriptionExecutor constructor.
    locked: false
    inputs:
      queue_state:
        type: TranscriptionQueueState
        required: true
      worker_fn:
        type: Callable[..., None]
        required: true
      max_workers:
        type: int
        required: true
      on_status_change:
        type: Callable[[TranscriptionJobStatusEvent], None] | None
        required: false
        default: null
    returns:
      type: None
    exceptions: []
    side_effects: initializes internal thread pool state
  - name: submit
    description: Queue and dispatch a transcription job.
    locked: false
    inputs:
      flow_idx:
        type: int
        required: true
      payload:
        type: TranscriptionQueuePayload
        required: true
    returns:
      type: None
    exceptions: []
    side_effects: updates queue state and submits async work
  - name: shutdown
    description: Shut down the underlying executor.
    locked: false
    inputs:
      wait:
        type: bool
        required: true
    returns:
      type: None
    exceptions: []
    side_effects: terminates background workers
  - name: _executor_instance
    description: Lazily create and return the thread pool executor.
    locked: false
    inputs: {}
    returns:
      type: ThreadPoolExecutor
    exceptions: []
    side_effects: creates thread pool on first use
  - name: _run_job
    description: Execute one transcription job and publish terminal status.
    locked: false
    inputs:
      flow_idx:
        type: int
        required: true
      payload:
        type: TranscriptionQueuePayload
        required: true
    returns:
      type: None
    exceptions: []
    side_effects: updates queue state and invokes worker callback
  - name: _runtime_payload
    description: Build runtime call payload from queue metadata.
    locked: false
    inputs:
      payload:
        type: TranscriptionQueuePayload
        required: true
    returns:
      type: dict[str, Any]
    exceptions: []
    side_effects: none
  - name: _emit
    description: Emit a status event callback when configured.
    locked: false
    inputs:
      flow_idx:
        type: int
        required: true
      status:
        type: str
        required: true
      snapshot:
        type: TranscriptionQueueSnapshot
        required: true
    returns:
      type: None
    exceptions: []
    side_effects: invokes caller-provided callback
  - name: _discard_future
    description: Remove completed futures from in-flight tracking.
    locked: false
    inputs:
      future:
        type: Future[None]
        required: true
    returns:
      type: None
    exceptions: []
    side_effects: updates in-memory future tracking
data_structures:
- name: TranscriptionJobStatusEvent
  type: dataclass
dependencies:
- module: interview_runtime
