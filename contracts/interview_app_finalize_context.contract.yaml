module:
  name: interview_app_finalize_context
  language: python
  path: src/interview_app/finalize_context.py
  version: 3.0.0
  description: Deprecated compatibility wrapper for finalize payload context implemented
    by interview_runtime.
functions:
- name: build_finalize_context
  description: Build finalize payload, flow transcript, transcript metadata, canonical
    interview notes path placeholder, and empty legacy transcript path.
  locked: false
  inputs:
    app:
      type: Any
      required: true
    scoring:
      type: dict[str, Any]
      required: true
    warnings:
      type: list[str]
      required: true
    transcript_metadata:
      type: FinalizeTranscriptMetadata
      required: true
  returns:
    type: FinalizeContext
  exceptions: []
  side_effects: Applies candidate transcript text to flow payloads and clears the
    legacy referral transcript path for new finalize output.
classes:
- name: FinalizeContext
  description: FinalizeContext carrying finalize payload, canonical interview notes
    document path, and empty legacy transcript compatibility field.
  locked: false
  attributes:
    payload:
      type: dict[str, Any]
    scoring:
      type: dict[str, Any]
    flow_transcript:
      type: list[dict[str, Any]]
    recording_metadata:
      type: list[dict[str, Any]]
    interview_notes_document_path:
      type: str
    transcript_path:
      type: str
      description: '[DEPRECATED] Empty legacy transcript-only path for new finalize
        output. Use interview_notes_document_path.'
    transcript_metadata:
      type: FinalizeTranscriptMetadata
    transcript_complete:
      type: bool
    remaining_question_indices:
      type: list[int]
  methods: []
data_structures:
- name: FinalizeContext
  type: dataclass
dependencies:
- module: interview_runtime
