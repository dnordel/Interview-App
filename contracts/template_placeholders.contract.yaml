module:
  name: template_placeholders
  language: python
  path: src/template_placeholders.py
  version: 1.0.0
  description: Shared placeholder token parsing, validation, and UI insertion helpers.
functions:
- name: placeholder_meta_for_context
  description: Return placeholder metadata available for a template context.
  locked: false
  inputs:
    context:
      type: str
      required: true
  returns:
    type: list[PlaceholderMeta]
  exceptions: []
  side_effects: none
- name: placeholder_tokens_for_context
  description: Return placeholder token strings for a context.
  locked: false
  inputs:
    context:
      type: str
      required: true
  returns:
    type: list[str]
  exceptions: []
  side_effects: none
- name: placeholder_picker_options
  description: Build ordered picker labels for one or more contexts.
  locked: false
  inputs:
    contexts:
      type: Iterable[str]
      required: true
  returns:
    type: list[str]
  exceptions: []
  side_effects: none
- name: token_from_picker_label
  description: Extract raw placeholder token from picker label text.
  locked: false
  inputs:
    label:
      type: str
      required: true
  returns:
    type: str
  exceptions: []
  side_effects: none
- name: token_to_key
  description: Convert placeholder token into canonical placeholder key.
  locked: false
  inputs:
    token:
      type: str
      required: true
  returns:
    type: str
  exceptions: []
  side_effects: none
- name: _match_key
  description: Extract placeholder key from regex match object.
  locked: false
  inputs:
    match:
      type: re.Match[str]
      required: true
  returns:
    type: str
  exceptions: []
  side_effects: none
- name: extract_placeholders
  description: Parse placeholder tokens from free-text template content.
  locked: false
  inputs:
    text:
      type: str
      required: true
  returns:
    type: set[str]
  exceptions: []
  side_effects: none
- name: missing_placeholder_keys
  description: Return placeholders that are required but missing from values.
  locked: false
  inputs:
    text:
      type: str
      required: true
    values:
      type: dict[str, object]
      required: true
    context:
      type: str
      required: true
  returns:
    type: list[str]
  exceptions: []
  side_effects: none
- name: find_unknown_placeholders
  description: Return unknown placeholders relative to context definitions.
  locked: false
  inputs:
    text:
      type: str
      required: true
    context:
      type: str
      required: true
  returns:
    type: set[str]
  exceptions: []
  side_effects: none
- name: validate_template_map
  description: Validate templates and return missing/unknown placeholder diagnostics.
  locked: false
  inputs:
    templates:
      type: dict[str, str]
      required: true
    context_by_key:
      type: dict[str, str]
      required: true
  returns:
    type: dict[str, set[str]]
  exceptions: []
  side_effects: none
- name: render_template
  description: Render placeholders from values using unknown placeholder policy.
  locked: false
  inputs:
    template:
      type: str
      required: true
    values:
      type: dict[str, object]
      required: true
    context:
      type: str | None
      required: false
      default: null
    unknown_policy:
      type: str
      required: false
      default: "leave"
  returns:
    type: str
  exceptions:
  - ValueError
  side_effects: none
- name: insert_token_into_widget
  description: Insert token text into a supported Tk widget.
  locked: false
  inputs:
    widget:
      type: tk.Misc
      required: true
    token:
      type: str
      required: true
  returns:
    type: bool
  exceptions: []
  side_effects: Mutates widget text content.
- name: insert_token_into_focused_widget
  description: Insert token into focused widget when widget type is allowed.
  locked: false
  inputs:
    root:
      type: tk.Misc
      required: true
    token:
      type: str
      required: true
    allowed_widgets:
      type: Iterable[tk.Misc]
      required: false
      default: ()
  returns:
    type: bool
  exceptions: []
  side_effects: Mutates focused widget text content.
classes:
- name: PlaceholderMeta
  description: Metadata describing one placeholder token.
  locked: false
  attributes:
    key:
      type: str
    label:
      type: str
    description:
      type: str
  methods: []
data_structures:
- name: PLACEHOLDER_METADATA
  type: dict[str, PlaceholderMeta]
- name: PLACEHOLDERS_BY_CONTEXT
  type: dict[str, tuple[str, ...]]
dependencies: []
