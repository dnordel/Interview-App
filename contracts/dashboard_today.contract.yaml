module:
  name: dashboard_today
  language: python
  path: src/dashboard_today.py
  version: 1.0.0
  description: Compatibility wrapper for dashboard summary helpers now implemented by onboarding_operations.
functions:
- name: build_dashboard_today_summary
  description: Build interview and onboarding counts for the today dashboard.
  locked: false
  inputs:
    history_rows:
      type: list[dict[str, Any]]
      required: true
    employees:
      type: list[Employee]
      required: true
    scheduler_settings:
      type: Mapping[str, Any] | None
      required: true
    today:
      type: date | None
      required: false
      default: null
  returns:
    type: DashboardTodaySummary
  exceptions: []
  side_effects: none
- name: summarize_interview_states
  description: Count pending and follow-up interview history rows.
  locked: false
  inputs:
    history_rows:
      type: list[dict[str, Any]]
      required: true
  returns:
    type: InterviewDashboardCounts
  exceptions: []
  side_effects: none
- name: summarize_onboarding_states
  description: Count actionable onboarding tasks and the next critical task.
  locked: false
  inputs:
    employees:
      type: list[Employee]
      required: true
    today:
      type: date
      required: true
    critical_window_days:
      type: int
      required: true
  returns:
    type: OnboardingDashboardCounts
  exceptions: []
  side_effects: none
- name: critical_window_days_from_settings
  description: Resolve critical-task dashboard window days from scheduler settings.
  locked: false
  inputs:
    settings:
      type: Mapping[str, Any] | None
      required: true
  returns:
    type: int
  exceptions: []
  side_effects: none
- name: _is_critical_by_window
  description: Return whether a task due date is inside the critical dashboard window.
  locked: false
  inputs:
    due_date_text:
      type: str | None
      required: true
    today:
      type: date
      required: true
    window_days:
      type: int
      required: true
  returns:
    type: bool
  exceptions: []
  side_effects: none
- name: _parse_due_date
  description: Parse an ISO due date or return None for missing/invalid input.
  locked: false
  inputs:
    due_date_text:
      type: str | None
      required: true
  returns:
    type: date | None
  exceptions: []
  side_effects: none
- name: _is_earlier_task
  description: Compare dashboard critical-task candidates by due date and title.
  locked: false
  inputs:
    current:
      type: tuple[date, NextCriticalTask] | None
      required: true
    due:
      type: date
      required: true
    title:
      type: str
      required: true
  returns:
    type: bool
  exceptions: []
  side_effects: none
classes:
- name: InterviewDashboardCounts
  description: Today-dashboard interview counts.
  locked: false
  attributes:
    pending:
      type: int
    follow_up:
      type: int
  methods: []
- name: NextCriticalTask
  description: Next actionable onboarding task within the critical dashboard window.
  locked: false
  attributes:
    employee_id:
      type: str
    employee_name:
      type: str
    task_id:
      type: str
    title:
      type: str
    due_date:
      type: str
    status:
      type: str
  methods: []
- name: OnboardingDashboardCounts
  description: Today-dashboard onboarding counts.
  locked: false
  attributes:
    overdue:
      type: int
    due_today:
      type: int
    critical:
      type: int
    critical_window_days:
      type: int
    next_critical:
      type: NextCriticalTask | None
  methods: []
- name: DashboardTodaySummary
  description: Combined today-dashboard summary for interview and onboarding.
  locked: false
  attributes:
    interviews:
      type: InterviewDashboardCounts
    onboarding:
      type: OnboardingDashboardCounts
  methods: []
data_structures:
- name: DEFAULT_CRITICAL_WINDOW_DAYS
  description: Default onboarding critical window for today dashboard counts.
dependencies:
- onboarding_operations
