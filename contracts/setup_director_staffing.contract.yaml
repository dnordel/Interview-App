module:
  name: setup_director_staffing
  language: powershell
  path: setup_director_staffing.ps1
  version: 1.1.0
  description: Minimal Windows bootstrap for school-filtered director Staffing v2 launchers; creates or repairs a school-specific desktop shortcut with the bundled Staffing icon, provisions Python 3.11, a director-specific virtual environment, pinned PySide6 and python-docx requirements, and the standalone director_staffing_app entrypoint without FFmpeg, VB-CABLE, audio, transcription, OpenVINO, or GPU setup.
functions:
- name: Write-Log
  description: Append director staffing launcher diagnostics to the setup log file.
  locked: false
  inputs:
    Message:
      type: string
      required: true
  returns:
    type: void
  exceptions: []
  side_effects: writes director staffing setup log entries
- name: Install-DirectorStaffingDesktopShortcut
  description: Create or repair the current user's school-specific Director Staffing desktop shortcut so it targets the matching minimal VBS launcher and uses the bundled repo-owned icon; invalid school filename characters are removed and shortcut-policy failures are logged without blocking app launch.
  locked: false
  inputs:
    School:
      type: string
      required: true
  returns:
    type: void
  exceptions: []
  side_effects: May create or update a school-specific Director Staffing .lnk on the current user's Desktop and writes launcher diagnostics.
- name: Run-Proc
  description: Execute a child process from the repo root and return its exit code.
  locked: false
  inputs:
    File:
      type: string
      required: true
    Args:
      type: string[]
      required: false
      default: []
  returns:
    type: int
  exceptions:
  - Exception
  side_effects: starts a child process and writes launcher log entries
- name: Find-Python311
  description: Resolve a usable Python 3.11 interpreter through the Windows py launcher or PATH.
  locked: false
  inputs: {}
  returns:
    type: string
  exceptions:
  - Exception
  side_effects: executes local interpreter probes
- name: Ensure-DirectorVenv
  description: Reuse the director-only Python 3.11 virtual environment under LOCALAPPDATA, fall back to the shared app virtual environment when present, or create the director-only virtual environment.
  locked: false
  inputs:
    PythonExe:
      type: string
      required: true
  returns:
    type: string
  exceptions:
  - Exception
  side_effects: may create the director staffing virtual environment
- name: Start-DirectorStaffingApp
  description: Launch the standalone director Staffing v2 app with quoted arguments, no child console window, redirected stdout/stderr logs for immediate-exit diagnostics, and immediate-exit detection.
  locked: false
  inputs:
    VenvPy:
      type: string
      required: true
    AppPath:
      type: string
      required: true
    AppArgs:
      type: string[]
      required: false
      default: []
  returns:
    type: void
  exceptions:
  - Exception
  side_effects: starts the director Staffing v2 Python process through System.Diagnostics.ProcessStartInfo with UseShellExecute false and CreateNoWindow true, writes launch logs, creates stdout/stderr log files, and writes captured output when the process exits immediately
- name: Ensure-DirectorDependencies
  description: Install requirements-director.txt when PySide6 or python-docx is missing from the director virtual environment.
  locked: false
  inputs:
    VenvPy:
      type: string
      required: true
  returns:
    type: void
  exceptions:
  - Exception
  side_effects: may install PySide6 into the director staffing virtual environment
classes: []
data_structures: []
dependencies:
- module: director_staffing_app
