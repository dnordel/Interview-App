module:
  name: staffing_service
  language: python
  path: src/staffing_service.py
  version: 0.17.0
  description: Staffing assignment state machine, service-backed classroom, position, person creation, director interview referral/completion tracking with optional pending-queue fallback, mistaken-position deletion, queued Dropbox edit handling, staffing dashboard metrics with pending-operation projection and workbook display metadata, confirmed person moves, editable assignment details, person permit metadata updates, and post-commit notification emission for successful transactions.
functions: []
classes:
- name: StaffingService
  description: Applies staffing transactions and director interview completion records through StaffingStore and emits checkpoint notifications after successful assignment commits.
  locked: false
  methods:
  - name: open_position
    inputs:
      assignment_id:
        type: int
        required: true
    returns:
      type: StaffingTransitionResult
    exceptions:
    - ValueError
    side_effects: Updates assignment/history rows, then may emit staffing.assignment.need_now notification; if DB is locked, saves operation to pending queue and returns queued status.
  - name: add_position
    inputs:
      school:
        type: str
        required: true
      classroom:
        type: str
        required: true
      classroom_program:
        type: str
        required: false
        default: ''
      licensed_capacity:
        type: int | None
        required: false
        default: null
      position_name:
        type: str
        required: true
      position_type:
        type: str
        required: true
      initial_status:
        type: str
        required: false
        default: dont_need_now
      person_name:
        type: str
        required: false
        default: ''
      permit_status:
        type: str
        required: false
        default: unknown
      start_date:
        type: str
        required: false
        default: ''
      notes:
        type: str
        required: false
        default: ''
    returns:
      type: StaffingTransitionResult
    exceptions:
    - ValueError
    - StaffingEditLock
    side_effects: Creates school/classroom/person rows as needed, inserts one assignment, opens history for open/coming statuses, and may emit staffing.assignment.created notification.
  - name: add_person
    inputs:
      name:
        type: str
        required: true
      role:
        type: str
        required: true
      permit_status:
        type: str
        required: false
        default: unknown
      units:
        type: float | int | None
        required: false
        default: null
    returns:
      type: StaffingPerson
    exceptions:
    - ValueError
    - StaffingEditLock
    side_effects: Creates or updates one active person row through StaffingStore.ensure_person under the staffing write lock without mutating assignments.
  - name: add_classroom
    inputs:
      school:
        type: str
        required: true
      name:
        type: str
        required: true
      program:
        type: str
        required: false
        default: ''
      ratio_group:
        type: str
        required: false
        default: ''
      licensed_capacity:
        type: int | None
        required: false
        default: null
    returns:
      type: StaffingClassroom
    exceptions:
    - ValueError
    - StaffingEditLock
    side_effects: Creates or updates one active school/classroom row through StaffingStore without mutating assignments or assignment_history.
  - name: update_classroom
    inputs:
      classroom_id:
        type: int
        required: true
      school:
        type: str
        required: true
      name:
        type: str
        required: true
      program:
        type: str
        required: false
        default: ''
      ratio_group:
        type: str
        required: false
        default: ''
      licensed_capacity:
        type: int | None
        required: false
        default: null
      display_order:
        type: int
        required: false
        default: 0
    returns:
      type: StaffingClassroom
    exceptions:
    - ValueError
    - StaffingEditLock
    side_effects: Updates one classroom record through StaffingStore without mutating assignments or assignment_history.
  - name: deactivate_classroom
    inputs:
      classroom_id:
        type: int
        required: true
    returns:
      type: StaffingClassroom
    exceptions:
    - ValueError
    - StaffingEditLock
    side_effects: Fails closed when active assignments exist; otherwise soft-deactivates one classroom through StaffingStore without deleting assignments or assignment_history.
  - name: mark_coming
    inputs:
      assignment_id:
        type: int
        required: true
      person_name:
        type: str
        required: true
      start_date:
        type: str
        required: true
    returns:
      type: StaffingTransitionResult
    exceptions:
    - ValueError
    side_effects: Updates assignment/person rows, then may emit staffing.assignment.coming notification; if DB is locked, saves operation to pending queue and returns queued status.
  - name: revert_coming
    inputs:
      assignment_id:
        type: int
        required: true
    returns:
      type: StaffingTransitionResult
    exceptions:
    - ValueError
    side_effects: Reverts coming assignment to need_now without emitting notification; if DB is locked, saves operation to pending queue and returns queued status.
  - name: mark_filled
    inputs:
      assignment_id:
        type: int
        required: true
    returns:
      type: StaffingTransitionResult
    exceptions:
    - ValueError
    side_effects: Closes assignment history using the Coming assignment start_date as current_filled_date and filled_date, then may emit staffing.assignment.filled notification; if DB is locked, saves operation to pending queue and returns queued status.
  - name: mark_replacing
    inputs:
      assignment_id:
        type: int
        required: true
      notice_given:
        type: str
        required: true
      final_working_day:
        type: str
        required: true
    returns:
      type: StaffingTransitionResult
    exceptions:
    - ValueError
    side_effects: Marks current person inactive, opens replacement history, changes assignment to Replace for future final working days, changes assignment immediately to Need Now and clears the assigned person/start date when final working day is today or earlier, then may emit staffing.assignment.replace or staffing.assignment.need_now notification; if DB is locked, saves operation to pending queue and returns queued status.
  - name: clear_replacement
    inputs:
      assignment_id:
        type: int
        required: true
    returns:
      type: StaffingTransitionResult
    exceptions:
    - ValueError
    side_effects: Clears replacing assignment person/start fields, keeps active replacement history open, and may emit staffing.assignment.need_now notification; if DB is locked, saves operation to pending queue and returns queued status.
  - name: mark_not_needed
    inputs:
      assignment_id:
        type: int
        required: true
      confirmed:
        type: bool
        required: false
        default: false
    returns:
      type: StaffingTransitionResult
    exceptions:
    - ValueError
    side_effects: Cancels active history, clears assignment, then may emit staffing.assignment.not_needed notification; if DB is locked, saves operation to pending queue and returns queued status.
  - name: delete_position
    inputs:
      assignment_id:
        type: int
        required: true
      confirmed:
        type: bool
        required: false
        default: false
    returns:
      type: StaffingTransitionResult
    exceptions:
    - ValueError
    side_effects: Requires explicit confirmation, soft-deactivates one unassigned mistaken position, closes any active open history as deleted, returns deleted status, and if DB is locked saves operation to pending queue and returns queued status.
  - name: update_permit_status
    inputs:
      person_id:
        type: int
        required: true
      permit_status:
        type: str
        required: true
      effective_date:
        type: str | None
        required: false
        default: null
      units:
        type: float | int | None
        required: false
        default: null
      documentation_received:
        type: bool
        required: false
        default: false
      notes:
        type: str
        required: false
        default: ''
    returns:
      type: StaffingTransitionResult
    exceptions:
    - ValueError
    side_effects: Updates person permit status, effective date, units, documentation flag, and permit notes, then may emit staffing.permit.updated notification; if DB is locked, saves operation to pending queue and returns queued status.
  - name: move_person
    inputs:
      source_assignment_id:
        type: int
        required: true
      target_assignment_id:
        type: int
        required: true
      confirmed:
        type: bool
        required: false
        default: false
    returns:
      type: StaffingTransitionResult
    exceptions:
    - ValueError
    side_effects: Moves a person from one assignment to an empty target assignment in one transaction, marks source need_now, opens source history, closes target active history, and requires explicit confirmation; if DB is locked, saves operation to pending queue and returns queued status.
  - name: update_assignment_details
    inputs:
      assignment_id:
        type: int
        required: true
      classroom:
        type: str
        required: true
      classroom_program:
        type: str | None
        required: false
        default: null
      position_name:
        type: str | None
        required: false
        default: null
      position_type:
        type: str | None
        required: false
        default: null
      status:
        type: str | None
        required: false
        default: null
      person_name:
        type: str | None
        required: false
        default: null
      start_date:
        type: str | None
        required: false
        default: null
      shift_start:
        type: str
        required: false
        default: ''
      shift_end:
        type: str
        required: false
        default: ''
      permit_status:
        type: str | None
        required: false
        default: null
      notes:
        type: str | None
        required: false
        default: null
    returns:
      type: StaffingTransitionResult
    exceptions:
    - ValueError
    side_effects: Updates assignment classroom/program, position name/type/status/start date/shift/notes fields, assigned or newly named person details, and assigned person's permit status when present; when status is changed to need_now, clears assigned person, start date, and current filled date instead of retaining or creating a person; may emit staffing.permit.updated notification; if DB is locked, saves operation to pending queue and returns queued status.
  - name: staffing_metrics
    inputs:
      today:
        type: date
        required: true
      school:
        type: str
        required: false
        default: ''
    returns:
      type: StaffingMetrics
    exceptions: []
    side_effects: Attempts to replay pending operations when unlocked, reads assignment, workbook display metadata, pending queue records, and filled-history rows from StaffingStore to compute dashboard metrics with queued changes projected for immediate UI feedback; when school is provided, returns metrics and rows only for that school; ignores seed epoch placeholder open dates so default 1970-era dates do not create multi-decade days-open values.
  - name: upsert_director_candidate_referral
    inputs:
      history_id:
        type: str
        required: true
      candidate_name:
        type: str
        required: true
      school:
        type: str
        required: true
      position:
        type: str
        required: false
        default: ''
      interviewer_rating:
        type: float | int | str | None
        required: false
        default: null
      interviewer_outcome:
        type: str
        required: true
      interview_date:
        type: str
        required: false
        default: ''
      candidate_email:
        type: str
        required: false
        default: ''
      referral_date:
        type: str
        required: false
        default: ''
      queue_on_lock:
        type: bool
        required: false
        default: false
    returns:
      type: StaffingDirectorCandidate
    exceptions:
    - ValueError
    - StaffingEditLock
    side_effects: Validates a new hire/borderline first-interview referral and upserts it without mutating staffing assignments; when queue_on_lock is true and the staffing edit lock is held, appends a director_candidate_referral pending operation and returns a placeholder StaffingDirectorCandidate with id 0.
  - name: list_pending_director_interviews
    inputs:
      school:
        type: str
        required: false
        default: ''
    returns:
      type: list[StaffingDirectorCandidate]
    exceptions: []
    side_effects: Reads pending director interview referrals, optionally scoped to one school.
  - name: list_completed_director_interviews
    inputs:
      school:
        type: str
        required: false
        default: ''
    returns:
      type: list[StaffingDirectorInterview]
    exceptions: []
    side_effects: Reads completed director interviews, optionally scoped to one school.
  - name: find_completed_director_interview
    inputs:
      history_id:
        type: str
        required: true
      school:
        type: str
        required: true
    returns:
      type: StaffingDirectorInterview | None
    exceptions: []
    side_effects: Reads one hire decision matched by exact interview history ID and school for downstream offer defaults.
  - name: delete_pending_director_interviews
    inputs:
      referral_ids:
        type: Sequence[int]
        required: true
      removed_by:
        type: str
        required: false
        default: ''
      removal_source:
        type: str
        required: false
        default: ''
    returns:
      type: int
    exceptions:
    - StaffingEditLock
    side_effects: Deletes and dismisses selected pending director interview referrals without deleting completed director interviews, staffing assignments, or interview history rows, and records removal audit actor/source metadata.
  - name: dismiss_director_referral_history_ids
    inputs:
      history_ids:
        type: Sequence[str]
        required: true
      removed_by:
        type: str
        required: false
        default: ''
      removal_source:
        type: str
        required: false
        default: ''
    returns:
      type: int
    exceptions:
    - StaffingEditLock
    side_effects: Dismisses director referral history ids and removes matching pending director interview referrals without deleting completed director interviews, staffing assignments, or interview history rows, and records removal audit actor/source metadata when matching pending rows exist.
  - name: record_director_interview
    inputs:
      referral_id:
        type: int
        required: true
      director_name:
        type: str
        required: true
      completed_date:
        type: str
        required: true
      rating:
        type: float | int | str
        required: true
      decision:
        type: str
        required: true
      decision_notes:
        type: str
        required: true
      proposed_shift_start:
        type: str
        required: false
        default: ''
      proposed_shift_end:
        type: str
        required: false
        default: ''
      proposed_classroom:
        type: str
        required: false
        default: ''
      follow_up_needed:
        type: bool
        required: false
        default: false
    returns:
      type: StaffingDirectorInterview
    exceptions:
    - ValueError
    - StaffingEditLock
    side_effects: Records a director interview with date, 1-10 rating, hire/no-hire decision, required notes, and hire-only proposed shift/classroom while leaving assignments and classroom status unchanged.
  - name: flush_pending_operations
    inputs: {}
    returns:
      type: int
    exceptions: []
    side_effects: Replays queued staffing operations when the DB edit lock is available; leaves remaining records queued if the DB is still locked.
data_structures:
- name: STAFFING_NOTIFICATION_EVENTS
  type: dict[str, str]
dependencies:
- notification_service
- staffing_models
- staffing_store
