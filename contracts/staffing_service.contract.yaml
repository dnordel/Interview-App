module:
  name: staffing_service
  language: python
  path: src/staffing_service.py
  version: 0.6.0
  description: Staffing assignment state machine, queued Dropbox edit handling, staffing dashboard metrics with pending-operation projection and workbook display metadata, confirmed person moves, editable assignment details, and post-commit notification emission for successful transactions.
functions: []
classes:
- name: StaffingService
  description: Applies staffing transactions through StaffingStore and emits checkpoint notifications after successful commits.
  locked: false
  methods:
  - name: open_position
    inputs:
      assignment_id:
        type: int
        required: true
    returns:
      type: StaffingTransitionResult
    exceptions:
    - ValueError
    side_effects: Updates assignment/history rows, then may emit staffing.assignment.need_now notification; if DB is locked, saves operation to pending queue and returns queued status.
  - name: mark_coming
    inputs:
      assignment_id:
        type: int
        required: true
      person_name:
        type: str
        required: true
      start_date:
        type: str
        required: true
    returns:
      type: StaffingTransitionResult
    exceptions:
    - ValueError
    side_effects: Updates assignment/person rows, then may emit staffing.assignment.coming notification; if DB is locked, saves operation to pending queue and returns queued status.
  - name: revert_coming
    inputs:
      assignment_id:
        type: int
        required: true
    returns:
      type: StaffingTransitionResult
    exceptions:
    - ValueError
    side_effects: Reverts coming assignment to need_now without emitting notification; if DB is locked, saves operation to pending queue and returns queued status.
  - name: mark_filled
    inputs:
      assignment_id:
        type: int
        required: true
    returns:
      type: StaffingTransitionResult
    exceptions:
    - ValueError
    side_effects: Closes assignment history, then may emit staffing.assignment.filled notification; if DB is locked, saves operation to pending queue and returns queued status.
  - name: mark_replacing
    inputs:
      assignment_id:
        type: int
        required: true
      notice_given:
        type: str
        required: true
      final_working_day:
        type: str
        required: true
    returns:
      type: StaffingTransitionResult
    exceptions:
    - ValueError
    side_effects: Marks current person inactive, opens replacement history, then may emit staffing.assignment.replace notification; if DB is locked, saves operation to pending queue and returns queued status.
  - name: clear_replacement
    inputs:
      assignment_id:
        type: int
        required: true
    returns:
      type: StaffingTransitionResult
    exceptions:
    - ValueError
    side_effects: Clears replacing assignment person/start fields, keeps active replacement history open, and may emit staffing.assignment.need_now notification; if DB is locked, saves operation to pending queue and returns queued status.
  - name: mark_not_needed
    inputs:
      assignment_id:
        type: int
        required: true
      confirmed:
        type: bool
        required: false
        default: false
    returns:
      type: StaffingTransitionResult
    exceptions:
    - ValueError
    side_effects: Cancels active history, clears assignment, then may emit staffing.assignment.not_needed notification; if DB is locked, saves operation to pending queue and returns queued status.
  - name: update_permit_status
    inputs:
      person_id:
        type: int
        required: true
      permit_status:
        type: str
        required: true
    returns:
      type: StaffingTransitionResult
    exceptions:
    - ValueError
    side_effects: Updates person permit status, then may emit staffing.permit.updated notification; if DB is locked, saves operation to pending queue and returns queued status.
  - name: move_person
    inputs:
      source_assignment_id:
        type: int
        required: true
      target_assignment_id:
        type: int
        required: true
      confirmed:
        type: bool
        required: false
        default: false
    returns:
      type: StaffingTransitionResult
    exceptions:
    - ValueError
    side_effects: Moves a person from one assignment to an empty target assignment in one transaction, marks source need_now, opens source history, closes target active history, and requires explicit confirmation; if DB is locked, saves operation to pending queue and returns queued status.
  - name: update_assignment_details
    inputs:
      assignment_id:
        type: int
        required: true
      classroom:
        type: str
        required: true
      shift_start:
        type: str
        required: false
        default: ''
      shift_end:
        type: str
        required: false
        default: ''
      permit_status:
        type: str | None
        required: false
        default: null
    returns:
      type: StaffingTransitionResult
    exceptions:
    - ValueError
    side_effects: Updates assignment classroom/shift fields and assigned person's permit status when present; may emit staffing.permit.updated notification; if DB is locked, saves operation to pending queue and returns queued status.
  - name: staffing_metrics
    inputs:
      today:
        type: date
        required: true
    returns:
      type: StaffingMetrics
    exceptions: []
    side_effects: Attempts to replay pending operations when unlocked, reads assignment, workbook display metadata, pending queue records, and filled-history rows from StaffingStore to compute dashboard metrics with queued changes projected for immediate UI feedback.
  - name: flush_pending_operations
    inputs: {}
    returns:
      type: int
    exceptions: []
    side_effects: Replays queued staffing operations when the DB edit lock is available; leaves remaining records queued if the DB is still locked.
data_structures:
- name: STAFFING_NOTIFICATION_EVENTS
  type: dict[str, str]
dependencies:
- notification_service
- staffing_models
- staffing_store
