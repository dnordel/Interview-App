module:
  name: staffing_service
  language: python
  path: src/staffing_service.py
  version: 0.9.1
  description: Staffing assignment state machine, service-backed position creation, queued Dropbox edit handling, staffing dashboard metrics with pending-operation projection and workbook display metadata, confirmed person moves, editable assignment details, person permit metadata updates, and post-commit notification emission for successful transactions.
functions: []
classes:
- name: StaffingService
  description: Applies staffing transactions through StaffingStore and emits checkpoint notifications after successful commits.
  locked: false
  methods:
  - name: open_position
    inputs:
      assignment_id:
        type: int
        required: true
    returns:
      type: StaffingTransitionResult
    exceptions:
    - ValueError
    side_effects: Updates assignment/history rows, then may emit staffing.assignment.need_now notification; if DB is locked, saves operation to pending queue and returns queued status.
  - name: add_position
    inputs:
      school:
        type: str
        required: true
      classroom:
        type: str
        required: true
      classroom_program:
        type: str
        required: false
        default: ''
      licensed_capacity:
        type: int | None
        required: false
        default: null
      position_name:
        type: str
        required: true
      position_type:
        type: str
        required: true
      initial_status:
        type: str
        required: false
        default: dont_need_now
      person_name:
        type: str
        required: false
        default: ''
      permit_status:
        type: str
        required: false
        default: unknown
      start_date:
        type: str
        required: false
        default: ''
      notes:
        type: str
        required: false
        default: ''
    returns:
      type: StaffingTransitionResult
    exceptions:
    - ValueError
    - StaffingEditLock
    side_effects: Creates school/classroom/person rows as needed, inserts one assignment, opens history for open/coming statuses, and may emit staffing.assignment.created notification.
  - name: mark_coming
    inputs:
      assignment_id:
        type: int
        required: true
      person_name:
        type: str
        required: true
      start_date:
        type: str
        required: true
    returns:
      type: StaffingTransitionResult
    exceptions:
    - ValueError
    side_effects: Updates assignment/person rows, then may emit staffing.assignment.coming notification; if DB is locked, saves operation to pending queue and returns queued status.
  - name: revert_coming
    inputs:
      assignment_id:
        type: int
        required: true
    returns:
      type: StaffingTransitionResult
    exceptions:
    - ValueError
    side_effects: Reverts coming assignment to need_now without emitting notification; if DB is locked, saves operation to pending queue and returns queued status.
  - name: mark_filled
    inputs:
      assignment_id:
        type: int
        required: true
    returns:
      type: StaffingTransitionResult
    exceptions:
    - ValueError
    side_effects: Closes assignment history using the Coming assignment start_date as current_filled_date and filled_date, then may emit staffing.assignment.filled notification; if DB is locked, saves operation to pending queue and returns queued status.
  - name: mark_replacing
    inputs:
      assignment_id:
        type: int
        required: true
      notice_given:
        type: str
        required: true
      final_working_day:
        type: str
        required: true
    returns:
      type: StaffingTransitionResult
    exceptions:
    - ValueError
    side_effects: Marks current person inactive, opens replacement history, then may emit staffing.assignment.replace notification; if DB is locked, saves operation to pending queue and returns queued status.
  - name: clear_replacement
    inputs:
      assignment_id:
        type: int
        required: true
    returns:
      type: StaffingTransitionResult
    exceptions:
    - ValueError
    side_effects: Clears replacing assignment person/start fields, keeps active replacement history open, and may emit staffing.assignment.need_now notification; if DB is locked, saves operation to pending queue and returns queued status.
  - name: mark_not_needed
    inputs:
      assignment_id:
        type: int
        required: true
      confirmed:
        type: bool
        required: false
        default: false
    returns:
      type: StaffingTransitionResult
    exceptions:
    - ValueError
    side_effects: Cancels active history, clears assignment, then may emit staffing.assignment.not_needed notification; if DB is locked, saves operation to pending queue and returns queued status.
  - name: update_permit_status
    inputs:
      person_id:
        type: int
        required: true
      permit_status:
        type: str
        required: true
      effective_date:
        type: str | None
        required: false
        default: null
      units:
        type: float | int | None
        required: false
        default: null
      documentation_received:
        type: bool
        required: false
        default: false
      notes:
        type: str
        required: false
        default: ''
    returns:
      type: StaffingTransitionResult
    exceptions:
    - ValueError
    side_effects: Updates person permit status, effective date, units, documentation flag, and permit notes, then may emit staffing.permit.updated notification; if DB is locked, saves operation to pending queue and returns queued status.
  - name: move_person
    inputs:
      source_assignment_id:
        type: int
        required: true
      target_assignment_id:
        type: int
        required: true
      confirmed:
        type: bool
        required: false
        default: false
    returns:
      type: StaffingTransitionResult
    exceptions:
    - ValueError
    side_effects: Moves a person from one assignment to an empty target assignment in one transaction, marks source need_now, opens source history, closes target active history, and requires explicit confirmation; if DB is locked, saves operation to pending queue and returns queued status.
  - name: update_assignment_details
    inputs:
      assignment_id:
        type: int
        required: true
      classroom:
        type: str
        required: true
      classroom_program:
        type: str | None
        required: false
        default: null
      position_name:
        type: str | None
        required: false
        default: null
      position_type:
        type: str | None
        required: false
        default: null
      status:
        type: str | None
        required: false
        default: null
      person_name:
        type: str | None
        required: false
        default: null
      start_date:
        type: str | None
        required: false
        default: null
      shift_start:
        type: str
        required: false
        default: ''
      shift_end:
        type: str
        required: false
        default: ''
      permit_status:
        type: str | None
        required: false
        default: null
      notes:
        type: str | None
        required: false
        default: null
    returns:
      type: StaffingTransitionResult
    exceptions:
    - ValueError
    side_effects: Updates assignment classroom/program, position name/type/status/start date/shift/notes fields, assigned or newly named person details, and assigned person's permit status when present; may emit staffing.permit.updated notification; if DB is locked, saves operation to pending queue and returns queued status.
  - name: staffing_metrics
    inputs:
      today:
        type: date
        required: true
      school:
        type: str
        required: false
        default: ''
    returns:
      type: StaffingMetrics
    exceptions: []
    side_effects: Attempts to replay pending operations when unlocked, reads assignment, workbook display metadata, pending queue records, and filled-history rows from StaffingStore to compute dashboard metrics with queued changes projected for immediate UI feedback; when school is provided, returns metrics and rows only for that school; ignores seed epoch placeholder open dates so default 1970-era dates do not create multi-decade days-open values.
  - name: flush_pending_operations
    inputs: {}
    returns:
      type: int
    exceptions: []
    side_effects: Replays queued staffing operations when the DB edit lock is available; leaves remaining records queued if the DB is still locked.
data_structures:
- name: STAFFING_NOTIFICATION_EVENTS
  type: dict[str, str]
dependencies:
- notification_service
- staffing_models
- staffing_store
