module:
  name: staffing_service
  language: python
  path: src/staffing_service.py
  version: 0.5.0
  description: Staffing assignment state machine, staffing dashboard metrics with workbook display metadata, confirmed person moves, editable assignment details, and post-commit notification emission for successful transactions.
functions: []
classes:
- name: StaffingService
  description: Applies staffing transactions through StaffingStore and emits checkpoint notifications after successful commits.
  locked: false
  methods:
  - name: open_position
    inputs:
      assignment_id:
        type: int
        required: true
    returns:
      type: StaffingTransitionResult
    exceptions:
    - ValueError
    side_effects: Updates assignment/history rows, then may emit staffing.assignment.need_now notification.
  - name: mark_coming
    inputs:
      assignment_id:
        type: int
        required: true
      person_name:
        type: str
        required: true
      start_date:
        type: str
        required: true
    returns:
      type: StaffingTransitionResult
    exceptions:
    - ValueError
    side_effects: Updates assignment/person rows, then may emit staffing.assignment.coming notification.
  - name: revert_coming
    inputs:
      assignment_id:
        type: int
        required: true
    returns:
      type: StaffingTransitionResult
    exceptions:
    - ValueError
    side_effects: Reverts coming assignment to need_now without emitting notification.
  - name: mark_filled
    inputs:
      assignment_id:
        type: int
        required: true
    returns:
      type: StaffingTransitionResult
    exceptions:
    - ValueError
    side_effects: Closes assignment history, then may emit staffing.assignment.filled notification.
  - name: mark_replacing
    inputs:
      assignment_id:
        type: int
        required: true
      notice_given:
        type: str
        required: true
      final_working_day:
        type: str
        required: true
    returns:
      type: StaffingTransitionResult
    exceptions:
    - ValueError
    side_effects: Marks current person inactive, opens replacement history, then may emit staffing.assignment.replace notification.
  - name: clear_replacement
    inputs:
      assignment_id:
        type: int
        required: true
    returns:
      type: StaffingTransitionResult
    exceptions:
    - ValueError
    side_effects: Clears replacing assignment person/start fields, keeps active replacement history open, and may emit staffing.assignment.need_now notification.
  - name: mark_not_needed
    inputs:
      assignment_id:
        type: int
        required: true
      confirmed:
        type: bool
        required: false
        default: false
    returns:
      type: StaffingTransitionResult
    exceptions:
    - ValueError
    side_effects: Cancels active history, clears assignment, then may emit staffing.assignment.not_needed notification.
  - name: update_permit_status
    inputs:
      person_id:
        type: int
        required: true
      permit_status:
        type: str
        required: true
    returns:
      type: StaffingTransitionResult
    exceptions:
    - ValueError
    side_effects: Updates person permit status, then may emit staffing.permit.updated notification.
  - name: move_person
    inputs:
      source_assignment_id:
        type: int
        required: true
      target_assignment_id:
        type: int
        required: true
      confirmed:
        type: bool
        required: false
        default: false
    returns:
      type: StaffingTransitionResult
    exceptions:
    - ValueError
    side_effects: Moves a person from one assignment to an empty target assignment in one transaction, marks source need_now, opens source history, closes target active history, and requires explicit confirmation.
  - name: update_assignment_details
    inputs:
      assignment_id:
        type: int
        required: true
      classroom:
        type: str
        required: true
      shift_start:
        type: str
        required: false
        default: ''
      shift_end:
        type: str
        required: false
        default: ''
      permit_status:
        type: str | None
        required: false
        default: null
    returns:
      type: StaffingTransitionResult
    exceptions:
    - ValueError
    side_effects: Updates assignment classroom/shift fields and assigned person's permit status when present; may emit staffing.permit.updated notification.
  - name: staffing_metrics
    inputs:
      today:
        type: date
        required: true
    returns:
      type: StaffingMetrics
    exceptions: []
    side_effects: Reads assignment, workbook display metadata, and filled-history rows from StaffingStore to compute dashboard metrics.
data_structures:
- name: STAFFING_NOTIFICATION_EVENTS
  type: dict[str, str]
dependencies:
- notification_service
- staffing_models
- staffing_store
