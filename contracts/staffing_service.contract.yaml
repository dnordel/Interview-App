module:
  name: staffing_service
  language: python
  path: src/staffing_service.py
  version: 0.33.0
  description: Staffing assignment state machine with Offer Pending reservation/acceptance/decline transitions, optional bidirectional cross-database immutable change staging, atomic destination verification/self-repair, causal conflict resolution, service-backed classroom, position, person creation/edit/deactivation, managed permit attachment storage, director interview referral/completion tracking with optional pending-queue fallback, mistaken-position deletion, queued Dropbox edit handling, staffing dashboard metrics, confirmed person moves, editable assignment details, and post-commit notifications.
functions:
- name: staffing_change_conflict_message
  locked: false
  inputs:
    conflict: {type: StaffingChangeConflict, required: true}
  returns: {type: str}
  exceptions: []
  side_effects: none
- name: staffing_notification_payload
  locked: false
  inputs:
    assignment: {type: StaffingAssignment, required: true}
    person: {type: 'StaffingPerson | None', required: false, default: null}
  returns: {type: 'dict[str, str]'}
  exceptions: []
  side_effects: none
classes:
- name: StaffingService
  description: Applies staffing transactions and director interview completion records through StaffingStore, optionally publishes/replays them through StaffingChangeStage, and emits checkpoint notifications after successful assignment commits.
  locked: false
  methods:
  - name: replay_staged_changes
    inputs: {}
    returns: {type: int}
    exceptions: [OSError, sqlite3.Error, JSONDecodeError]
    side_effects: Replays ordered peer events into only this service's local staffing DB, reconciles acknowledged Director Interview events lacking a same-database destination proof, atomically verifies interview and candidate-contact fields before recording proof, self-repairs absent/partial destinations, avoids duplicate replay after a verified crash window, compares causal snapshots, prompts for conflicts, independently acknowledges outcomes, and stops fail-closed at a lock, invalid event, failed verification, or unresolved conflict.
  - name: open_position
    inputs:
      assignment_id:
        type: int
        required: true
    returns:
      type: StaffingTransitionResult
    exceptions:
    - ValueError
    side_effects: Updates assignment/history rows, then may emit staffing.assignment.need_now notification; if DB is locked, saves operation to pending queue and returns queued status.
  - name: add_position
    inputs:
      school:
        type: str
        required: true
      classroom:
        type: str
        required: true
      classroom_program:
        type: str
        required: false
        default: ''
      licensed_capacity:
        type: int | None
        required: false
        default: null
      position_name:
        type: str
        required: true
      position_type:
        type: str
        required: true
      initial_status:
        type: str
        required: false
        default: dont_need_now
      person_name:
        type: str
        required: false
        default: ''
      permit_status:
        type: str
        required: false
        default: unknown
      start_date:
        type: str
        required: false
        default: ''
      notes:
        type: str
        required: false
        default: ''
    returns:
      type: StaffingTransitionResult
    exceptions:
    - ValueError
    - StaffingEditLock
    side_effects: Creates school/classroom/person rows as needed, inserts one assignment, opens history for open/coming statuses, may emit staffing.assignment.created notification, and publishes the successful operation when cross-database staging is configured.
  - name: add_person
    inputs:
      name:
        type: str
        required: true
      role:
        type: str
        required: true
      permit_status:
        type: str
        required: false
        default: unknown
      units:
        type: float | int | None
        required: false
        default: null
    returns:
      type: StaffingPerson
    exceptions:
    - ValueError
    - StaffingEditLock
    side_effects: Creates or updates one active person row through StaffingStore.ensure_person under the staffing write lock without mutating assignments, then publishes the stable-name operation to every peer DB when cross-database staging is configured.
  - name: update_person
    inputs:
      person_id: {type: int, required: true}
      name: {type: str, required: true}
      role: {type: str, required: true}
      permit_status: {type: str, required: false, default: unknown}
      units: {type: 'float | int | None', required: false, default: null}
    returns: {type: StaffingPerson}
    exceptions: [ValueError, StaffingEditLock]
    side_effects: Validates and updates one person name, normalized name, role, permit status, and units without changing assignments; rejects duplicate active names; publishes the stable old-name operation and causal base snapshot when cross-database staging is configured.
  - name: deactivate_person
    inputs:
      person_id: {type: int, required: true}
    returns: {type: StaffingPerson}
    exceptions: [ValueError, StaffingEditLock]
    side_effects: Soft-deactivates one unassigned active person while failing closed when an active assignment references that person, then publishes the stable-name operation and causal base snapshot when cross-database staging is configured.
  - name: add_classroom
    inputs:
      school:
        type: str
        required: true
      name:
        type: str
        required: true
      program:
        type: str
        required: false
        default: ''
      ratio_group:
        type: str
        required: false
        default: ''
      licensed_capacity:
        type: int | None
        required: false
        default: null
    returns:
      type: StaffingClassroom
    exceptions:
    - ValueError
    - StaffingEditLock
    side_effects: Creates or updates one active school/classroom row through StaffingStore without mutating assignments or assignment_history, then publishes the stable school/name operation when cross-database staging is configured.
  - name: update_classroom
    inputs:
      classroom_id:
        type: int
        required: true
      school:
        type: str
        required: true
      name:
        type: str
        required: true
      program:
        type: str
        required: false
        default: ''
      ratio_group:
        type: str
        required: false
        default: ''
      licensed_capacity:
        type: int | None
        required: false
        default: null
      display_order:
        type: int
        required: false
        default: 0
    returns:
      type: StaffingClassroom
    exceptions:
    - ValueError
    - StaffingEditLock
    side_effects: Updates one classroom record through StaffingStore without mutating assignments or assignment_history, then publishes the stable old school/name operation and causal base snapshot when cross-database staging is configured.
  - name: deactivate_classroom
    inputs:
      classroom_id:
        type: int
        required: true
    returns:
      type: StaffingClassroom
    exceptions:
    - ValueError
    - StaffingEditLock
    side_effects: Fails closed when active assignments exist; otherwise soft-deactivates one classroom through StaffingStore without deleting assignments or assignment_history, then publishes the stable school/name operation and causal base snapshot when cross-database staging is configured.
  - name: mark_coming
    inputs:
      assignment_id:
        type: int
        required: true
      person_name:
        type: str
        required: true
      start_date:
        type: str
        required: true
      position_type:
        type: str | None
        required: false
        default: null
    returns:
      type: StaffingTransitionResult
    exceptions:
    - ValueError
    side_effects: Atomically updates assignment status/person/start date and optional position type; when position type changes, replaces a matching type prefix in the position name while preserving its suffix; then may emit staffing.assignment.coming notification. If DB is locked, saves the complete operation to pending queue and returns queued status.
  - name: accept_pending_offer
    inputs:
      history_id: {type: str, required: true}
      start_date: {type: str, required: true}
    returns: {type: StaffingTransitionResult}
    exceptions: [ValueError]
    side_effects: Finds the history-linked original Offer Pending or still-open Need Now position, restores the retained candidate when reversing a decline, validates the offer start date, changes status to Coming, and emits the existing staffing.assignment.coming event; mismatched or occupied assignments fail closed.
  - name: decline_pending_offer
    inputs:
      history_id: {type: str, required: true}
    returns: {type: StaffingTransitionResult}
    exceptions: [ValueError]
    side_effects: Finds one history-linked Offer Pending assignment, clears its person/start date, restores Need Now, retains the candidate profile and history linkage for reversal, and emits the existing staffing.assignment.need_now event.
  - name: revert_coming
    inputs:
      assignment_id:
        type: int
        required: true
    returns:
      type: StaffingTransitionResult
    exceptions:
    - ValueError
    side_effects: Reverts coming assignment to need_now without emitting notification; if DB is locked, saves operation to pending queue and returns queued status.
  - name: mark_filled
    inputs:
      assignment_id:
        type: int
        required: true
      actual_start_date:
        type: str | null
        required: false
        default: null
      repair_missing_history:
        type: bool
        required: false
        default: false
    returns:
      type: StaffingTransitionResult
    exceptions:
    - ValueError
    side_effects: Validates an optional actual start date, falling back to the Coming assignment start_date; when explicitly requested by automatic conversion, repairs a missing active history cycle from a static import using the start date as its zero-day opened date; atomically stores the date as assignment start_date/current_filled_date and closes assignment history with the same filled_date, then may emit staffing.assignment.filled notification. If DB is locked, saves the complete operation to pending queue and returns queued status.
  - name: auto_fill_due_coming
    inputs:
      today:
        type: date
        required: true
    returns:
      type: list[StaffingTransitionResult]
    exceptions:
    - ValueError
    side_effects: Finds Coming assignments with valid start dates on or before today and marks each Filled through mark_filled, preserving future or malformed-date Coming rows; DB-locked transitions queue through the existing pending-operation path.
  - name: update_start_date
    inputs:
      assignment_id:
        type: int
        required: true
      start_date:
        type: str
        required: true
      today:
        type: date
        required: true
    returns:
      type: StaffingTransitionResult
    exceptions:
    - ValueError
    side_effects: Validates and updates a Coming or Filled assignment start date; moving an already-Filled employee to a future date atomically restores Coming status and reopens the latest filled history cycle, while correcting a Filled date on or before today updates assignment and closed-history dates/days consistently. DB-locked updates queue with date context.
  - name: mark_replacing
    inputs:
      assignment_id:
        type: int
        required: true
      notice_given:
        type: str
        required: true
      final_working_day:
        type: str
        required: true
    returns:
      type: StaffingTransitionResult
    exceptions:
    - ValueError
    side_effects: Marks current person inactive, opens replacement history, changes assignment to Replace for future final working days, changes assignment immediately to Need Now and clears the assigned person/start date when final working day is today or earlier, then may emit staffing.assignment.replace or staffing.assignment.need_now notification; if DB is locked, saves operation to pending queue and returns queued status.
  - name: clear_replacement
    inputs:
      assignment_id:
        type: int
        required: true
    returns:
      type: StaffingTransitionResult
    exceptions:
    - ValueError
    side_effects: Clears replacing assignment person/start fields, keeps active replacement history open, and may emit staffing.assignment.need_now notification; if DB is locked, saves operation to pending queue and returns queued status.
  - name: mark_not_needed
    inputs:
      assignment_id:
        type: int
        required: true
      confirmed:
        type: bool
        required: false
        default: false
    returns:
      type: StaffingTransitionResult
    exceptions:
    - ValueError
    side_effects: Cancels active history, clears assignment, then may emit staffing.assignment.not_needed notification; if DB is locked, saves operation to pending queue and returns queued status.
  - name: delete_position
    inputs:
      assignment_id:
        type: int
        required: true
      confirmed:
        type: bool
        required: false
        default: false
    returns:
      type: StaffingTransitionResult
    exceptions:
    - ValueError
    side_effects: Requires explicit confirmation, soft-deactivates one unassigned mistaken position, closes any active open history as deleted, returns deleted status, and if DB is locked saves operation to pending queue and returns queued status.
  - name: update_permit_status
    inputs:
      person_id:
        type: int
        required: true
      permit_status:
        type: str
        required: true
      effective_date:
        type: str | None
        required: false
        default: null
      units:
        type: float | int | None
        required: false
        default: null
      documentation_received:
        type: bool
        required: false
        default: false
      attachment_path:
        type: str | Path | None
        required: false
        default: null
      notes:
        type: str
        required: false
        default: ''
    returns:
      type: StaffingTransitionResult
    exceptions:
    - ValueError
    side_effects: Validates and copies an optional PDF/image/Word attachment up to 25 MB into managed staffing_attachments storage, persists its managed path while retaining an existing path when no replacement is selected, updates person permit status/effective date/units/documentation/notes, then may emit staffing.permit.updated notification; if DB is locked, saves the managed-path operation to pending queue and returns queued status.
  - name: move_person
    inputs:
      source_assignment_id:
        type: int
        required: true
      target_assignment_id:
        type: int
        required: true
      confirmed:
        type: bool
        required: false
        default: false
    returns:
      type: StaffingTransitionResult
    exceptions:
    - ValueError
    side_effects: Moves a person from one assignment to an empty target assignment in one transaction, marks source need_now, opens source history, closes target active history, and requires explicit confirmation; if DB is locked, saves operation to pending queue and returns queued status.
  - name: update_assignment_details
    inputs:
      assignment_id:
        type: int
        required: true
      classroom:
        type: str
        required: true
      classroom_program:
        type: str | None
        required: false
        default: null
      position_name:
        type: str | None
        required: false
        default: null
      position_type:
        type: str | None
        required: false
        default: null
      status:
        type: str | None
        required: false
        default: null
      person_name:
        type: str | None
        required: false
        default: null
      start_date:
        type: str | None
        required: false
        default: null
      shift_start:
        type: str
        required: false
        default: ''
      shift_end:
        type: str
        required: false
        default: ''
      permit_status:
        type: str | None
        required: false
        default: null
      notes:
        type: str | None
        required: false
        default: null
    returns:
      type: StaffingTransitionResult
    exceptions:
    - ValueError
    side_effects: Updates assignment and person fields; transitions of an assigned employee to need_now, dont_need_now, or replace emit notice using pre-transition employee data, and need_now also emits the position-needed event; clears assignment data when needed; may emit permit updates and queue locked writes.
  - name: staffing_metrics
    inputs:
      today:
        type: date
        required: true
      school:
        type: str
        required: false
        default: ''
    returns:
      type: StaffingMetrics
    exceptions: []
    side_effects: Attempts to replay pending operations when unlocked, reads assignment, workbook display metadata, pending queue records, and filled-history rows from StaffingStore to compute dashboard metrics with queued changes projected for immediate UI feedback; when school is provided, returns metrics and rows only for that school; ignores seed epoch placeholder open dates so default 1970-era dates do not create multi-decade days-open values.
  - name: upsert_director_candidate_referral
    inputs:
      history_id:
        type: str
        required: true
      candidate_name:
        type: str
        required: true
      school:
        type: str
        required: true
      position:
        type: str
        required: false
        default: ''
      interviewer_rating:
        type: float | int | str | None
        required: false
        default: null
      interviewer_outcome:
        type: str
        required: true
      interview_date:
        type: str
        required: false
        default: ''
      candidate_email:
        type: str
        required: false
        default: ''
      candidate_phone:
        type: str
        required: false
        default: ''
      referral_date:
        type: str
        required: false
        default: ''
      queue_on_lock:
        type: bool
        required: false
        default: false
    returns:
      type: StaffingDirectorCandidate
    exceptions:
    - ValueError
    - StaffingEditLock
    side_effects: Validates a new hire/borderline first-interview referral and upserts it without mutating staffing assignments; when queue_on_lock is true and the staffing edit lock is held, appends a director_candidate_referral pending operation and returns a placeholder StaffingDirectorCandidate with id 0.
  - name: list_pending_director_interviews
    inputs:
      school:
        type: str
        required: false
        default: ''
    returns:
      type: list[StaffingDirectorCandidate]
    exceptions: []
    side_effects: Reads pending director interview referrals, optionally scoped to one school.
  - name: reconcile_director_referral
    description: Reconcile score-driven Hire/Borderline/No Hire report results into pending referrals, removing No Hire without durable dismissal so later score changes may re-add.
    inputs:
      history_id: {type: str, required: true}
      candidate_name: {type: str, required: true}
      school: {type: str, required: true}
      calculated_outcome: {type: str, required: true}
      position: {type: str, required: false, default: ''}
      interviewer_rating: {type: 'float | int | str | None', required: false, default: null}
      interview_date: {type: str, required: false, default: ''}
      candidate_email: {type: str, required: false, default: ''}
      candidate_phone: {type: str, required: false, default: ''}
      referral_date: {type: str, required: false, default: ''}
    returns: {type: 'StaffingDirectorCandidate | None'}
  - name: list_completed_director_interviews
    inputs:
      school:
        type: str
        required: false
        default: ''
    returns:
      type: list[StaffingDirectorInterview]
    exceptions: []
    side_effects: Reads completed director interviews, optionally scoped to one school.
  - name: find_completed_director_interview
    inputs:
      history_id:
        type: str
        required: true
      school:
        type: str
        required: true
    returns:
      type: StaffingDirectorInterview | None
    exceptions: []
    side_effects: Reads one hire decision matched by exact interview history ID and school for downstream offer defaults.
  - name: find_any_completed_director_interview
    description: Read any completed director decision by exact history id and school for combined candidate-report display.
    inputs:
      history_id: {type: str, required: true}
      school: {type: str, required: true}
    returns: {type: 'StaffingDirectorInterview | None'}
  - name: delete_pending_director_interviews
    inputs:
      referral_ids:
        type: Sequence[int]
        required: true
      removed_by:
        type: str
        required: false
        default: ''
      removal_source:
        type: str
        required: false
        default: ''
    returns:
      type: int
    exceptions:
    - StaffingEditLock
    side_effects: Deletes and dismisses selected pending director interview referrals without deleting completed director interviews, staffing assignments, or interview history rows, and records removal audit actor/source metadata.
  - name: dismiss_director_referral_history_ids
    inputs:
      history_ids:
        type: Sequence[str]
        required: true
      removed_by:
        type: str
        required: false
        default: ''
      removal_source:
        type: str
        required: false
        default: ''
    returns:
      type: int
    exceptions:
    - StaffingEditLock
    side_effects: Dismisses director referral history ids and removes matching pending director interview referrals without deleting completed director interviews, staffing assignments, or interview history rows, and records removal audit actor/source metadata when matching pending rows exist.
  - name: record_director_interview
    inputs:
      referral_id:
        type: int
        required: true
      director_name:
        type: str
        required: true
      completed_date:
        type: str
        required: true
      rating:
        type: float | int | str
        required: true
      decision:
        type: str
        required: true
      decision_notes:
        type: str
        required: true
      proposed_shift_start:
        type: str
        required: false
        default: ''
      proposed_shift_end:
        type: str
        required: false
        default: ''
      proposed_classroom:
        type: str
        required: false
        default: ''
      offer_position_id:
        type: str
        required: false
        default: ''
      follow_up_needed:
        type: bool
        required: false
        default: false
      candidate_email: {type: str, required: false, default: ''}
      candidate_phone: {type: str, required: false, default: ''}
    returns:
      type: StaffingDirectorInterview
    exceptions:
    - ValueError
    - StaffingEditLock
    side_effects: Records a director interview with date, 1-10 rating, hire/no-hire decision, required notes, hire-only proposed shift and exact school-supported position, teacher-position-only required proposed classroom, required valid email, and optional normalized phone; a teacher Hire atomically selects the first ordered Need Now slot in that classroom, assigns the candidate as Teacher, and marks Offer Pending, while no available slot fails before interview persistence; non-teacher classrooms remain unchanged; publishes completion with stable referral history data when configured.
  - name: reopen_director_interview
    inputs:
      interview_id: {type: int, required: true}
      expected_row_version: {type: int, required: true}
      reason: {type: str, required: true}
      actor: {type: str, required: true}
      actor_role: {type: str, required: true}
    returns: {type: StaffingDirectorInterview}
  - name: revise_director_interview
    description: Validate and re-finalize one reopened director section with a required audited reason.
    inputs:
      interview_id: {type: int, required: true}
      expected_row_version: {type: int, required: true}
      director_name: {type: str, required: true}
      completed_date: {type: str, required: true}
      rating: {type: 'float | int | str', required: true}
      decision: {type: str, required: true}
      decision_notes: {type: str, required: true}
      reason: {type: str, required: true}
      actor: {type: str, required: true}
      actor_role: {type: str, required: true}
      proposed_shift_start: {type: str, required: false, default: ''}
      proposed_shift_end: {type: str, required: false, default: ''}
      proposed_classroom: {type: str, required: false, default: ''}
      follow_up_needed: {type: bool, required: false, default: false}
    returns: {type: StaffingDirectorInterview}
  - name: list_director_interview_audit
    description: Return immutable director-section audit events for chronological merge with initial-report audit history.
    inputs:
      interview_id: {type: int, required: true}
    returns: {type: 'list[dict[str, Any]]'}
  - name: compare_director_interview_version
    description: Return ordered three-way differences between saved, current database, and local Director Interview versions.
    inputs:
      local: {type: StaffingDirectorInterview, required: true}
      saved: {type: StaffingDirectorInterview, required: true}
    returns: {type: 'list[StaffingDirectorInterviewDifference]'}
  - name: load_director_interview
    inputs:
      interview_id: {type: int, required: true}
    returns: {type: StaffingDirectorInterview}
  - name: flush_pending_operations
    inputs: {}
    returns:
      type: int
    exceptions: []
    side_effects: Replays queued staffing operations when the DB edit lock is available; leaves remaining records queued if the DB is still locked.
data_structures:
- name: StaffingChangeConflict
  type: dataclass
  description: Causal same-entity conflict containing event/source metadata plus base, current-local, and remote change payloads for a user decision.
- name: STAFFING_NOTIFICATION_EVENTS
  type: dict[str, str]
dependencies:
- notification_service
- staffing_change_stage
- staffing_models
- staffing_store
