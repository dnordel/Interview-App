module:
  name: hiring_workspace_v2
  language: python
  path: src/hiring_workspace_v2.py
  version: 3.5.0
  description: Native Staffing v2 Candidates pipeline/history and Offers surfaces for the seven-stage application pipeline, with separate auto-height pending and approved offer tables, approval-time pay editing, delayed email send actions, and selected-offer deletion alongside shared overlays and contextual lifecycle actions.
functions: []
classes:
- name: HiringOfferApprovalDialog
  description: Embedded exact-PDF approval review with multi-page fit-width display and fail-closed approver/readiness gating.
  locked: false
  attributes:
    dialog: {type: QDialog}
    pdf_document: {type: QPdfDocument}
    pdf_view: {type: QPdfView}
    pay_input: {type: QLineEdit}
    approver_input: {type: QLineEdit}
    change_pay_button: {type: QPushButton}
    approve_button: {type: QPushButton}
  methods:
  - name: approver_name
    inputs: {}
    returns: {type: str}
    exceptions: []
    side_effects: none
  - name: hourly_pay
    inputs: {}
    returns: {type: str}
    exceptions: []
    side_effects: none
  - name: change_pay_requested
    inputs: {}
    returns: {type: bool}
    exceptions: []
    side_effects: none
  - name: exec
    inputs: {}
    returns: {type: bool}
    exceptions: []
    side_effects: Opens modal approval review.
  - name: close
    inputs: {}
    returns: {type: None}
    exceptions: []
    side_effects: Closes PDF document and dialog.
- name: HiringInterviewGuidePage
  description: Internal focused interview/closeout route owner that retains optional pipeline compatibility while allowing Interviews to start directly on interview setup.
  locked: false
  attributes:
    widget: {type: QWidget}
    interviews_widget: {type: QWidget}
    candidates_widget: {type: QWidget}
    offers_widget: {type: QWidget}
    stack: {type: QStackedWidget}
    pipeline_widget: {type: 'QWidget | None'}
    current_route: {type: str}
  methods:
  - name: show_pipeline
    inputs: {}
    returns: {type: None}
    exceptions: []
    side_effects: Shows pipeline route when owned; otherwise keeps interview route visible.
  - name: show_interview
    inputs: {}
    returns: {type: None}
    exceptions: []
    side_effects: Shows focused interview route.
  - name: show_closeout
    inputs: {}
    returns: {type: None}
    exceptions: []
    side_effects: Shows closeout route.
- name: HiringWorkspaceV2Page
  description: PySide workspace with stage counters, filters, candidate history, offer editing, and an Offers page with separate pending/approved tables, direct Review/Send actions, auto-height pending rows, and version-targeted deletion menus.
  locked: false
  attributes:
    widget: {type: QWidget}
    stage_buttons: {type: 'dict[HiringStage, QPushButton]'}
    application_table: {type: QTableWidget}
    pending_offers_table: {type: QTableWidget}
    approved_offers_table: {type: QTableWidget}
    detail_next_action: {type: QLabel}
    timeline_list: {type: QListWidget}
  methods:
  - name: refresh
    inputs: {}
    returns: {type: None}
    exceptions: []
    side_effects: Refreshes pipeline records, counts, filters, list, and detail from canonical hiring storage.
  - name: perform_action
    inputs:
      name: {type: str, required: true}
      application: {type: HiringApplication, required: true}
      actor: {type: str, required: false, default: Admin User}
      values: {type: 'dict[str, Any] | None', required: false, default: null}
    returns: {type: Any}
    exceptions: [ValueError]
    side_effects: Runs create, manual external-create, retry, revision, extension, acceptance, or archive workflow action and refreshes workspace.
  - name: _open_external_offer_dialog
    inputs: {}
    returns: {type: None}
    exceptions: []
    side_effects: Opens the manual external-candidate offer dialog, creates a candidate/application record, submits offer v1 for approval, refreshes the workspace, and reports sanitized validation failures.
  - name: _external_offer_editor_values
    inputs: {}
    returns: {type: 'dict[str, Any] | None'}
    exceptions: []
    side_effects: Opens a three-step candidate, compensation, and destination editor with required-field gating for manual external offers.
data_structures: []
dependencies:
- dashboard_v2_ui
- hiring_pipeline
