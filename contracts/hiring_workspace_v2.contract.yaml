module:
  name: hiring_workspace_v2
  language: python
  path: src/hiring_workspace_v2.py
  version: 3.10.0
  description: Native Staffing v2 Candidates pipeline/history and Offers surfaces with shared candidate capture, searchable existing-candidate reuse that preserves review facts, qualification-driven teacher offer creation, automatic school paths and shift-derived schedule terms, compact approval facts, and admin-only reversible Accepted/Not Accepted lifecycle actions.
functions: []
classes:
- name: HiringOfferApprovalDialog
  description: Embedded exact-PDF approval review with a compact optional three-column details grid, multi-page fit-width display, fail-closed approver/readiness gating, and an explicit degree-in-ECE correction action.
  locked: false
  attributes:
    dialog: {type: QDialog}
    pdf_document: {type: QPdfDocument}
    pdf_view: {type: QPdfView}
    pay_input: {type: QLineEdit}
    degree_in_ece_input: {type: QCheckBox}
    approver_input: {type: QLineEdit}
    correct_qualification_button: {type: QPushButton}
    change_pay_button: {type: QPushButton}
    approve_button: {type: QPushButton}
  methods:
  - name: approver_name
    inputs: {}
    returns: {type: str}
    exceptions: []
    side_effects: none
  - name: hourly_pay
    inputs: {}
    returns: {type: str}
    exceptions: []
    side_effects: none
  - name: change_pay_requested
    inputs: {}
    returns: {type: bool}
    exceptions: []
    side_effects: none
  - name: degree_in_ece
    inputs: {}
    returns: {type: bool}
    exceptions: []
    side_effects: none
  - name: qualification_change_requested
    inputs: {}
    returns: {type: bool}
    exceptions: []
    side_effects: none
  - name: exec
    inputs: {}
    returns: {type: bool}
    exceptions: []
    side_effects: Opens modal approval review.
  - name: close
    inputs: {}
    returns: {type: None}
    exceptions: []
    side_effects: Closes PDF document and dialog.
- name: HiringInterviewGuidePage
  description: Internal focused interview/closeout route owner that retains optional pipeline compatibility while allowing Interviews to start directly on interview setup.
  locked: false
  attributes:
    widget: {type: QWidget}
    interviews_widget: {type: QWidget}
    candidates_widget: {type: QWidget}
    offers_widget: {type: QWidget}
    stack: {type: QStackedWidget}
    pipeline_widget: {type: 'QWidget | None'}
    current_route: {type: str}
  methods:
  - name: show_pipeline
    inputs: {}
    returns: {type: None}
    exceptions: []
    side_effects: Shows pipeline route when owned; otherwise keeps interview route visible.
  - name: show_interview
    inputs: {}
    returns: {type: None}
    exceptions: []
    side_effects: Shows focused interview route.
  - name: show_closeout
    inputs: {}
    returns: {type: None}
    exceptions: []
    side_effects: Shows closeout route.
- name: HiringWorkspaceV2Page
  description: PySide workspace with stage counters, filters, candidate history, offer editing, and an Offers page with shared candidate/qualification capture, searchable roster reuse, configured school paths, separate pending/approved tables, and contextual lifecycle actions.
  locked: false
  attributes:
    widget: {type: QWidget}
    stage_buttons: {type: 'dict[HiringStage, QPushButton]'}
    application_table: {type: QTableWidget}
    pending_offers_table: {type: QTableWidget}
    approved_offers_table: {type: QTableWidget}
    detail_next_action: {type: QLabel}
    timeline_list: {type: QListWidget}
  methods:
  - name: refresh
    inputs: {}
    returns: {type: None}
    exceptions: []
    side_effects: Refreshes pipeline records, counts, filters, list, and detail from canonical hiring storage.
  - name: perform_action
    inputs:
      name: {type: str, required: true}
      application: {type: HiringApplication, required: true}
      actor: {type: str, required: false, default: Admin User}
      values: {type: 'dict[str, Any] | None', required: false, default: null}
    returns: {type: Any}
    exceptions: [ValueError]
    side_effects: Runs calculated teacher-offer creation, external-create, retry, increment-enforced revision, extension, reversible accepted/not-accepted admin decision, or archive workflow action and refreshes workspace including Not Accepted rows/counts.
  - name: _open_external_offer_dialog
    inputs: {}
    returns: {type: None}
    exceptions: []
    side_effects: Opens shared candidate and qualification capture, calculates schedule and starting pay, creates or reuses a candidate, submits offer v1 for approval, refreshes the workspace, and reports sanitized validation failures.
  - name: _external_offer_editor_values
    inputs: {}
    returns: {type: 'dict[str, Any] | None'}
    exceptions: []
    side_effects: Opens a searchable new/existing candidate wizard using shared identity and qualification editors; preserves available interview score, director rating, requested pay, classroom, editable director shift times, and director-selected offer position for the selected candidate; validates required email, derives schedule, resolves school template/output settings, and returns no manual start-date field.
  - name: _external_offer_candidate_prefill
    inputs:
      candidate_id: {type: str, required: true}
    returns: {type: 'dict[str, Any]'}
    exceptions: []
    side_effects: Reads candidate applications, visible candidate reports, events, prior offer versions, and an optional exact director-interview provider to resolve latest school, director-selected offer position, authoritative qualification, interview score, director rating, requested pay, classroom, and shift-time defaults.
data_structures: []
dependencies:
- dashboard_v2_ui
- data_store
- hiring_pipeline
- platform_services
- pyside_interview_components
- scoring_reporting
- starting_pay_calculator
