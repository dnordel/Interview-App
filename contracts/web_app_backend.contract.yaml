module:
  name: web_app_backend
  language: python
  path: src/web_app_backend.py
  version: 0.10.0
  description: Opt-in local HTTP backend for the web migration shell. It exposes
    repository-local configuration bootstrap data, serves the web app static files,
    and saves browser draft payloads through the existing DraftManager while Tk
    remains the production entry point.
functions:
- name: load_bootstrap_payload
  description: Load rubric, question overrides, interview history, and offer settings
    from existing repository JSON files.
  locked: false
  inputs: {}
  returns:
    type: dict[str, Any]
  exceptions: []
  side_effects: Reads repository-local JSON files.
- name: load_question_overrides
  description: Load normalized question override configuration from the existing
    question_overrides.json path.
  locked: false
  inputs: {}
  returns:
    type: dict[str, Any]
  exceptions: []
  side_effects: Reads config/question_overrides.json.
- name: save_question_overrides
  description: Validate, normalize, and atomically persist question override configuration
    to config/question_overrides.json through the existing QuestionOverridesStore shape.
  locked: false
  inputs:
    payload:
      type: dict[str, Any]
      required: true
  returns:
    type: dict[str, Any]
  exceptions:
  - WebAppBackendError
  side_effects: Writes config/question_overrides.json.
- name: load_offer_settings
  description: Load normalized per-school offer settings from the existing
    school_offer_settings.json path.
  locked: false
  inputs: {}
  returns:
    type: dict[str, dict[str, str]]
  exceptions: []
  side_effects: Reads school_offer_settings.json.
- name: save_offer_settings
  description: Validate, normalize, and atomically persist per-school offer settings
    to school_offer_settings.json through the existing SchoolOfferSettingsStore shape.
  locked: false
  inputs:
    payload:
      type: dict[str, Any]
      required: true
  returns:
    type: dict[str, dict[str, str]]
  exceptions:
  - WebAppBackendError
  side_effects: Writes school_offer_settings.json.
- name: load_history_rows
  description: Load finalized interview history rows from the existing interview
    history store.
  locked: false
  inputs: {}
  returns:
    type: list[dict[str, Any]]
  exceptions: []
  side_effects: Reads interview_history.json.
- name: update_history_offer_status
  description: Update one finalized interview history row's offer_status by row key
    or history id without echoing candidate notes or transcripts in errors.
  locked: false
  inputs:
    row_key:
      type: str
      required: true
    offer_status:
      type: str
      required: true
    offer_letter_path:
      type: str
      required: false
      default: ""
  returns:
    type: dict[str, Any]
  exceptions:
  - WebAppBackendError
  side_effects: Writes interview_history.json when the row exists.
- name: score_web_draft_preview
  description: Validate a browser draft payload and return a report-compatible scoring
    preview through ScoringEngine without writing files or logging candidate text.
  locked: false
  inputs:
    payload:
      type: dict[str, Any]
      required: true
  returns:
    type: web_backend_score_preview
  exceptions:
  - WebAppBackendError
  side_effects: Reads config/rubric.json only.
- name: finalize_web_draft
  description: Validate a browser draft payload, generate a DOCX interview report
    through DocxExporter, write a JSON integration export through the existing
    integration serializer, build a director referral packet preview, and append
    a finalized interview history row without sending emails, posting referral
    packets, or launching external applications.
  locked: false
  inputs:
    payload:
      type: dict[str, Any]
      required: true
    base_dir:
      type: Path
      required: false
      default: DEFAULT_BASE_DIR
  returns:
    type: web_backend_finalize_result
  exceptions:
  - WebAppBackendError
  - OSError
  side_effects: Reads rubric and question overrides, writes one DOCX report under
    base_dir/Indeed Interview Notes, writes one JSON export under base_dir/integration_exports,
    and appends one row to interview_history.json.
- name: normalize_web_draft_payload
  description: Convert browser draft payload field names into the desktop draft
    shape expected by session hydration and reporting.
  locked: false
  inputs:
    payload:
      type: dict[str, Any]
      required: true
  returns:
    type: dict[str, Any]
  exceptions:
  - WebAppBackendError
  side_effects: none
- name: save_web_draft
  description: Validate and persist a browser draft payload through DraftManager
    under the configured base draft directory.
  locked: false
  inputs:
    payload:
      type: dict[str, Any]
      required: true
    base_dir:
      type: Path
      required: false
      default: DEFAULT_BASE_DIR
  returns:
    type: dict[str, str]
  exceptions:
  - WebAppBackendError
  - OSError
  side_effects: Writes one JSON draft file under base_dir/drafts.
- name: save_web_recording
  description: Validate and persist one explicit browser audio recording upload
    under the configured base directory, returning metadata suitable for
    flow_recordings without transcribing or logging audio/candidate content.
  locked: false
  inputs:
    payload:
      type: dict[str, Any]
      required: true
    base_dir:
      type: Path
      required: false
      default: DEFAULT_BASE_DIR
  returns:
    type: web_backend_recording_save_result
  exceptions:
  - WebAppBackendError
  - OSError
  side_effects: Writes one audio file under base_dir/web_recordings.
- name: list_web_drafts
  description: Return newest-first draft metadata for JSON draft files under the
    configured base_dir/drafts directory without returning candidate notes or score
    contents.
  locked: false
  inputs:
    base_dir:
      type: Path
      required: false
      default: DEFAULT_BASE_DIR
    limit:
      type: int
      required: false
      default: 20
  returns:
    type: list[web_backend_draft_metadata]
  exceptions: []
  side_effects: Reads draft file metadata and minimal candidate headers.
- name: load_web_draft
  description: Load one JSON draft by draft file name after constraining the path
    to base_dir/drafts.
  locked: false
  inputs:
    draft_name:
      type: str
      required: true
    base_dir:
      type: Path
      required: false
      default: DEFAULT_BASE_DIR
  returns:
    type: dict[str, Any]
  exceptions:
  - WebAppBackendError
  - OSError
  - json.JSONDecodeError
  side_effects: Reads one draft JSON file from disk.
- name: build_handler
  description: Build a request handler class bound to a configured draft base directory.
  locked: false
  inputs:
    base_dir:
      type: Path
      required: false
      default: DEFAULT_BASE_DIR
  returns:
    type: type[BaseHTTPRequestHandler]
  exceptions: []
  side_effects: none
- name: run_server
  description: Start the local web migration backend server.
  locked: false
  inputs:
    host:
      type: str
      required: false
      default: 127.0.0.1
    port:
      type: int
      required: false
      default: 8766
    base_dir:
      type: Path
      required: false
      default: DEFAULT_BASE_DIR
  returns:
    type: None
  exceptions:
  - OSError
  side_effects: Opens a local HTTP listener until interrupted.
classes:
- name: WebAppBackendError
  description: Raised when a web app API request cannot be safely handled.
data_structures:
- name: web_backend_bootstrap_payload
  fields:
    rubric: dict
    overrides: dict
    history: list[dict]
    offerSettings: dict
- name: web_backend_draft_save_result
  fields:
    draft_path: string
    draft_name: string
- name: web_backend_draft_metadata
  fields:
    draft_name: string
    candidate_name: string
    interview_date: string
    school: string
    track: string
    modified_at: string
- name: web_backend_recording_save_result
  fields:
    flow_index: integer
    question_id: string
    mime_type: string
    audio_path: string
    byte_count: integer
    candidate_transcript: string
- name: web_backend_offer_settings
  fields:
    school_name:
      type: dict
      fields:
        full_time_template: string
        part_time_template: string
        offer_output_dir: string
- name: web_backend_history_update_result
  fields:
    history: list[dict]
    updated: boolean
- name: web_backend_score_preview
  fields:
    rows: list[dict]
    weighted_total: number
    configured_max_weighted_total: number
    max_weighted_total: number
    percent_of_max: number
    percent_of_max_label: string
    skipped_traits_count: integer
    scored_traits_count: integer
    critical_eq_1: integer
    critical_lt_3: integer
    disqualifier_present: boolean
    locked_rule: string
    outcome: string
- name: web_backend_finalize_result
  fields:
    report_path: string
    integration_path: string
    director_packet: dict
    history_entry: dict
    scorePreview: web_backend_score_preview
dependencies:
- module: platform_services
- module: scoring_reporting
- module: data_store
