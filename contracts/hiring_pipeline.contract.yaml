module:
  name: hiring_pipeline
  language: python
  path: src/hiring_pipeline.py
  version: 1.15.0
  description: Candidate-profile, application-pipeline, event-audit, calculated teacher starting pay, existing-candidate external offer cycles, editable increment-enforced pending-offer approval, reversible accepted/not-accepted admin decisions with staffing callbacks, delayed candidate-email delivery, offer-only deletion, and PDF-only offer lifecycle persistence.
functions:
- name: build_offer_notification_payload
  description: Build shared offer-approved notification values used by both approval preview and candidate delivery, including canonical school code and location.
  locked: false
  inputs:
    candidate: {type: CandidateProfile, required: true}
    version: {type: OfferVersion, required: true}
    pdf_path: {type: Path, required: true}
  returns: {type: 'dict[str, Any]'}
  exceptions: []
  side_effects: none
- name: normalize_candidate_phone
  description: Validate and normalize one U.S. candidate phone number to canonical display form.
  locked: false
  inputs:
    value: {type: str, required: true}
  returns: {type: str}
  exceptions: [ValueError]
  side_effects: none
- name: calculate_offer_approval_dates
  description: Calculate approval-day offer date, three-calendar-day reply deadline, and first Monday on or after the two-week post-deadline target.
  locked: false
  inputs:
    approval_date: {type: date, required: true}
  returns: {type: OfferApprovalDates}
  exceptions: [TypeError]
  side_effects: none
classes:
- name: PromotedOfferArtifacts
  description: Verified immutable destinations and SHA-256 hashes for exact previewed offer artifacts.
  locked: false
  attributes:
    docx_path: {type: Path}
    pdf_path: {type: Path}
    docx_sha256: {type: str}
    pdf_sha256: {type: str}
  methods: []
- name: OfferApprovalArtifactStage
  description: Same-directory staging boundary that promotes previewed DOCX/PDF bytes only after hash validation.
  locked: false
  attributes:
    final_docx_path: {type: Path}
    final_pdf_path: {type: Path}
    staging_dir: {type: Path}
    staged_docx_path: {type: Path}
    staged_pdf_path: {type: Path}
  methods:
  - name: hashes
    inputs: {}
    returns: {type: 'tuple[str, str]'}
    exceptions: [ValueError]
    side_effects: Reads staged artifact bytes.
  - name: promote
    inputs: {}
    returns: {type: PromotedOfferArtifacts}
    exceptions: [ValueError, OSError]
    side_effects: Moves staged artifacts to unused final paths, verifies unchanged hashes, and removes staging directory.
  - name: cleanup
    inputs: {}
    returns: {type: None}
    exceptions: [OSError]
    side_effects: Removes only known staged artifacts and their unique empty staging directory.
- name: HiringStage
  description: Canonical seven-stage hiring application state enumeration.
  locked: false
  attributes: {}
  methods: []
- name: CandidateProfile
  description: Stable operational candidate identity and contact record.
  locked: false
  attributes:
    candidate_id: {type: str}
    legal_name: {type: str}
    preferred_name: {type: str}
    email: {type: str}
    phone: {type: str}
    honorific: {type: str}
    archived_at: {type: str}
  methods: []
- name: HiringApplication
  description: One independent school-position hiring attempt linked to a candidate and interview history row.
  locked: false
  attributes:
    application_id: {type: str}
    candidate_id: {type: str}
    history_id: {type: str}
    school: {type: str}
    position: {type: str}
    cycle_number: {type: int}
    stage: {type: HiringStage}
    attention_code: {type: str}
    archived_at: {type: str}
    created_at: {type: str}
    updated_at: {type: str}
  methods: []
- name: ApplicationEvent
  description: Immutable application lifecycle audit event.
  locked: false
  attributes:
    event_id: {type: int}
    application_id: {type: str}
    event_type: {type: str}
    actor: {type: str}
    created_at: {type: str}
    payload: {type: 'dict[str, Any]'}
  methods: []
- name: OfferApprovalDates
  description: Immutable approval-derived offer, reply-by, and start dates.
  locked: false
  attributes:
    offer_date: {type: date}
    reply_by_date: {type: date}
    start_date: {type: date}
  methods: []
- name: OfferVersion
  description: Immutable numbered offer terms and approval/delivery state.
  locked: false
  attributes:
    version_id: {type: str}
    application_id: {type: str}
    version_number: {type: int}
    status: {type: str}
    terms: {type: 'dict[str, Any]'}
    docx_path: {type: str}
    pdf_path: {type: str}
    approval_date: {type: str}
    document_reply_by_date: {type: str}
    operational_reply_by_date: {type: str}
    start_date: {type: str}
    approver_name: {type: str}
    approver_role: {type: str}
    send_status: {type: str}
    send_error: {type: str}
    docx_sha256: {type: str}
    pdf_sha256: {type: str}
    rendered_email: {type: str}
    approved_at: {type: str}
    sent_at: {type: str}
    superseded_by_version_id: {type: str}
  methods: []
- name: MigrationParityReport
  description: Deterministic candidate/application migration parity totals and conflict counts.
  locked: false
  attributes:
    source_rows: {type: int}
    profile_count: {type: int}
    application_count: {type: int}
    stage_counts: {type: 'dict[str, int]'}
    conflict_count: {type: int}
    skipped_rows: {type: int}
  methods: []
- name: HiringOfferNotificationAdapter
  description: Candidate-only approved-offer notification boundary that rejects every non-PDF attachment before notification delivery.
  locked: false
  attributes:
    notification_service: {type: Any}
  methods:
  - name: __call__
    inputs:
      candidate: {type: CandidateProfile, required: true}
      version: {type: OfferVersion, required: true}
      pdf_path: {type: Path, required: true}
      idempotency_key: {type: str, required: true}
    returns: {type: 'list[Any]'}
    exceptions: [ValueError]
    side_effects: Emits one idempotent offer.approved event containing candidate identity, honorific, school, email, approval dates, and only the approved PDF; Word documents fail closed before delivery.
  - name: offer_accepted
    inputs:
      candidate: {type: CandidateProfile, required: true}
      version: {type: OfferVersion, required: true}
      idempotency_key: {type: str, required: true}
    returns: {type: 'list[Any]'}
    exceptions: []
    side_effects: Emits an idempotent offer.accepted event with candidate contact, school director name, and configured onboarding guide.
  - name: payload
    inputs:
      candidate: {type: CandidateProfile, required: true}
      version: {type: OfferVersion, required: true}
      pdf_path: {type: Path, required: true}
    returns: {type: 'dict[str, Any]'}
    exceptions: []
    side_effects: none
- name: HiringPipelineStore
  description: Deep SQLite repository for candidate identities, application cycles, lifecycle events, and validated version-bound offer-template snapshots.
  locked: false
  attributes:
    history_path: {type: Path}
    db_path: {type: Path}
  methods:
  - name: get_candidate
    inputs: {candidate_id: {type: str, required: true}}
    returns: {type: CandidateProfile}
    exceptions: [ValueError]
    side_effects: Reads canonical hiring storage.
  - name: search_candidate_profiles
    inputs: {query: {type: str, required: false, default: ''}}
    returns: {type: 'list[CandidateProfile]'}
    exceptions: []
    side_effects: Searches active profiles by legal or preferred name, email, or phone.
  - name: update_candidate_profile
    inputs:
      candidate_id: {type: str, required: true}
      legal_name: {type: str, required: true}
      preferred_name: {type: str, required: true}
      email: {type: str, required: true}
      phone: {type: str, required: true}
      honorific: {type: 'str | None', required: false, default: null}
    returns: {type: CandidateProfile}
    exceptions: [ValueError]
    side_effects: Validates and updates stable candidate identity/contact fields.
  - name: get_application
    inputs: {application_id: {type: str, required: true}}
    returns: {type: HiringApplication}
    exceptions: [ValueError]
    side_effects: Reads canonical hiring storage.
  - name: application_for_history
    inputs: {history_id: {type: str, required: true}}
    returns: {type: 'HiringApplication | None'}
    exceptions: []
    side_effects: Reads canonical hiring storage.
  - name: list_applications
    inputs: {include_archived: {type: bool, required: false, default: false}}
    returns: {type: 'list[HiringApplication]'}
    exceptions: []
    side_effects: Reads canonical hiring storage.
  - name: profile_count
    inputs: {}
    returns: {type: int}
    exceptions: []
    side_effects: Reads canonical profile count for migration parity.
  - name: snapshot_offer_template
    inputs:
      school: {type: str, required: true}
      template_kind: {type: str, required: true}
      source_path: {type: Path, required: true}
      version_id: {type: str, required: false, default: ''}
    returns: {type: str}
    exceptions: [ValueError, OSError]
    side_effects: Validates and stores a bounded Word template BLOB by SHA-256, makes it active for one school and employment type, and optionally binds it to an exact offer version.
  - name: materialize_offer_template
    inputs:
      school: {type: str, required: true}
      template_kind: {type: str, required: true}
      destination_dir: {type: Path, required: true}
      version_id: {type: str, required: false, default: ''}
    returns: {type: Path}
    exceptions: [ValueError, OSError]
    side_effects: Reads an exact version-bound or active school-scoped template, verifies its size, SHA-256, and Word package structure, then atomically writes a safe local cache file.
  - name: archive_application
    inputs: {application_id: {type: str, required: true}}
    returns: {type: HiringApplication}
    exceptions: [ValueError]
    side_effects: Archives an active application without deleting its linked records.
  - name: delete_candidate_profile
    inputs: {candidate_id: {type: str, required: true}}
    returns: {type: None}
    exceptions: [ValueError]
    side_effects: Permanently deletes only an unlinked candidate profile and otherwise fails closed.
  - name: update_application_stage
    inputs:
      application_id: {type: str, required: true}
      stage: {type: HiringStage, required: true}
      attention_code: {type: str, required: false, default: ''}
    returns: {type: HiringApplication}
    exceptions: [ValueError]
    side_effects: Updates one application stage and attention state.
  - name: append_event
    inputs:
      application_id: {type: str, required: true}
      event_type: {type: str, required: true}
      actor: {type: str, required: true}
      payload: {type: 'dict[str, Any] | None', required: false, default: null}
    returns: {type: None}
    exceptions: [ValueError]
    side_effects: Appends an immutable application audit event.
  - name: list_events
    inputs: {application_id: {type: str, required: true}}
    returns: {type: 'list[ApplicationEvent]'}
    exceptions: []
    side_effects: Reads the chronological immutable application audit timeline.
  - name: create_offer_version
    inputs:
      application_id: {type: str, required: true}
      terms: {type: 'dict[str, Any]', required: true}
      actor: {type: str, required: true}
      source_key: {type: str, required: false, default: ''}
    returns: {type: OfferVersion}
    exceptions: [ValueError]
    side_effects: Creates an immutable numbered offer draft and audit event.
  - name: find_offer_version_by_source
    inputs:
      application_id: {type: str, required: true}
      source_key: {type: str, required: true}
    returns: {type: 'OfferVersion | None'}
    exceptions: []
    side_effects: Reads one idempotently sourced offer version.
  - name: get_offer_version
    inputs: {version_id: {type: str, required: true}}
    returns: {type: OfferVersion}
    exceptions: [ValueError]
    side_effects: Reads canonical hiring storage.
  - name: list_offer_versions
    inputs: {application_id: {type: str, required: true}}
    returns: {type: 'list[OfferVersion]'}
    exceptions: []
    side_effects: Reads canonical hiring storage.
  - name: set_offer_status
    inputs:
      version_id: {type: str, required: true}
      status: {type: str, required: true}
    returns: {type: OfferVersion}
    exceptions: [ValueError]
    side_effects: Updates one persisted offer version status.
  - name: delete_offer_version
    inputs:
      application_id: {type: str, required: true}
      version_id: {type: str, required: true}
    returns: {type: None}
    exceptions: [ValueError, OSError]
    side_effects: Deletes one selected offer row and only its unshared DOCX/PDF artifacts after constraining stored paths to the configured offer output directory.
  - name: record_offer_approval
    inputs:
      version_id: {type: str, required: true}
      dates: {type: OfferApprovalDates, required: true}
      docx_path: {type: Path, required: true}
      pdf_path: {type: Path, required: true}
      approver_name: {type: str, required: true}
      approver_role: {type: str, required: true}
      rendered_email: {type: str, required: false, default: ''}
    returns: {type: OfferVersion}
    exceptions: [ValueError]
    side_effects: Persists validated approval artifacts and dates on one pending offer version.
  - name: record_offer_artifacts
    inputs:
      version_id: {type: str, required: true}
      docx_path: {type: Path, required: true}
      pdf_path: {type: Path, required: true}
    returns: {type: OfferVersion}
    exceptions: [ValueError]
    side_effects: Validates and persists non-empty DOCX and PDF artifacts plus hashes on one pending offer version before approval review.
  - name: record_offer_delivery
    inputs:
      version_id: {type: str, required: true}
      sent: {type: bool, required: true}
      error: {type: str, required: false, default: ''}
    returns: {type: OfferVersion}
    exceptions: [ValueError]
    side_effects: Records delivery state and supersedes older sent versions after success.
  - name: update_operational_reply_by_date
    inputs:
      version_id: {type: str, required: true}
      reply_by_date: {type: date, required: true}
    returns: {type: OfferVersion}
    exceptions: [ValueError]
    side_effects: Extends operational deadline without changing offer document artifacts.
  - name: record_initial_interview
    inputs:
      history_id: {type: str, required: true}
      legal_name: {type: str, required: true}
      email: {type: str, required: true}
      phone: {type: str, required: true}
      school: {type: str, required: true}
      position: {type: str, required: true}
      score: {type: float, required: true}
      outcome: {type: str, required: true}
      honorific: {type: str, required: false, default: 'Ms.'}
    returns: {type: HiringApplication}
    exceptions: [ValueError]
    side_effects: Creates or links a candidate, creates an application cycle and audit event, and links the interview history row.
  - name: start_application
    inputs:
      legal_name: {type: str, required: true}
      email: {type: str, required: true}
      phone: {type: str, required: true}
      school: {type: str, required: true}
      position: {type: str, required: true}
      actor: {type: str, required: true}
      honorific: {type: str, required: false, default: 'Ms.'}
    returns: {type: HiringApplication}
    exceptions: [ValueError]
    side_effects: Creates a new initial-interview application cycle and application-started audit event.
  - name: start_external_offer_application
    inputs:
      legal_name: {type: str, required: true}
      email: {type: str, required: true}
      phone: {type: str, required: true}
      school: {type: str, required: true}
      position: {type: str, required: true}
      actor: {type: str, required: true}
      honorific: {type: str, required: false, default: 'Ms.'}
    returns: {type: HiringApplication}
    exceptions: [ValueError]
    side_effects: Creates a candidate-linked application cycle at offer draft stage for externally interviewed candidates and appends an audit event.
  - name: start_external_offer_application_for_candidate
    inputs:
      candidate_id: {type: str, required: true}
      school: {type: str, required: true}
      position: {type: str, required: true}
      actor: {type: str, required: true}
    returns: {type: HiringApplication}
    exceptions: [ValueError]
    side_effects: Creates a new offer-draft application cycle linked to an existing active candidate without inspecting prior application stages and appends an audit event.
  - name: finalize_initial_interview
    inputs:
      application_id: {type: str, required: true}
      history_id: {type: str, required: true}
      score: {type: float, required: true}
      outcome: {type: str, required: true}
      actor: {type: str, required: true}
    returns: {type: HiringApplication}
    exceptions: [ValueError]
    side_effects: Links the finalized history record to the same application cycle and advances by score threshold.
- name: HiringWorkflowService
  description: Small public workflow interface over hiring persistence and transition rules.
  locked: false
  attributes:
    store: {type: HiringPipelineStore}
  methods:
  - name: record_initial_interview
    inputs: {values: {type: Any, required: true}}
    returns: {type: HiringApplication}
    exceptions: [ValueError]
    side_effects: Delegates validated initial interview completion to HiringPipelineStore.
  - name: search_candidate_profiles
    inputs: {query: {type: str, required: false, default: ''}}
    returns: {type: 'list[CandidateProfile]'}
    exceptions: []
    side_effects: Delegates active candidate profile search.
  - name: update_candidate_profile
    inputs:
      candidate_id: {type: str, required: true}
      values: {type: Any, required: true}
    returns: {type: CandidateProfile}
    exceptions: [ValueError]
    side_effects: Delegates validated candidate profile update.
  - name: start_application
    inputs: {values: {type: Any, required: true}}
    returns: {type: HiringApplication}
    exceptions: [ValueError]
    side_effects: Starts a new application cycle before interview work begins.
  - name: start_external_offer_application
    inputs: {values: {type: Any, required: true}}
    returns: {type: HiringApplication}
    exceptions: [ValueError]
    side_effects: Starts an externally interviewed candidate at offer draft stage.
  - name: start_external_offer_application_for_candidate
    inputs: {values: {type: Any, required: true}}
    returns: {type: HiringApplication}
    exceptions: [ValueError]
    side_effects: Starts a new external-offer cycle for an existing candidate without prior-stage gating.
  - name: finalize_initial_interview
    inputs:
      application_id: {type: str, required: true}
      values: {type: Any, required: true}
    returns: {type: HiringApplication}
    exceptions: [ValueError]
    side_effects: Completes and links an existing initial-interview application.
  - name: backfill_history
    inputs: {}
    returns: {type: 'list[HiringApplication]'}
    exceptions: []
    side_effects: Idempotently creates candidate profiles and application cycles for valid historical interview rows and links their IDs.
  - name: reconcile_history
    inputs: {}
    returns: {type: MigrationParityReport}
    exceptions: []
    side_effects: Backfills history, infers strongest stages, flags conflicts, and returns parity counts.
  - name: record_director_decision
    inputs:
      application_id: {type: str, required: true}
      decision: {type: str, required: true}
      actor: {type: str, required: true}
      actor_id: {type: str, required: false, default: ''}
    returns: {type: HiringApplication}
    exceptions: [ValueError]
    side_effects: Advances a director-review application to offer draft or closed and appends an audit event.
  - name: synchronize_director_outcome
    inputs:
      history_id: {type: str, required: true}
      decision: {type: str, required: true}
      actor: {type: str, required: false, default: Staffing v2}
      actor_id: {type: str, required: false, default: ''}
    returns: {type: HiringApplication}
    exceptions: [ValueError]
    side_effects: Idempotently applies the authoritative Staffing v2 director outcome by history ID.
  - name: create_offer_draft
    inputs:
      application_id: {type: str, required: true}
      terms: {type: 'dict[str, Any]', required: true}
      actor: {type: str, required: true}
      source_key: {type: str, required: false, default: ''}
    returns: {type: OfferVersion}
    exceptions: [ValueError]
    side_effects: Creates a numbered draft for an offer-ready or negotiated application.
  - name: create_calculated_offer_draft
    inputs:
      application_id: {type: str, required: true}
      position_id: {type: str, required: true}
      qualification: {type: 'dict[str, Any]', required: true}
      terms: {type: 'dict[str, Any]', required: true}
      actor: {type: str, required: true}
      source_key: {type: str, required: false, default: ''}
    returns: {type: OfferVersion}
    exceptions: [ValueError]
    side_effects: Calculates and locks initial teacher pay, persists the qualification and calculation snapshot, and creates a numbered draft.
  - name: create_external_offer
    inputs:
      legal_name: {type: str, required: true}
      email: {type: str, required: true}
      phone: {type: str, required: true}
      school: {type: str, required: true}
      position: {type: str, required: true}
      terms: {type: 'dict[str, Any]', required: true}
      actor: {type: str, required: true}
      honorific: {type: str, required: false, default: 'Ms.'}
    returns: {type: OfferVersion}
    exceptions: [ValueError]
    side_effects: Creates an external offer application, creates offer version 1, submits it for approval, and refreshes application stage.
  - name: create_calculated_external_offer
    inputs:
      legal_name: {type: str, required: true}
      email: {type: str, required: true}
      phone: {type: str, required: true}
      school: {type: str, required: true}
      position_id: {type: str, required: true}
      qualification: {type: 'dict[str, Any]', required: true}
      terms: {type: 'dict[str, Any]', required: true}
      actor: {type: str, required: true}
      honorific: {type: str, required: false, default: 'Ms.'}
    returns: {type: OfferVersion}
    exceptions: [ValueError]
    side_effects: Calculates initial teacher pay, creates the external candidate/application and version 1 audit snapshot, and submits it for approval.
  - name: create_calculated_external_offer_for_candidate
    inputs:
      candidate_id: {type: str, required: true}
      school: {type: str, required: true}
      position_id: {type: str, required: true}
      qualification: {type: 'dict[str, Any]', required: true}
      terms: {type: 'dict[str, Any]', required: true}
      actor: {type: str, required: true}
    returns: {type: OfferVersion}
    exceptions: [ValueError]
    side_effects: Calculates initial teacher pay, creates an offer-draft application linked to the selected candidate, creates version 1, and submits it for approval without prior-stage gating.
  - name: ensure_director_offer_submitted
    inputs:
      application_id: {type: str, required: true}
      source_key: {type: str, required: true}
      terms: {type: 'dict[str, Any]', required: true}
      actor: {type: str, required: true}
    returns: {type: OfferVersion}
    exceptions: [ValueError, sqlite3.IntegrityError]
    side_effects: Idempotently creates one director-sourced offer version, submits it for approval, and returns an existing version on retry.
  - name: submit_offer_for_approval
    inputs:
      application_id: {type: str, required: true}
      version_id: {type: str, required: true}
      actor: {type: str, required: true}
    returns: {type: OfferVersion}
    exceptions: [ValueError]
    side_effects: Marks one draft pending approval, advances application stage, appends an audit event, and generates and persists both DOCX and PDF artifacts when an artifact preparer is configured.
  - name: create_compensation_revision
    inputs:
      application_id: {type: str, required: true}
      hourly_pay: {type: str, required: true}
      weekly_hours: {type: str, required: true}
      actor: {type: str, required: true}
      actor_role: {type: str, required: true}
    returns: {type: OfferVersion}
    exceptions: [ValueError]
    side_effects: Creates an Admin-only numbered pending revision with only compensation fields changed after enforcing the configured pay increment; the configured initial-pay cap is not applied to Admin overrides.
  - name: revise_pending_offer_pay
    inputs:
      application_id: {type: str, required: true}
      version_id: {type: str, required: true}
      hourly_pay: {type: str, required: true}
      actor: {type: str, required: true}
    returns: {type: OfferVersion}
    exceptions: [ValueError, OSError]
    side_effects: Enforces the configured pay increment, creates and previews a new numbered pending version with changed hourly pay, then supersedes the prior pending version only after artifact generation succeeds; the configured initial-pay cap is not applied to Admin overrides.
  - name: revise_pending_offer_qualification
    inputs:
      application_id: {type: str, required: true}
      version_id: {type: str, required: true}
      qualification: {type: 'dict[str, Any]', required: true}
      actor: {type: str, required: true}
    returns: {type: OfferVersion}
    exceptions: [ValueError, OSError]
    side_effects: Recalculates starting pay from corrected qualifications, creates and previews a new numbered pending version with an auditable qualification/pay snapshot, then supersedes the prior pending version only after artifact generation succeeds.
  - name: approve_offer
    inputs:
      application_id: {type: str, required: true}
      version_id: {type: str, required: true}
      approver_name: {type: str, required: true}
      approver_role: {type: str, required: true}
      approval_date: {type: date, required: true}
      docx_path: {type: Path, required: true}
      pdf_path: {type: Path, required: true}
      rendered_email: {type: str, required: false, default: ''}
    returns: {type: OfferVersion}
    exceptions: [ValueError]
    side_effects: Persists approval without requiring candidate email; attempts candidate-only PDF delivery when email exists and advances only on send success.
  - name: approve_compensation_revision
    inputs:
      application_id: {type: str, required: true}
      version_id: {type: str, required: true}
      admin_name: {type: str, required: true}
      approval_date: {type: date, required: true}
      docx_path: {type: Path, required: true}
      pdf_path: {type: Path, required: true}
      rendered_email: {type: str, required: false, default: ''}
    returns: {type: OfferVersion}
    exceptions: [ValueError]
    side_effects: Admin-approves, redates, delivers only the revised PDF to the candidate, and supersedes a compensation revision without executive review; the retained Word artifact is never attached.
  - name: retry_offer_send
    inputs:
      application_id: {type: str, required: true}
      version_id: {type: str, required: true}
      actor: {type: str, required: true}
    returns: {type: OfferVersion}
    exceptions: [ValueError]
    side_effects: Idempotently retries candidate PDF delivery for an approved failed version.
  - name: send_approved_offer
    inputs:
      application_id: {type: str, required: true}
      version_id: {type: str, required: true}
      candidate_email: {type: str, required: true}
      actor: {type: str, required: true}
    returns: {type: OfferVersion}
    exceptions: [ValueError]
    side_effects: Validates and saves candidate email, audits a send request without storing the address in event payload, and delivers the approved PDF.
  - name: delete_offer
    inputs:
      application_id: {type: str, required: true}
      version_id: {type: str, required: true}
      actor: {type: str, required: true}
    returns: {type: HiringApplication}
    exceptions: [ValueError, OSError]
    side_effects: Deletes only the selected offer and its safely constrained generated artifacts, retains application/candidate/interview records, recalculates application stage, and appends a PII-safe audit event.
  - name: extend_offer_deadline
    inputs:
      application_id: {type: str, required: true}
      version_id: {type: str, required: true}
      reply_by_date: {type: date, required: true}
      actor: {type: str, required: true}
    returns: {type: OfferVersion}
    exceptions: [ValueError]
    side_effects: Updates operational deadline and audit only; document remains unchanged.
  - name: accept_offer
    inputs:
      application_id: {type: str, required: true}
      version_id: {type: str, required: true}
      actor: {type: str, required: true}
    returns: {type: HiringApplication}
    exceptions: [ValueError]
    side_effects: Accepts only the latest sent or reversibly not-accepted version, invokes the fail-closed staffing Coming callback before persistence, preserves accepted state before onboarding/notification work, and marks blocked acceptance email retryable.
  - name: mark_offer_not_accepted
    inputs:
      application_id: {type: str, required: true}
      version_id: {type: str, required: true}
      actor: {type: str, required: true}
    returns: {type: HiringApplication}
    exceptions: [ValueError]
    side_effects: Marks only the latest Sent offer Not Accepted after the staffing Need Now callback succeeds, keeps the application active at Offer Sent for reversal, and appends an immutable offer_not_accepted audit event.
  - name: retry_accepted_notification
    inputs:
      application_id: {type: str, required: true}
      version_id: {type: str, required: true}
    returns: {type: bool}
    exceptions: [ValueError]
    side_effects: Retries the accepted-offer onboarding notification and clears Attention only after sent or permanent duplicate success.
  - name: retry_onboarding_handoff
    inputs:
      application_id: {type: str, required: true}
      actor: {type: str, required: true}
    returns: {type: bool}
    exceptions: [ValueError]
    side_effects: Retries one accepted application marked onboarding_handoff_pending, records PII-safe outcome category, and clears Attention only after idempotent handoff success.
  - name: retry_pending_accepted_notifications
    inputs: {}
    returns: {type: int}
    exceptions: []
    side_effects: Retries all active accepted applications marked accepted_notification_pending.
  - name: archive_application
    inputs:
      application_id: {type: str, required: true}
      actor: {type: str, required: true}
    returns: {type: HiringApplication}
    exceptions: [ValueError]
    side_effects: Archives an application and appends its audit event.
  - name: refresh_expired_offer_attention
    inputs:
      today: {type: 'date | None', required: false, default: null}
    returns: {type: int}
    exceptions: []
    side_effects: Marks overdue sent offers for Attention without advancing their stage.
data_structures:
- name: PromotedOfferArtifacts
  type: dataclass
- name: CandidateProfile
  type: dataclass
- name: HiringApplication
  type: dataclass
- name: ApplicationEvent
  type: dataclass
- name: OfferApprovalDates
  type: dataclass
- name: OfferVersion
  type: dataclass
- name: MigrationParityReport
  type: dataclass
dependencies:
- starting_pay_calculator
- data_store
