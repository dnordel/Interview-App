module:
  name: data_store
  language: python
  path: src/data_store.py
  version: 1.0.0
  description: JSON-backed stores and loaders for interview runtime and onboarding settings.
functions: []
classes:
- name: RubricLoader
  description: Loads and validates rubric configuration and exposes track-filtered traits.
  locked: false
  attributes:
    rubric_path:
      type: Path
    data:
      type: dict[str, Any]
  methods:
  - name: __init__
    inputs:
      rubric_path:
        type: Path
        required: true
    returns:
      type: None
  - name: validate
    inputs:
      data:
        type: dict[str, Any]
        required: true
    returns:
      type: None
  - name: get_traits_for_track
    inputs:
      track_key:
        type: str
        required: true
    returns:
      type: list[dict[str, Any]]
- name: DisqualifierSignalLibrary
  description: Loads optional disqualifier config and indexes entries by trait id.
  locked: false
  attributes:
    path:
      type: Path
    data:
      type: dict[str, Any]
    by_trait_id:
      type: dict[str, dict[str, Any]]
  methods:
  - name: __init__
    inputs:
      path:
        type: Path
        required: true
    returns:
      type: None
  - name: get_for_trait
    inputs:
      trait_id:
        type: str
        required: true
    returns:
      type: dict[str, Any] | None
- name: QuestionOverridesStore
  description: Persists and normalizes question override configuration per track.
  locked: false
  attributes:
    path:
      type: Path
    data:
      type: dict[str, Any]
  methods:
  - name: load
    inputs: {}
    returns:
      type: dict[str, Any]
  - name: save
    inputs: {}
    returns:
      type: None
  - name: get_trait_order
    inputs:
      track_key:
        type: str
        required: true
    returns:
      type: list[str]
  - name: set_trait_order
    inputs:
      track_key:
        type: str
        required: true
      trait_ids:
        type: list[str]
        required: true
    returns:
      type: None
  - name: get_trait_question_override
    inputs:
      trait_id:
        type: str
        required: true
    returns:
      type: str | None
  - name: set_trait_question_override
    inputs:
      trait_id:
        type: str
        required: true
      text:
        type: str
        required: true
    returns:
      type: None
  - name: clear_trait_question_override
    inputs:
      trait_id:
        type: str
        required: true
    returns:
      type: None
  - name: list_custom_questions
    inputs:
      track_key:
        type: str
        required: true
    returns:
      type: list[dict[str, Any]]
  - name: upsert_custom_question
    inputs:
      track_key:
        type: str
        required: true
      q:
        type: dict[str, Any]
        required: true
    returns:
      type: None
  - name: delete_custom_question
    inputs:
      track_key:
        type: str
        required: true
      qid:
        type: str
        required: true
    returns:
      type: None
  - name: get_question_flow_raw
    inputs:
      track_key:
        type: str
        required: true
    returns:
      type: list[dict[str, Any]]
  - name: set_question_flow
    inputs:
      track_key:
        type: str
        required: true
      flow:
        type: list[dict[str, Any]]
        required: true
    returns:
      type: None
  - name: ensure_flow
    inputs:
      track_key:
        type: str
        required: true
      valid_trait_ids_in_order:
        type: list[str]
        required: true
      valid_custom_ids_in_order:
        type: list[str]
        required: true
    returns:
      type: list[dict[str, Any]]
  - name: remove_custom_from_flow
    inputs:
      track_key:
        type: str
        required: true
      qid:
        type: str
        required: true
    returns:
      type: None
  - name: insert_custom_into_flow
    inputs:
      track_key:
        type: str
        required: true
      qid:
        type: str
        required: true
      index:
        type: int
        required: true
    returns:
      type: None
- name: InterviewHistoryStore
  description: Persists finalized interview history entries.
  locked: false
  attributes: {}
  methods:
  - name: load
    inputs: {}
    returns:
      type: list[dict[str, Any]]
  - name: append
    inputs:
      entry:
        type: dict[str, Any]
        required: true
    returns:
      type: None
  - name: update_row
    inputs:
      row_key:
        type: str
        required: true
      updates:
        type: dict[str, Any]
        required: true
    returns:
      type: bool
- name: SchoolOfferSettingsStore
  description: Stores per-school offer template settings.
  locked: false
  attributes: {}
  methods:
  - name: load
    inputs: {}
    returns:
      type: dict[str, dict[str, str]]
  - name: save
    inputs:
      data:
        type: dict[str, dict[str, str]]
        required: true
    returns:
      type: None
- name: SchoolEmailTemplateStore
  description: Stores per-school email template settings.
  locked: false
  attributes: {}
  methods:
  - name: load
    inputs: {}
    returns:
      type: dict[str, dict[str, str]]
  - name: save
    inputs:
      data:
        type: dict[str, dict[str, str]]
        required: true
    returns:
      type: None
data_structures: []
