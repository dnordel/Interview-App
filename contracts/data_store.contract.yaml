module:
  name: data_store
  language: python
  path: src/data_store.py
  version: 1.2.0
  description: JSON-backed stores and loaders for interview runtime and onboarding
    settings.
functions: []
classes:
- name: RubricLoader
  description: Loads and validates rubric configuration and exposes track-filtered
    traits.
  locked: false
  attributes:
    rubric_path:
      type: Path
    data:
      type: dict[str, Any]
  methods:
  - name: __init__
    inputs:
      rubric_path:
        type: Path
        required: true
    returns:
      type: None
  - name: validate
    inputs:
      data:
        type: dict[str, Any]
        required: true
    returns:
      type: None
  - name: get_traits_for_track
    inputs:
      track_key:
        type: str
        required: true
    returns:
      type: list[dict[str, Any]]
- name: DisqualifierSignalLibrary
  description: Loads optional disqualifier config and indexes entries by trait id.
  locked: false
  attributes:
    path:
      type: Path
    data:
      type: dict[str, Any]
    by_trait_id:
      type: dict[str, dict[str, Any]]
  methods:
  - name: __init__
    inputs:
      path:
        type: Path
        required: true
    returns:
      type: None
  - name: get_for_trait
    inputs:
      trait_id:
        type: str
        required: true
    returns:
      type: dict[str, Any] | None
- name: QuestionOverridesStore
  description: Persists and normalizes question override configuration per track.
  locked: false
  attributes:
    path:
      type: Path
    data:
      type: dict[str, Any]
  methods:
  - name: load
    inputs: {}
    returns:
      type: dict[str, Any]
  - name: save
    inputs: {}
    returns:
      type: None
  - name: get_trait_order
    inputs:
      track_key:
        type: str
        required: true
    returns:
      type: list[str]
  - name: set_trait_order
    inputs:
      track_key:
        type: str
        required: true
      trait_ids:
        type: list[str]
        required: true
    returns:
      type: None
  - name: get_trait_question_override
    inputs:
      trait_id:
        type: str
        required: true
    returns:
      type: str | None
  - name: set_trait_question_override
    inputs:
      trait_id:
        type: str
        required: true
      text:
        type: str
        required: true
    returns:
      type: None
  - name: clear_trait_question_override
    inputs:
      trait_id:
        type: str
        required: true
    returns:
      type: None
  - name: list_custom_questions
    inputs:
      track_key:
        type: str
        required: true
    returns:
      type: list[dict[str, Any]]
  - name: upsert_custom_question
    description: Add or replace one custom question for a track; custom question id
      must be non-empty.
    inputs:
      track_key:
        type: str
        required: true
      q:
        type: dict[str, Any]
        required: true
    returns:
      type: None
    exceptions:
    - ValueError
    side_effects: Writes question_overrides.json.
  - name: delete_custom_question
    description: Delete one custom question for a track; missing ids are tolerated.
    inputs:
      track_key:
        type: str
        required: true
      qid:
        type: str
        required: true
    returns:
      type: None
    exceptions: []
    side_effects: Writes question_overrides.json.
  - name: get_question_flow_raw
    inputs:
      track_key:
        type: str
        required: true
    returns:
      type: list[dict[str, Any]]
  - name: set_question_flow
    inputs:
      track_key:
        type: str
        required: true
      flow:
        type: list[dict[str, Any]]
        required: true
    returns:
      type: None
  - name: ensure_flow
    inputs:
      track_key:
        type: str
        required: true
      valid_trait_ids_in_order:
        type: list[str]
        required: true
      valid_custom_ids_in_order:
        type: list[str]
        required: true
    returns:
      type: list[dict[str, Any]]
  - name: remove_custom_from_flow
    inputs:
      track_key:
        type: str
        required: true
      qid:
        type: str
        required: true
    returns:
      type: None
  - name: insert_custom_into_flow
    inputs:
      track_key:
        type: str
        required: true
      qid:
        type: str
        required: true
      index:
        type: int
        required: true
    returns:
      type: None
- name: InterviewHistoryStore
  description: Persists finalized interview history entries and reads legacy root-level
    history rows when the canonical user_artifacts history path is used.
  locked: false
  attributes: {}
  methods:
  - name: load
    description: Load canonical history rows merged after legacy root-level rows,
      deduplicating by stable row key when both files contain the same interview.
    inputs: {}
    returns:
      type: list[dict[str, Any]]
    side_effects: Reads user_artifacts/interview_history.json and, when using that
      canonical path, may also read interview_history.json from the repository root.
  - name: _load_from_path
    inputs:
      path:
        type: Path | None
        required: true
    returns:
      type: list[dict[str, Any]]
  - name: _legacy_root_path
    inputs: {}
    returns:
      type: Path | None
  - name: _merge_history_rows
    inputs:
      legacy_rows:
        type: list[dict[str, Any]]
        required: true
      canonical_rows:
        type: list[dict[str, Any]]
        required: true
    returns:
      type: list[dict[str, Any]]
  - name: append
    inputs:
      entry:
        type: dict[str, Any]
        required: true
    returns:
      type: None
  - name: update_row
    inputs:
      row_key:
        type: str
        required: true
      updates:
        type: dict[str, Any]
        required: true
    returns:
      type: bool
  - name: delete_row
    description: Delete one finalized interview history row by stable row key/history
      id.
    inputs:
      row_key:
        type: str
        required: true
    returns:
      type: bool
    side_effects: Writes interview history JSON when the row is found.
  - name: update_offer_state
    description: Update one history row's offer status and optional offer letter
      path using the row key/history id.
    inputs:
      row_key:
        type: str
        required: true
      offer_status:
        type: str
        required: true
      offer_letter_path:
        type: str
        required: false
        default: ""
    returns:
      type: bool
    side_effects: Writes interview history JSON when the row is found.
  - name: repair_interview_notes_links
    description: Repair missing or broken interview-notes path fields by matching
      history row candidate/date/school metadata to DOCX filenames in an interview
      notes directory.
    inputs:
      notes_dir:
        type: Path
        required: true
    returns:
      type: int
    side_effects: Writes interview history JSON when one or more rows are repaired.
  - name: _interview_notes_index
    description: Build normalized candidate/date/school lookup keys from interview
      notes filenames shaped like YYYY-MM-DD - School - Candidate - Interview.docx.
    inputs:
      notes_dir:
        type: Path
        required: true
    returns:
      type: dict[tuple[str, str, str], Path]
  - name: _normalize_match_text
    description: Normalize filename/history text for case-insensitive matching.
    inputs:
      value:
        type: str
        required: true
    returns:
      type: str
  - name: _has_existing_notes_link
    description: Return whether a row already has a notes/report path field pointing
      to an existing local file.
    inputs:
      row:
        type: dict[str, Any]
        required: true
    returns:
      type: bool
- name: SchoolOfferSettingsStore
  description: Stores per-school offer template settings.
  locked: false
  attributes: {}
  methods:
  - name: load
    inputs: {}
    returns:
      type: dict[str, dict[str, str]]
  - name: save
    inputs:
      data:
        type: dict[str, dict[str, str]]
        required: true
    returns:
      type: None
- name: SchoolEmailTemplateStore
  description: Stores per-school email template settings.
  locked: false
  attributes: {}
  methods:
  - name: load
    inputs: {}
    returns:
      type: dict[str, dict[str, str]]
  - name: save
    inputs:
      data:
        type: dict[str, dict[str, str]]
        required: true
    returns:
      type: None
data_structures: []
dependencies:
- module: platform_services
