module:
  name: data_store
  language: python
  path: src/data_store.py
  version: 1.9.0
  description: SQLite-backed interview history store plus JSON-backed stores and
    loaders for interview runtime and onboarding settings.
functions:
- name: ml_dataset_path_for_history_path
  description: Return the interview_ml_dataset.sqlite3 path under the configured
    ML dataset directory, defaulting to G:\My Drive\Work\LaunchPad\Interview ML DB
    and allowing INTERVIEW_ML_DATASET_DIR to override it for tests or alternate machines.
  locked: false
  inputs:
    history_path:
      type: Path
      required: true
  returns:
    type: Path
  exceptions: []
  side_effects: none
- name: default_school_offer_settings
  description: Return default per-school offer settings with portable full-time and
    part-time template paths, offer output folders, contractor slots, and interview-notes
    folder fragments for known schools.
  locked: false
  inputs: {}
  returns:
    type: dict[str, dict[str, str]]
  exceptions: []
  side_effects: none
- name: resolve_interview_notes_output_dir
  description: Resolve the interview notes output directory for a school by applying
    editable per-school settings to the current computer's Dropbox root, falling
    back to base_dir/Indeed Interview Notes when no school folder is configured.
  locked: false
  inputs:
    base_dir:
      type: Path
      required: true
    school:
      type: str
      required: true
    settings:
      type: dict[str, dict[str, str]] | None
      required: false
      default: null
  returns:
    type: Path
  exceptions:
  - ValueError
  side_effects: none
- name: resolve_offer_template_path
  description: Resolve the configured full-time or part-time template against the current Dropbox root using the 30-hour boundary.
  locked: false
  inputs:
    base_dir:
      type: Path
      required: true
    school:
      type: str
      required: true
    hours:
      type: int
      required: true
    settings:
      type: dict[str, dict[str, str]] | None
      required: false
      default: null
  returns:
    type: Path
  exceptions:
  - ValueError
  side_effects: none
- name: resolve_offer_output_dir
  description: Resolve a school's configured offer output folder against the current Dropbox root.
  locked: false
  inputs:
    base_dir:
      type: Path
      required: true
    school:
      type: str
      required: true
    settings:
      type: dict[str, dict[str, str]] | None
      required: false
      default: null
  returns:
    type: Path
  exceptions:
  - ValueError
  side_effects: none
classes:
- name: RubricLoader
  description: Loads and validates rubric configuration and exposes track-filtered
    traits.
  locked: false
  attributes:
    rubric_path:
      type: Path
    data:
      type: dict[str, Any]
  methods:
  - name: __init__
    inputs:
      rubric_path:
        type: Path
        required: true
    returns:
      type: None
  - name: validate
    inputs:
      data:
        type: dict[str, Any]
        required: true
    returns:
      type: None
  - name: get_traits_for_track
    inputs:
      track_key:
        type: str
        required: true
    returns:
      type: list[dict[str, Any]]
- name: DisqualifierSignalLibrary
  description: Loads optional disqualifier config and indexes entries by trait id.
  locked: false
  attributes:
    path:
      type: Path
    data:
      type: dict[str, Any]
    by_trait_id:
      type: dict[str, dict[str, Any]]
  methods:
  - name: __init__
    inputs:
      path:
        type: Path
        required: true
    returns:
      type: None
  - name: get_for_trait
    inputs:
      trait_id:
        type: str
        required: true
    returns:
      type: dict[str, Any] | None
- name: QuestionOverridesStore
  description: Persists and normalizes question override configuration per track.
  locked: false
  attributes:
    path:
      type: Path
    data:
      type: dict[str, Any]
  methods:
  - name: load
    inputs: {}
    returns:
      type: dict[str, Any]
  - name: save
    inputs: {}
    returns:
      type: None
  - name: get_trait_order
    inputs:
      track_key:
        type: str
        required: true
    returns:
      type: list[str]
  - name: set_trait_order
    inputs:
      track_key:
        type: str
        required: true
      trait_ids:
        type: list[str]
        required: true
    returns:
      type: None
  - name: get_trait_question_override
    inputs:
      trait_id:
        type: str
        required: true
    returns:
      type: str | None
  - name: set_trait_question_override
    inputs:
      trait_id:
        type: str
        required: true
      text:
        type: str
        required: true
    returns:
      type: None
  - name: clear_trait_question_override
    inputs:
      trait_id:
        type: str
        required: true
    returns:
      type: None
  - name: list_custom_questions
    inputs:
      track_key:
        type: str
        required: true
    returns:
      type: list[dict[str, Any]]
  - name: upsert_custom_question
    description: Add or replace one custom question for a track; custom question id
      must be non-empty.
    inputs:
      track_key:
        type: str
        required: true
      q:
        type: dict[str, Any]
        required: true
    returns:
      type: None
    exceptions:
    - ValueError
    side_effects: Writes question_overrides.json.
  - name: delete_custom_question
    description: Delete one custom question for a track; missing ids are tolerated.
    inputs:
      track_key:
        type: str
        required: true
      qid:
        type: str
        required: true
    returns:
      type: None
    exceptions: []
    side_effects: Writes question_overrides.json.
  - name: get_question_flow_raw
    inputs:
      track_key:
        type: str
        required: true
    returns:
      type: list[dict[str, Any]]
  - name: set_question_flow
    inputs:
      track_key:
        type: str
        required: true
      flow:
        type: list[dict[str, Any]]
        required: true
    returns:
      type: None
  - name: ensure_flow
    inputs:
      track_key:
        type: str
        required: true
      valid_trait_ids_in_order:
        type: list[str]
        required: true
      valid_custom_ids_in_order:
        type: list[str]
        required: true
    returns:
      type: list[dict[str, Any]]
  - name: remove_custom_from_flow
    inputs:
      track_key:
        type: str
        required: true
      qid:
        type: str
        required: true
    returns:
      type: None
  - name: insert_custom_into_flow
    inputs:
      track_key:
        type: str
        required: true
      qid:
        type: str
        required: true
      index:
        type: int
        required: true
    returns:
      type: None
- name: InterviewHistoryStore
  description: Persists finalized interview history entries to a sibling SQLite
    database with queryable metadata columns, row-level write/update/delete operations,
    and read-only legacy JSON import.
  locked: false
  attributes:
    json_path:
      type: Path
    db_path:
      type: Path
  methods:
  - name: load
    description: Load finalized interview history rows from SQLite, importing canonical
      and legacy JSON rows only when the SQLite table is empty; constructor accepts
      either the DB path or the legacy JSON path.
    inputs: {}
    returns:
      type: list[dict[str, Any]]
    side_effects: Creates/reads interview_history.sqlite3 and may import rows from
      user_artifacts/interview_history.json plus root-level interview_history.json.
  - name: load_filtered
    description: Load finalized interview history payload rows using indexed SQLite
      metadata filters for school, outcome, offer status, text search across metadata
      plus stored payload JSON, and optional limit.
    inputs:
      school:
        type: str
        required: false
        default: ""
      outcome:
        type: str
        required: false
        default: ""
      offer_status:
        type: str
        required: false
        default: ""
      search:
        type: str
        required: false
        default: ""
      limit:
        type: int | None
        required: false
        default: null
    returns:
      type: list[dict[str, Any]]
    side_effects: Creates/reads interview_history.sqlite3, imports legacy JSON rows
      only if the DB is empty, and queries payload rows through SQLite metadata columns
      plus payload JSON text.
  - name: _load_from_path
    inputs:
      path:
        type: Path | None
        required: true
    returns:
      type: list[dict[str, Any]]
  - name: _legacy_root_path
    inputs: {}
    returns:
      type: Path | None
  - name: _merge_history_rows
    inputs:
      legacy_rows:
        type: list[dict[str, Any]]
        required: true
      canonical_rows:
        type: list[dict[str, Any]]
        required: true
    returns:
      type: list[dict[str, Any]]
  - name: append
    inputs:
      entry:
        type: dict[str, Any]
        required: true
    returns:
      type: None
    side_effects: Inserts one row into the interview_history SQLite database without
      rewriting existing rows or mutating legacy JSON history files.
  - name: update_row
    inputs:
      row_key:
        type: str
        required: true
      updates:
        type: dict[str, Any]
        required: true
    returns:
      type: bool
    side_effects: Updates one interview_history SQLite row when the row exists without
      rewriting unrelated rows.
  - name: delete_row
    description: Delete one finalized interview history row by stable row key/history
      id.
    inputs:
      row_key:
        type: str
        required: true
    returns:
      type: bool
    side_effects: Deletes one interview_history SQLite row when the row is found without
      rewriting unrelated rows.
  - name: update_offer_state
    description: Update one history row's offer status and optional offer letter
      path using the row key/history id.
    inputs:
      row_key:
        type: str
        required: true
      offer_status:
        type: str
        required: true
      offer_letter_path:
        type: str
        required: false
        default: ""
    returns:
      type: bool
    side_effects: Updates one interview_history SQLite row when the row is found without
      rewriting unrelated rows.
  - name: repair_interview_notes_links
    description: Repair missing or broken interview-notes path fields by matching
      history row candidate/date/school metadata to DOCX filenames in an interview
      notes directory.
    inputs:
      notes_dir:
        type: Path
        required: true
    returns:
      type: int
    side_effects: Writes the interview_history SQLite database when one or more rows
      are repaired.
  - name: _interview_notes_index
    description: Build normalized candidate/date/school lookup keys from interview
      notes filenames shaped like YYYY-MM-DD - School - Candidate - Interview.docx.
    inputs:
      notes_dir:
        type: Path
        required: true
    returns:
      type: dict[tuple[str, str, str], Path]
  - name: _normalize_match_text
    description: Normalize filename/history text for case-insensitive matching.
    inputs:
      value:
        type: str
        required: true
    returns:
      type: str
  - name: _has_existing_notes_link
    description: Return whether a row already has a notes/report path field pointing
      to an existing local file.
    inputs:
      row:
        type: dict[str, Any]
        required: true
    returns:
      type: bool
  - name: _save
    inputs:
      items:
        type: list[dict[str, Any]]
        required: true
    returns:
      type: None
    side_effects: Replaces interview_history SQLite table contents with normalized
      row-keyed JSON payload records plus queryable metadata columns.
  - name: _write_history_row
    inputs:
      conn:
        type: sqlite3.Connection
        required: true
      row_key:
        type: str
        required: true
      sort_order:
        type: int
        required: true
      row:
        type: dict[str, Any]
        required: true
    returns:
      type: None
    side_effects: Upserts one interview_history SQLite row payload plus queryable
      metadata columns, preserving created_at for existing rows.
  - name: _next_sort_order
    inputs:
      conn:
        type: sqlite3.Connection
        required: true
    returns:
      type: int
  - name: _ensure_db
    inputs: {}
    returns:
      type: None
    side_effects: Creates or migrates the sibling interview_history SQLite database,
      history table, query columns, and indexes when missing.
  - name: _ensure_query_columns
    inputs:
      conn:
        type: sqlite3.Connection
        required: true
    returns:
      type: None
    side_effects: Adds missing queryable metadata columns to existing interview_history
      SQLite tables without dropping rows.
  - name: _load_from_db
    inputs: {}
    returns:
      type: list[dict[str, Any]]
    side_effects: Reads JSON payload rows from the interview_history SQLite database.
  - name: _payloads_from_rows
    inputs:
      rows:
        type: list[Any]
        required: true
    returns:
      type: list[dict[str, Any]]
  - name: _import_json_rows_if_needed
    inputs: {}
    returns:
      type: int
    side_effects: Imports canonical and legacy JSON history rows into SQLite only
      when no SQLite history rows exist.
  - name: _history_text
    inputs:
      row:
        type: dict[str, Any]
        required: true
      keys:
        type: tuple[str, ...]
        required: true
    returns:
      type: str
  - name: _history_score
    inputs:
      row:
        type: dict[str, Any]
        required: true
    returns:
      type: float | None
- name: InterviewMLDatasetStore
  description: Persists normalized interview data for machine-learning analysis,
    including session/profile metadata, per-question answer rows with exact prompt
    snapshots, AI signal rows, DeepSeek prompt/output traces, pending-AI backlog rows,
    and CSV/JSONL exports.
  locked: false
  attributes:
    path:
      type: Path
    db_path:
      type: Path
  methods:
  - name: count_rows
    inputs:
      table_name:
        type: str
        required: true
    returns:
      type: int
    side_effects: Creates the ML dataset SQLite schema when missing, then reads a
      count from a supported ML table.
  - name: fetch_one
    inputs:
      query:
        type: str
        required: true
      params:
        type: tuple[Any, ...]
        required: false
        default: ()
    returns:
      type: sqlite3.Row | None
    side_effects: Creates the ML dataset SQLite schema when missing, then executes
      one local read query.
  - name: upsert_interview
    description: Upsert one interview's ML session/profile rows and replace its
      derived answer/signal rows idempotently from finalize, DeepSeek, or backfill
      payloads; missing or pending DeepSeek analysis creates a pending-AI backlog row.
    inputs:
      history_entry:
        type: dict[str, Any]
        required: true
      payload:
        type: dict[str, Any]
        required: true
      scoring:
        type: dict[str, Any]
        required: true
      source_job_path:
        type: Path | str
        required: false
        default: ''
      source_session_path:
        type: Path | str
        required: false
        default: ''
    returns:
      type: None
    side_effects: Creates or updates interview_ml_dataset.sqlite3 only; does not
      run DeepSeek or mutate interview history.
  - name: record_deepseek_traces
    description: Upsert raw DeepSeek prompt/output trace events for one history id,
      preserving prompt text, response text, validation result, normalized output,
      model metadata, and optional trait/question identifiers.
    inputs:
      history_id:
        type: str
        required: true
      events:
        type: list[dict[str, Any]]
        required: true
      source_path:
        type: Path | str
        required: false
        default: ''
    returns:
      type: int
    side_effects: Writes rows to ml_deepseek_traces.
  - name: export_dataset
    description: Export ML sessions, answers, signals, pending-AI rows, DeepSeek
      traces, and joined answer-level JSONL files to a local directory and log export
      metadata.
    inputs:
      output_dir:
        type: Path
        required: true
    returns:
      type: dict[str, Path]
    side_effects: Creates export files and appends rows to ml_exports.
- name: SchoolOfferSettingsStore
  description: Stores per-school full-time, part-time, contractor offer template
    settings and interview-note output folder settings.
  locked: false
  attributes: {}
  methods:
  - name: load
    inputs: {}
    returns:
      type: dict[str, dict[str, str]]
  - name: save
    inputs:
      data:
        type: dict[str, dict[str, str]]
        required: true
    returns:
      type: None
- name: SchoolEmailTemplateStore
  description: Stores per-school email template settings.
  locked: false
  attributes: {}
  methods:
  - name: load
    inputs: {}
    returns:
      type: dict[str, dict[str, str]]
  - name: save
    inputs:
      data:
        type: dict[str, dict[str, str]]
        required: true
    returns:
      type: None
data_structures:
- name: DEFAULT_SCHOOL_INTERVIEW_NOTES_DIRS
  description: Portable default per-school interview notes folder fragments, rooted
    at the current computer's Dropbox folder during resolution.
- name: DEFAULT_SCHOOL_OFFER_DIRS
  description: Portable default PMD, NLB, and HAW offer output folder fragments.
- name: DEFAULT_SCHOOL_OFFER_TEMPLATE_NAMES
  description: Full-time and part-time offer template filenames keyed by school.
dependencies:
- module: platform_services
