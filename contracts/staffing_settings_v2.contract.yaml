module:
  name: staffing_settings_v2
  language: python
  path: src/staffing_settings_v2.py
  version: 1.4.0
  description: Admin-only Staffing v2 settings for interview configuration, shared notification services, and school-scoped Onboarding owner-role recipients.
functions: []
classes:
- name: StaffingSettingsV2Page
  description: Builds responsive Staffing v2 Settings sections plus an optional Onboarding owner-role panel.
  locked: false
  attributes:
    widget:
      type: QWidget
    is_dirty:
      type: bool
  methods:
  - name: __init__
    inputs:
      QtCore: {type: Any, required: true}
      QtGui: {type: Any, required: true}
      QtWidgets: {type: Any, required: true}
      studio: {type: AdminStudio, required: true}
      email_settings_path: {type: Path, required: true}
      hiring_manager_email_settings_path: {type: 'Path | None', required: false, default: null}
      notification_directory_path: {type: 'Path | None', required: false, default: null}
      on_email_settings_saved: {type: "Callable[[], None] | None", required: false, default: null}
      onboarding_service: {type: 'Any | None', required: false, default: null}
    returns: {type: None}
    exceptions: []
    side_effects: Creates an in-memory AdminStudioDraft, loads masked shared-email fields and school contacts, and builds the six-section Settings widget with consolidated School Settings plus independent save and background incoming/outgoing verification controls without writing configuration.
  - name: set_editing
    inputs:
      enabled: {type: bool, required: true}
    returns: {type: None}
    exceptions: []
    side_effects: Enables or disables editable controls for the first five sections and synchronizes global configuration actions without treating email-only changes as publishable configuration.
  - name: discard_changes
    inputs: {}
    returns: {type: None}
    exceptions: []
    side_effects: Replaces the in-memory configuration draft from persisted state and restores unsaved email fields from their saved baseline.
  - name: request_navigation_away
    inputs: {}
    returns: {type: bool}
    exceptions: []
    side_effects: Returns immediately when clean; otherwise prompts Keep Draft, Discard, or Stay and discards only when selected.
  - name: request_close
    inputs: {}
    returns: {type: bool}
    exceptions: []
    side_effects: Returns immediately when clean; otherwise prompts Discard and Close or Stay and discards only when closing.
dependencies:
- module: admin_studio
- module: notification_service
- module: onboarding_service
- module: PySide6
data_structures: []
