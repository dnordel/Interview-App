    exceptions: []
    side_effects: Populates the People / Employee Management side filter drawer with active-status, role, permit-status, and units controls plus icon-bearing reset, icon-only close, cancel, and primary icon-bearing apply actions without mutating staffing data.
  - name: _people_drawer_combo
    inputs:
      object_name:
        type: str
        required: true
      values:
        type: list[str]
        required: true
    returns:
      type: QComboBox
    exceptions: []
    side_effects: Creates a People / Employee Management side drawer filter combo with stable objectName.
  - name: _open_people_filter_drawer
    inputs: {}
    returns:
      type: None
    exceptions: []
    side_effects: Synchronizes People side drawer controls from current top-filter state and shows the drawer without mutating staffing data.
  - name: _reset_people_filter_drawer
    inputs: {}
    returns:
      type: None
    exceptions: []
    side_effects: Resets People side drawer controls to default active, role, permit, and units filters without applying until requested.
  - name: _apply_people_filter_drawer
    inputs: {}
    returns:
      type: None
    exceptions: []
    side_effects: Applies People side drawer filters to the visible People table and hides the drawer without mutating staffing data.
  - name: _refresh_people_filters
    inputs: {}
    returns:
      type: None
    exceptions: []
    side_effects: Applies People search, active, role, permit, and units filters, then refreshes metrics, the read-only people table, result count, and selected overlay detail panel without mutating staffing data.
  - name: _refresh_people_metrics
    inputs: {}
    returns:
      type: None
    exceptions: []
    side_effects: Rebuilds People / Employee Management metric cards from StaffingStore person snapshot data.
  - name: _refresh_people_table
    inputs: {}
    returns:
      type: None
    exceptions: []
    side_effects: Rebuilds the read-only People table from filtered person records, wires row View buttons to refresh the overlay detail panel, and selects the first visible person without mutating staffing data.
  - name: _select_person
    inputs:
      row_index:
        type: int
        required: true
    returns:
      type: None
    exceptions: []
    side_effects: Renders or hides the People / Employee Management overlay detail panel for a visible table row or no-selection state without mutating staffing data.
  - name: _render_person_detail
    inputs:
      person:
        type: StaffingPerson | None
        required: true
    returns:
      type: None
    exceptions: []
    side_effects: Rebuilds and shows the People / Employee Management overlay detail panel for the selected person, including active tabs, compact reusable employee information/current assignment/status cards, and pinned footer actions without mutating staffing data.
  - name: _refresh_history_table
    inputs: {}
    returns:
      type: None
    exceptions: []
    side_effects: Rebuilds the read-only Assignment History table from filtered history records, wires row View buttons to refresh the overlay detail panel, and selects the first visible record without mutating staffing data.
  - name: _select_history_record
    inputs:
      row_index:
        type: int
        required: true
    returns:
      type: None
    exceptions: []
    side_effects: Renders or hides the Assignment History overlay detail panel for a visible table row or no-selection state without mutating staffing data.
  - name: _open_history_assignment
    inputs:
      assignment_id:
        type: int
        required: true
    returns:
      type: None
    exceptions: []
    side_effects: Switches from Assignment History to the main Staffing Dashboard and opens the selected assignment in the Position Detail drawer without mutating staffing data.
  - name: _open_history_employee
    inputs:
      employee_name:
        type: str
        required: true
    returns:
      type: None
    exceptions: []
    side_effects: Switches from Assignment History to People / Employee Management and selects the visible person matching the history employee name without mutating staffing data.
  - name: _open_history_export_list_dialog
    inputs: {}
    returns:
      type: None
    exceptions: []
    side_effects: Opens a read-only Assignment History export preview dialog for currently visible filtered history records without writing files or mutating staffing data.
  - name: _open_history_export_dialog
    inputs:
      record:
        type: StaffingHistoryRecord
        required: true
    returns:
      type: None
    exceptions: []
    side_effects: Opens a read-only Assignment History export preview dialog for the selected record without writing files or mutating staffing data.
  - name: _show_position_drawer
    inputs:
      assignment_id:
        type: int
        required: true
    returns:
      type: None
    exceptions: []
    side_effects: Reads one staffing assignment, rebuilds and shows the visible Staffing v2 read-only Position Detail overlay drawer with icon-only close, icon-bearing action buttons including v2-native Mark Need Now, Delete Position, Edit Position, Replace Employee, and View Full History navigation, icon-bearing related-person placeholder action, and pinned icon-bearing Cancel/Save Draft/Save Changes footer actions without mutating staffing data during render.
  - name: _wire_menu_action
    inputs:
      action:
        type: QAction
        required: true
      action_key:
        type: str
        required: true
      assignment_id:
        type: int
        required: true
    returns:
      type: None
    exceptions: []
    side_effects: Wires a Staffing v2 positions-table menu action to an implemented v2 dialog/drawer/navigation workflow, v2-native status transition, supplied callback, or disables unsupported actions without mutating data during render.
  - name: _open_position_from_drawer
    inputs:
      assignment_id:
        type: int
        required: true
    returns:
      type: None
    exceptions: []
    side_effects: Opens one Don't Need staffing assignment through StaffingService.open_position, refreshes the Staffing v2 dashboard, and reopens the position drawer.
  - name: _revert_coming_from_drawer
    inputs:
      assignment_id:
        type: int
        required: true
    returns:
      type: None
    exceptions: []
    side_effects: Reverts one Coming staffing assignment through StaffingService.revert_coming, refreshes the Staffing v2 dashboard, and reopens the position drawer.
  - name: _run_position_transition
    inputs:
      assignment_id:
        type: int
        required: true
      action:
        type: Callable[[StaffingService], Any]
        required: true
    returns:
      type: None
    exceptions: []
    side_effects: Runs one service-backed position transition, refreshes the Staffing v2 dashboard, and reopens the selected position drawer; on service error, leaves data unchanged and restores the current drawer.
  - name: _open_position_edit_dialog
    inputs:
      assignment_id:
        type: int
        required: true
    returns:
      type: None
    exceptions: []
    side_effects: Opens the Staffing v2 Edit Position dialog with icon-only close and editable classroom, program, position name, position type, status, and notes fields; on save, calls StaffingService.update_assignment_details, refreshes the dashboard, and reopens the position drawer with inline sanitized validation errors on failure.
  - name: _open_add_position_dialog
    inputs: {}
    returns:
      type: None
    exceptions: []
    side_effects: Opens the Staffing v2 Add Position dialog with Director as a first-class position type and icon-only close; on confirmation, calls StaffingService.add_position, resets stale dashboard classroom/search filters so the created assignment is visible immediately, refreshes the v2 dashboard, selects the created classroom, and opens the created position drawer.
  - name: _open_delete_position_dialog
    inputs:
      assignment_id:
        type: int
        required: true
    returns:
      type: None
    exceptions: []
    side_effects: Opens the Staffing v2 Delete Position confirmation dialog with icon-only close for one unassigned mistaken position; on confirmation, disables repeat submit, calls StaffingService.delete_position with explicit confirmation, hides the drawer, refreshes the v2 dashboard, and shows service validation errors inline without deleting assigned positions.
  - name: _open_mark_coming_dialog
    inputs:
      assignment_id:
        type: int
        required: true
    returns:
      type: None
    exceptions: []
    side_effects: Opens the Staffing v2 Mark Coming dialog with Director role preservation, icon-only close, and icon-bearing candidate-selection and footer actions for one Need Now assignment; on confirmation, calls StaffingService.mark_coming and optionally StaffingService.update_permit_status, refreshes the v2 dashboard, and reopens the position drawer.
  - name: _open_mark_filled_dialog
    inputs:
      assignment_id:
        type: int
        required: true
    returns:
      type: None
    exceptions: []
    side_effects: Opens the Staffing v2 Mark Filled dialog with icon-only close for one Coming assignment; displays the assignment start date as the read-only filled date source, calls StaffingService.mark_filled on confirmation, refreshes the v2 dashboard, and reopens the position drawer.
  - name: _open_manage_filled_dialog
    inputs:
      assignment_id:
        type: int
        required: true
    returns:
      type: None
    exceptions: []
    side_effects: Opens the Staffing v2 Manage Filled Position chooser with icon-only close for one Filled assignment, displays permit-update and replace-employee workflow options, and routes Continue to the selected Staffing v2 dialog without mutating staffing data in the chooser.
  - name: _open_replace_employee_dialog
    inputs:
      assignment_id:
        type: int
        required: true
    returns:
      type: None
    exceptions: []
    side_effects: Opens the Staffing v2 Replace Employee dialog with icon-only close, date picker widgets that default to today and open the calendar when users click either the field or dropdown arrow, fixed reason dropdown, inline save errors, and v2 summary/validation/what-happens sections for one Filled assignment; on confirmation, calls StaffingService.mark_replacing, refreshes the dashboard, and reopens the position drawer with future final working days shown as Replace and today-or-earlier final working days shown as Need Now with the assigned person cleared.
  - name: _open_update_permit_dialog
    inputs:
      assignment_id:
        type: int
        required: true
    returns:
      type: None
    exceptions: []
    side_effects: Opens the Staffing v2 Update Permit dialog with icon-only close for one assigned position; on confirmation, calls StaffingService.update_permit_status with permit status, effective date, units, documentation flag, and notes, then refreshes the dashboard and drawer.
  - name: _open_mark_need_now_dialog
    inputs:
      assignment_id:
        type: int
        required: true
    returns:
      type: None
    exceptions: []
    side_effects: Opens the Staffing v2 Mark Position as Need Now confirmation with icon-only close for one Replace assignment; on confirmation, disables repeat submit, calls StaffingService.clear_replacement, treats an already-cleared need_now state as success, refreshes the dashboard, and reopens the position drawer.
  - name: _metric_card
    inputs:
      label:
        type: str
        required: true
      value:
        type: str
        required: true
      accessible_text:
        type: str
        required: true
      object_name:
        type: str
        required: false
        default: StaffingV2MetricCard
    returns:
      type: QFrame
    exceptions: []
    side_effects: Creates a mockup-style Staffing v2 metric or overview card with an icon-bearing label row and no staffing data mutation.
  - name: _summary_chip
    inputs:
      label:
        type: str
        required: true
      value:
        type: str
        required: true
      accessible_text:
        type: str
        required: true
    returns:
      type: QFrame
    exceptions: []
    side_effects: Creates a compact main-dashboard summary chip with stable objectName StaffingV2MetricCard, mockup-visible colon labels for metric chips, a semantic staffingV2SummaryVariant property for mockup colors, and no staffing data mutation.
  - name: _add_position_drop_zone
    inputs: {}
    returns:
      type: QFrame
    exceptions: []
    side_effects: Creates the dashed mockup-style Add Position drop zone with an icon-bearing button and wires it to the service-backed Add Position dialog.
  - name: _chip
    inputs:
      text:
        type: str
        required: true
      status:
        type: str
        required: true
    returns:
      type: QFrame
    exceptions: []
    side_effects: Creates an icon-bearing Staffing v2 status or permit chip widget with stable objectName styling and no staffing data mutation.
  - name: _icon_label
    inputs:
      icon_key:
        type: str
        required: true
      object_name:
        type: str
        required: true
    returns:
      type: QLabel
    exceptions: []
    side_effects: Creates a fixed-size label containing a Staffing v2 Qt standard icon pixmap for card labels and chips.
  - name: _detail_panel_card
    inputs:
      object_name:
        type: str
        required: true
      title:
        type: str
        required: false
        default: '""'
    returns:
      type: tuple[QFrame, QVBoxLayout]
    exceptions: []
    side_effects: Creates a compact reusable side-panel detail card with maximum vertical size policy, reduced padding/spacing, optional title, and no staffing data mutation.
data_structures:
- name: APP_QSS
  type: str
  description: Staffing v2 dedicated mockup QSS including shell colors, cards, chips, buttons, dialogs, and app-styled scrollbars.
- name: ActionCallback
  type: Callable[[int], None]
dependencies:
- notification_models
- notification_service
- notification_store
- staffing_models
- staffing_service
- staffing_store
