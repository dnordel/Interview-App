classes:
- name: _StaffingV2WheelRelay
  description: Factory for a retained Qt event-filter object that converts wheel events over the supplied root, non-scroll child widgets, custom item widgets, and viewports into vertical scrollbar movement on the owning Staffing v2 QAbstractScrollArea when the event global position sits over that scroll area, ignoring stale/deleted Qt objects without surfacing RuntimeError.
  locked: false
  methods:
  - name: __new__
    inputs:
      QtCore:
        type: Any
        required: true
      QtWidgets:
        type: Any
        required: true
      root:
        type: QWidget
        required: true
      scroll_area:
        type: QScrollArea
        required: true
    returns:
      type: QObject
    exceptions: []
    side_effects: Creates a QObject child of root that handles wheel events for one scroll area by parent-chain or global-position match, returning false when that scroll area has no usable range or when the watched/root widgets were deleted so parent relays can continue.
- name: _StaffingV2ApplicationWheelRouter
  description: Factory for a retained QApplication-level event-filter object that routes wheel events delivered to the top-level app/window into the smallest visible Staffing v2 QAbstractScrollArea viewport under the cursor, ignoring stale/deleted Staffing v2 roots without surfacing RuntimeError.
  locked: false
  methods:
  - name: __new__
    inputs:
      QtCore:
        type: Any
        required: true
      QtWidgets:
        type: Any
        required: true
      root:
        type: QWidget
        required: true
    returns:
      type: QObject
    exceptions: []
    side_effects: Creates a QObject child of root that handles application-level wheel events for all visible descendant scroll areas under the supplied Staffing v2 root, preferring smaller native viewports such as tables before parent detail scroll areas and returning false when the root was deleted.
- name: _StaffingV2OverlayPanel
  description: Internal PySide helper that creates a right-aligned Staffing v2 overlay panel with a preserved root objectName, reusable title/subtitle/close header builder, top-aligned viewport-width-clamped scrollable body layout, fixed footer layout, resize-aware positioning, and no participation in the parent dashboard layout.
  locked: false
  methods:
  - name: __init__
    inputs:
      QtCore:
        type: Any
        required: true
      QtWidgets:
        type: Any
        required: true
      parent:
        type: QWidget
        required: true
      object_name:
        type: str
        required: true
      width:
        type: int
        required: true
    returns:
      type: None
    exceptions: []
    side_effects: Creates a hidden QFrame child of the supplied parent, installs a parent resize event filter, and creates top-aligned body/footer layouts whose scroll body can shrink to the viewport width.
  - name: clear
    inputs: {}
    returns:
      type: None
    exceptions: []
    side_effects: Clears body and footer child widgets/layouts.
  - name: add_header
    inputs:
      title:
        type: str
        required: true
      title_object_name:
        type: str
        required: true
      close_object_name:
        type: str
        required: true
      close_icon:
        type: Any | None
        required: false
        default: null
      subtitle:
        type: str
        required: false
        default: ''
      subtitle_object_name:
        type: str
        required: false
        default: StaffingV2Muted
    returns:
      type: QPushButton
    exceptions: []
    side_effects: Adds a reusable overlay header to the scrollable body with title, optional subtitle, and icon-only close button wired to hide the overlay.
  - name: hide
    inputs: {}
    returns:
      type: None
    exceptions: []
    side_effects: Hides the overlay root frame.
  - name: show_overlay
    inputs: {}
    returns:
      type: None
    exceptions: []
    side_effects: Repositions, clamps the scroll body to the current viewport width, shows, raises the overlay frame without resizing the parent dashboard layout, adjusts the dynamic body size, and reapplies shared scroll-area behavior so rebuilt overlay child widgets relay wheel events to the scroll area.
  - name: reposition
    inputs: {}
    returns:
      type: None
    exceptions: []
    side_effects: Updates overlay geometry to right-align inside the parent and clamps the scroll body to the current viewport width.
  - name: _sync_body_width
    inputs: {}
    returns:
      type: None
    exceptions: []
    side_effects: Fixes the scroll body width to the current viewport width when the viewport has been laid out, preventing overlay detail content from creating clipped horizontal overflow.
  - name: _clear_layout
    inputs:
      layout:
        type: QLayout
        required: true
    returns:
      type: None
    exceptions: []
    side_effects: Recursively detaches and schedules deletion of layout children.
- name: StaffingDashboardV2Page
  description: Builds and refreshes the parallel Staffing v2 PySide shell/sidebar with Qt icons plus custom primary-blue add and person-add icons, styled scrollbars, mockup nav placeholders, dashboard with mockup-style header controls and one shared selected-school summary/action row containing Export/View History beside semantic compact icon-bearing summary chips with visible colon labels, icon-bearing overview cards and priority chip, custom classroom list item widgets, classroom list footer count, and icon-only filter affordance, explicit-numbered chip-based positions table with menu-style row actions, service-backed Add Position dialog with first-class Director position type, icon-only close, and icon-bearing drop zone, Export read-only preview dialog, shared overlay panels for side drawers/detail cards with scrollable bodies and fixed footers, multi-select pending director interview table with delete-selected cleanup, Classroom Management dashboard with icon-owned Add Classroom action text, Export read-only filtered-classrooms preview dialog, pagination footer, icon-bearing header/filter/search/table-row/detail-footer actions, row View detail selection, and icon-bearing overlay filter drawer active-count controls, Notifications dashboard with rule cards, filters, sorting, list/grid toggle, editable free-form event combo, recipient chips, template toolbar/variables, preview dialog, send-test action, audit/scheduled panel, validation, save/cancel/delete backed by NotificationStore and NotificationService, Staffing Validation dashboard with metric cards, active-state issue severity tabs, pagination footer, icon-bearing export/filter/search/table-row/detail-footer actions, row View drawer navigation, Run Full Validation refresh action, Export Validation Report read-only dialog, View Validation Rules read-only dialog, and icon-bearing overlay filter/right-panel controls, read-only position detail overlay drawer with icon-only close, icon-bearing action buttons, icon-bearing related-person placeholder action, and icon-bearing footer actions, Mark Coming and Mark Filled workflows with Director role preservation, icon-only close, and icon-bearing footer actions, Manage Filled workflow chooser with icon-only close, Update Permit workflow with icon-only close, Mark Need Now replacement-clear workflow with icon-only close, People / Employee Management dashboard with icon-owned Add Person action text, Director role filtering/addition, service-backed Add Person dialog, active-state detail tabs, pagination footer, icon-bearing header/filter/search/table-row actions, row View detail selection, and icon-bearing overlay detail/filter controls, and Assignment History dashboard with icon-bearing header/date-range/table-row/detail-footer actions, row View detail selection, View Validation navigation, View Assignment drawer navigation, Open Employee navigation, header Export read-only filtered-records preview dialog, Export Record read-only preview dialog, pagination footer, overlay detail panel, neutral assignment-ID detail chip, lifecycle event rows, and validation checklist rows from StaffingService metrics and StaffingStore data while keeping staffing mutations in StaffingService.
