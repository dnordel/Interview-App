  description: Return whether a notification rule should be visible in the Staffing v2 Notifications dashboard, hiding empty unrelated onboarding/welcome placeholders while preserving edited user-created rules.
  locked: false
  inputs:
    rule:
      type: NotificationRule
      required: true
  returns:
    type: bool
  exceptions: []
  side_effects: none
- name: _safe_object_suffix
  description: Convert user-provided notification text into a stable objectName-safe suffix for chip remove buttons.
  locked: false
