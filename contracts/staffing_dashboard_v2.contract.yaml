  description: Parallel PySide Staffing v2 dashboard page module for the mockup-driven rewrite; renders a standalone mockup-style staffing shell/sidebar with active nav state, Qt icons plus custom primary-blue add and person-add icons, styled scrollbars, and disabled placeholder nav entries for unimplemented mockup destinations, main Staffing Dashboard with stable dashboard objectName, labeled filters/icon-owned Add Position and a shared selected-school summary/action row containing semantic compact icon-bearing summary chips plus Export/View History actions, validation worklist chip drilldown, mockup colon labels, icon-bearing overview cards, icon-bearing classroom priority chip, custom always-scrollable classroom list rows with status dots and chevrons, icon-only classroom list filter dialog for status/permit/open-days filters, classroom list footer count, vertically scrollable classroom detail area with refresh-synced scroll range, page-wide per-pixel Qt scroll behavior for Staffing v2 lists/tables/text edits/scroll areas, position table with explicit row-number column, normalized date/program display, icon-bearing status and permit chips plus menu-style row actions including mistaken-position deletion for unassigned positions, icon-bearing dashed Add Position drop zone, director-interview pending/completed section for new hire/borderline referrals with first-interview score visibility, visible pending-candidate checkbox controls plus no-modifier multi-row selection for multi-delete, school-selector-synced pending/completed director interview lists, shortened wrapped pending-table headers, compact fixed pending-table column spacing with full-value cell tooltips, fully visible Record Interview action buttons, and hire-only proposed shift/classroom capture that hides those fields when director decision is No-Hire, status key, service-backed Add Position dialog with first-class Director position type and icon-only close, filtered Export read-only preview dialog, shared overlay side-panel template with top-aligned viewport-width-clamped scrollable body and fixed footer plus shared compact detail-card builder, Classroom Management sub-dashboard with icon-owned Add Classroom header action, service-backed Add Classroom dialog, Export read-only filtered-classrooms preview dialog, pagination footer, readable fixed-width table columns with status/active chips, icon-bearing compact detail/metric/health cards, row View detail selection, always-visible-scrollbar classroom detail overlay with pinned Save Changes/Deactivate controls, and an overlay side filter drawer with draft-only controls and active-count badges, Staffing Validation sub-dashboard with metric cards, active-state issue severity tabs, lifecycle/permit/date worklist issues, pagination footer, icon-bearing export/filter/search/table-row/detail-footer actions, row View drawer navigation, Run Full Validation refresh action, Export Validation Report read-only filtered-issues preview dialog, View Validation Rules read-only dialog, and icon-bearing overlay filter/right-panel controls, read-only position detail overlay drawer with icon-only close, normalized date/program display, icon-bearing action buttons including Delete Position for unassigned positions, icon-bearing related-person placeholder action, and icon-bearing footer actions, v2 Mark Coming / Mark Filled dialogs with Director role preservation, icon-only close, and icon-bearing footer actions, v2 Manage Filled chooser with icon-only close, v2 Update Permit dialog with icon-only close, v2 Mark Need Now dialog with icon-only close, v2 Delete Position confirmation dialog, People / Employee Management sub-dashboard with icon-owned Add Person action text, Director role filtering/addition, active-state detail tabs, pagination footer, icon-bearing header/filter/search/table-row/detail/footer actions, row View detail selection, service-backed Add Person dialog, and icon-bearing overlay detail/filter controls with compact reusable cards, full Staffing v2 Notifications dashboard with editable free-form events, filters, sorting, list/grid toggle, recipient chips, template variables, preview, test send, validation, sanitized audit errors, scheduled counts, save/cancel/delete backed by NotificationStore and NotificationService, and Assignment History sub-dashboard with icon-bearing header/date-range/table-row/detail-footer actions, View Validation navigation, View Assignment drawer navigation, Open Employee navigation, header Export read-only filtered-records preview dialog, Export Record read-only preview dialog, pagination footer, overlay detail panel with compact reusable cards, a neutral assignment-ID detail chip, icon-bearing lifecycle event rows, and validation checklist rows while the legacy Staffing page remains available.
functions:
- name: configure_v2_scroll_areas
  description: Apply shared v2 per-pixel wheel scrolling, root/global-position,
    child-widget, and item-view viewport wheel relay, ignored size-adjust policy,
    and practical scrollbar step/page values to all QAbstractScrollArea descendants
    under a supplied PySide widget root.
  locked: false
  inputs:
    QtWidgets:
      type: Any
      required: true
    root:
      type: QWidget
      required: true
    QtCore:
      type: Any | None
      required: false
      default: null
  returns:
    type: None
  exceptions: []
  side_effects: Updates scroll behavior for descendant scroll areas and item views, and when QtCore is supplied installs retained child-widget relays plus a reusable QApplication-level wheel router that sends top-window wheel events to the native scroll viewport under the cursor.
- name: _install_v2_application_wheel_router
  description: Install one retained QApplication-level Staffing v2 wheel router for a supplied widget root so wheel events delivered to the top-level app/window still scroll the native scroll viewport under the cursor.
  locked: false
  inputs:
    QtCore:
      type: Any
      required: true
    QtWidgets:
      type: Any
      required: true
    root:
      type: QWidget
      required: true
  returns:
    type: None
  exceptions: []
  side_effects: Stores the router on QApplication and the supplied root, installs it as an application event filter, and leaves unrelated app areas alone unless the event global position is inside the root.
- name: _install_v2_wheel_relay
  description: Install one retained wheel-event relay per scroll area for the supplied root, QScrollArea content widgets, item-view viewports, and their child widgets, skipping already-wired target/scroll-area pairs.
  locked: false
  inputs:
    QtCore:
      type: Any
      required: true
    QtWidgets:
      type: Any
      required: true
    root:
      type: QWidget
      required: true
    scroll_area:
      type: QAbstractScrollArea
      required: true
  returns:
    type: None
  exceptions: []
  side_effects: Stores relay filters on the supplied root and installs event filters on eligible root, content, viewport, and child widgets so wheel movement scrolls the owning QAbstractScrollArea while still allowing nested scroll areas to handle their own range first.
- name: _v2_scroll_area_viewport_area
  description: Return the viewport area for a scroll area so nested native scroll surfaces can be tried from smallest/deepest to largest/parent.
  locked: false
  inputs:
    scroll_area:
      type: QAbstractScrollArea
      required: true
  returns:
    type: int
  exceptions: []
  side_effects: none
- name: _v2_wheel_global_position
  description: Return a QPoint global cursor position from either Qt6 globalPosition or older globalPos wheel-event APIs.
  locked: false
  inputs:
    event:
      type: QWheelEvent
      required: true
  returns:
    type: QPoint
  exceptions: []
  side_effects: none
- name: _scroll_v2_area_from_wheel
  description: Apply one wheel event delta to a scroll area's vertical scrollbar, accepting the event only when the scrollbar moves.
  locked: false
  inputs:
    scroll_area:
      type: QAbstractScrollArea
      required: true
    event:
      type: QWheelEvent
      required: true
  returns:
    type: bool
  exceptions: []
  side_effects: Moves the supplied scroll area's vertical scrollbar and accepts the wheel event only after a successful movement.
