module:
  name: generate_director_staffing_launchers
  language: python
  path: tools/generate_director_staffing_launchers.py
  version: 1.2.0
  description: Generates one director staffing Windows .bat compatibility wrapper and one no-console .vbs launcher per school in config/staffing_seed.json, with each hidden launcher using the minimal director staffing setup path and passing its school as the director filter.
functions:
- name: load_staffing_schools
  description: Read staffing_seed.json and return ordered school names.
  locked: false
  inputs:
    seed_path:
      type: Path
      required: false
      default: DEFAULT_SEED_PATH
  returns:
    type: list[str]
  exceptions:
  - OSError
  - JSONDecodeError
  - ValueError
  side_effects: reads staffing seed JSON
- name: director_launcher_filename
  description: Build a Windows-safe director launcher filename for one school.
  locked: false
  inputs:
    school:
      type: str
      required: true
  returns:
    type: str
  exceptions:
  - ValueError
  side_effects: none
- name: director_vbs_launcher_filename
  description: Build a Windows-safe no-console VBScript director launcher filename for one school.
  locked: false
  inputs:
    school:
      type: str
      required: true
  returns:
    type: str
  exceptions:
  - ValueError
  side_effects: none
- name: director_launcher_body
  description: Build the .bat compatibility-wrapper body for one school-specific director staffing dashboard.
  locked: false
  inputs:
    school:
      type: str
      required: true
  returns:
    type: str
  exceptions: []
  side_effects: none
- name: director_vbs_launcher_body
  description: Build the no-console .vbs launcher body that starts setup_director_staffing.ps1 through hidden PowerShell for one school-specific director staffing dashboard.
  locked: false
  inputs:
    school:
      type: str
      required: true
  returns:
    type: str
  exceptions: []
  side_effects: none
- name: generate_director_launchers
  description: Create or update school-specific director staffing .bat compatibility wrappers and .vbs no-console launchers under the repository root.
  locked: false
  inputs:
    root:
      type: Path
      required: false
      default: ROOT
    seed_path:
      type: Path
      required: false
      default: DEFAULT_SEED_PATH
  returns:
    type: list[Path]
  exceptions:
  - OSError
  - JSONDecodeError
  - ValueError
  side_effects: writes one .bat file and one .vbs file per staffing seed school
- name: main
  description: CLI entry point for regenerating director staffing .bat and .vbs launchers from the current staffing seed.
  locked: false
  inputs: {}
  returns:
    type: int
  exceptions:
  - OSError
  - JSONDecodeError
  - ValueError
  side_effects: writes one .bat file and one .vbs file per staffing seed school
classes: []
data_structures: []
dependencies: []
