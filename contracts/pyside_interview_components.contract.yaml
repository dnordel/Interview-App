module:
  name: pyside_interview_components
  language: python
  path: src/pyside_interview_components.py
  version: 1.1.0
  description: Shared toolkit-injected candidate identity/contact and qualification editors plus glyph-safe identity and responsive two-column helpers used by interview and offer flows.
functions:
- name: build_candidate_identity
  description: Build a consistently named candidate identity block from safe display strings.
  locked: false
  inputs:
    QtWidgets: {type: Any, required: true}
    candidate_name: {type: str, required: true}
    school: {type: str, required: true}
    position: {type: str, required: true}
    interview_type: {type: str, required: false, default: ''}
    object_prefix: {type: str, required: true}
  returns: {type: Any}
  exceptions: []
  side_effects: Creates Qt widgets without reading or writing candidate records.
classes:
- name: CandidateIdentityEditor
  description: Reusable candidate identity editor with configurable school/position choices, optional contact fields, canonical email validation, and optional phone normalization.
  locked: false
  attributes:
    widget: {type: QWidget}
    candidate_name: {type: QLineEdit}
    honorific: {type: QComboBox}
    school: {type: QComboBox}
    position: {type: QComboBox}
    email: {type: 'QLineEdit | None'}
    phone: {type: 'QLineEdit | None'}
  methods:
  - name: set_values
    inputs:
      values: {type: 'dict[str, Any]', required: true}
    returns: {type: None}
    exceptions: []
    side_effects: Updates editor widgets without persisting candidate data.
  - name: validated_values
    inputs: {}
    returns: {type: 'dict[str, str]'}
    exceptions: [ValueError]
    side_effects: none
- name: CandidateQualificationEditor
  description: Reusable structured education and experience editor backed by canonical candidate qualification validation.
  locked: false
  attributes:
    widget: {type: QWidget}
    has_degree: {type: QComboBox}
    degree_type: {type: QComboBox}
    degree_in_ece: {type: QCheckBox}
    ece_units: {type: QLineEdit}
    infant_toddler: {type: QCheckBox}
    total_units: {type: QLineEdit}
    years_experience: {type: QLineEdit}
  methods:
  - name: set_values
    inputs:
      values: {type: 'dict[str, Any]', required: true}
    returns: {type: None}
    exceptions: []
    side_effects: Updates editor widgets without persisting qualification data.
  - name: validated_values
    inputs: {}
    returns: {type: 'dict[str, Any]'}
    exceptions: [ValueError]
    side_effects: none
- name: AdaptiveTwoColumn
  description: Reusable two-panel Qt container that switches between weighted columns and vertical narrow layout.
  locked: false
  attributes: {}
  methods:
  - name: set_narrow
    description: Apply desktop columns or equal-width vertical stacking.
    locked: false
    inputs:
      narrow: {type: bool, required: true}
    returns: {type: None}
    exceptions: []
    side_effects: Changes Qt layout direction, stretches, and style state.
data_structures: []
dependencies:
- module: PySide6
- module: hiring_pipeline
- module: scoring_reporting
