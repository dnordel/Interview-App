module:
  name: backfill_interview_ml_dataset
  language: python
  path: tools/backfill_interview_ml_dataset.py
  version: 1.0.0
  description: Backfill the derived interview ML dataset from finalized history,
    existing DeepSeek job artifacts, and interview-notes DOCX transcript recovery
    without invoking DeepSeek for old interviews.
functions:
- name: recover_flow_transcript_from_docx
  description: Try to recover candidate transcript text from matching interview
    notes DOCX files, splitting by question headings when possible and otherwise
    returning one recovered transcript row.
  locked: false
  inputs:
    row:
      type: dict[str, Any]
      required: true
    notes_dirs:
      type: list[Path]
      required: true
  returns:
    type: tuple[list[dict[str, Any]], Path | None]
  exceptions: []
  side_effects: Reads local DOCX files only.
- name: backfill_ml_dataset
  description: Import history rows into interview_ml_dataset.sqlite3, enrich from
    existing DeepSeek jobs when present, recover missing transcript text from DOCX
    notes when possible, write pending-AI backlog rows, and export CSV/JSONL files;
    never starts or calls DeepSeek.
  locked: false
  inputs:
    history_path:
      type: Path
      required: true
    ml_path:
      type: Path | None
      required: false
      default: null
    base_dir:
      type: Path | None
      required: false
      default: null
    notes_dirs:
      type: list[Path] | None
      required: false
      default: null
    export_dir:
      type: Path | None
      required: false
      default: null
  returns:
    type: dict[str, Any]
  exceptions: []
  side_effects: Writes interview_ml_dataset.sqlite3 and export files.
- name: main
  description: CLI entrypoint for backfilling the interview ML dataset.
  locked: false
  inputs:
    argv:
      type: list[str] | None
      required: false
      default: null
  returns:
    type: int
  exceptions: []
  side_effects: Parses CLI arguments, writes the ML DB and exports, and prints a JSON summary.
classes: []
data_structures: []
dependencies:
- data_store
- platform_services
- python-docx
