- name: TITLE_OPTIONS
  description: Supported candidate honorific options.
- name: DEFAULT_CANDIDATE_TITLE
  description: Default candidate honorific used for unsupported input.
- name: CANONICAL_DEGREE_TYPES
  description: Supported normalized degree abbreviations.
