module:
  name: scoring_reporting
  language: python
  path: src/scoring_reporting.py
  version: 3.1.0
  description: Flattened public interface for human scoring, reporting, trait signals,
    exports, referrals, email safety, offers, and templates; only active legacy adapters remain in the compatibility module
    inventory.
functions:
- name: normalize_candidate_title
  description: Normalize an arbitrary title-like value to one of the supported candidate
    honorifics.
  locked: false
  inputs:
    value:
      type: Any
      required: true
  returns:
    type: str
  exceptions: []
  side_effects: none
- name: normalize_degree_type
  description: Normalize degree type to supported canonical abbreviations.
  locked: false
  inputs:
    value:
      type: Any
      required: true
  returns:
    type: str
  exceptions: []
  side_effects: none
- name: coerce_non_negative_int
  description: Coerce integer-like values to non-negative integers.
  locked: false
  inputs:
    value:
      type: Any
      required: true
  returns:
    type: int | None
  exceptions: []
  side_effects: none
- name: coerce_non_negative_decimal
  description: Coerce values to finite non-negative Decimal unit counts with at most two decimal places.
  locked: false
  inputs:
    value:
      type: Any
      required: true
  returns:
    type: Decimal | None
  exceptions: []
  side_effects: none
- name: validate_candidate_qualification
  description: Validate and normalize candidate education and experience; a reported degree waives total-unit entry, and a degree in ECE/CD also waives ECE/CD-unit entry.
  locked: false
  inputs:
    has_degree_raw:
      type: str
      required: true
    degree_type_raw:
      type: str
      required: true
    degree_in_ece:
      type: bool
      required: true
    ece_units_raw:
      type: str
      required: true
    total_units_raw:
      type: str
      required: true
    infant_toddler_class_completed:
      type: bool
      required: true
    years_experience_raw:
      type: str
      required: true
  returns:
    type: tuple[bool, str, CandidateQualification]
  exceptions: []
  side_effects: none
- name: parse_yes_no
  description: Parse yes/no string values into a tri-state boolean.
  locked: false
  inputs:
    value:
      type: str
      required: true
  returns:
    type: bool | None
  exceptions: []
  side_effects: none
- name: sanitize_email_subject
  description: Normalize and trim an email subject line to a safe header value.
  locked: false
  inputs:
    subject:
      type: str
      required: true
  returns:
    type: str
  exceptions: []
  side_effects: none
- name: is_valid_email_address
  description: Validate email address format using project policy.
  locked: false
  inputs:
    value:
      type: str
      required: true
  returns:
    type: bool
  exceptions: []
  side_effects: none
- name: sender_email_error_reason
  description: Return policy reason code for rejected sender addresses.
  locked: false
  inputs:
    value:
      type: str
      required: true
  returns:
    type: str | None
  exceptions: []
  side_effects: none
- name: normalize_referral_packet
  description: Normalize referral packet values to stripped strings and backfill canonical
    interview_notes_document_path from legacy fields when absent.
  locked: false
  inputs:
    packet:
      type: dict[str, str] | None
      required: true
  returns:
    type: dict[str, str]
  exceptions: []
  side_effects: none
- name: missing_required_docs
  description: Return ordered labels for required referral packet documents that are
    missing after normalization.
  locked: false
  inputs:
    packet:
      type: dict[str, str] | None
      required: true
  returns:
    type: list[str]
  exceptions: []
  side_effects: none
- name: validate_referral_packet
  description: Validate that required referral packet document fields are populated
    and return (is_valid, missing_labels).
  locked: false
  inputs:
    packet:
      type: dict[str, str] | None
      required: true
  returns:
    type: tuple[bool, list[str]]
  exceptions: []
  side_effects: none
- name: is_supported_document_path
  description: Check whether a document path suffix is an allowed extension.
  locked: false
  inputs:
    path_text:
      type: str
      required: true
  returns:
    type: bool
  exceptions: []
  side_effects: none
- name: available_modules
  description: Return remaining legacy scoring/reporting modules still exposed through
    this flattened facade.
  locked: false
  inputs: {}
  returns:
    type: tuple[str, ...]
  exceptions: []
  side_effects: none
- name: load_compat_module
  description: Import a remaining legacy module that belongs to the scoring/reporting
    facade.
  locked: false
  inputs:
    module_name:
      type: str
      required: true
  returns:
    type: ModuleType
  exceptions:
  - AttributeError
  side_effects: Imports the requested module.
- name: module_ownership
  description: Return the ownership map from each remaining legacy scoring/reporting
    module to the flattened scoring_reporting module.
  locked: false
  inputs: {}
  returns:
    type: dict[str, str]
  exceptions: []
  side_effects: none
- name: wrapper_policy
  description: Return the compatibility wrapper policy for remaining legacy scoring/reporting
    modules during flattening cleanup.
  locked: false
  inputs: {}
  returns:
    type: str
  exceptions: []
  side_effects: none
- name: public_symbols
  description: Return public symbols exposed by one remaining legacy scoring/reporting
    module or by all remaining scoring/reporting modules.
  locked: false
  inputs:
    module_name:
      type: str | None
      required: false
      default: None
  returns:
    type: tuple[str, ...]
  exceptions:
  - AttributeError
  side_effects: Imports remaining scoring/reporting compatibility modules.
- name: resolve_compat_symbol
  description: Resolve a public symbol from the remaining legacy modules owned by
    this facade.
  locked: false
  inputs:
    symbol_name:
      type: str
      required: true
  returns:
    type: Any
  exceptions:
  - AttributeError
  side_effects: Imports legacy modules until the symbol is found.
- name: placeholder_meta_for_context
  description: Return placeholder metadata available for a template context.
  locked: false
  inputs:
    context:
      type: str
      required: true
  returns:
    type: list[PlaceholderMeta]
  exceptions: []
  side_effects: none
- name: token_to_key
  description: Convert placeholder token into canonical placeholder key.
  locked: false
  inputs:
    token:
      type: str
      required: true
  returns:
    type: str
  exceptions: []
  side_effects: none
- name: _match_key
  description: Extract placeholder key from regex match object.
  locked: false
  inputs:
    match:
      type: re.Match[str]
      required: true
  returns:
    type: str
  exceptions: []
  side_effects: none
- name: extract_placeholders
  description: Parse placeholder tokens from free-text template content.
  locked: false
  inputs:
    text:
      type: str
      required: true
  returns:
    type: set[str]
  exceptions: []
  side_effects: none
- name: missing_placeholder_keys
  description: Return placeholders that are required but missing from values.
  locked: false
  inputs:
    text:
      type: str
      required: true
    values:
      type: dict[str, object]
      required: true
    context:
      type: str
      required: true
  returns:
    type: list[str]
  exceptions: []
  side_effects: none
- name: find_unknown_placeholders
  description: Return unknown placeholders relative to context definitions.
  locked: false
  inputs:
    text:
      type: str
      required: true
    context:
      type: str
      required: true
  returns:
    type: set[str]
  exceptions: []
  side_effects: none
- name: validate_template_map
  description: Validate templates and return missing/unknown placeholder diagnostics.
  locked: false
  inputs:
    templates:
      type: dict[str, str]
      required: true
    context_by_key:
      type: dict[str, str]
      required: true
  returns:
    type: dict[str, set[str]]
  exceptions: []
  side_effects: none
- name: render_template
  description: Render placeholders from values using unknown placeholder policy.
  locked: false
  inputs:
    template:
      type: str
      required: true
    values:
      type: dict[str, object]
      required: true
    context:
      type: str | None
      required: false
      default: null
    unknown_policy:
      type: str
      required: false
      default: leave
  returns:
    type: str
  exceptions:
  - ValueError
  side_effects: none
- name: insert_token_into_widget
  description: Insert token text into a widget-like object that exposes insert.
  locked: false
  inputs:
    widget:
      type: Any
      required: true
    token:
      type: str
      required: true
  returns:
    type: bool
  exceptions: []
  side_effects: Mutates widget text content.
- name: build_mailto_url
  description: Builds a sanitized mailto URL for fallback email draft flows.
  locked: false
  inputs:
    subject:
      type: str
      required: true
    body:
      type: str
      required: true
    to_recipients:
      type: str
      required: false
      default: ''
  returns:
    type: str
  exceptions: []
  side_effects: none
- name: _normalize_mailto_recipients
  description: Normalize and URL-encode mailto recipient lists while preserving comma
    or semicolon separator style.
  locked: false
  inputs:
    to_recipients:
      type: str
      required: true
  returns:
    type: str
  exceptions: []
  side_effects: none
- name: _allowed_referral_hosts_from_env
  description: Load allowed director referral endpoint hosts from environment configuration.
  locked: false
  inputs: {}
  returns:
    type: set[str]
  exceptions: []
  side_effects: Reads environment variables.
- name: _validate_referral_endpoint
  description: Validate that director referral endpoint uses HTTPS and an allowed
    host when configured.
  locked: false
  inputs:
    endpoint:
      type: str
      required: true
    allowed_hosts:
      type: set[str] | None
      required: false
      default: null
  returns:
    type: str
  exceptions:
  - DirectorReferralError
  side_effects: Reads environment variables when allowed_hosts is not supplied.
- name: build_director_packet
  description: Build the director referral packet from finalized interview payload,
    scoring, report, integration export, and referral documents.
  locked: false
  inputs:
    payload:
      type: dict[str, Any]
      required: true
    scoring:
      type: dict[str, Any]
      required: true
    report_path:
      type: Path
      required: true
    integration_path:
      type: Path
      required: true
    referral_packet:
      type: dict[str, str]
      required: true
    generated_transcript_path:
      type: Path | None
      required: false
      default: null
      description: '[DEPRECATED] Optional legacy transcript-only path. New finalize
        flow passes null and uses interview_notes_document_path/final report.'
  returns:
    type: dict[str, Any]
  exceptions: []
  side_effects: none
- name: send_director_packet
  description: POST a director referral packet to a validated HTTPS endpoint.
  locked: false
  inputs:
    packet:
      type: dict[str, Any]
      required: true
    endpoint:
      type: str
      required: true
    timeout_seconds:
      type: int
      required: false
      default: 12
    allowed_hosts:
      type: set[str] | None
      required: false
      default: null
  returns:
    type: dict[str, Any]
  exceptions:
  - DirectorReferralError
  side_effects: Sends an HTTPS request to the configured referral endpoint.
- name: append_communication_log
  description: Append a director referral communication event as JSONL under the base
    communications directory.
  locked: false
  inputs:
    base_dir:
      type: Path
      required: true
    event:
      type: dict[str, Any]
      required: true
    candidate_name:
      type: str
      required: true
  returns:
    type: Path
  exceptions:
  - OSError
  side_effects: Creates directories and appends a JSONL communication log entry.
- name: normalize_outcome_label
  description: Normalize scoring outcome labels for downstream integrations.
  locked: false
  inputs:
    outcome:
      type: Any
      required: true
  returns:
    type: str
  exceptions: []
  side_effects: none
- name: build_integration_payload
  description: Build normalized integration payload from interview payload and scoring,
    preserving generated executive summary, interview highlights, answer summaries,
    and summary status metadata when present while excluding live-only introduction
    answers and transcript slices.
  locked: false
  inputs:
    payload:
      type: dict[str, Any]
      required: true
    scoring:
      type: dict[str, Any]
      required: true
    include_flow_slices:
      type: bool
      required: false
      default: true
  returns:
    type: dict[str, Any]
  exceptions: []
  side_effects: none
- name: serialize_integration_payload
  description: Serialize integration payload to JSON under integration exports directory.
  locked: false
  inputs:
    base_output_dir:
      type: Path
      required: true
    export_payload:
      type: dict[str, Any]
      required: true
    candidate_name:
      type: str
      required: true
  returns:
    type: Path
  exceptions:
  - ValueError
  - OSError
  side_effects: Creates directories/files and writes JSON payload to disk.
- name: _trait_note
  description: Build trait-note slice used in integration payload.
  locked: false
  inputs:
    row:
      type: dict[str, Any]
      required: true
  returns:
    type: dict[str, Any]
  exceptions: []
  side_effects: none
- name: _flow_slices
  description: Build filtered non-introduction flow transcript slices with candidate transcript text.
  locked: false
  inputs:
    flow_transcript:
      type: list[dict[str, Any]]
      required: true
  returns:
    type: list[dict[str, Any]]
  exceptions: []
  side_effects: none
- name: build_school_offer_filename
  description: Build a safe school-branded offer filename using the candidate full name.
  locked: false
  inputs:
    school:
      type: str
      required: true
    candidate_full_name:
      type: str
      required: true
  returns:
    type: str
  exceptions:
  - ValueError
  side_effects: none
- name: next_available_offer_path
  description: Return the first unused DOCX output path, adding a numeric revision suffix when needed.
  locked: false
  inputs:
    output_dir:
      type: Path
      required: true
    filename:
      type: str
      required: true
  returns:
    type: Path
  exceptions:
  - ValueError
  side_effects: Reads candidate output-path existence without writing.
- name: parse_clock_12h
  description: Parse a 12-hour clock string into a datetime object.
  locked: false
  inputs:
    value:
      type: str
      required: true
  returns:
    type: datetime
  exceptions:
  - ValueError
  side_effects: none
- name: derive_offer_schedule
  description: Derive gross, lunch-adjusted daily, five-day weekly hours, and full/part-time classification from same-day 12-hour shift values.
  locked: false
  inputs:
    start_time_12h: {type: str, required: true}
    end_time_12h: {type: str, required: true}
  returns: {type: OfferSchedule}
  exceptions: [ValueError]
  side_effects: none
- name: build_approval_offer_input
  description: Convert immutable director offer terms into approval-time template input while preserving honorific and fractional weekly-hour precision and defaulting a missing honorific to Ms.
  locked: false
  inputs:
    first_name: {type: str, required: true}
    last_name: {type: str, required: true}
    city: {type: str, required: true}
    position: {type: str, required: true}
    approval_date: {type: date, required: true}
    terms: {type: 'dict[str, Any]', required: true}
  returns: {type: OfferInput}
  exceptions: [ValueError, TypeError]
  side_effects: none
- name: parse_requested_hourly_pay
  description: Parse one unambiguous hourly dollar amount while returning null for ranges, multiple values, missing values, or unsafe amounts.
  locked: false
  inputs:
    value: {type: str, required: true}
  returns: {type: 'Decimal | None'}
  exceptions: []
  side_effects: none
- name: build_signal_dictionary_index
  description: Index signal-dictionary entries by runtime signal id for category-aware
    normalization.
  locked: false
  inputs:
    signal_dictionary:
      type: dict[str, Any]
      required: true
  returns:
    type: dict[str, dict[str, Any]]
  exceptions: []
  side_effects: none
- name: normalize_trait_signal
  description: Normalize one trait signal from either the legacy ref/weight schema
    or the runtime id/base_weight schema.
  locked: false
  inputs:
    signal:
      type: dict[str, Any]
      required: true
    default_group_label:
      type: str
      required: true
  returns:
    type: CanonicalSignal
  exceptions: []
  side_effects: none
- name: resolve_trait_signal_selection_id
  description: Resolve the UI-facing selection identifier for a trait signal by preferring
    legacy refs, then mapped shared-signal aliases, then the runtime signal id.
  locked: false
  inputs:
    signal:
      type: dict[str, Any]
      required: true
  returns:
    type: str
  exceptions: []
  side_effects: none
- name: resolve_trait_signal_runtime_id
  description: Resolve the runtime signal id used by the scoring engine for a trait
    signal record.
  locked: false
  inputs:
    signal:
      type: dict[str, Any]
      required: true
  returns:
    type: str
  exceptions: []
  side_effects: none
- name: signal_selection_aliases
  description: Return every accepted selection alias for a trait signal, including
    its runtime signal id and any shared-signal maps_to aliases.
  locked: false
  inputs:
    signal:
      type: dict[str, Any]
      required: true
  returns:
    type: list[str]
  exceptions: []
  side_effects: none
- name: resolve_trait_signal_label
  description: Resolve the display label for a trait signal with a fallback value.
  locked: false
  inputs:
    signal:
      type: dict[str, Any]
      required: true
    fallback:
      type: str
      required: false
      default: ''
  returns:
    type: str
  exceptions: []
  side_effects: none
- name: resolve_trait_signal_weight
  description: Resolve the numeric weight for a trait signal across weight, base_weight,
    and default_weight fields, treating the AUTO_NO_HIRE sentinel as zero-weight
    advisory metadata.
  locked: false
  inputs:
    signal:
      type: dict[str, Any]
      required: true
  returns:
    type: float
  exceptions: []
  side_effects: none
- name: normalize_core_signals
  description: Normalize core trait signals into the canonical UI/adapter signal shape.
  locked: false
  inputs:
    core_signals:
      type: list[dict[str, Any]]
      required: true
  returns:
    type: list[CanonicalSignal]
  exceptions: []
  side_effects: none
- name: normalize_extended_signal_groups
  description: Normalize explicit extended groups or runtime extended_signals into
    canonical grouped signal metadata.
  locked: false
  inputs:
    trait_definition:
      type: dict[str, Any]
      required: true
    signal_dictionary_index:
      type: dict[str, dict[str, Any]] | None
      required: false
      default: null
  returns:
    type: list[CanonicalSignalGroup]
  exceptions: []
  side_effects: none
- name: iter_trait_schema_signals
  description: Flatten trait signals across core_signals, extended_signal_groups,
    and extended_signals schemas.
  locked: false
  inputs:
    trait_definition:
      type: dict[str, Any]
      required: true
  returns:
    type: list[dict[str, Any]]
  exceptions: []
  side_effects: none
- name: load_trait_definitions_from_runtime_bundle
  description: Resolve runtime trait definitions, preferring bundled weighted trait
    payloads before legacy resolved trait-directory paths or runtime contract paths.
  locked: false
  inputs:
    runtime_bundle:
      type: dict[str, Any]
      required: true
  returns:
    type: list[TraitDefinition]
  exceptions: []
  side_effects: May read configured runtime trait-definition JSON files from disk.
- name: load_trait_definitions_from_contract
  description: Resolve runtime trait definitions from the traits directory configured
    by the runtime scoring contract.
  locked: false
  inputs:
    runtime_contract_path:
      type: str | Path
      required: true
  returns:
    type: list[TraitDefinition]
  exceptions: []
  side_effects: Reads the runtime contract YAML and configured trait-definition JSON
    files from disk.
- name: load_trait_definitions_from_dir
  description: Load trait definitions from a directory of runtime T*.json trait-definition
    files.
  locked: false
  inputs:
    traits_dir:
      type: str | Path
      required: true
  returns:
    type: list[TraitDefinition]
  exceptions: []
  side_effects: Reads runtime trait-definition JSON files from disk.
- name: canonical_trait_id
  description: Normalize rubric-style and legacy runtime trait identifiers into the
    canonical rubric trait_<number> format.
  locked: false
  inputs:
    trait_id:
      type: Any
      required: true
  returns:
    type: str
  exceptions: []
  side_effects: none
- name: trait_id_aliases
  description: Return canonical and legacy aliases for a trait identifier while preserving
    deterministic order.
  locked: false
  inputs:
    trait_id:
      type: Any
      required: true
  returns:
    type: list[str]
  exceptions: []
  side_effects: none
- name: _resolve_traits_dir_from_bundle
  description: Resolve the traits directory from runtime bundle resolved-path metadata
    when available.
  locked: false
  inputs:
    runtime_bundle:
      type: dict[str, Any]
      required: true
  returns:
    type: Path | None
  exceptions: []
  side_effects: none
- name: _resolve_traits_dir_from_contract_payload
  description: Resolve the traits directory from a runtime contract payload and contract
    path.
  locked: false
  inputs:
    contract_payload:
      type: dict[str, Any]
      required: true
    runtime_contract_path:
      type: str | Path
      required: true
  returns:
    type: Path
  exceptions: []
  side_effects: none
- name: _load_json
  description: Load a JSON object from disk and coerce non-mapping payloads to an
    empty mapping.
  locked: false
  inputs:
    path:
      type: Path
      required: true
  returns:
    type: dict[str, Any]
  exceptions: []
  side_effects: Reads JSON files from disk.
- name: _load_yaml
  description: Load a YAML object from disk and coerce non-mapping payloads to an
    empty mapping.
  locked: false
  inputs:
    path:
      type: Path
      required: true
  returns:
    type: dict[str, Any]
  exceptions: []
  side_effects: Reads YAML files from disk.
- name: default_signal_ui_definition
  description: Return the explicit contract-aligned default trait signal UI metadata
    used when runtime config is missing or trait definitions cannot be resolved.
  locked: false
  inputs:
    trait_id:
      type: str
      required: true
  returns:
    type: SignalUIDefinition
  exceptions: []
  side_effects: none
- name: load_trait_signal_ui_definition
  description: Load runtime-backed signal rendering metadata for a scored trait screen
    using the adapter-resolved trait-definition JSON source.
  locked: false
  inputs:
    trait_id:
      type: str
      required: true
    engine_module_contract_path:
      type: str | Path
      required: false
      default: contracts/trait_based_scoring_engine.contract.yaml
    engine_runtime_contract_path:
      type: str | Path
      required: false
      default: Trait-Based Scoring/trait_based_scoring_contract.yaml
  returns:
    type: SignalUIDefinition
  exceptions:
  - ReportingValidationError
  side_effects: Reads scoring runtime bundle assets from disk.
- name: ensure_trait_signal_ui_definition
  description: Load runtime-backed signal rendering metadata and raise a configuration
    error when a scored rubric trait has no runtime signal definition.
  locked: false
  inputs:
    trait_id:
      type: str
      required: true
    engine_module_contract_path:
      type: str | Path
      required: false
      default: contracts/trait_based_scoring_engine.contract.yaml
    engine_runtime_contract_path:
      type: str | Path
      required: false
      default: Trait-Based Scoring/trait_based_scoring_contract.yaml
  returns:
    type: SignalUIDefinition
  exceptions:
  - ReportingValidationError
  side_effects: Reads scoring runtime bundle assets from disk.
- name: normalize_trait_signal_selection_state
  description: Normalize legacy trait signal-selection compatibility variants into
    canonical selected_signal_ids filtered to the trait runtime definition.
  locked: false
  inputs:
    trait_state:
      type: dict[str, Any] | None
      required: true
    valid_signal_ids:
      type: list[str]
      required: true
  returns:
    type: list[str]
  exceptions: []
  side_effects: none
- name: write_canonical_selected_signal_ids
  description: Persist canonical selected_signal_ids to trait state while removing
    legacy compatibility fields.
  locked: false
  inputs:
    trait_state:
      type: dict[str, Any]
      required: true
    selected_signal_ids:
      type: list[str]
      required: true
  returns:
    type: None
  exceptions: []
