  description: Required referral packet keys and labels.
- name: OPTIONAL_PACKET_DOCS
  description: Optional/deprecated referral packet keys retained for compatibility.
- name: ALL_PACKET_DOCS
  description: Ordered union of required and optional packet keys.
- name: ALLOWED_DOC_EXTENSIONS
  description: Allowed file suffixes for manually selected referral documents.
- name: POSITION_OPTIONS
  description: Supported offer-letter position labels.
- name: DEFAULT_EXTENDED_GROUP_LABEL
  description: Default label used for runtime extended trait signals without an explicit
    category.
- name: CanonicalSignal
  description: Canonical in-memory signal shape shared by trait UI and adapter consumers.
- name: CanonicalSignalGroup
  description: Canonical grouped signal collection for extended trait UI rendering.
- name: CANONICAL_SIGNAL_COMPARISON_KEYS
  description: Stable canonical signal fields used for equality comparison.
- name: DEFAULT_ENGINE_RUNTIME_CONTRACT
  description: Default runtime contract path for trait-based scoring assets.
- name: RUBRIC_TRAIT_ID_PATTERN
  description: Regex pattern matching canonical rubric trait ids.
- name: RUNTIME_TRAIT_ID_PATTERN
  description: Regex pattern matching legacy runtime trait ids.
- name: TraitDefinition
  description: Runtime trait definition loaded from a configured trait JSON file.
- name: SignalUIDefinition
  description: Signal rendering metadata returned for one scored trait.
- name: DEFAULT_CORE_DISPLAY_STYLE
  description: Default display style for core trait signals.
- name: DEFAULT_EXTENDED_DISPLAY_STYLE
  description: Default display style for extended trait signals.
- name: DEFAULT_CORE_SECTION_LABEL
  description: Default UI section label for core trait signals.
- name: DEFAULT_EXTENDED_SECTION_LABEL
  description: Default UI section label for extended trait signals.
- name: DEFAULT_EXTENDED_COLLAPSIBLE
  description: Default setting for whether extended trait signal sections are collapsible.
- name: DEFAULT_EXTENDED_DEFAULT_COLLAPSED
  description: Default setting for whether extended trait signal sections start collapsed.
- name: TRAIT_SELECTION_FIELDS
  description: Accepted legacy trait signal-selection field names in priority order.
- name: SELECTION_COLLECTION_TYPES
  description: Accepted list-like collection types for legacy trait signal selections.
- name: VALID_RAW_SCORES
  description: Accepted interviewer raw score values.
- name: CANONICAL_TRAIT_STATE_SCHEMA_VERSION
  description: Schema version for normalized trait-state payloads.
- name: OUTPUT_SCHEMA_VERSION
  description: Schema version for normalized trait scoring output payloads.
- name: DECISION_LABELS
  description: Runtime scoring decision labels mapped to reporting outcome labels.
- name: NormalizedTraitState
  description: Canonical normalized trait-state object used for trait scoring.
- name: RuntimeBundleMetadata
  description: Scoring runtime metadata including resolved trait definitions and runtime
    loading status.
- name: NormalizedTraitScoringPayload
  description: Shared finalize/export trait scoring payload shape.
- name: PLACEHOLDER_PATTERN
  description: Compiled expression matching double-braced template placeholders.
- name: UNKNOWN_PLACEHOLDER_PRESERVE
  description: Policy value that leaves unknown placeholders intact.
- name: UNKNOWN_PLACEHOLDER_EMPTY
  description: Policy value that renders unknown placeholders as empty text.
- name: UNKNOWN_PLACEHOLDER_ERROR
  description: Policy value that raises ValueError for unknown placeholders.
- name: UNKNOWN_PLACEHOLDER_POLICIES
  description: Allowed unknown placeholder rendering policies.
- name: PLACEHOLDER_METADATA
  description: Placeholder metadata keyed by canonical placeholder key.
- name: PLACEHOLDERS_BY_CONTEXT
  description: Ordered placeholder keys available for each template context.
- name: _COMPAT_MODULES
  description: Ordered tuple of remaining legacy module import paths exposed by scoring_reporting.
- name: _WRAPPER_POLICY
  description: Human-readable wrapper policy for remaining scoring/reporting compatibility
    modules.
