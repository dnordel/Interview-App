module:
  name: pyside_interview_app
  language: python
  path: src/pyside_interview_app.py
  version: 6.8.0
  description: PySide6 operations shell and headless view-model builder for a mockup-driven
    New Interview setup/live flow, Candidates-owned pipeline/history, candidate reports,
    onboarding, staffing, notifications, and admin-only
    Staffing v2 Settings. Settings is lazily hosted inside the Staffing v2 shell, delegates
    draft validation, backup, and confirmed persistence to admin_studio, hides global
    configuration from director mode, and guards navigation or close when unpublished
    configuration or shared email-account edits exist.
functions:
- name: build_interview_redesign_model
  description: Build workflow-first home, setup, live interview, review, offer, classroom-detail staffing, onboarding, and admin view data from rubric, intro script, question flow, and InterviewHistoryStore rows, importing legacy JSON only through the store when applicable.
  locked: false
  inputs:
    rubric_path:
      type: Path
      required: false
      default: DEFAULT_RUBRIC_PATH
    overrides_path:
      type: Path
      required: false
      default: QUESTIONS_OVERRIDE_PATH
    history_path:
      type: Path
      required: false
      default: INTERVIEW_HISTORY_PATH
    school_options:
      type: Sequence[str]
      required: false
      default: DEFAULT_SCHOOL_OPTIONS
  returns:
    type: InterviewRedesignModel
  exceptions:
  - ValueError
  side_effects: Reads local rubric, question override, and InterviewHistoryStore data; may import legacy JSON into the SQLite history store and may normalize question flow through QuestionOverridesStore.
- name: build_director_staffing_model
  description: Return a director staffing-only PySide model that keeps full app data/contracts but exposes only the Staffing v2 content surface, optional assigned school filter, and mockup-style full navigation rail display.
  locked: false
  inputs:
    model:
      type: InterviewRedesignModel | None
      required: false
      default: null
    school:
      type: str
      required: false
      default: ''
  returns:
    type: InterviewRedesignModel
  exceptions:
  - ValueError
  side_effects: May read local app config/history when no model is supplied.
- name: staffing_db_path_for_school
  description: Return the school-specific staffing SQLite path for a director school using a path-safe slug suffix, or the base staffing path when no school is supplied.
  locked: false
  inputs:
    school:
      type: str
      required: true
    base_path:
      type: Path | None
      required: false
      default: null
  returns:
    type: Path
  exceptions: []
  side_effects: none
- name: director_offer_shift_for_history
  description: Read proposed shift start and end values from a completed hire decision matched by exact history ID and school, checking the school-specific director Staffing v2 database before the shared staffing database.
  locked: false
  inputs:
    history_id:
      type: str
      required: true
    school:
      type: str
      required: true
    base_path:
      type: Path | None
      required: false
      default: null
  returns:
    type: tuple[str, str]
  exceptions: []
  side_effects: Reads existing staffing SQLite databases without creating missing database files.
- name: staffing_referral_queue_db_path
  description: Return the central staffing referral queue SQLite path, deriving a sibling DB path from an injected legacy JSONL queue path for tests and migrations.
  locked: false
  inputs:
    queue_path:
      type: Path | None
      required: false
      default: null
  returns:
    type: Path
  exceptions: []
  side_effects: none
- name: _staffing_referral_queue_store
  description: Build the SQLite-backed central director referral queue store with the legacy JSONL path wired for one-time import.
  locked: false
  inputs:
    queue_path:
      type: Path | None
      required: false
      default: null
  returns:
    type: StaffingReferralQueueStore
  exceptions: []
  side_effects: none
- name: build_pyside_onboarding_board
  description: Build PySide onboarding dashboard counts and employee next-task rows from existing onboarding state.
  locked: false
  inputs:
    employees:
      type: list[Any]
      required: true
    scheduler_settings:
      type: dict[str, Any] | None
      required: true
    today:
      type: date
      required: true
  returns:
    type: PySideOnboardingBoard
  exceptions: []
  side_effects: none
- name: build_pyside_candidate_board
  description: Build PySide candidate list rows, shared history-grid rows, and hiring status summary from interview history rows. Numeric history scores are canonical for display thresholds unless an explicit no-hire override, incomplete state, or processing state is present; 80% and above displays Hire, 65% through below 80% displays Borderline, and below 65% displays No Hire.
  locked: false
  inputs:
    history_rows:
      type: Sequence[dict[str, Any] | PySideHistoryRow]
      required: true
  returns:
    type: PySideCandidateBoard
  exceptions: []
  side_effects: none
- name: _coerce_history_percent
  description: Parse a history score value or percent string into a display-safe 0 through 100 numeric percent for PySide history status thresholding; invalid or out-of-range values return None.
  locked: false
  inputs:
    value:
      type: Any
      required: true
  returns:
    type: float | None
  exceptions: []
  side_effects: none
- name: should_prompt_candidate_contact_handoff
  description: Return true only when a finalized initial-interview score is strictly greater than 65 percent.
  locked: false
  inputs:
    score:
      type: Any
      required: true
  returns:
    type: bool
  exceptions: []
  side_effects: none
- name: _format_offer_number
  description: Format Decimal-compatible offer numbers without unnecessary trailing zeros.
  locked: false
  inputs:
    value: {type: Any, required: true}
  returns: {type: str}
  exceptions: []
  side_effects: none
- name: _history_has_no_hire_override
  description: Return whether a persisted history row contains explicit human disqualifier, critical-score, locked-rule, or override-rationale metadata that should preserve a No Hire status even when numeric score is 65% or higher.
  locked: false
  inputs:
    row:
      type: dict[str, Any]
      required: true
  returns:
    type: bool
  exceptions: []
  side_effects: none
- name: _history_status_from_score
  description: Derive PySide history display status from score thresholds, preserving incomplete and processing statuses plus explicit human no-hire override metadata; 80% and above returns Hire, 65% through below 80% returns Borderline, and below 65% returns No Hire.
  locked: false
  inputs:
    row:
      type: dict[str, Any]
      required: true
    score:
      type: Any
      required: true
    status:
      type: Any
      required: true
  returns:
    type: str
  exceptions: []
  side_effects: none
- name: _offer_school_code
  description: Return the Launch Pad Learning offer-email school code HAW, NLB, or PMD for a supported school, falling back to the supplied school text.
  locked: false
  inputs:
    school:
      type: str
      required: true
  returns:
    type: str
  exceptions: []
  side_effects: none
- name: _offer_school_location
  description: Return human-readable school location text for offer email templates.
  locked: false
  inputs:
    school:
      type: str
      required: true
  returns:
    type: str
  exceptions: []
  side_effects: none
- name: _convert_offer_docx_to_pdf_path
  description: Return an existing non-empty offer PDF path or convert an existing DOCX offer letter to a same-stem non-empty PDF through Microsoft Word automation, with a sanitized failure reason for approval review.
  locked: false
  inputs:
    offer_path:
      type: str
      required: true
  returns:
    type: tuple[str, str]
  exceptions: []
  side_effects: May read a DOCX offer letter and write a same-stem PDF; suppresses conversion exceptions and returns the reason instead.
- name: _ensure_offer_pdf_path
  description: Return an existing offer PDF path or convert an existing DOCX offer letter to a same-stem PDF through Microsoft Word automation when available.
  locked: false
  inputs:
    offer_path:
      type: str
      required: true
  returns:
    type: str
  exceptions: []
  side_effects: May read a DOCX offer letter and write a same-stem PDF; suppresses conversion errors so notification send can block cleanly.
- name: _build_pyside_history_rows
  description: Build PySide history row view models from InterviewHistoryStore, using DB-backed filtered reads when school, outcome, search, or limit filters are supplied.
  locked: false
  inputs:
    history_path:
      type: Path
      required: true
    school:
      type: str
      required: false
      default: ''
    outcome:
      type: str
      required: false
      default: ''
    search:
      type: str
      required: false
      default: ''
    limit:
      type: int | None
      required: false
      default: null
  returns:
    type: list[PySideHistoryRow]
  exceptions: []
  side_effects: Reads interview history through InterviewHistoryStore and may import legacy JSON when the store is initialized.
- name: _pyside_history_rows_from_payloads
  description: Convert raw persisted history payload dictionaries into newest-first display-ready PySideHistoryRow values using existing score, status, offer, and notes normalization.
  locked: false
  inputs:
    rows:
      type: Sequence[dict[str, Any]]
      required: true
    store:
      type: InterviewHistoryStore
      required: true
  returns:
    type: list[PySideHistoryRow]
  exceptions: []
  side_effects: none
- name: latest_pyside_draft_path
  description: Return the newest PySide draft JSON path from the draft directory, if one exists.
  locked: false
  inputs:
    drafts_dir:
      type: Path | None
      required: false
      default: null
  returns:
    type: Path | None
  exceptions: []
  side_effects: Reads PySide draft directory metadata.
- name: standard_window_control_flags
  description: Return PySide window flags that keep the native title bar, system menu, minimize, maximize, and close controls visible.
  locked: false
  inputs:
    QtCore:
      type: Any
      required: true
  returns:
    type: Any
  exceptions: []
  side_effects: none
- name: _normalize_history_search
  description: Normalize free-text PySide history search input or row metadata for case-insensitive fuzzy matching without exposing hidden candidate artifacts.
  locked: false
  inputs:
    value:
      type: str
      required: true
  returns:
    type: str
  exceptions: []
  side_effects: none
- name: _history_token_matches
  description: Return whether one normalized search term approximately matches any normalized history metadata token.
  locked: false
  inputs:
    term:
      type: str
      required: true
    candidates:
      type: list[str]
      required: true
  returns:
    type: bool
  exceptions: []
  side_effects: none
- name: _history_outcome_color
  description: Map a normalized hiring outcome/status label to a soft table-row background color for the PySide history grid.
  locked: false
  inputs:
    outcome:
      type: str
      required: true
  returns:
    type: str
  exceptions: []
  side_effects: none
- name: launch_pyside_interview_app
  description: Launch the PySide6 redesigned desktop shell using the supplied model or current repository configuration, optionally in director staffing-only mode, applying the shared Staffing app/taskbar icon and showing the first navigation page before secondary pages are built.
  locked: false
  inputs:
    model:
      type: InterviewRedesignModel | None
      required: false
      default: null
    director_staffing:
      type: bool
      required: false
      default: false
    director_school:
      type: str
      required: false
      default: ''
  returns:
    type: int
  exceptions:
  - PySide6UnavailableError
  side_effects: Creates a QApplication, applies Staffing v2's forced light Qt theme
    and shared repo-owned icon/Windows taskbar identity, opens the redesigned desktop
    window, and defers secondary page construction until navigation.
- name: parse_args
  description: Parse PySide app CLI arguments including director staffing-only mode and optional director school filter.
  locked: false
  inputs:
    argv:
      type: Sequence[str] | None
      required: false
      default: null
  returns:
    type: argparse.Namespace
  exceptions:
  - SystemExit
  side_effects: none
- name: main
  description: Command-line entry point for the PySide6 redesigned interview assistant.
  locked: false
  inputs:
    argv:
      type: Sequence[str] | None
      required: false
      default: null
  returns:
    type: int
  exceptions:
  - PySide6UnavailableError
  side_effects: Launches the PySide6 desktop UI.
classes:
- name: PySideInterviewSession
  description: Autosaved PySide interview session state for guided question flow, draft resume, and canonical interview_sessions transcript snapshots.
  locked: false
  attributes:
    model:
      type: InterviewRedesignModel
    draft_path:
      type: Path
    candidate_name:
      type: str
    honorific:
      type: str
    interview_date:
      type: str
    school:
      type: str
    track_key:
      type: str
    current_index:
      type: int
    answers:
      type: dict[str, dict[str, Any]]
    qualification:
      type: dict[str, Any]
    flow_time_marks:
      type: list[dict[str, Any]]
    flow_candidate_transcripts:
      type: dict[int, str]
    flow_live_transcripts:
      type: dict[int, str]
    flow_transcript_overrides:
      type: dict[int, str]
    flow_recordings:
      type: dict[int, dict[str, Any]]
    application_id:
      type: str
  methods:
  - name: append_live_transcript
    description: Append new candidate-only provisional text for a flow index while preserving any manual override prefix.
    locked: false
    inputs:
      flow_index: {type: int, required: true}
      text: {type: str, required: true}
    returns: {type: None}
    exceptions: []
    side_effects: Autosaves draft and canonical in-progress session state.
  - name: replace_live_transcript
    description: Replace the current question transcript with an explicit manual override.
    locked: false
    inputs:
      flow_index: {type: int, required: true}
      text: {type: str, required: true}
    returns: {type: None}
    exceptions: []
    side_effects: Autosaves draft and canonical in-progress session state.
  - name: live_transcript
    description: Return effective provisional text with manual override precedence and later candidate segments appended.
    locked: false
    inputs:
      flow_index: {type: int, required: true}
    returns: {type: str}
    exceptions: []
    side_effects: none
  - name: apply_canonical_transcripts
    description: Apply final canonical question transcripts while preserving manual overrides and falling back to provisional text when canonical ASR is unavailable.
    locked: false
    inputs:
      canonical: {type: 'dict[int, str]', required: true}
    returns: {type: None}
    exceptions: []
    side_effects: Updates in-memory final transcript mappings.
  - name: start
    description: Start a new guided interview session at the school-specific intro script, assign the current interview date, and persist initial draft/session state.
    locked: false
    inputs:
      candidate_name:
        type: str
        required: true
      school:
        type: str
        required: true
      track_key:
        type: str
        required: true
      honorific:
        type: str
        required: false
        default: Ms.
    returns:
      type: None
    exceptions:
    - ValueError
    side_effects: Writes PySide draft JSON and initializes canonical interview_sessions storage when answer/transcript data is present.
  - name: active_question
    description: Return the current intro, custom, or scored question, or None when the session has reached review.
    locked: false
    inputs: {}
    returns:
      type: FlowQuestion | None
    exceptions: []
    side_effects: none
  - name: save_answer_and_advance
    description: Save one answer, score, optional skipped state, and quick-action set, advance to the next question, autosave the draft, and mirror answer/transcript data to interview_sessions.
    locked: false
    inputs:
      notes:
        type: str
        required: true
      score:
        type: str
        required: false
        default: ''
      quick_actions:
        type: Sequence[str]
        required: false
        default: ()
      qualification:
        type: dict[str, Any] | None
        required: false
        default: null
      skipped:
        type: bool
        required: false
        default: false
    returns:
      type: None
    exceptions: []
    side_effects: Writes PySide draft JSON and canonical interview_sessions question snapshots.
  - name: go_back
    description: Move the guided PySide session back to the previous question without deleting saved answers and autosave the draft.
    locked: false
    inputs: {}
    returns:
      type: None
    exceptions: []
    side_effects: Writes PySide draft JSON and canonical interview_sessions question snapshots.
  - name: skip_active_question
    description: Save the active question as intentionally skipped with optional notes and quick actions, leave score blank, advance to the next question, and autosave the draft.
    locked: false
    inputs:
      notes:
        type: str
        required: false
        default: ''
      quick_actions:
        type: Sequence[str]
        required: false
        default: ()
    returns:
      type: None
    exceptions: []
    side_effects: Writes PySide draft JSON and canonical interview_sessions question snapshots.
  - name: update_review_score
    description: Update one scored trait rating from the PySide review screen after the interview, preserving notes/transcripts, clearing skipped state when a score is chosen, autosaving the draft, and mirroring canonical interview_sessions snapshots.
    locked: false
    inputs:
      question_id:
        type: str
        required: true
      score:
        type: int | str | None
        required: true
    returns:
      type: None
    exceptions:
    - ValueError
    side_effects: Writes PySide draft JSON and canonical interview_sessions question snapshots.
  - name: import_indeed_transcript_file
    description: Import an Indeed-generated .txt transcript into the session, split answers by configured question prompts, infer interviewer/candidate speakers, preserve any existing scored ratings, mark unasked unrated questions skipped, and leave newly scored answers unrated for operator review.
    locked: false
    inputs:
      path:
        type: Path
        required: true
    returns:
      type: IndeedTranscriptImportResult
    exceptions:
    - ValueError
    - OSError
    side_effects: Reads a local .txt transcript file, updates answers/transcript maps, writes PySide draft JSON, and writes canonical interview_sessions question snapshots.
  - name: import_indeed_transcript_text
    description: Import Indeed transcript text into the session, split candidate answer transcripts onto matching questions, infer speakers, preserve any existing scored ratings, mark unmatched unrated questions skipped, and move to the first imported scored answer that still needs a rating.
    locked: false
    inputs:
      text:
        type: str
        required: true
    returns:
      type: IndeedTranscriptImportResult
    exceptions:
    - ValueError
    side_effects: Updates answers, flow_candidate_transcripts, flow_recordings, current_index, writes PySide draft JSON, and writes canonical interview_sessions question snapshots.
  - name: review_summary
    description: Evaluate completed PySide trait scores with existing scoring rules and return review-screen summary data.
    locked: false
    inputs: {}
    returns:
      type: PySideReviewSummary
    exceptions:
    - ReportingValidationError
    side_effects: none
  - name: offer_review_defaults
    description: Return prefilled offer wizard fields from candidate setup and interview review outcome.
    locked: false
    inputs: {}
    returns:
      type: dict[str, str]
    exceptions:
    - ReportingValidationError
    side_effects: none
  - name: generate_offer_document
    description: Render a Word offer letter from the completed PySide session and selected offer template.
    locked: false
    inputs:
      template_path:
        type: Path
        required: true
      output_dir:
        type: Path
        required: true
      start_date:
        type: date
        required: true
      start_time_12h:
        type: str
        required: true
      end_time_12h:
        type: str
        required: true
      hourly_pay:
        type: float
        required: true
      hours:
        type: int
        required: true
      created_on:
        type: date
        required: true
      title:
        type: str
        required: false
        default: ""
      position:
        type: str
        required: false
        default: ""
    returns:
      type: Path
    exceptions:
    - OfferTemplateError
    - OSError
    side_effects: Writes a titled, school-branded offer DOCX to the selected output directory without overwriting an existing revision.
  - name: generate_interview_notes_document
    description: Compatibility wrapper that finalizes the PySide session through
      the shared desktop finalize path and returns the generated interview-notes
      DOCX path, using the configured history DB unless a caller supplies an
      explicit history path.
    locked: false
    inputs:
      output_dir:
        type: Path
        required: true
      history_path:
        type: Path
        required: false
        default: INTERVIEW_HISTORY_PATH
    returns:
      type: Path
    exceptions:
    - OSError
    side_effects: Writes basic interview-notes DOCX and integration export under
      the selected output directory, and writes the SQLite history row to the
      configured history path.
  - name: finalize_interview
    description: Finalize the completed PySide session using shared desktop runtime
      contracts for scoring, immediate history persistence after the hiring decision,
      basic DocxExporter notes generation, integration export, transcript metadata,
      and final history path backfill.
    locked: false
    inputs:
      base_dir:
        type: Path
        required: false
        default: DEFAULT_BASE_DIR
      history_path:
        type: Path
        required: false
        default: INTERVIEW_HISTORY_PATH
      gateways:
        type: FinalizeGateways | None
        required: false
        default: null
    returns:
      type: dict[str, Any]
    exceptions:
    - ReportingValidationError
    - OSError
    side_effects: Writes finalized interview history immediately after scoring,
      writes basic interview-notes DOCX to the resolved
      per-school Dropbox candidate folder when configured, backfills the history notes
      paths, writes integration export, and preserves any PySide recording/transcript
      payload in history/session data.
  - name: update_completed_artifacts
    description: Idempotently regenerate completed interview scoring, base DOCX, history payload, and candidate-report snapshot for an existing history ID after overview edits or Back navigation.
    locked: false
    inputs:
      history_id: {type: str, required: true}
      base_dir: {type: Path, required: false, default: DEFAULT_BASE_DIR}
      history_path: {type: Path, required: false, default: INTERVIEW_HISTORY_PATH}
    returns: {type: 'dict[str, Any]'}
    exceptions:
    - ValueError
    - ReportingValidationError
    - OSError
    side_effects: Updates one existing history row and its base DOCX and candidate-report snapshot without creating duplicate history, application, referral, or notification records.
  - name: _transcript_metadata
    description: Build complete/partial transcript metadata from PySide flow transcript
      and recording state for finalize/history payloads.
    locked: false
    inputs: {}
    returns:
      type: dict[str, Any]
    exceptions: []
    side_effects: none
  - name: to_draft
    description: Serialize the session as versioned draft JSON data including interview_date.
    locked: false
    inputs: {}
    returns:
      type: dict[str, Any]
    exceptions: []
    side_effects: none
  - name: save_draft
    description: Atomically write current session state to the configured draft path and mirror answered/transcribed questions to interview_sessions.
    locked: false
    inputs: {}
    returns:
      type: None
    exceptions:
    - OSError
    side_effects: Writes PySide draft JSON and canonical interview_sessions question snapshots.
  - name: _save_interview_session_snapshots
    description: Mirror answered or transcribed PySide flow items to canonical InterviewSessionStore JSON for durable transcript snapshots.
    locked: false
    inputs: {}
    returns:
      type: None
    exceptions:
    - OSError
    side_effects: Creates or updates interview_sessions JSON under DEFAULT_BASE_DIR.
  - name: _interview_session_id
    description: Return a path-safe canonical PySide interview session id based on candidate name and interview date.
    locked: false
    inputs: {}
    returns:
      type: str
    exceptions: []
    side_effects: none
  - name: _session_snapshot_notes
    description: Convert one PySide answer and flow question into InterviewSessionStore notes metadata, preserving prompt text, score, skip flags, notes, and quick-action-derived scoring flags.
    locked: false
    inputs:
      item:
        type: FlowQuestion
        required: true
      answer:
        type: dict[str, Any]
        required: true
    returns:
      type: dict[str, Any]
    exceptions: []
    side_effects: none
  - name: load
    description: Load and validate a versioned PySide interview draft.
    locked: false
    inputs:
      model:
        type: InterviewRedesignModel
        required: true
      draft_path:
        type: Path
        required: true
    returns:
      type: PySideInterviewSession
    exceptions:
    - ValueError
    side_effects: Reads PySide draft JSON.
- name: PySideInterviewWindow
  description: Main PySide6 operations shell. Interviews owns mockup-driven setup, focused
    live interview, recording/transcription status, and closeout. Candidates owns roster,
    application pipeline, history, transcript import, and draft recovery. Hiring v2 owns
    those candidate and offer surfaces plus immutable offer approval preview,
    immutable offer approval preview, delivery, negotiation, and acceptance. Staffing,
    Staffing v2, Onboarding, and Admin remain separate navigation surfaces. Deferred
    construction builds only the actual default Staffing v2 page and leaves every
    other outer page as a placeholder until selected.
  locked: false
  attributes:
    model:
      type: InterviewRedesignModel
    window:
      type: QMainWindow
    school_offer_store:
      type: SchoolOfferSettingsStore
    offer_fields:
      type: dict[str, QWidget]
    generated_offer_path:
      type: Path | None
    school_folder_settings_table:
      type: QTableWidget | None
    admin_studio:
      type: AdminStudio
    _main_nav_page_names:
      type: list[str]
    _main_nav_pages_built:
      type: set[int]
  methods:
  - name: _generate_hiring_offer_artifacts
    description: Generate one versioned offer DOCX and same-stem PDF together for persistence before approval review.
    locked: false
    inputs:
      application: {type: HiringApplication, required: true}
      candidate: {type: CandidateProfile, required: true}
      version: {type: OfferVersion, required: true}
    returns: {type: 'tuple[Path, Path]'}
    exceptions: [ValueError, OSError]
    side_effects: Writes a versioned DOCX and PDF to the configured school offer folder; preserves the DOCX and fails closed if PDF conversion fails.
  - name: _review_hiring_offer_approval
