  - name: _confirm_staffing_move
    description: Confirm and execute a drag/drop teacher move from one staffing assignment to another through StaffingService.
    locked: false
    inputs:
      source_assignment_id:
        type: int
        required: true
      target_assignment_id:
        type: int
        required: true
    returns:
      type: bool
    exceptions: []
    side_effects: Shows confirmation dialog; may update staffing SQLite rows and refresh dashboard.
  - name: _open_staffing_position
    description: Open a staffing position through StaffingService and refresh the Staffing dashboard.
    locked: false
    inputs:
      assignment_id:
        type: int
        required: true
    returns:
      type: None
    exceptions: []
    side_effects: Updates staffing SQLite rows and visible PySide staffing dashboard widgets.
  - name: _mark_staffing_filled
    description: Mark a coming staffing position filled through StaffingService and refresh the Staffing dashboard.
    locked: false
    inputs:
      assignment_id:
        type: int
        required: true
    returns:
      type: None
    exceptions: []
    side_effects: Updates staffing SQLite rows and visible PySide staffing dashboard widgets.
  - name: _mark_staffing_coming
    description: Show the guided Mark Coming dialog for incoming person, start date, role, permit status, and units; saving marks a staffing position coming through StaffingService and refreshes the Staffing dashboard.
    locked: false
    inputs:
      assignment_id:
        type: int
        required: true
    returns:
      type: None
    exceptions: []
    side_effects: Shows a nonblocking PySide guided action dialog; saving updates staffing SQLite rows, optionally updates permit status, and refreshes visible PySide staffing dashboard widgets.
  - name: _mark_staffing_replacing
    description: Show the guided Replace Employee dialog with date picker widgets for notice date and final working day that default to today and open the calendar when users click either the field or dropdown arrow, a fixed reason dropdown, and dialog-local save errors; saving marks a filled staffing position as replacing through StaffingService and refreshes the Staffing dashboard.
    locked: false
    inputs:
      assignment_id:
        type: int
        required: true
    returns:
      type: None
    exceptions: []
    side_effects: Shows a nonblocking PySide guided action dialog; failed saves keep the dialog open with an inline error, while valid saving updates staffing SQLite rows and refreshes visible PySide staffing dashboard widgets.
  - name: _revert_staffing_coming
    description: Revert a coming staffing assignment to need_now through StaffingService and refresh the Staffing dashboard.
    locked: false
    inputs:
      assignment_id:
        type: int
        required: true
    returns:
      type: None
    exceptions: []
    side_effects: Updates staffing SQLite rows and visible PySide staffing dashboard widgets.
  - name: _clear_staffing_replacement
    description: Clear a replacement assignment back to need_now through StaffingService and refresh the Staffing dashboard.
    locked: false
    inputs:
      assignment_id:
        type: int
        required: true
    returns:
      type: None
    exceptions: []
    side_effects: Updates staffing SQLite rows and visible PySide staffing dashboard widgets.
  - name: _mark_staffing_not_needed
    description: Confirm and mark a staffing assignment not needed through StaffingService.
    locked: false
    inputs:
      assignment_id:
        type: int
        required: true
    returns:
      type: None
    exceptions: []
    side_effects: Shows confirmation, updates staffing SQLite rows, and refreshes visible widgets.
  - name: _update_staffing_permit
    description: Show the guided Update Permit Status dialog for permit status, units, and effective date; saving updates assigned person's permit through StaffingService.
    locked: false
    inputs:
      assignment_id:
        type: int
        required: true
    returns:
      type: None
    exceptions: []
    side_effects: Shows a nonblocking PySide guided action dialog, updates people table, and refreshes visible widgets.
  - name: _update_staffing_permit_from_table
    description: Update assigned person's permit from the inline Staffing table dropdown through StaffingService.
    locked: false
    inputs:
      assignment_id:
        type: int
        required: true
      permit_status:
        type: str
        required: true
    returns:
      type: None
    exceptions: []
    side_effects: Updates people table through StaffingService, queues when locked, and refreshes visible widgets.
  - name: _run_staffing_action
    description: Run a StaffingService transition with notification service attached, surface exact validation failures without leaking secrets, queue locked-DB edits for later replay, and refresh staffing widgets on success or queued save.
    locked: false
    inputs:
      action:
        type: Any
        required: true
      success_message:
        type: str
        required: true
    returns:
      type: None
    exceptions: []
    side_effects: Updates staffing SQLite rows through the supplied action or queues a pending operation when the DB is locked, updates visible PySide status/metric/table widgets immediately, and schedules a short retry refresh for queued operations.
  - name: _notification_service
    description: Return cached generic notification service backed by shared company
      Email Settings and current notification rules path.
    locked: false
    inputs: {}
    returns:
      type: NotificationService
    exceptions: []
    side_effects: May read shared email account settings and open notification SQLite database.
  - name: _run_due_notifications_safely
    description: Best-effort drain of due queued notification schedules when PySide
      starts, skipping real SMTP-backed sends if shared email settings are incomplete.
    locked: false
    inputs: {}
    returns:
      type: None
    exceptions: []
    side_effects: May read shared email settings, open notification SQLite database,
      send due notification emails, write sanitized audit rows, and update pending
      schedule statuses; suppresses notification failures so app startup is not blocked.
  - name: _refresh_home_draft_panel
    description: Refresh the compact PySide home draft label and adjacent Continue/Delete Saved Draft button enabled states from the latest existing draft.
    locked: false
    inputs: {}
    returns:
      type: None
    exceptions: []
    side_effects: Updates visible PySide home draft controls.
  - name: _delete_latest_draft
    description: Confirm with the operator, delete the latest saved PySide interview draft when it still exists, clear the active matching session, and refresh home controls.
    locked: false
    inputs: {}
    returns:
      type: None
    exceptions: []
    side_effects: Shows a PySide confirmation dialog, may delete one draft JSON file, and updates visible home draft controls.
  - name: _deepseek_retry_job_path_for_row
    description: Resolve the persisted DeepSeek job JSON path for a failed history
      row from the row key and configured history/base directories, rejecting unsafe
      path-bearing row keys.
    locked: false
    inputs:
      row:
        type: PySideHistoryRow
        required: true
    returns:
      type: Path | None
    exceptions: []
    side_effects: Checks local filesystem path existence.
  - name: _retry_history_deepseek
    description: Relaunch a persisted DeepSeek finalize job for a history row in full
      or document-only regeneration mode, refresh history tables to Processing, and
      attach the existing progress dialog watcher to the progress JSON.
    locked: false
    inputs:
      row:
        type: PySideHistoryRow
        required: true
    returns:
      type: None
    exceptions: []
    side_effects: Reads a local job JSON path, updates history through interview_runtime
      regeneration behavior, starts a detached worker, shows warnings on failure,
      and refreshes visible history/progress UI.
  - name: _choose_pyside_notes_regeneration_mode
    description: Ask whether notes regeneration should rerun local DeepSeek and rebuild
      the document or rebuild only the document from saved data using explicit action
      buttons.
    locked: false
    inputs:
      row:
        type: PySideHistoryRow
        required: true
    returns:
      type: str | None
    exceptions: []
    side_effects: Shows a PySide modal selection dialog.
  - name: _open_history_notes
    description: Open a selected history row's interview notes DOCX in the OS default
      application immediately when the local path exists; when a failed row has no
      notes document, route to regeneration.
    locked: false
    inputs:
      row:
        type: PySideHistoryRow
        required: true
    returns:
      type: None
    exceptions: []
    side_effects: May launch the OS default document application, show a missing-file
      warning dialog, or start regeneration for failed rows without a document.
  - name: _open_history_offer
    description: Advance generated/approved/accepted history offer rows through PySide offer transitions with notification emission, or open the offer wizard for not_generated rows.
    locked: false
    inputs:
      row:
        type: PySideHistoryRow
        required: true
    returns:
      type: None
    exceptions: []
    side_effects: May update interview history offer status, emit checkpoint notifications,
      reload visible history tables, switch to Offers, or switch to Onboarding.
  - name: _advance_pyside_offer_status
    description: Persist one PySide history offer status transition and emit the matching checkpoint notification.
    locked: false
    inputs:
      row:
        type: PySideHistoryRow
        required: true
      status:
        type: str
        required: true
      message:
        type: str
        required: true
    returns:
      type: None
    exceptions: []
    side_effects: Writes interview history through InterviewHistoryStore, emits notification, reloads visible history model, and shows status-bar message.
  - name: _update_pyside_offer_status
    description: Update one PySide history row offer status and optionally emit notification.
    locked: false
    inputs:
      row_key:
        type: str
        required: true
      status:
        type: str
        required: true
      offer_path:
        type: str
        required: false
        default: ''
      row:
        type: PySideHistoryRow | None
        required: false
        default: null
    returns:
      type: bool
    exceptions: []
    side_effects: Writes interview history through InterviewHistoryStore and may emit notification.
  - name: _emit_pyside_session_offer_generated
    description: Emit generic offer.generated notification for an active PySide
      interview session offer document, including candidate aliases, school code/location,
      position, offer path, reply-by date, interview date when available, generated-date,
      start-date, notice, and final-working-day payload fields used by immediate or queued
      date-offset notification rules.
    locked: false
    inputs:
      output_path:
        type: Path
        required: true
    returns:
      type: None
    exceptions: []
    side_effects: May read notification settings and write notification audit/send
      email or queue future date-offset notification schedules.
  - name: _emit_pyside_offer_notification
    description: Emit generic offer notification event for a PySide history offer status,
      including dynamic candidate aliases/email, qualification, school code/location,
      position, generated-date, reply-by date, offer path/PDF path for approved offers,
      start-date, notice, final-working-day, and status placeholder payload fields.
    locked: false
    inputs:
      row:
        type: PySideHistoryRow
        required: true
      status:
        type: str
        required: true
    returns:
      type: None
    exceptions: []
    side_effects: May convert an approved-offer DOCX to PDF, read notification settings, and write notification audit/send email.
  - name: _open_notification_template_dialog
    description: Open a PySide pop-up for creating or modifying one Admin Studio
      notification template row, including custom system event, active/delete state,
      event/date-offset trigger controls, subject/body templates, recipients, and
      visible supported placeholder fields.
    locked: false
    inputs: {}
    returns:
      type: None
    exceptions: []
    side_effects: Shows a modal dialog and writes accepted edits back to the visible
      Admin Studio notification table for later review/apply.
  - name: _emit_pyside_rating_notification
    description: Emit generic interview rating notification events for Hire and Borderline
      PySide finalize outcomes only, including dynamic candidate, qualification,
      school, position, score, outcome, and history-id placeholder payload fields.
    locked: false
    inputs:
      result:
        type: dict[str, Any]
        required: true
    returns:
      type: None
    exceptions: []
    side_effects: May read notification settings and write notification audit/send email.
  - name: _open_session_offer
    description: Route a completed active PySide session to the Offers wizard,
      clearing any selected history offer row so fields are prefilled from current
      session answers. This helper is not exposed as a completed-review-screen
      action because offers occur after director interview review.
    locked: false
    inputs: {}
    returns:
      type: None
    exceptions: []
    side_effects: Re-renders the offer page and switches sidebar/stack navigation
      to Offers.
  - name: _delete_history_row
    description: Confirm with the operator, delete one selected PySide history row
      by stable row key, and reload Home/Candidates history tables when deletion succeeds.
    locked: false
    inputs:
      row:
        type: PySideHistoryRow
        required: true
    returns:
      type: None
    exceptions: []
    side_effects: Shows a PySide confirmation dialog, may update persisted history,
      and refreshes visible history tables.
  - name: _set_history_search_text
    description: Update the in-memory PySide history fuzzy search text and refresh the visible history table.
    locked: false
    inputs:
      value:
        type: str
        required: true
    returns:
      type: None
    exceptions: []
    side_effects: Re-renders the visible PySide history table.
  - name: _set_history_school_filter
    description: Update the selected school filter and refresh the visible PySide history table.
    locked: false
    inputs:
      value:
        type: str
        required: true
    returns:
      type: None
    exceptions: []
    side_effects: Re-renders the visible PySide history table.
  - name: _set_history_outcome_filter
    description: Update the optional hiring outcome filter and refresh the visible PySide history table.
    locked: false
    inputs:
      value:
        type: str
        required: true
    returns:
      type: None
    exceptions: []
    side_effects: Re-renders the visible PySide history table.
  - name: _refresh_history_table
    description: Rebuild a visible PySide history table from supplied rows or current in-memory search and filter state while preserving action buttons and sortable columns.
    locked: false
    inputs:
      table:
        type: QTableWidget | None
        required: false
        default: null
      rows:
        type: Sequence[PySideHistoryRow] | None
        required: false
        default: null
    returns:
      type: None
    exceptions: []
    side_effects: Re-renders the visible PySide history table.
  - name: _refresh_all_history_tables
    description: Refresh every PySide table that renders finalized interview history,
      including Home and Candidates, through the same row rendering code path.
    locked: false
    inputs: {}
    returns:
      type: None
    exceptions: []
    side_effects: Re-renders registered PySide history table widgets.
  - name: _history_notes_action_state
    description: Return the Notes-column label, enabled state, and tooltip for a PySide
      history row, showing Processing during detached DeepSeek work, Failed/Retry
      when detached DeepSeek failed, and preventing missing-path opens.
    locked: false
    inputs:
      row:
        type: PySideHistoryRow
        required: true
    returns:
      type: tuple[str, bool, str]
    exceptions: []
    side_effects: none
  - name: _create_history_table
    description: Create a shared expanding PySide history-grid table with Date, Candidate, School, Position, Score, Status, Notes, Regenerate, Transcript, Offer, and Delete columns.
    locked: false
    inputs:
      object_name:
        type: str
        required: true
    returns:
      type: QTableWidget
    exceptions: []
    side_effects: Creates a PySide table widget.
  - name: _size_history_table_columns
    description: Size PySide history text columns to visible content while keeping Notes, Regenerate, Transcript, Offer, and Delete action columns compact.
    locked: false
    inputs:
      table:
        type: QTableWidget
        required: true
    returns:
      type: None
    exceptions: []
    side_effects: Updates visible PySide history table column widths.
  - name: _track_key_for_label
    description: Resolve a displayed role label to a configured interview track key.
    locked: false
    inputs:
      label:
        type: str
        required: true
    returns:
      type: str
    exceptions: []
    side_effects: none
  - name: _import_indeed_transcript_from_home
    description: Collect candidate name, interview date, school, track, and transcript
      file metadata for a new Indeed transcript import, import mapped transcript
      answers into a PySide session, immediately create an Incomplete candidate
      history row, and open the existing live rating flow without starting recording.
    locked: false
    inputs: {}
    returns:
      type: None
    exceptions: []
    side_effects: Opens import metadata/file UI, reads a local .txt transcript,
      writes PySide draft/session snapshots, appends InterviewHistoryStore row,
      refreshes history tables, and opens the live rating tab.
  - name: _collect_indeed_transcript_import_request
    description: Show the new-transcript import dialog for candidate name, interview
      date, school, track, and .txt transcript file path.
    locked: false
    inputs: {}
    returns:
      type: dict[str, Any] | None
    exceptions: []
    side_effects: Opens a modal PySide dialog and may show validation warning.
  - name: _persist_new_indeed_import_history_row
    description: Append an Incomplete candidate history row for a new Indeed transcript
      import using mapped answers and transcript metadata.
    locked: false
    inputs:
      session:
        type: PySideInterviewSession
        required: true
      result:
        type: IndeedTranscriptImportResult
        required: true
      source_path:
        type: Path
        required: true
    returns:
      type: str
    exceptions: []
    side_effects: Appends one InterviewHistoryStore row and returns its history_id.
  - name: _track_key_for_history_row
    description: Resolve the interview track key for a finalized history row from its
      position text, falling back to the first configured track when no direct label
      match exists.
    locked: false
    inputs:
      row:
        type: PySideHistoryRow
        required: true
    returns:
      type: str
    exceptions: []
    side_effects: none
  - name: _session_from_history_row
    description: Build a PySideInterviewSession for a finalized history row so an
      imported Indeed transcript can be attached to the existing candidate and
      opened for review-score edits while preserving prior answers, review scores,
      and scoring-row raw scores from history payload data.
    locked: false
    inputs:
      row:
        type: PySideHistoryRow
        required: true
    returns:
      type: PySideInterviewSession
    exceptions:
    - ValueError
    side_effects: Writes the new draft through PySideInterviewSession.start.
  - name: _history_payload_for_row
    description: Load the full persisted history payload for a rendered history row key.
    locked: false
    inputs:
      row:
        type: PySideHistoryRow
        required: true
    returns:
      type: dict[str, Any]
    exceptions: []
    side_effects: none
  - name: _hydrate_session_from_history_payload
    description: Copy saved answers, review score edits, and scoring raw-score values
      from a history payload into a PySide session before transcript import.
    locked: false
    inputs:
      session:
        type: PySideInterviewSession
        required: true
      payload:
        type: dict[str, Any]
        required: true
    returns:
      type: None
    exceptions: []
    side_effects: Mutates the in-memory PySideInterviewSession answers.
  - name: _history_import_updates
    description: Build the history-store payload for an imported Indeed transcript,
      including mapped answers, flow transcripts, source metadata, regenerated
      Basic Interview Notes metadata, saved DeepSeek job metadata, and resetting
      DeepSeek processing status to not_started while carrying forward preserved
      review scores.
    locked: false
    inputs:
      row:
        type: PySideHistoryRow
        required: true
      session:
        type: PySideInterviewSession
        required: true
      result:
        type: IndeedTranscriptImportResult
        required: true
      source_path:
        type: Path
        required: true
      artifact_updates:
        type: dict[str, Any] | None
        required: false
        default: None
    returns:
      type: dict[str, Any]
    exceptions: []
    side_effects: none
  - name: _regenerate_history_import_artifacts
    description: Regenerate Basic Interview Notes and write a not-started DeepSeek
      finalize job for a history-row Indeed transcript import without launching
      the DeepSeek worker.
    locked: false
    inputs:
      row:
        type: PySideHistoryRow
        required: true
      session:
        type: PySideInterviewSession
        required: true
    returns:
      type: dict[str, Any]
    exceptions:
    - Exception
    side_effects: Writes a Basic Interview Notes DOCX, writes a deepseek-finalize
      JSON job under DEFAULT_BASE_DIR/deepseek_jobs, and returns history updates.
  - name: _import_indeed_transcript_for_history_row
    description: Prompt for an Indeed .txt transcript for a selected finalized history
      row, import it into that candidate's PySide session, persist mapped answers
      and transcript metadata to the history row, regenerate the Basic Interview
      Notes DOCX, save a DeepSeek job for the Generate button, and open the Review
      tab with editable ratings bound to that same history row.
    locked: false
    inputs:
      row:
        type: PySideHistoryRow
        required: true
    returns:
      type: None
    exceptions: []
    side_effects: Opens a local file picker, reads a .txt transcript, writes draft
      and interview-session snapshots, updates InterviewHistoryStore, refreshes
      history tables, and re-renders live/review/offer panes.
data_structures:
- name: InterviewRedesignModel
  type: dataclass
  description: Headless UI model for navigation, setup readiness, interview flows,
    home dashboard/history data, rubric data, and the history store path used for
    offer-status persistence; director_staffing_school optionally filters the Staffing
    v2 page to one assigned school in director mode.
- name: PySideHistoryRow
  type: dataclass
  description: Render-ready finalized interview history row with stable row key,
    interview date, candidate, school, position, score, status, offer status/action,
    notes path, report path, DeepSeek job/progress paths, candidate email, offer path, and detached DeepSeek processing state/warning for the
    searchable, filterable, sortable, outcome-colored, content-sized PySide history
    grid and offer workflow. Status must follow score display thresholds when a
    numeric score is present unless explicit no-hire override metadata or an
    incomplete/processing state is present.
- name: TrackFlow
  type: dataclass
  description: Ordered question flow for one role track.
- name: FlowQuestion
  type: dataclass
  description: Render-ready intro, qualification, custom, or scored interview question data; scored
    trait followups may come from followups, follow_up_prompts, or follow_up_probes
    rubric fields.
- name: ScoreCard
  type: dataclass
  description: One selectable score value and full plain-language rubric descriptor
    shown beside the PySide rating selection.
- name: PySideReviewSummary
  type: dataclass
  description: Score, determination, missing scores, strongest evidence, concerns, and recommended next action for PySide review.
- name: PySideOnboardingBoard
  type: dataclass
  description: Counts, next task, and employee rows for PySide onboarding board.
- name: PySideCandidateBoard
  type: dataclass
  description: Candidate list rows, shared history-grid rows, and summary count for PySide candidate view.
- name: pyside_desktop_surface
  type: documented_surface_map
  description: Single supported desktop GUI surface. PySide implements interview finalize/history,
    onboarding, Admin Studio, settings, validation, notification editing, path-safety,
    and UI-mode behavior directly with setup_and_run/runtime_wrapper launch support while
    shared runtime/services remain toolkit-neutral.
dependencies:
- module: admin_studio
- module: data_store
- module: interview_runtime
- module: notification_service
- module: onboarding_operations
- module: platform_services
- module: scoring_reporting
- module: staffing_dashboard_v2
- module: staffing_referral_queue
- module: staffing_service
- module: staffing_store
- module: PySide6
