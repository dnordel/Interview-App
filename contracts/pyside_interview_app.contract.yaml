    side_effects: Reads candidate history payloads without mutation.
  - name: _sync_candidate_report_import
    description: Version imported candidate answer transcripts into any existing structured Candidate Interview Report so both admin and director snapshots display the same question-aligned transcript text.
    locked: false
    inputs:
      history_id:
        type: str
        required: true
      result:
        type: IndeedTranscriptImportResult
        required: true
    returns:
      type: None
    exceptions:
    - CandidateReportError
    side_effects: May version and audit working and finalized candidate-report snapshots in the interview-history database.
  - name: _collect_indeed_transcript_import_request
    description: Show the new-transcript import dialog for candidate name, interview
      date, school, track, and .txt transcript file path.
    locked: false
    inputs: {}
    returns:
      type: dict[str, Any] | None
    exceptions: []
    side_effects: Opens a modal PySide dialog and may show validation warning.
  - name: _persist_new_indeed_import_history_row
    description: Append an Incomplete candidate history row for a new Indeed transcript
      import using mapped answers and transcript metadata.
    locked: false
    inputs:
      session:
        type: PySideInterviewSession
        required: true
      result:
        type: IndeedTranscriptImportResult
        required: true
      source_path:
        type: Path
        required: true
    returns:
      type: str
    exceptions: []
    side_effects: Appends one InterviewHistoryStore row and returns its history_id.
  - name: _track_key_for_history_row
    description: Resolve the interview track key for a finalized history row from its
      position text, falling back to the first configured track when no direct label
      match exists.
    locked: false
    inputs:
      row:
        type: PySideHistoryRow
        required: true
    returns:
      type: str
    exceptions: []
    side_effects: none
  - name: _session_from_history_row
    description: Build a PySideInterviewSession for a finalized history row so an
      imported Indeed transcript can be attached to the existing candidate and
      opened for review-score edits while preserving prior answers, review scores,
      and scoring-row raw scores from history payload data, with the structured
      candidate-report snapshot used as a fallback for finalized rows whose compact
      history payload does not contain interview content.
    locked: false
    inputs:
      row:
        type: PySideHistoryRow
        required: true
    returns:
      type: PySideInterviewSession
    exceptions:
    - ValueError
    side_effects: Writes the new draft through PySideInterviewSession.start.
  - name: _history_payload_for_row
    description: Load the full persisted history payload for a rendered history row key.
    locked: false
    inputs:
      row:
        type: PySideHistoryRow
        required: true
    returns:
      type: dict[str, Any]
    exceptions: []
    side_effects: none
  - name: _hydrate_session_from_history_payload
    description: Copy saved answers, structured candidate-report questions and transcripts,
      qualification, review score edits, and scoring raw-score values from a persisted
      payload into a PySide session before transcript import or notes regeneration.
    locked: false
    inputs:
      session:
        type: PySideInterviewSession
        required: true
      payload:
        type: dict[str, Any]
        required: true
    returns:
      type: None
    exceptions: []
    side_effects: Mutates the in-memory PySideInterviewSession answers, qualification,
      and candidate transcripts.
  - name: _history_import_updates
    description: Build the history-store payload for an imported Indeed transcript,
      including mapped answers, flow transcripts, source metadata, regenerated
      Basic Interview Notes metadata, and preserved review scores.
    locked: false
    inputs:
      row:
        type: PySideHistoryRow
        required: true
      session:
        type: PySideInterviewSession
        required: true
      result:
        type: IndeedTranscriptImportResult
        required: true
      source_path:
        type: Path
        required: true
      artifact_updates:
        type: dict[str, Any] | None
        required: false
        default: None
    returns:
      type: dict[str, Any]
    exceptions: []
    side_effects: none
  - name: _regenerate_history_import_artifacts
    description: Regenerate Basic Interview Notes from recovered history or structured
      candidate-report content and fail closed before writing when no saved answers,
      scores, skips, flags, or transcripts are available.
    locked: false
    inputs:
      row:
        type: PySideHistoryRow
        required: true
      session:
        type: PySideInterviewSession
        required: true
    returns:
      type: dict[str, Any]
    exceptions:
    - ValueError
    - Exception
    side_effects: Writes a Basic Interview Notes DOCX and returns history updates.
  - name: _regenerate_history_notes
    description: Regenerate a selected history row's Basic Interview Notes from its persisted interview data.
    locked: false
    inputs:
      row:
        type: PySideHistoryRow
        required: true
    returns:
      type: None
    exceptions: []
    side_effects: Rebuilds the notes document, updates the existing history row, refreshes history, and may show an operator warning.
  - name: _import_indeed_transcript_for_history_row
    description: Prompt for an Indeed .txt transcript for a selected finalized history
      row, import it into that candidate's PySide session, persist mapped answers
      and transcript metadata to the history row, regenerate the Basic Interview
      Notes DOCX, and open the Review
      tab with editable ratings bound to that same history row.
    locked: false
    inputs:
      row:
        type: PySideHistoryRow
        required: true
    returns:
      type: None
    exceptions: []
    side_effects: Opens a local file picker, reads a .txt transcript, writes draft
      and interview-session snapshots, updates InterviewHistoryStore, refreshes
      history tables, and re-renders live/review/offer panes.
  - name: _sync_hiring_v2_director_decisions
    description: Reconcile finalized Staffing director decisions into hiring; each Hire derives contact, shift, template, classroom, and pay terms and idempotently submits one immutable offer version for executive approval, while dependency failures remain retryable as offer_draft_pending.
    locked: false
    inputs:
      service: {type: HiringWorkflowService, required: true}
    returns: {type: None}
    exceptions: []
    side_effects: Reads staffing/history/settings stores; initializes/migrates existing staffing databases before director-decision reads; may update canonical candidate contact, hiring stage/attention, and create one pending-approval offer version.
  - name: _director_offer_terms
    description: Build normalized offer terms from candidate, application, finalized director shift/classroom, requested pay, and configured school template/output paths.
    locked: false
    inputs:
      application: {type: Any, required: true}
      candidate: {type: Any, required: true}
      interview: {type: Any, required: true}
    returns: {type: 'dict[str, Any]'}
    exceptions: [ValueError]
    side_effects: Reads school offer settings and interview history.
  - name: _requested_pay_answer
    description: Return raw initial-interview Pay answer from canonical answers or custom_answers history payload.
    locked: false
    inputs:
      history_id: {type: str, required: true}
    returns: {type: str}
    exceptions: []
    side_effects: Reads InterviewHistoryStore.
data_structures:
- name: InterviewRedesignModel
  type: dataclass
  description: Headless UI model for navigation, setup readiness, interview flows,
    home dashboard/history data, rubric data, and the history store path used for
    offer-status persistence; director_staffing_school optionally filters the Staffing
    v2 page to one assigned school in director mode.
- name: PySideHistoryRow
  type: dataclass
  description: Render-ready finalized interview history row with stable row key,
    interview date, candidate, school, position, score, status, offer status/action,
    notes path, report path, candidate email, candidate phone, and offer path for the
    searchable, filterable, sortable, outcome-colored, content-sized PySide history
    grid and offer workflow. Status must follow score display thresholds when a
    numeric score is present unless explicit no-hire override metadata or an
    incomplete/processing state is present.
- name: TrackFlow
  type: dataclass
  description: Ordered question flow for one role track.
- name: FlowQuestion
  type: dataclass
  description: Render-ready intro, qualification, custom, or scored interview question data; scored
    trait followups may come from followups, follow_up_prompts, or follow_up_probes
    rubric fields and may carry semantic stage, priority, and weight metadata.
- name: ScoreCard
  type: dataclass
  description: One selectable score value and full plain-language rubric descriptor
    shown beside the PySide rating selection, plus an optional configured sample-answer anchor.
- name: PySideReviewSummary
  type: dataclass
  description: Score, determination, missing scores, strongest evidence, concerns, and recommended next action for PySide review.
- name: PySideOnboardingBoard
  type: dataclass
  description: Counts, next task, and employee rows for PySide onboarding board.
- name: PySideCandidateBoard
  type: dataclass
  description: Candidate list rows, shared history-grid rows, and summary count for PySide candidate view.
- name: pyside_desktop_surface
  type: documented_surface_map
  description: Single supported desktop GUI surface. PySide implements interview finalize/history,
    onboarding, admin-only Staffing v2 Settings, validation, Staffing v2 notification routing, path-safety,
    and UI-mode behavior directly with setup_and_run/runtime_wrapper launch support while
    shared runtime/services remain toolkit-neutral.
