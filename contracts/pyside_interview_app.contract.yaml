module:
  name: pyside_interview_app
  language: python
  path: src/pyside_interview_app.py
  version: 1.19.0
  description: PySide6 redesign shell and headless view-model builder for guided
    interview workflow with searchable, filterable, sortable, outcome-colored,
    content-sized history table behavior, compact home draft actions beside the
    start action, guided review-then-apply Admin Studio backed by admin_studio
    with readable wrapped admin tables and visible edit mode, interview notes
    regeneration actions, user-closable
    finalize progress with immediate ordered task/status rows in a compact scrollable
    dialog, successful-completion auto-close, live history refresh, and single-surface parity documentation
    for desktop Tk contracts while preserving Tk-owned finalize, history, document,
    and DeepSeek runtime contracts.
functions:
- name: build_interview_redesign_model
  description: Build workflow-first home, setup, live interview, review, offer, onboarding, and admin view data from rubric, intro script, question flow, and merged canonical plus legacy history JSON.
  locked: false
  inputs:
    rubric_path:
      type: Path
      required: false
      default: DEFAULT_RUBRIC_PATH
    overrides_path:
      type: Path
      required: false
      default: QUESTIONS_OVERRIDE_PATH
    history_path:
      type: Path
      required: false
      default: INTERVIEW_HISTORY_PATH
    school_options:
      type: Sequence[str]
      required: false
      default: DEFAULT_SCHOOL_OPTIONS
  returns:
    type: InterviewRedesignModel
  exceptions:
  - ValueError
  side_effects: Reads local rubric, question override, user_artifacts history JSON, and root-level legacy history JSON when the canonical history path is used; may normalize question flow through QuestionOverridesStore.
- name: build_pyside_onboarding_board
  description: Build PySide onboarding dashboard counts and employee next-task rows from existing onboarding state.
  locked: false
  inputs:
    employees:
      type: list[Any]
      required: true
    scheduler_settings:
      type: dict[str, Any] | None
      required: true
    today:
      type: date
      required: true
  returns:
    type: PySideOnboardingBoard
  exceptions: []
  side_effects: none
- name: build_pyside_candidate_board
  description: Build PySide candidate list rows, shared history-grid rows, and hiring status summary from interview history rows. Numeric history scores are canonical for display thresholds unless an explicit no-hire override, incomplete state, or processing state is present; 80% and above displays Hire, 65% through below 80% displays Borderline, and below 65% displays No Hire.
  locked: false
  inputs:
    history_rows:
      type: Sequence[dict[str, Any] | PySideHistoryRow]
      required: true
  returns:
    type: PySideCandidateBoard
  exceptions: []
  side_effects: none
- name: _coerce_history_percent
  description: Parse a history score value or percent string into a display-safe 0 through 100 numeric percent for PySide history status thresholding; invalid or out-of-range values return None.
  locked: false
  inputs:
    value:
      type: Any
      required: true
  returns:
    type: float | None
  exceptions: []
  side_effects: none
- name: _history_has_no_hire_override
  description: Return whether a persisted history row contains explicit human disqualifier, critical-score, locked-rule, or override-rationale metadata that should preserve a No Hire status even when numeric score is 65% or higher; DeepSeek automatic no-hire advisory metadata alone does not preserve No Hire.
  locked: false
  inputs:
    row:
      type: dict[str, Any]
      required: true
  returns:
    type: bool
  exceptions: []
  side_effects: none
- name: _history_status_from_score
  description: Derive PySide history display status from score thresholds, preserving incomplete and processing statuses plus explicit human no-hire override metadata; DeepSeek automatic no-hire advisory metadata alone follows the numeric score, 80% and above returns Hire, 65% through below 80% returns Borderline, and below 65% returns No Hire.
  locked: false
  inputs:
    row:
      type: dict[str, Any]
      required: true
    score:
      type: Any
      required: true
    status:
      type: Any
      required: true
  returns:
    type: str
  exceptions: []
  side_effects: none
- name: latest_pyside_draft_path
  description: Return the newest PySide draft JSON path from the draft directory, if one exists.
  locked: false
  inputs:
    drafts_dir:
      type: Path
      required: false
      default: DEFAULT_BASE_DIR / "pyside_drafts"
  returns:
    type: Path | None
  exceptions: []
  side_effects: Reads PySide draft directory metadata.
- name: standard_window_control_flags
  description: Return PySide window flags that keep the native title bar, system menu, minimize, maximize, and close controls visible.
  locked: false
  inputs:
    QtCore:
      type: Any
      required: true
  returns:
    type: Any
  exceptions: []
  side_effects: none
- name: _normalize_history_search
  description: Normalize free-text PySide history search input or row metadata for case-insensitive fuzzy matching without exposing hidden candidate artifacts.
  locked: false
  inputs:
    value:
      type: str
      required: true
  returns:
    type: str
  exceptions: []
  side_effects: none
- name: _history_token_matches
  description: Return whether one normalized search term approximately matches any normalized history metadata token.
  locked: false
  inputs:
    term:
      type: str
      required: true
    candidates:
      type: list[str]
      required: true
  returns:
    type: bool
  exceptions: []
  side_effects: none
- name: _history_outcome_color
  description: Map a normalized hiring outcome/status label to a soft table-row background color for the PySide history grid.
  locked: false
  inputs:
    outcome:
      type: str
      required: true
  returns:
    type: str
  exceptions: []
  side_effects: none
- name: launch_pyside_interview_app
  description: Launch the PySide6 redesigned desktop shell using the supplied model or current repository configuration.
  locked: false
  inputs:
    model:
      type: InterviewRedesignModel | None
      required: false
      default: null
  returns:
    type: int
  exceptions:
  - PySide6UnavailableError
  side_effects: Creates a QApplication and opens the redesigned desktop window.
- name: main
  description: Command-line entry point for the PySide6 redesigned interview assistant.
  locked: false
  inputs: {}
  returns:
    type: int
  exceptions:
  - PySide6UnavailableError
  side_effects: Launches the PySide6 desktop UI.
classes:
- name: PySideInterviewSession
  description: Autosaved PySide interview session state for guided question flow and draft resume.
  locked: false
  attributes:
    model:
      type: InterviewRedesignModel
    draft_path:
      type: Path
    candidate_name:
      type: str
    school:
      type: str
    track_key:
      type: str
    current_index:
      type: int
    answers:
      type: dict[str, dict[str, Any]]
    qualification:
      type: dict[str, Any]
    flow_time_marks:
      type: list[dict[str, Any]]
    flow_candidate_transcripts:
      type: dict[int, str]
    flow_recordings:
      type: dict[int, dict[str, Any]]
  methods:
  - name: start
    description: Start a new guided interview session at the school-specific intro script and persist initial draft state.
    locked: false
    inputs:
      candidate_name:
        type: str
        required: true
      school:
        type: str
        required: true
      track_key:
        type: str
        required: true
    returns:
      type: None
    exceptions:
    - ValueError
    side_effects: Writes PySide draft JSON.
  - name: active_question
    description: Return the current intro, custom, or scored question, or None when the session has reached review.
    locked: false
    inputs: {}
    returns:
      type: FlowQuestion | None
    exceptions: []
    side_effects: none
  - name: save_answer_and_advance
    description: Save one answer, score, optional skipped state, and quick-action set, advance to the next question, and autosave the draft.
    locked: false
    inputs:
      notes:
        type: str
        required: true
      score:
        type: str
        required: false
        default: ''
      quick_actions:
        type: Sequence[str]
        required: false
        default: ()
      qualification:
        type: dict[str, Any] | None
        required: false
        default: null
      skipped:
        type: bool
        required: false
        default: false
    returns:
      type: None
    exceptions: []
    side_effects: Writes PySide draft JSON.
  - name: go_back
    description: Move the guided PySide session back to the previous question without deleting saved answers and autosave the draft.
    locked: false
    inputs: {}
    returns:
      type: None
    exceptions: []
    side_effects: Writes PySide draft JSON.
  - name: skip_active_question
    description: Save the active question as intentionally skipped with optional notes and quick actions, leave score blank, advance to the next question, and autosave the draft.
    locked: false
    inputs:
      notes:
        type: str
        required: false
        default: ''
      quick_actions:
        type: Sequence[str]
        required: false
        default: ()
    returns:
      type: None
    exceptions: []
    side_effects: Writes PySide draft JSON.
  - name: review_summary
    description: Evaluate completed PySide trait scores with existing scoring rules and return review-screen summary data.
    locked: false
    inputs: {}
    returns:
      type: PySideReviewSummary
    exceptions:
    - ReportingValidationError
    side_effects: none
  - name: offer_review_defaults
    description: Return prefilled offer wizard fields from candidate setup and interview review outcome.
    locked: false
    inputs: {}
    returns:
      type: dict[str, str]
    exceptions:
    - ReportingValidationError
    side_effects: none
  - name: generate_offer_document
    description: Render a Word offer letter from the completed PySide session and selected offer template.
    locked: false
    inputs:
      template_path:
        type: Path
        required: true
      output_dir:
        type: Path
        required: true
      start_date:
        type: date
        required: true
      start_time_12h:
        type: str
        required: true
      end_time_12h:
        type: str
        required: true
      hourly_pay:
        type: float
        required: true
      hours:
        type: int
        required: true
      created_on:
        type: date
        required: true
    returns:
      type: Path
    exceptions:
    - OfferTemplateError
    - OSError
    side_effects: Writes rendered offer DOCX to the selected output directory.
  - name: generate_interview_notes_document
    description: Compatibility wrapper that finalizes the PySide session through
      the shared desktop finalize path and returns the generated interview-notes
      DOCX path.
    locked: false
    inputs:
      output_dir:
        type: Path
        required: true
    returns:
      type: Path
    exceptions:
    - OSError
    side_effects: Writes generated interview-notes DOCX, integration export, history
      row, and queued DeepSeek job metadata under the selected output directory.
  - name: finalize_interview
    description: Finalize the completed PySide session using shared Tk desktop runtime
      contracts for scoring, DocxExporter report generation, integration export,
      transcript metadata, history persistence, and detached DeepSeek processing.
    locked: false
    inputs:
      base_dir:
        type: Path
        required: false
        default: DEFAULT_BASE_DIR
      history_path:
        type: Path
        required: false
        default: INTERVIEW_HISTORY_PATH
      gateways:
        type: FinalizeGateways | None
        required: false
        default: null
    returns:
      type: dict[str, Any]
    exceptions:
    - ReportingValidationError
    - OSError
    side_effects: Writes interview-notes DOCX to the resolved per-school Dropbox
      candidate folder when configured, writes integration export, finalized interview
      history row, and detached DeepSeek job/progress files under the base output
      root when history persistence has a path; includes any PySide recording/transcript
      payload in the queued DeepSeek job.
  - name: _transcript_metadata
    description: Build complete/partial transcript metadata from PySide flow transcript
      and recording state for finalize/history payloads.
    locked: false
    inputs: {}
    returns:
      type: dict[str, Any]
    exceptions: []
    side_effects: none
  - name: to_draft
    description: Serialize the session as versioned draft JSON data.
    locked: false
    inputs: {}
    returns:
      type: dict[str, Any]
    exceptions: []
    side_effects: none
  - name: save_draft
    description: Atomically write current session state to the configured draft path.
    locked: false
    inputs: {}
    returns:
      type: None
    exceptions:
    - OSError
    side_effects: Writes PySide draft JSON.
  - name: load
    description: Load and validate a versioned PySide interview draft.
    locked: false
    inputs:
      model:
        type: InterviewRedesignModel
        required: true
      draft_path:
        type: Path
        required: true
    returns:
      type: PySideInterviewSession
    exceptions:
    - ValueError
    side_effects: Reads PySide draft JSON.
- name: PySideInterviewWindow
  description: Main PySide6 window with navigation for Interviews, Candidates, Offers,
    Onboarding, Admin Studio, top-level Tk/PySide UI switching, and scrollable
    live/review interview panes with wrapped long question and score text. The
    home start panel places Continue/Delete Saved Draft actions beside Begin Interview
    so the Home history grid remains visually prioritized; home and Candidates history grids share the same Date, Candidate, School, Position, Score, Status,
    Interview Notes, Regenerate, Offer, and confirmed Delete actions; supports column sorting, fuzzy search,
    school/outcome filters, hiring-outcome row color, content-sized text columns,
    compact notes/offer/delete action columns, Processing notes state during detached
    DeepSeek work, and live refresh after finalize; Open Notes opens the selected
    interview notes file and Generate Offer opens the PySide offer wizard from
    either the selected history row or completed review screen; Admin Studio exposes
    checkpoint notification rule rows for editable active flags, templates, and recipients.
  locked: false
  attributes:
    model:
      type: InterviewRedesignModel
    window:
      type: QMainWindow
    school_offer_store:
      type: SchoolOfferSettingsStore
    school_folder_settings_table:
      type: QTableWidget | None
    admin_studio:
      type: AdminStudio
    admin_draft:
      type: AdminStudioDraft
  methods:
  - name: show
    description: Show the redesigned PySide6 main window.
    locked: false
    inputs: {}
    returns:
      type: None
    exceptions: []
    side_effects: Displays the QMainWindow.
  - name: _admin_studio_paths
    description: Build the AdminStudioPaths using the current PySide module config
      constants.
    locked: false
    inputs: {}
    returns:
      type: AdminStudioPaths
    exceptions: []
    side_effects: none
  - name: _set_admin_editing_enabled
    description: Toggle Admin Studio tables between read-only mode and explicit edit
      mode, including visible edit-state button text, editable-cell highlighting,
      and readable table wrapping.
    locked: false
    inputs:
      enabled:
        type: bool
        required: true
    returns:
      type: None
    exceptions: []
    side_effects: Updates Admin Studio widgets.
  - name: _review_admin_changes
    description: Capture Admin Studio table edits, show a review confirmation, and
      apply confirmed valid changes through admin_studio with backups.
    locked: false
    inputs: {}
    returns:
      type: None
    exceptions: []
    side_effects: May show confirmation or warning dialogs; writes changed admin
      JSON files through AdminStudio only when confirmed and validation passes.
  - name: _discard_admin_changes
    description: Reset the current Admin Studio draft and return the UI to read-only
      mode.
    locked: false
    inputs: {}
    returns:
      type: None
    exceptions: []
    side_effects: Updates Admin Studio widgets.
  - name: _start_pyside_interview_recording
    description: Start optional continuous PySide interview recording using the shared
      local recorder, or record a non-blocking warning when recording dependencies
      are unavailable.
    locked: false
    inputs: {}
    returns:
      type: None
    exceptions: []
    side_effects: Resets PySide session transcript state and may start FFmpeg-backed
      local recording.
  - name: _stop_pyside_interview_recording
    description: Stop optional PySide continuous recording, transcribe it locally,
      map candidate transcript segments to interview flow items, and save the draft.
    locked: false
    inputs: {}
    returns:
      type: None
    exceptions: []
    side_effects: May write WAV/transcript artifacts under DEFAULT_BASE_DIR and update
      session flow_recordings/flow_candidate_transcripts.
  - name: _render_live_footer
    description: Render persistent Live Interview footer actions with Back and Skip
      on the left, Next or Finalize plus Exit on the right, and disable Next/Finalize
      on scored questions until a rating is selected.
    locked: false
    inputs:
      item:
        type: FlowQuestion | None
        required: true
    returns:
      type: None
    exceptions: []
    side_effects: Re-renders the fixed PySide live-interview footer.
  - name: _finalize_from_live_question
    description: Save the current final answer, stamp the final transcript boundary,
      start background recording/transcription plus finalize work, and show the
      Interview Complete review screen without blocking the PySide UI thread.
    locked: false
    inputs: {}
    returns:
      type: None
    exceptions: []
    side_effects: Writes draft/finalize artifacts through a background worker and
      switches to the review tab.
  - name: _skip_live_question
    description: Save the active live question as skipped and advance without requiring a scored rating.
    locked: false
    inputs: {}
    returns:
      type: None
    exceptions: []
    side_effects: Writes PySide draft JSON and re-renders the live interview page.
  - name: _go_back_live_question
    description: Return the live interview view to the previous question while preserving saved answers for review or overwrite.
    locked: false
    inputs: {}
    returns:
      type: None
    exceptions: []
    side_effects: Writes PySide draft JSON and re-renders live, review, and offer panes.
  - name: _restore_live_answer
    description: Rehydrate notes, selected score, and quick-action checks for a previously answered live question.
    locked: false
    inputs:
      item:
        type: FlowQuestion
        required: true
    returns:
      type: None
    exceptions: []
    side_effects: Updates visible live-interview form widgets.
  - name: _update_live_next_enabled
    description: Enable Next or Finalize for non-scored questions and for scored questions only after a rating is selected.
    locked: false
    inputs:
      item:
        type: FlowQuestion | None
        required: true
    returns:
      type: None
    exceptions: []
    side_effects: Updates visible live-interview footer button state.
  - name: _poll_pyside_finalize_worker
    description: Poll background PySide finalize results, drain progress updates,
      refresh history/candidate tables, and update review status text when recording/transcription
      and notes generation complete or fail.
    locked: false
    inputs:
      results:
        type: queue.Queue[dict[str, Any]]
        required: true
      timer:
        type: QTimer
        required: true
    returns:
      type: None
    exceptions: []
    side_effects: Stops the polling timer, clears finalize running state, updates
      the review status label, refreshes visible history tables, and starts optional
      detached DeepSeek progress polling.
  - name: _show_pyside_finalize_progress
    description: Show a user-closable non-modal PySide finalize progress dialog with
      immediate ordered sanitized task/status rows in a compact scrollable task pane
      and without exposing candidate transcript or notes
      text.
    locked: false
    inputs:
      step:
        type: str
        required: true
    returns:
      type: None
    exceptions: []
    side_effects: Creates or updates a QDialog, scroll area, indeterminate progress
      bar, and task/status label content.
  - name: _report_pyside_finalize_progress
    description: Queue or store one sanitized operator-facing finalize progress step
      for the PySide progress dialog task list.
    locked: false
    inputs:
      step:
        type: str
        required: true
    returns:
      type: None
    exceptions: []
    side_effects: Updates in-memory progress step and task/status state.
  - name: _refresh_pyside_finalize_progress
    description: Drain queued PySide finalize progress updates and render task/status
      rows in pipeline order when the progress dialog is still open.
    locked: false
    inputs: {}
    returns:
      type: None
    exceptions: []
    side_effects: Updates visible progress label text.
  - name: _read_pyside_deepseek_progress_step
    description: Read local detached DeepSeek progress JSON produced by the finalize
      queue and return sanitized step/status text.
    locked: false
    inputs: {}
    returns:
      type: tuple[str, str]
    exceptions: []
    side_effects: Reads a local progress JSON file path produced by finalize.
  - name: _read_pyside_deepseek_progress_tasks
    description: Read local detached DeepSeek progress JSON task rows and normalize
      them for the PySide finalize task/status display.
    locked: false
    inputs: {}
    returns:
      type: list[dict[str, str]]
    exceptions: []
    side_effects: Reads a local progress JSON file path produced by finalize.
  - name: _watch_pyside_deepseek_finalize_progress
    description: Poll detached DeepSeek progress JSON while the PySide progress dialog
      remains open, refresh visible status, reload history when processing completes
      or fails, and schedule dialog auto-close after successful completion.
    locked: false
    inputs:
      progress_path:
        type: str | Path | None
        required: true
    returns:
      type: None
    exceptions: []
    side_effects: May start or stop a QTimer and refresh visible history tables.
  - name: _close_pyside_finalize_progress
    description: Close the PySide finalize progress dialog and stop progress polling
      without cancelling background transcription, finalize, or DeepSeek work.
    locked: false
    inputs: {}
    returns:
      type: None
    exceptions: []
    side_effects: Closes QDialog and clears progress widget references.
  - name: _schedule_close_pyside_finalize_progress
    description: Schedule the PySide finalize progress dialog to close shortly after
      successful finalize or DeepSeek completion while leaving failure states visible
      for review.
    locked: false
    inputs: {}
    returns:
      type: None
    exceptions: []
    side_effects: Starts a one-shot Qt timer that closes the progress dialog.
  - name: _exit_live_interview
    description: Persist current PySide draft state and return to the interview home tab.
    locked: false
    inputs: {}
    returns:
      type: None
    exceptions: []
    side_effects: Writes PySide draft JSON and changes visible tab.
  - name: _refresh_home_draft_panel
    description: Refresh the compact PySide home draft label and adjacent Continue/Delete Saved Draft button enabled states from the latest existing draft.
    locked: false
    inputs: {}
    returns:
      type: None
    exceptions: []
    side_effects: Updates visible PySide home draft controls.
  - name: _delete_latest_draft
    description: Confirm with the operator, delete the latest saved PySide interview draft when it still exists, clear the active matching session, and refresh home controls.
    locked: false
    inputs: {}
    returns:
      type: None
    exceptions: []
    side_effects: Shows a PySide confirmation dialog, may delete one draft JSON file, and updates visible home draft controls.
  - name: _deepseek_retry_job_path_for_row
    description: Resolve the persisted DeepSeek job JSON path for a failed history
      row from the row key and configured history/base directories, rejecting unsafe
      path-bearing row keys.
    locked: false
    inputs:
      row:
        type: PySideHistoryRow
        required: true
    returns:
      type: Path | None
    exceptions: []
    side_effects: Checks local filesystem path existence.
  - name: _retry_history_deepseek
    description: Relaunch a persisted DeepSeek finalize job for a history row in full
      or document-only regeneration mode, refresh history tables to Processing, and
      attach the existing progress dialog watcher to the progress JSON.
    locked: false
    inputs:
      row:
        type: PySideHistoryRow
        required: true
    returns:
      type: None
    exceptions: []
    side_effects: Reads a local job JSON path, updates history through interview_runtime
      regeneration behavior, starts a detached worker, shows warnings on failure,
      and refreshes visible history/progress UI.
  - name: _choose_pyside_notes_regeneration_mode
    description: Ask whether notes regeneration should rerun local DeepSeek and rebuild
      the document or rebuild only the document from saved data using explicit action
      buttons.
    locked: false
    inputs:
      row:
        type: PySideHistoryRow
        required: true
    returns:
      type: str | None
    exceptions: []
    side_effects: Shows a PySide modal selection dialog.
  - name: _open_history_notes
    description: Open a selected history row's interview notes DOCX in the OS default
      application immediately when the local path exists; when a failed row has no
      notes document, route to regeneration.
    locked: false
    inputs:
      row:
        type: PySideHistoryRow
        required: true
    returns:
      type: None
    exceptions: []
    side_effects: May launch the OS default document application, show a missing-file
      warning dialog, or start regeneration for failed rows without a document.
  - name: _open_session_offer
    description: Route the completed active PySide session from the review screen
      to the Offers wizard, clearing any selected history offer row so fields are
      prefilled from current session answers.
    locked: false
    inputs: {}
    returns:
      type: None
    exceptions: []
    side_effects: Re-renders the offer page and switches sidebar/stack navigation
      to Offers.
  - name: _delete_history_row
    description: Confirm with the operator, delete one selected PySide history row
      by stable row key, and reload Home/Candidates history tables when deletion succeeds.
    locked: false
    inputs:
      row:
        type: PySideHistoryRow
        required: true
    returns:
      type: None
    exceptions: []
    side_effects: Shows a PySide confirmation dialog, may update persisted history,
      and refreshes visible history tables.
  - name: _set_history_search_text
    description: Update the in-memory PySide history fuzzy search text and refresh the visible history table.
    locked: false
    inputs:
      value:
        type: str
        required: true
    returns:
      type: None
    exceptions: []
    side_effects: Re-renders the visible PySide history table.
  - name: _set_history_school_filter
    description: Update the selected school filter and refresh the visible PySide history table.
    locked: false
    inputs:
      value:
        type: str
        required: true
    returns:
      type: None
    exceptions: []
    side_effects: Re-renders the visible PySide history table.
  - name: _set_history_outcome_filter
    description: Update the optional hiring outcome filter and refresh the visible PySide history table.
    locked: false
    inputs:
      value:
        type: str
        required: true
    returns:
      type: None
    exceptions: []
    side_effects: Re-renders the visible PySide history table.
  - name: _refresh_history_table
    description: Rebuild a visible PySide history table from supplied rows or current in-memory search and filter state while preserving action buttons and sortable columns.
    locked: false
    inputs:
      table:
        type: QTableWidget | None
        required: false
        default: null
      rows:
        type: Sequence[PySideHistoryRow] | None
        required: false
        default: null
    returns:
      type: None
    exceptions: []
    side_effects: Re-renders the visible PySide history table.
  - name: _refresh_all_history_tables
    description: Refresh every PySide table that renders finalized interview history,
      including Home and Candidates, through the same row rendering code path.
    locked: false
    inputs: {}
    returns:
      type: None
    exceptions: []
    side_effects: Re-renders registered PySide history table widgets.
  - name: _history_notes_action_state
    description: Return the Notes-column label, enabled state, and tooltip for a PySide
      history row, showing Processing during detached DeepSeek work, Failed/Retry
      when detached DeepSeek failed, and preventing missing-path opens.
    locked: false
    inputs:
      row:
        type: PySideHistoryRow
        required: true
    returns:
      type: tuple[str, bool, str]
    exceptions: []
    side_effects: none
  - name: _create_history_table
    description: Create a shared expanding PySide history-grid table with Date, Candidate, School, Position, Score, Status, Notes, Regenerate, Offer, and Delete columns.
    locked: false
    inputs:
      object_name:
        type: str
        required: true
    returns:
      type: QTableWidget
    exceptions: []
    side_effects: Creates a PySide table widget.
  - name: _size_history_table_columns
    description: Size PySide history text columns to visible content while keeping Notes, Offer, and Delete action columns compact.
    locked: false
    inputs:
      table:
        type: QTableWidget
        required: true
    returns:
      type: None
    exceptions: []
    side_effects: Updates visible PySide history table column widths.
data_structures:
- name: InterviewRedesignModel
  type: dataclass
  description: Headless UI model for navigation, setup readiness, interview flows,
    home dashboard/history data, rubric data, and the history JSON path used for
    offer-status persistence.
- name: PySideHistoryRow
  type: dataclass
  description: Render-ready finalized interview history row with stable row key,
    interview date, candidate, school, position, score, status, offer status/action,
    notes path, report path, and detached DeepSeek processing state/warning for the
    searchable, filterable, sortable, outcome-colored, content-sized PySide history
    grid and offer workflow. Status must follow score display thresholds when a
    numeric score is present unless explicit no-hire override metadata or an
    incomplete/processing state is present.
- name: TrackFlow
  type: dataclass
  description: Ordered question flow for one role track.
- name: FlowQuestion
  type: dataclass
  description: Render-ready intro, qualification, custom, or scored interview question data; scored
    trait followups may come from followups, follow_up_prompts, or follow_up_probes
    rubric fields.
- name: ScoreCard
  type: dataclass
  description: One selectable score value and full plain-language rubric descriptor
    shown beside the PySide rating selection.
- name: PySideReviewSummary
  type: dataclass
  description: Score, determination, missing scores, strongest evidence, concerns, and recommended next action for PySide review.
- name: PySideOnboardingBoard
  type: dataclass
  description: Counts, next task, and employee rows for PySide onboarding board.
- name: PySideCandidateBoard
  type: dataclass
  description: Candidate list rows, shared history-grid rows, and summary count for PySide candidate view.
- name: tk_contract_parity
  type: documented_parity_map
  description: Single-surface PySide desktop parity marker for Tk-bearing contracts
    including interview_app, ui_composition, ui_windows, question_settings_window,
    question_screens, onboarding_app, onboarding_scrollable_modal, onboarding_scroll_helpers,
    ui_feedback, tk_theme, keyboard_telemetry, template_placeholders, runtime_wrapper,
    and setup_and_run. PySide implements matching interview finalize/history behavior
    directly and documents partial/existing onboarding, admin, settings, validation,
    path-safety, and UI-mode surfaces here rather than creating mirrored PySide modules.
dependencies:
- module: admin_studio
- module: data_store
- module: interview_runtime
- module: notification_service
- module: onboarding_operations
- module: platform_services
- module: scoring_reporting
- module: ui_mode_switch
- module: PySide6
