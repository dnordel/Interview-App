module:
  name: pyside_interview_app
  language: python
  path: src/pyside_interview_app.py
  version: 1.68.0
  description: PySide6 redesign shell and headless view-model builder for guided
    interview workflow with searchable, filterable, sortable, outcome-colored,
    content-sized history table behavior, mockup-aligned staffing classroom detail dashboard with full left rail, resizable splitter sections, school/classroom selectors, wider color-coded classroom list with per-classroom status-count overview, metric cards, positions table, fully editable right-side assignment/person details drawer, guided action dialogs, legacy workbook compatibility tabs, actions, and metrics, parallel Staffing v2 navigation/page shell with its own mockup-style staffing sidebar, People / Employee Management and Assignment History sub-dashboards for the mockup-driven rewrite backed by staffing_dashboard_v2 while the legacy Staffing page remains available,
    director staffing-only launch mode that opens the Staffing v2 dashboard, keeps the full mockup navigation rail visible, filters to an assigned school when supplied, reuses the same Staffing v2 page, stores school-scoped director staffing data in school-specific SQLite files bootstrapped from the existing shared staffing DB on first use, imports queued hire/borderline interview referral and dismissal events into the matching school staffing database on launch and on a live timer, and records finalized or review-updated referral events to a central SQLite bridge queue instead of writing staffing databases directly,
    compact home draft actions beside the start action, guided review-then-apply Admin Studio backed by admin_studio
    with dashboard-first grouped admin-console navigation, standard icons on each
    selectable Admin Studio nav item, Environment/User cards at the bottom of the Admin Studio rail, distinct status pills,
    icon-labeled Admin Dashboard cards with wired Quick Links shortcuts including edit-mode notification rule creation, inline
    clickable Validation Review blocker list, refreshed Draft Changes file summaries,
    Publishing Readiness checklist rows, and validation-gated Publish Changes action,
    screen-aware initial window sizing and available-screen maximum-size clamping, adaptive resize behavior for narrow and desktop widths, font-metric-aware responsive navigation/action sizing for Windows text/display scaling, viewport-clamped main pages that allow vertical overflow without forcing a hard page width, horizontally scrollable workspace action bars,
    workspace action buttons, edit-gated model choice cards, no generic concept
    scaffolding panels in modern Admin Studio pages, hidden backing tables
    for legacy draft capture, dashboard panels, sectioned
    Questions & Flow cards with two-row wrapping track tabs, draft-backed per-track stacked flow pages that refresh after add/reorder/duplicate/delete actions, compact edit-gated reorder/duplicate/action controls, expanding prompt text columns, an edit-gated question drawer with combo-box metadata, required/scoring checkboxes, scoring-weight selection, weak-response flagging, and draft delete action, add-question drop zone
    with blank Create/Edit Question state,
    live drawer counters, Create/Edit Track dialog, mockup-style Rubrics trait cards with search, priority, weight, and linked-question filters, grid/list toggle, duplicate/delete actions, and edit-gated rubric
    trait editor with edit-gated weight minus/plus stepper, applicable-track checkboxes, descriptor and sample-answer text controls, validation impact, selected-trait-synced linked question preview/jump action, sample-answer
    rows, and publish-rule checklist panels, searchable read-only Signal Hints groups with category chips, selected-card state, selectable detail reference, colored High/Moderate/Low signal-level cards, and no legacy raw table fallback
    panel, selectable Templates & Folders school cards with wired Browse/Copy/Test Write actions, Add School draft flow, Delete School draft removal, offer template health cards with edit-gated New Template draft path picker, edit-gated detail drawer, folder picker, clipboard copy, and safe write-test probe action,
    selectable Notifications rule cards with enabled-status filtering, sort controls, edit-gated create-rule/editor flow, removable recipient chips backed by the draft recipients field, subject variable insertion controls, email body toolbar insertion controls, user-friendly trigger and modular relative-date scheduling controls for before/on/after any supported or typed date field, live validation,
    notification variable insertion chips, selected rule state, editor metadata,
    variables preview and validation panels, and template preview dialog, selectable
    DeepSeek Model comparison cards with hidden backing selector, hardware, Ollama compatibility, and performance guidance panels,
    DeepSeek Prompt templates with mockup feature summary strip, searchable prompt cards, selected-prompt status/metadata header, edit-gated new-template draft flow, edit-gated prompt editor, edit-gated prompt version note field that unblocks publish validation, right-side Inspector/Activity tab panel, explicit JSON/Text format dropdown, expanded prompt editor dialog, nine visible variable insertion chips, required-variable validation, live editor footer
    showing line, column, spacing, encoding, newline, and selected format status, clickable variable
    insertion chips, Prompt Settings dialog with required-variable and validation policy, sample-data Prompt Preview dialog, prompt-specific Version History dialog, dashboard-level Version History dialog covering prompts/rubrics/notifications/JSON files, selectable Advanced JSON
    file cards with mockup summary strip, selected-card state, read-only code viewer controls, JSON syntax highlighting, line-number gutter with warning marker, highlighted validation issue line, copy-to-clipboard actions for viewer text and file path, read-only expanded viewer dialog, viewer footer, issue/read-only detail panels with jump-to-line action, no legacy raw table fallback, and guarded JSON
    Editor draft dialog gated by global Start Editing mode, shared Email Settings account setup screen with compact
    identity/incoming/outgoing panels, working IMAP/POP3 default switching, and
    notification sending including immediate offer.generated events, offer.approved candidate payloads with school code/location, reply-by date, and offer PDF attachment path conversion, queued start-date/generated-date/notice/final-working-day relative notifications, and startup due-schedule drain, Validation Review
    blocked banner, summary cards, guidance panels, inline expandable raw technical
    details on each issue card, and technical Details dialog,
    grouped Review Changes
    dialog with section cards, before/after draft diffs, and explicit final review checkbox gating the publish handoff, Publish Confirmation dialog with validation
    status, section summary cards, and explicit final confirmation checkbox gating the confirm action, Discard Changes confirmation dialog with section-grouped
    lost-change summaries, section-specific cards
    for high-risk settings, guarded validation review, readable wrapped admin tables,
    visible edit mode, dirty-cell affordances, unsaved-change discard confirmation,
    validation-blocked apply, interview notes
    regeneration actions, user-closable
    history-row Indeed transcript import that opens the selected candidate in the completed Review screen for transcript-adjacent score edits, regenerates the Basic Interview Notes document, and saves a not-started DeepSeek job for the history Generate action,
    finalize progress with immediate ordered task/status rows in a compact scrollable
    dialog, successful-completion auto-close, live history refresh, and single supported desktop GUI documentation
    while preserving shared finalize, history, document, and DeepSeek runtime services.
functions:
- name: build_interview_redesign_model
  description: Build workflow-first home, setup, live interview, review, offer, classroom-detail staffing, onboarding, and admin view data from rubric, intro script, question flow, and InterviewHistoryStore rows, importing legacy JSON only through the store when applicable.
  locked: false
  inputs:
    rubric_path:
      type: Path
      required: false
      default: DEFAULT_RUBRIC_PATH
    overrides_path:
      type: Path
      required: false
      default: QUESTIONS_OVERRIDE_PATH
    history_path:
      type: Path
      required: false
      default: INTERVIEW_HISTORY_PATH
    school_options:
      type: Sequence[str]
      required: false
      default: DEFAULT_SCHOOL_OPTIONS
  returns:
    type: InterviewRedesignModel
  exceptions:
  - ValueError
  side_effects: Reads local rubric, question override, and InterviewHistoryStore data; may import legacy JSON into the SQLite history store and may normalize question flow through QuestionOverridesStore.
- name: build_director_staffing_model
  description: Return a director staffing-only PySide model that keeps full app data/contracts but exposes only the Staffing v2 content surface, optional assigned school filter, and mockup-style full navigation rail display.
  locked: false
  inputs:
    model:
      type: InterviewRedesignModel | None
      required: false
      default: null
    school:
      type: str
      required: false
      default: ''
  returns:
    type: InterviewRedesignModel
  exceptions:
  - ValueError
  side_effects: May read local app config/history when no model is supplied.
- name: staffing_db_path_for_school
  description: Return the school-specific staffing SQLite path for a director school using a path-safe slug suffix, or the base staffing path when no school is supplied.
  locked: false
  inputs:
    school:
      type: str
      required: true
    base_path:
      type: Path | None
      required: false
      default: null
  returns:
    type: Path
  exceptions: []
  side_effects: none
- name: staffing_referral_queue_db_path
  description: Return the central staffing referral queue SQLite path, deriving a sibling DB path from an injected legacy JSONL queue path for tests and migrations.
  locked: false
  inputs:
    queue_path:
      type: Path | None
      required: false
      default: null
  returns:
    type: Path
  exceptions: []
  side_effects: none
- name: _staffing_referral_queue_store
  description: Build the SQLite-backed central director referral queue store with the legacy JSONL path wired for one-time import.
  locked: false
  inputs:
    queue_path:
      type: Path | None
      required: false
      default: null
  returns:
    type: StaffingReferralQueueStore
  exceptions: []
  side_effects: none
- name: build_pyside_onboarding_board
  description: Build PySide onboarding dashboard counts and employee next-task rows from existing onboarding state.
  locked: false
  inputs:
    employees:
      type: list[Any]
      required: true
    scheduler_settings:
      type: dict[str, Any] | None
      required: true
    today:
      type: date
      required: true
  returns:
    type: PySideOnboardingBoard
  exceptions: []
  side_effects: none
- name: build_pyside_candidate_board
  description: Build PySide candidate list rows, shared history-grid rows, and hiring status summary from interview history rows. Numeric history scores are canonical for display thresholds unless an explicit no-hire override, incomplete state, or processing state is present; 80% and above displays Hire, 65% through below 80% displays Borderline, and below 65% displays No Hire.
  locked: false
  inputs:
    history_rows:
      type: Sequence[dict[str, Any] | PySideHistoryRow]
      required: true
  returns:
    type: PySideCandidateBoard
  exceptions: []
  side_effects: none
- name: _coerce_history_percent
  description: Parse a history score value or percent string into a display-safe 0 through 100 numeric percent for PySide history status thresholding; invalid or out-of-range values return None.
  locked: false
  inputs:
    value:
      type: Any
      required: true
  returns:
    type: float | None
  exceptions: []
  side_effects: none
- name: _history_has_no_hire_override
  description: Return whether a persisted history row contains explicit human disqualifier, critical-score, locked-rule, or override-rationale metadata that should preserve a No Hire status even when numeric score is 65% or higher; DeepSeek automatic no-hire advisory metadata alone does not preserve No Hire.
  locked: false
  inputs:
    row:
      type: dict[str, Any]
      required: true
  returns:
    type: bool
  exceptions: []
  side_effects: none
- name: _history_status_from_score
  description: Derive PySide history display status from score thresholds, preserving incomplete and processing statuses plus explicit human no-hire override metadata; DeepSeek automatic no-hire advisory metadata alone follows the numeric score, 80% and above returns Hire, 65% through below 80% returns Borderline, and below 65% returns No Hire.
  locked: false
  inputs:
    row:
      type: dict[str, Any]
      required: true
    score:
      type: Any
      required: true
    status:
      type: Any
      required: true
  returns:
    type: str
  exceptions: []
  side_effects: none
- name: _offer_school_code
  description: Return the Launch Pad Learning offer-email school code HAW, NLB, or PMD for a supported school, falling back to the supplied school text.
  locked: false
  inputs:
    school:
      type: str
      required: true
  returns:
    type: str
  exceptions: []
  side_effects: none
- name: _offer_school_location
  description: Return human-readable school location text for offer email templates.
  locked: false
  inputs:
    school:
      type: str
      required: true
  returns:
    type: str
  exceptions: []
  side_effects: none
- name: _ensure_offer_pdf_path
  description: Return an existing offer PDF path or convert an existing DOCX offer letter to a same-stem PDF through Microsoft Word automation when available.
  locked: false
  inputs:
    offer_path:
      type: str
      required: true
  returns:
    type: str
  exceptions: []
  side_effects: May read a DOCX offer letter and write a same-stem PDF; suppresses conversion errors so notification send can block cleanly.
- name: _build_pyside_history_rows
  description: Build PySide history row view models from InterviewHistoryStore, using DB-backed filtered reads when school, outcome, search, or limit filters are supplied.
  locked: false
  inputs:
    history_path:
      type: Path
      required: true
    school:
      type: str
      required: false
      default: ''
    outcome:
      type: str
      required: false
      default: ''
    search:
      type: str
      required: false
      default: ''
    limit:
      type: int | None
      required: false
      default: null
  returns:
    type: list[PySideHistoryRow]
  exceptions: []
  side_effects: Reads interview history through InterviewHistoryStore and may import legacy JSON when the store is initialized.
- name: _pyside_history_rows_from_payloads
  description: Convert raw persisted history payload dictionaries into newest-first display-ready PySideHistoryRow values using existing score, status, offer, notes, and DeepSeek-processing normalization.
  locked: false
  inputs:
    rows:
      type: Sequence[dict[str, Any]]
      required: true
    store:
      type: InterviewHistoryStore
      required: true
  returns:
    type: list[PySideHistoryRow]
  exceptions: []
  side_effects: none
- name: latest_pyside_draft_path
  description: Return the newest PySide draft JSON path from the draft directory, if one exists.
  locked: false
  inputs:
    drafts_dir:
      type: Path | None
      required: false
      default: null
  returns:
    type: Path | None
  exceptions: []
  side_effects: Reads PySide draft directory metadata.
- name: standard_window_control_flags
  description: Return PySide window flags that keep the native title bar, system menu, minimize, maximize, and close controls visible.
  locked: false
  inputs:
    QtCore:
      type: Any
      required: true
  returns:
    type: Any
  exceptions: []
  side_effects: none
- name: _normalize_history_search
  description: Normalize free-text PySide history search input or row metadata for case-insensitive fuzzy matching without exposing hidden candidate artifacts.
  locked: false
  inputs:
    value:
      type: str
      required: true
  returns:
    type: str
  exceptions: []
  side_effects: none
- name: _history_token_matches
  description: Return whether one normalized search term approximately matches any normalized history metadata token.
  locked: false
  inputs:
    term:
      type: str
      required: true
    candidates:
      type: list[str]
      required: true
  returns:
    type: bool
  exceptions: []
  side_effects: none
- name: _history_outcome_color
  description: Map a normalized hiring outcome/status label to a soft table-row background color for the PySide history grid.
  locked: false
  inputs:
    outcome:
      type: str
      required: true
  returns:
    type: str
  exceptions: []
  side_effects: none
- name: launch_pyside_interview_app
  description: Launch the PySide6 redesigned desktop shell using the supplied model or current repository configuration, optionally in director staffing-only mode, showing the first navigation page before secondary pages are built.
  locked: false
  inputs:
    model:
      type: InterviewRedesignModel | None
      required: false
      default: null
    director_staffing:
      type: bool
      required: false
      default: false
    director_school:
      type: str
      required: false
      default: ''
  returns:
    type: int
  exceptions:
  - PySide6UnavailableError
  side_effects: Creates a QApplication, opens the redesigned desktop window, and
    defers secondary page construction until navigation.
- name: parse_args
  description: Parse PySide app CLI arguments including director staffing-only mode and optional director school filter.
  locked: false
  inputs:
    argv:
      type: Sequence[str] | None
      required: false
      default: null
  returns:
    type: argparse.Namespace
  exceptions:
  - SystemExit
  side_effects: none
- name: main
  description: Command-line entry point for the PySide6 redesigned interview assistant.
  locked: false
  inputs:
    argv:
      type: Sequence[str] | None
      required: false
      default: null
  returns:
    type: int
  exceptions:
  - PySide6UnavailableError
  side_effects: Launches the PySide6 desktop UI.
classes:
- name: PySideInterviewSession
  description: Autosaved PySide interview session state for guided question flow, draft resume, and canonical interview_sessions transcript snapshots used by history-triggered DeepSeek generation.
  locked: false
  attributes:
    model:
      type: InterviewRedesignModel
    draft_path:
      type: Path
    candidate_name:
      type: str
    interview_date:
      type: str
    school:
      type: str
    track_key:
      type: str
    current_index:
      type: int
    answers:
      type: dict[str, dict[str, Any]]
    qualification:
      type: dict[str, Any]
    flow_time_marks:
      type: list[dict[str, Any]]
    flow_candidate_transcripts:
      type: dict[int, str]
    flow_recordings:
      type: dict[int, dict[str, Any]]
  methods:
  - name: start
    description: Start a new guided interview session at the school-specific intro script, assign the current interview date, and persist initial draft/session state.
    locked: false
    inputs:
      candidate_name:
        type: str
        required: true
      school:
        type: str
        required: true
      track_key:
        type: str
        required: true
    returns:
      type: None
    exceptions:
    - ValueError
    side_effects: Writes PySide draft JSON and initializes canonical interview_sessions storage when answer/transcript data is present.
  - name: active_question
    description: Return the current intro, custom, or scored question, or None when the session has reached review.
    locked: false
    inputs: {}
    returns:
      type: FlowQuestion | None
    exceptions: []
    side_effects: none
  - name: save_answer_and_advance
    description: Save one answer, score, optional skipped state, and quick-action set, advance to the next question, autosave the draft, and mirror answer/transcript data to interview_sessions.
    locked: false
    inputs:
      notes:
        type: str
        required: true
      score:
        type: str
        required: false
        default: ''
      quick_actions:
        type: Sequence[str]
        required: false
        default: ()
      qualification:
        type: dict[str, Any] | None
        required: false
        default: null
      skipped:
        type: bool
        required: false
        default: false
    returns:
      type: None
    exceptions: []
    side_effects: Writes PySide draft JSON and canonical interview_sessions question snapshots.
  - name: go_back
    description: Move the guided PySide session back to the previous question without deleting saved answers and autosave the draft.
    locked: false
    inputs: {}
    returns:
      type: None
    exceptions: []
    side_effects: Writes PySide draft JSON and canonical interview_sessions question snapshots.
  - name: skip_active_question
    description: Save the active question as intentionally skipped with optional notes and quick actions, leave score blank, advance to the next question, and autosave the draft.
    locked: false
    inputs:
      notes:
        type: str
        required: false
        default: ''
      quick_actions:
        type: Sequence[str]
        required: false
        default: ()
    returns:
      type: None
    exceptions: []
    side_effects: Writes PySide draft JSON and canonical interview_sessions question snapshots.
  - name: update_review_score
    description: Update one scored trait rating from the PySide review screen after the interview, preserving notes/transcripts, clearing skipped state when a score is chosen, autosaving the draft, and mirroring canonical interview_sessions snapshots.
    locked: false
    inputs:
      question_id:
        type: str
        required: true
      score:
        type: int | str | None
        required: true
    returns:
      type: None
    exceptions:
    - ValueError
    side_effects: Writes PySide draft JSON and canonical interview_sessions question snapshots.
  - name: import_indeed_transcript_file
    description: Import an Indeed-generated .txt transcript into the session, split answers by configured question prompts, infer interviewer/candidate speakers, preserve any existing scored ratings, mark unasked unrated questions skipped, and leave newly scored answers unrated for operator review.
    locked: false
    inputs:
      path:
        type: Path
        required: true
    returns:
      type: IndeedTranscriptImportResult
    exceptions:
    - ValueError
    - OSError
    side_effects: Reads a local .txt transcript file, updates answers/transcript maps, writes PySide draft JSON, and writes canonical interview_sessions question snapshots.
  - name: import_indeed_transcript_text
    description: Import Indeed transcript text into the session, split candidate answer transcripts onto matching questions, infer speakers, preserve any existing scored ratings, mark unmatched unrated questions skipped, and move to the first imported scored answer that still needs a rating.
    locked: false
    inputs:
      text:
        type: str
        required: true
    returns:
      type: IndeedTranscriptImportResult
    exceptions:
    - ValueError
    side_effects: Updates answers, flow_candidate_transcripts, flow_recordings, current_index, writes PySide draft JSON, and writes canonical interview_sessions question snapshots.
  - name: review_summary
    description: Evaluate completed PySide trait scores with existing scoring rules and return review-screen summary data.
    locked: false
    inputs: {}
    returns:
      type: PySideReviewSummary
    exceptions:
    - ReportingValidationError
    side_effects: none
  - name: offer_review_defaults
    description: Return prefilled offer wizard fields from candidate setup and interview review outcome.
    locked: false
    inputs: {}
    returns:
      type: dict[str, str]
    exceptions:
    - ReportingValidationError
    side_effects: none
  - name: generate_offer_document
    description: Render a Word offer letter from the completed PySide session and selected offer template.
    locked: false
    inputs:
      template_path:
        type: Path
        required: true
      output_dir:
        type: Path
        required: true
      start_date:
        type: date
        required: true
      start_time_12h:
        type: str
        required: true
      end_time_12h:
        type: str
        required: true
      hourly_pay:
        type: float
        required: true
      hours:
        type: int
        required: true
      created_on:
        type: date
        required: true
    returns:
      type: Path
    exceptions:
    - OfferTemplateError
    - OSError
    side_effects: Writes rendered offer DOCX to the selected output directory.
  - name: generate_interview_notes_document
    description: Compatibility wrapper that finalizes the PySide session through
      the shared desktop finalize path and returns the generated interview-notes
      DOCX path, using the configured history DB unless a caller supplies an
      explicit history path.
    locked: false
    inputs:
      output_dir:
        type: Path
        required: true
      history_path:
        type: Path
        required: false
        default: INTERVIEW_HISTORY_PATH
    returns:
      type: Path
    exceptions:
    - OSError
    side_effects: Writes basic interview-notes DOCX and integration export under
      the selected output directory, and writes the SQLite history row to the
      configured history path without queueing DeepSeek.
  - name: finalize_interview
    description: Finalize the completed PySide session using shared desktop runtime
      contracts for scoring, immediate history persistence after the hiring decision,
      basic DocxExporter notes generation, integration export, transcript metadata,
      and final history path backfill; DeepSeek processing is not started by finalize
      and is only launched later from the candidate history Generate action.
    locked: false
    inputs:
      base_dir:
        type: Path
        required: false
        default: DEFAULT_BASE_DIR
      history_path:
        type: Path
        required: false
        default: INTERVIEW_HISTORY_PATH
      gateways:
        type: FinalizeGateways | None
        required: false
        default: null
    returns:
      type: dict[str, Any]
    exceptions:
    - ReportingValidationError
    - OSError
    side_effects: Writes finalized interview history immediately after scoring with
      not-started DeepSeek status, writes basic interview-notes DOCX to the resolved
      per-school Dropbox candidate folder when configured, backfills the history notes
      paths, writes integration export, and preserves any PySide recording/transcript
      payload in history/session data for later history-triggered DeepSeek generation.
  - name: _transcript_metadata
    description: Build complete/partial transcript metadata from PySide flow transcript
      and recording state for finalize/history payloads.
    locked: false
    inputs: {}
    returns:
      type: dict[str, Any]
    exceptions: []
    side_effects: none
  - name: to_draft
    description: Serialize the session as versioned draft JSON data including interview_date.
    locked: false
    inputs: {}
    returns:
      type: dict[str, Any]
    exceptions: []
    side_effects: none
  - name: save_draft
    description: Atomically write current session state to the configured draft path and mirror answered/transcribed questions to interview_sessions.
    locked: false
    inputs: {}
    returns:
      type: None
    exceptions:
    - OSError
    side_effects: Writes PySide draft JSON and canonical interview_sessions question snapshots.
  - name: _save_interview_session_snapshots
    description: Mirror answered or transcribed PySide flow items to canonical InterviewSessionStore JSON so history Generate can synthesize a DeepSeek job after transcript-only finalize.
    locked: false
    inputs: {}
    returns:
      type: None
    exceptions:
    - OSError
    side_effects: Creates or updates interview_sessions JSON under DEFAULT_BASE_DIR.
  - name: _interview_session_id
    description: Return a path-safe canonical PySide interview session id based on candidate name and interview date.
    locked: false
    inputs: {}
    returns:
      type: str
    exceptions: []
    side_effects: none
  - name: _session_snapshot_notes
    description: Convert one PySide answer and flow question into InterviewSessionStore notes metadata, preserving prompt text, score, skip flags, notes, and quick-action-derived scoring flags.
    locked: false
    inputs:
      item:
        type: FlowQuestion
        required: true
      answer:
        type: dict[str, Any]
        required: true
    returns:
      type: dict[str, Any]
    exceptions: []
    side_effects: none
  - name: load
    description: Load and validate a versioned PySide interview draft.
    locked: false
    inputs:
      model:
        type: InterviewRedesignModel
        required: true
      draft_path:
        type: Path
        required: true
    returns:
      type: PySideInterviewSession
    exceptions:
    - ValueError
    side_effects: Reads PySide draft JSON.
- name: PySideInterviewWindow
  description: Main PySide6 window with navigation for Interviews, Candidates, Offers,
    Onboarding, Admin Studio, top-level Tk/PySide UI switching, and scrollable
    live interview panes with wrapped long question and score text, plus an
    interviewer-facing review closeout that shows immediate manual scoring,
    missing/skipped checks, and question score status without DeepSeek analysis,
    AI scoring text, transcript text, or offer/finalize actions. The
    home start panel places Continue/Delete Saved Draft actions beside Begin Interview
