module:
  name: question_screens
  language: python
  path: src/question_screens.py
  version: 1.0.1
  description: Interview question-screen rendering and validation orchestration.
functions:
- name: validate_and_store_qualification
  description: Validates candidate education details and stores normalized qualification
    state.
  locked: false
  inputs:
    app:
      type: InterviewApp
      required: true
    vars_map:
      type: dict[str, Any]
      required: true
  returns:
    type: bool
  exceptions: []
  side_effects: Updates inline validation state and interview qualification data.
classes:
- name: TraitScreenUI
  description: Renders scored competency screens and enforces scoring/disqualifier
    validation rules.
  locked: false
  attributes: {}
  methods:
  - name: persist_state
    inputs: {}
    returns:
      type: bool
- name: CustomQuestionScreenUI
  description: Renders non-scored custom question screens and persistence actions.
  locked: false
  attributes: {}
  methods:
  - name: persist_custom
    inputs: {}
    returns:
      type: bool
data_structures: []
dependencies:
- app_content
- candidate_profile
- keyboard_telemetry
- reporting
- ui_feedback
