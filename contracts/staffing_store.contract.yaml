module:
  name: staffing_store
  language: python
  path: src/staffing_store.py
  version: 0.4.0
  description: SQLite persistence for staffing schools, classrooms, people including optional units, assignments with shift metadata, workbook display metadata, assignment history, required staffing indexes, and deterministic seed imports.
functions: []
classes:
- name: StaffingStore
  description: Opens staffing SQLite connections, initializes schema, seeds test/bootstrap assignments, and reads assignment/person snapshots.
  locked: false
  methods:
  - name: connect
    inputs: {}
    returns:
      type: sqlite3.Connection
    side_effects: Opens SQLite database and creates parent directory if needed.
  - name: initialize
    inputs: {}
    returns:
      type: None
    side_effects: Creates staffing tables/indexes when missing and migrates workbook display and shift metadata columns for existing databases.
  - name: seed_assignment
    inputs:
      school:
        type: str
        required: true
      classroom:
        type: str
        required: true
      position_name:
        type: str
        required: true
      position_type:
        type: str
        required: true
      status:
        type: str
        required: false
        default: dont_need_now
      person_name:
        type: str
        required: false
        default: ''
      permit_status:
        type: str
        required: false
        default: unknown
    returns:
      type: int
    exceptions:
    - ValueError
    side_effects: Inserts or reuses school/classroom/person rows and inserts one assignment row.
  - name: import_seed_file
    inputs:
      seed_path:
        type: Path
        required: true
    returns:
      type: dict[str, int]
    exceptions:
    - ValueError
    side_effects: Reads and validates a local staffing seed JSON file, then idempotently upserts schools, classrooms, support rows, people, assignment slots, workbook metadata, and active history rows. Supports legacy positions and workbook slots.
  - name: list_assignments
    inputs: {}
    returns:
      type: list[StaffingAssignment]
    exceptions: []
    side_effects: Reads staffing SQLite database.
  - name: closed_days_to_fill
    inputs: {}
    returns:
      type: list[int]
    exceptions: []
    side_effects: Reads closed filled assignment history rows from staffing SQLite database.
  - name: get_assignment
    inputs:
      assignment_id:
        type: int
        required: true
    returns:
      type: StaffingAssignment
    exceptions:
    - ValueError
    side_effects: Reads staffing SQLite database.
  - name: active_history_count
    inputs:
      assignment_id:
        type: int
        required: true
    returns:
      type: int
    side_effects: Reads staffing SQLite database.
  - name: assignment_context
    inputs:
      conn:
        type: sqlite3.Connection
        required: true
      assignment_id:
        type: int
        required: true
    returns:
      type: StaffingAssignment
    exceptions:
    - ValueError
    side_effects: Reads staffing SQLite database through supplied connection.
  - name: person_context
    inputs:
      conn:
        type: sqlite3.Connection
        required: true
      person_id:
        type: int
        required: true
    returns:
      type: StaffingPerson
    exceptions:
    - ValueError
    side_effects: Reads staffing SQLite database through supplied connection.
  - name: ensure_person
    inputs:
      conn:
        type: sqlite3.Connection
        required: true
      name:
        type: str
        required: true
      role:
        type: str
        required: true
      permit_status:
        type: str
        required: true
      now:
        type: str
        required: true
    returns:
      type: int
    exceptions:
    - ValueError
    side_effects: Reuses active person by normalized name or inserts person row.
data_structures: []
dependencies:
- staffing_models
