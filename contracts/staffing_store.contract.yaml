module:
  name: staffing_store
  language: python
  path: src/staffing_store.py
  version: 0.11.0
  description: SQLite persistence for staffing schools, classrooms, people including optional units, active status, role, current assignment summary, and permit effective-date/documentation metadata, service-backed assignment creation, assignments with shift metadata, workbook display metadata, assignment history dashboard records, Dropbox-visible edit locking, pending operation queueing, required staffing indexes, and deterministic seed imports.
functions: []
classes:
- name: StaffingEditLock
  description: Raised when another director holds the staffing edit lock.
  locked: false
  methods: []
- name: StaffingStore
  description: Opens staffing SQLite connections, initializes schema, manages Dropbox-visible edit locks and pending operation queue files, seeds test/bootstrap assignments, and reads assignment/person snapshots.
  locked: false
  methods:
  - name: connect
    inputs: {}
    returns:
      type: sqlite3.Connection
    side_effects: Opens SQLite database and creates parent directory if needed.
  - name: write_connection
    inputs:
      owner:
        type: str
        required: false
        default: ''
    returns:
      type: contextmanager[sqlite3.Connection]
    exceptions:
    - StaffingEditLock
    side_effects: Creates a Dropbox-visible edit lock file, opens SQLite, starts BEGIN IMMEDIATE, commits or rolls back, closes the connection, and removes the edit lock.
  - name: initialize
    inputs: {}
    returns:
      type: None
    side_effects: Creates staffing tables/indexes when missing and migrates workbook display, shift metadata, and person permit metadata columns for existing databases.
  - name: enqueue_pending_operation
    inputs:
      operation:
        type: str
        required: true
      payload:
        type: dict[str, Any]
        required: true
    returns:
      type: None
    side_effects: Appends a queued staffing operation JSON record beside the Dropbox-hosted staffing database.
  - name: pop_pending_operations
    inputs: {}
    returns:
      type: list[dict[str, Any]]
    exceptions:
    - OSError
    - JSONDecodeError
    side_effects: Reads pending operation records and removes the queue file when present.
  - name: peek_pending_operations
    inputs: {}
    returns:
      type: list[dict[str, Any]]
    exceptions:
    - OSError
    - JSONDecodeError
    side_effects: Reads pending operation records without removing the queue file.
  - name: restore_pending_operations
    inputs:
      records:
        type: list[dict[str, Any]]
        required: true
    returns:
      type: None
    side_effects: Re-appends pending operation records after replay is interrupted.
  - name: seed_assignment
    inputs:
      school:
        type: str
        required: true
      classroom:
        type: str
        required: true
      position_name:
        type: str
        required: true
      position_type:
        type: str
        required: true
      status:
        type: str
        required: false
        default: dont_need_now
      person_name:
        type: str
        required: false
        default: ''
      permit_status:
        type: str
        required: false
        default: unknown
    returns:
      type: int
    exceptions:
    - ValueError
    side_effects: Inserts or reuses school/classroom/person rows and inserts one assignment row.
  - name: create_assignment
    inputs:
      school:
        type: str
        required: true
      classroom:
        type: str
        required: true
      classroom_program:
        type: str
        required: false
        default: ''
      licensed_capacity:
        type: int | None
        required: false
        default: null
      position_name:
        type: str
        required: true
      position_type:
        type: str
        required: true
      status:
        type: str
        required: false
        default: dont_need_now
      person_name:
        type: str
        required: false
        default: ''
      permit_status:
        type: str
        required: false
        default: unknown
      start_date:
        type: str
        required: false
        default: ''
      notes:
        type: str
        required: false
        default: ''
      now:
        type: str
        required: true
    returns:
      type: int
    exceptions:
    - ValueError
    - StaffingEditLock
    side_effects: Uses a staffing write lock, inserts or updates school/classroom/person rows, inserts one assignment, and opens assignment_history for Need Now, Replace, and Coming positions.
  - name: create_classroom
    inputs:
      school:
        type: str
        required: true
      name:
        type: str
        required: true
      program:
        type: str
        required: false
        default: ''
      ratio_group:
        type: str
        required: false
        default: ''
      licensed_capacity:
        type: int | None
        required: false
        default: null
      display_order:
        type: int
        required: false
        default: 0
    returns:
      type: int
    exceptions:
    - ValueError
    - StaffingEditLock
    side_effects: Uses a staffing write lock and inserts or updates one school/classroom record without mutating assignments or assignment_history.
  - name: update_classroom
    inputs:
      classroom_id:
        type: int
        required: true
      school:
        type: str
        required: true
      name:
        type: str
        required: true
      program:
        type: str
        required: false
        default: ''
      ratio_group:
        type: str
        required: false
        default: ''
      licensed_capacity:
        type: int | None
        required: false
        default: null
      display_order:
        type: int
        required: false
        default: 0
    returns:
      type: StaffingClassroom
    exceptions:
    - ValueError
    - StaffingEditLock
    side_effects: Uses a staffing write lock to update one active classroom's school, name, program, ratio group, licensed capacity, and display order without mutating assignments or assignment_history.
  - name: classroom_active_assignment_count
    inputs:
      classroom_id:
        type: int
        required: true
    returns:
      type: int
    exceptions: []
    side_effects: Reads the number of active assignment rows attached to one classroom.
  - name: deactivate_classroom
    inputs:
      classroom_id:
        type: int
        required: true
    returns:
      type: StaffingClassroom
    exceptions:
    - ValueError
    - StaffingEditLock
    side_effects: Uses a staffing write lock to set one classroom active flag to false and returns the deactivated classroom without deleting or mutating assignments or assignment_history.
  - name: import_seed_file
    inputs:
      seed_path:
        type: Path
        required: true
    returns:
      type: dict[str, int]
    exceptions:
    - ValueError
    side_effects: Reads and validates a local staffing seed JSON file, then idempotently upserts schools, classrooms, support rows, people, assignment slots, workbook metadata, and active history rows. Supports legacy positions and workbook slots.
  - name: list_assignments
    inputs: {}
    returns:
      type: list[StaffingAssignment]
    exceptions: []
    side_effects: Reads staffing SQLite database.
  - name: list_classrooms
    inputs: {}
    returns:
      type: list[StaffingClassroom]
    exceptions: []
    side_effects: Reads staffing SQLite school/classroom records for Classroom Management and Add Classroom workflows.
  - name: list_people
    inputs: {}
    returns:
      type: list[StaffingPerson]
    exceptions: []
    side_effects: Reads staffing SQLite people and active assignment data for the employee management dashboard.
  - name: list_assignment_history
    inputs: {}
    returns:
      type: list[StaffingHistoryRecord]
    exceptions: []
    side_effects: Reads staffing SQLite assignment_history rows joined with schools, classrooms, assignments, and people for the Assignment History dashboard.
  - name: closed_days_to_fill
    inputs:
      school:
        type: str
        required: false
        default: ''
    returns:
      type: list[int]
    exceptions: []
    side_effects: Reads closed filled assignment history rows from staffing SQLite database; when school is provided, returns only history rows for that school.
  - name: get_assignment
    inputs:
      assignment_id:
        type: int
        required: true
    returns:
      type: StaffingAssignment
    exceptions:
    - ValueError
    side_effects: Reads staffing SQLite database.
  - name: active_history_count
    inputs:
      assignment_id:
        type: int
        required: true
    returns:
      type: int
    side_effects: Reads staffing SQLite database.
  - name: assignment_context
    inputs:
      conn:
        type: sqlite3.Connection
        required: true
      assignment_id:
        type: int
        required: true
    returns:
      type: StaffingAssignment
    exceptions:
    - ValueError
    side_effects: Reads staffing SQLite database through supplied connection.
  - name: person_context
    inputs:
      conn:
        type: sqlite3.Connection
        required: true
      person_id:
        type: int
        required: true
    returns:
      type: StaffingPerson
    exceptions:
    - ValueError
    side_effects: Reads staffing SQLite database through supplied connection.
  - name: classroom_context
    inputs:
      conn:
        type: sqlite3.Connection
        required: true
      classroom_id:
        type: int
        required: true
    returns:
      type: StaffingClassroom
    exceptions:
    - ValueError
    side_effects: Reads staffing SQLite classroom data through supplied connection.
  - name: _classroom_context_any_active
    inputs:
      conn:
        type: sqlite3.Connection
        required: true
      classroom_id:
        type: int
        required: true
    returns:
      type: StaffingClassroom
    exceptions:
    - ValueError
    side_effects: Reads one classroom row by id regardless of classroom active flag while requiring an active school.
  - name: ensure_person
    inputs:
      conn:
        type: sqlite3.Connection
        required: true
      name:
        type: str
        required: true
      role:
        type: str
        required: true
      permit_status:
        type: str
        required: true
      now:
        type: str
        required: true
    returns:
      type: int
    exceptions:
    - ValueError
    side_effects: Reuses active person by normalized name or inserts person row.
data_structures: []
dependencies:
- staffing_models
