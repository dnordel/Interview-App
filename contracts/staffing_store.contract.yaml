module:
  name: staffing_store
  language: python
  path: src/staffing_store.py
  version: 0.19.0
  description: SQLite persistence for staffing schools, classrooms, people including optional units, active status, role, current assignment summary, and permit effective-date/documentation/managed-path metadata, service-backed assignment creation and mistaken-position soft deletion, assignments with shift metadata, workbook display metadata, assignment history dashboard records, director candidate referral/interview completion and dismissal records, Dropbox-visible edit locking, pending operation queueing, required staffing indexes, and deterministic seed imports.
functions: []
classes:
- name: StaffingEditLock
  description: Raised when another director holds the staffing edit lock.
  locked: false
  methods: []
- name: StaffingStaleRevisionError
  description: Raised when a Director Interview optimistic row version is no longer current.
  locked: false
  methods: []
- name: StaffingStore
  description: Opens staffing SQLite connections, initializes schema, manages Dropbox-visible edit locks and pending operation queue files, seeds test/bootstrap assignments, and reads assignment/person/director-interview snapshots.
  locked: false
  methods:
  - name: connect
    inputs: {}
    returns:
      type: sqlite3.Connection
    side_effects: Opens SQLite database and creates parent directory if needed.
  - name: write_connection
    inputs:
      owner:
        type: str
        required: false
        default: ''
    returns:
      type: contextmanager[sqlite3.Connection]
    exceptions:
    - StaffingEditLock
    side_effects: Creates a Dropbox-visible edit lock file, opens SQLite, starts BEGIN IMMEDIATE, commits or rolls back, closes the connection, and removes the edit lock.
  - name: initialize
    inputs: {}
    returns:
      type: None
    side_effects: Creates staffing tables/indexes when missing and migrates workbook display, shift metadata, and person permit metadata columns including permit_document_path for existing databases; concurrent initializers tolerate only verified duplicate-column migration races and re-raise other SQL failures.
  - name: enqueue_pending_operation
    inputs:
      operation:
        type: str
        required: true
      payload:
        type: dict[str, Any]
        required: true
    returns:
      type: None
    side_effects: Appends a queued staffing operation JSON record beside the Dropbox-hosted staffing database.
  - name: pop_pending_operations
    inputs: {}
    returns:
      type: list[dict[str, Any]]
    exceptions:
    - OSError
    - JSONDecodeError
    side_effects: Reads pending operation records and removes the queue file when present.
  - name: peek_pending_operations
    inputs: {}
    returns:
      type: list[dict[str, Any]]
    exceptions:
    - OSError
    - JSONDecodeError
    side_effects: Reads pending operation records without removing the queue file.
  - name: restore_pending_operations
    inputs:
      records:
        type: list[dict[str, Any]]
        required: true
    returns:
      type: None
    side_effects: Re-appends pending operation records after replay is interrupted.
  - name: seed_assignment
    inputs:
      school:
        type: str
        required: true
      classroom:
        type: str
        required: true
      position_name:
        type: str
        required: true
      position_type:
        type: str
        required: true
      status:
        type: str
        required: false
        default: dont_need_now
      person_name:
        type: str
        required: false
        default: ''
      permit_status:
        type: str
        required: false
        default: unknown
    returns:
      type: int
    exceptions:
    - ValueError
    side_effects: Inserts or reuses school/classroom/person rows and inserts one assignment row.
  - name: create_assignment
    inputs:
      school:
        type: str
        required: true
      classroom:
        type: str
        required: true
      classroom_program:
        type: str
        required: false
        default: ''
      licensed_capacity:
        type: int | None
        required: false
        default: null
      position_name:
        type: str
        required: true
      position_type:
        type: str
        required: true
      status:
        type: str
        required: false
        default: dont_need_now
      person_name:
        type: str
        required: false
        default: ''
      permit_status:
        type: str
        required: false
        default: unknown
      start_date:
        type: str
        required: false
        default: ''
      notes:
        type: str
        required: false
        default: ''
      now:
        type: str
        required: true
    returns:
      type: int
    exceptions:
    - ValueError
    - StaffingEditLock
    side_effects: Uses a staffing write lock, inserts or updates school/classroom/person rows, inserts one assignment, and opens assignment_history for Need Now, Replace, and Coming positions.
  - name: create_classroom
    inputs:
      school:
        type: str
        required: true
      name:
        type: str
        required: true
      program:
        type: str
        required: false
        default: ''
      ratio_group:
        type: str
        required: false
        default: ''
      licensed_capacity:
        type: int | None
        required: false
        default: null
      display_order:
        type: int
        required: false
        default: 0
    returns:
      type: int
    exceptions:
    - ValueError
    - StaffingEditLock
    side_effects: Uses a staffing write lock and inserts or updates one school/classroom record without mutating assignments or assignment_history.
  - name: update_classroom
    inputs:
      classroom_id:
        type: int
        required: true
      school:
        type: str
        required: true
      name:
        type: str
        required: true
      program:
        type: str
        required: false
        default: ''
      ratio_group:
        type: str
        required: false
        default: ''
      licensed_capacity:
        type: int | None
        required: false
        default: null
      display_order:
        type: int
        required: false
        default: 0
    returns:
      type: StaffingClassroom
    exceptions:
    - ValueError
    - StaffingEditLock
    side_effects: Uses a staffing write lock to update one active classroom's school, name, program, ratio group, licensed capacity, and display order without mutating assignments or assignment_history.
  - name: classroom_active_assignment_count
    inputs:
      classroom_id:
        type: int
        required: true
    returns:
      type: int
    exceptions: []
    side_effects: Reads the number of active assignment rows attached to one classroom.
  - name: deactivate_classroom
    inputs:
      classroom_id:
        type: int
        required: true
    returns:
      type: StaffingClassroom
    exceptions:
    - ValueError
    - StaffingEditLock
    side_effects: Uses a staffing write lock to set one classroom active flag to false and returns the deactivated classroom without deleting or mutating assignments or assignment_history.
  - name: delete_assignment
    inputs:
      assignment_id:
        type: int
        required: true
      now:
        type: str
        required: true
    returns:
      type: StaffingAssignment
    exceptions:
    - ValueError
    - StaffingEditLock
    side_effects: Uses a staffing write lock to soft-deactivate one unassigned assignment, close any active open history with closed_reason deleted, reject assigned/coming/filled/replacement/completed-history positions, and return the prior assignment with updated_at set to now.
  - name: import_seed_file
    inputs:
      seed_path:
        type: Path
        required: true
    returns:
      type: dict[str, int]
    exceptions:
    - ValueError
    side_effects: Reads and validates a local staffing seed JSON file, then idempotently upserts schools, classrooms, support rows, people, assignment slots, workbook metadata, and active history rows. Supports legacy positions and workbook slots.
  - name: list_assignments
    inputs: {}
    returns:
      type: list[StaffingAssignment]
    exceptions: []
    side_effects: Reads staffing SQLite database.
  - name: upsert_director_candidate_referral
    inputs:
      history_id:
        type: str
        required: true
      candidate_name:
        type: str
        required: true
      school:
        type: str
        required: true
      position:
        type: str
        required: false
        default: ''
      interviewer_rating:
        type: float | None
        required: false
        default: null
      interviewer_outcome:
        type: str
        required: true
      interview_date:
        type: str
        required: false
        default: ''
      candidate_email:
        type: str
        required: false
        default: ''
      candidate_phone:
        type: str
        required: false
        default: ''
      referral_date:
        type: str
        required: false
        default: ''
      now:
        type: str
        required: true
    returns:
      type: StaffingDirectorCandidate
    exceptions:
    - ValueError
    - StaffingEditLock
    side_effects: Upserts one director candidate referral keyed by interview history id without mutating assignments or assignment_history.
  - name: list_director_candidate_referrals
    inputs:
      school:
        type: str
        required: false
        default: ''
      include_completed:
        type: bool
        required: false
        default: false
    returns:
      type: list[StaffingDirectorCandidate]
    exceptions: []
    side_effects: Reads director candidate referrals, optionally school-scoped and excluding completed director interviews.
  - name: delete_pending_director_referrals
    inputs:
      referral_ids:
        type: Sequence[int]
        required: true
      removed_by:
        type: str
        required: false
        default: ''
      removal_source:
        type: str
        required: false
        default: ''
    returns:
      type: int
    exceptions:
    - StaffingEditLock
    side_effects: Dismisses and deletes matching pending director candidate referrals, preserving completed director interviews, recording dismissed history ids so history backfill does not re-add them, and writing removal audit rows with actor/source metadata.
  - name: dismiss_director_referral_history_ids
    inputs:
      history_ids:
        type: Sequence[str]
        required: true
      removed_by:
        type: str
        required: false
        default: ''
      removal_source:
        type: str
        required: false
        default: ''
    returns:
      type: int
    exceptions:
    - StaffingEditLock
    side_effects: Records dismissed director referral history ids and deletes matching pending director candidate referrals while preserving completed director interviews, writing removal audit rows when matching pending rows still exist.
  - name: list_dismissed_director_referral_history_ids
    inputs: {}
    returns:
      type: set[str]
    exceptions: []
    side_effects: Creates or reads staffing SQLite dismissal records for director referral history ids.
  - name: record_director_referral_removal_audit
    inputs:
      history_id:
        type: str
        required: true
      candidate_name:
        type: str
        required: false
        default: ''
      school:
        type: str
        required: false
        default: ''
      removed_by:
        type: str
        required: true
      removal_source:
        type: str
        required: true
      removed_at:
        type: str | None
        required: false
        default: null
    returns:
      type: StaffingDirectorReferralRemovalAudit
    exceptions:
    - ValueError
    - StaffingEditLock
    side_effects: Writes one director referral removal audit row even when the pending referral was already removed locally.
  - name: list_director_referral_removal_audit
    inputs:
      school:
        type: str
        required: false
        default: ''
    returns:
      type: list[StaffingDirectorReferralRemovalAudit]
    exceptions: []
    side_effects: Reads director referral removal audit rows, optionally school-scoped.
  - name: record_director_interview
    inputs:
      referral_id:
        type: int
        required: true
      director_name:
        type: str
        required: true
      completed_date:
        type: str
        required: true
      rating:
        type: float
        required: true
      decision:
        type: str
        required: true
      decision_notes:
        type: str
        required: true
      proposed_shift_start:
        type: str
        required: false
        default: ''
      proposed_shift_end:
        type: str
        required: false
        default: ''
      proposed_classroom:
        type: str
        required: false
        default: ''
      candidate_email: {type: str, required: false, default: ''}
      candidate_phone: {type: str, required: false, default: ''}
      follow_up_needed:
        type: bool
        required: false
        default: false
      owner_approval_status:
        type: str
        required: false
        default: pending_owner_approval
      now:
        type: str
        required: true
    returns:
      type: StaffingDirectorInterview
    exceptions:
    - ValueError
    - StaffingEditLock
    side_effects: Inserts or updates one completed director interview, captures initial-report score/outcome, and appends immutable director-interview version/audit rows without mutating assignments, classrooms, people, or assignment_history.
  - name: remove_pending_director_referral_for_reconciliation
    inputs:
      history_id: {type: str, required: true}
      removed_by: {type: str, required: false, default: system}
      removal_source: {type: str, required: false, default: candidate_report_reconciliation}
    returns: {type: int}
    side_effects: Removes only an ineligible pending referral and records removal audit without creating durable dismissal state.
  - name: reopen_director_interview
    inputs:
      interview_id: {type: int, required: true}
      expected_row_version: {type: int, required: true}
      reason: {type: str, required: true}
      actor: {type: str, required: true}
      actor_role: {type: str, required: true}
      now: {type: str, required: true}
    returns: {type: StaffingDirectorInterview}
  - name: revise_director_interview
    description: Re-finalize an explicitly reopened director section using optimistic concurrency and append-only version/audit history.
    inputs:
      interview_id: {type: int, required: true}
      expected_row_version: {type: int, required: true}
      director_name: {type: str, required: true}
      completed_date: {type: str, required: true}
      rating: {type: float, required: true}
      decision: {type: str, required: true}
      decision_notes: {type: str, required: true}
      proposed_shift_start: {type: str, required: true}
      proposed_shift_end: {type: str, required: true}
      proposed_classroom: {type: str, required: true}
      follow_up_needed: {type: bool, required: true}
      reason: {type: str, required: true}
      actor: {type: str, required: true}
      actor_role: {type: str, required: true}
      now: {type: str, required: true}
    returns: {type: StaffingDirectorInterview}
  - name: list_director_interview_audit
    inputs:
      interview_id: {type: int, required: true}
    returns: {type: 'list[dict[str, Any]]'}
  - name: list_director_interviews
    inputs:
      school:
        type: str
        required: false
        default: ''
    returns:
      type: list[StaffingDirectorInterview]
    exceptions: []
    side_effects: Reads completed director interview records, optionally school-scoped.
  - name: get_director_interview
    inputs:
      interview_id: {type: int, required: true}
    returns: {type: StaffingDirectorInterview}
  - name: find_completed_director_interview
    inputs:
      history_id:
        type: str
        required: true
      school:
        type: str
        required: true
    returns:
      type: StaffingDirectorInterview | None
    exceptions: []
    side_effects: Reads one hire decision matched by exact interview history ID and school without mutating staffing data.
  - name: find_any_completed_director_interview
    description: Read any completed Hire or No Hire director decision by exact history id and school for combined report display.
    inputs:
      history_id: {type: str, required: true}
      school: {type: str, required: true}
    returns: {type: 'StaffingDirectorInterview | None'}
    exceptions: []
    side_effects: Reads staffing data only.
  - name: list_classrooms
    inputs: {}
    returns:
      type: list[StaffingClassroom]
    exceptions: []
    side_effects: Reads staffing SQLite school/classroom records for Classroom Management and Add Classroom workflows.
  - name: list_people
    inputs: {}
    returns:
      type: list[StaffingPerson]
    exceptions: []
    side_effects: Reads staffing SQLite people and active assignment data for the employee management dashboard.
  - name: list_assignment_history
    inputs: {}
    returns:
      type: list[StaffingHistoryRecord]
    exceptions: []
    side_effects: Reads staffing SQLite assignment_history rows joined with schools, classrooms, assignments, and people for the Assignment History dashboard.
  - name: closed_days_to_fill
    inputs:
      school:
        type: str
        required: false
        default: ''
    returns:
      type: list[int]
    exceptions: []
    side_effects: Reads closed filled assignment history rows from staffing SQLite database; when school is provided, returns only history rows for that school.
  - name: get_assignment
    inputs:
      assignment_id:
        type: int
        required: true
    returns:
      type: StaffingAssignment
    exceptions:
    - ValueError
    side_effects: Reads staffing SQLite database.
  - name: active_history_count
    inputs:
      assignment_id:
        type: int
        required: true
    returns:
      type: int
    side_effects: Reads staffing SQLite database.
  - name: assignment_context
    inputs:
      conn:
        type: sqlite3.Connection
        required: true
      assignment_id:
        type: int
        required: true
    returns:
      type: StaffingAssignment
    exceptions:
    - ValueError
    side_effects: Reads staffing SQLite database through supplied connection.
  - name: person_context
    inputs:
      conn:
        type: sqlite3.Connection
        required: true
      person_id:
        type: int
        required: true
    returns:
      type: StaffingPerson
    exceptions:
    - ValueError
    side_effects: Reads staffing SQLite database through supplied connection.
  - name: classroom_context
    inputs:
      conn:
        type: sqlite3.Connection
        required: true
      classroom_id:
        type: int
        required: true
    returns:
      type: StaffingClassroom
    exceptions:
    - ValueError
    side_effects: Reads staffing SQLite classroom data through supplied connection.
  - name: _classroom_context_any_active
    inputs:
      conn:
        type: sqlite3.Connection
        required: true
      classroom_id:
        type: int
        required: true
    returns:
      type: StaffingClassroom
    exceptions:
    - ValueError
    side_effects: Reads one classroom row by id regardless of classroom active flag while requiring an active school.
  - name: ensure_person
    inputs:
      conn:
        type: sqlite3.Connection
        required: true
      name:
        type: str
        required: true
      role:
        type: str
        required: true
      permit_status:
        type: str
        required: true
      now:
        type: str
        required: true
    returns:
      type: int
    exceptions:
    - ValueError
    side_effects: Reuses active person by normalized name or inserts person row.
data_structures: []
dependencies:
- staffing_models
