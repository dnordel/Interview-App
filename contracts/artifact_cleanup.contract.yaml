module:
  name: artifact_cleanup
  language: python
  path: src/artifact_cleanup.py
  version: 1.0.0
  description: Deprecated compatibility wrapper for artifact cleanup helpers now owned by platform_services.
functions:
- name: _is_within
  description: Forward to platform_services._is_within.
  locked: false
  inputs:
    base_dir:
      type: Path
      required: true
    path:
      type: Path
      required: true
  returns:
    type: bool
  exceptions: []
  side_effects: none
- name: _safe_to_delete
  description: Forward to platform_services._safe_to_delete.
  locked: false
  inputs:
    base_dir:
      type: Path
      required: true
    path:
      type: Path
      required: true
  returns:
    type: bool
  exceptions: []
  side_effects: Reads filesystem metadata.
- name: extract_artifact_paths
  description: Forward to platform_services.extract_artifact_paths.
  locked: false
  inputs:
    flow_recordings:
      type: dict[int, dict[str, Any]] | dict[str, Any]
      required: true
  returns:
    type: list[Path]
  exceptions: []
  side_effects: none
- name: delete_recording_artifacts
  description: Forward to platform_services.delete_recording_artifacts.
  locked: false
  inputs:
    base_dir:
      type: Path
      required: true
    flow_recordings:
      type: dict[int, dict[str, Any]] | dict[str, Any]
      required: true
  returns:
    type: list[Path]
  exceptions: []
  side_effects: Deletes selected files from disk.
- name: cleanup_stale_artifacts
  description: Forward to platform_services.cleanup_stale_artifacts.
  locked: false
  inputs:
    base_dir:
      type: Path
      required: true
  returns:
    type: list[Path]
  exceptions: []
  side_effects: Deletes selected files from disk.
classes: []
data_structures:
- name: SAFE_EXTENSIONS
  type: set[str]
- name: SAFE_NAME_TOKENS
  type: tuple[str, ...]
dependencies:
- module: platform_services
