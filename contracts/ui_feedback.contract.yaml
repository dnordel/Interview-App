module:
  name: ui_feedback
  language: python
  path: src/ui_feedback.py
  version: 3.0.0
  description: Shared validation feedback and sanitized error-copy helpers without Tk widget dependencies.
functions:
- name: format_guidance
  description: Builds a standardized issue plus next-step guidance sentence.
  locked: false
  inputs:
    issue:
      type: str
      required: true
    next_step:
      type: str
      required: true
  returns:
    type: str
  exceptions: []
  side_effects: none
- name: should_display_modal
  description: Determines whether validation should be shown as a modal dialog.
  locked: false
  inputs:
    severity:
      type: str
      required: true
    irreversible_action:
      type: bool
      required: false
      default: false
  returns:
    type: bool
  exceptions: []
  side_effects: none
- name: sanitize_user_error
  description: Redacts technical fragments from user-facing error text.
  locked: false
  inputs:
    message:
      type: str
      required: true
  returns:
    type: str
  exceptions: []
  side_effects: none
- name: present_transcription_partial_warning
  description: Returns standardized partial-transcript warning copy and forwards it to a generic presenter when supplied.
  locked: false
  inputs:
    presenter:
      type: Any | None
      required: true
    auto_expire_ms:
      type: int | None
      required: false
      default: 12000
  returns:
    type: str
  exceptions: []
  side_effects: may call presenter.show
- name: show_inline_field_error
  description: Formats field-level inline validation feedback through a generic inline presenter.
  locked: false
  inputs:
    inline_validation:
      type: Any
      required: true
    field_label:
      type: str
      required: true
    cause:
      type: str
      required: true
    corrective_action:
      type: str
      required: true
    focus_widget:
      type: Any | None
      required: false
      default: null
    severity:
      type: str
      required: false
      default: error
  returns:
    type: None
  exceptions: []
  side_effects: calls inline_validation.show
classes: []
data_structures: []
dependencies: []
