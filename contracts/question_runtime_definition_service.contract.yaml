module:
  name: question_runtime_definition_service
  language: python
  path: src/question_runtime_definition_service.py
  version: 3.0.0
  description: Trait runtime signal-definition helpers used by PySide Admin Studio and scoring configuration.
functions:
  - name: default_runtime_definition
    description: Build an empty normalized runtime definition payload for a rubric trait.
    locked: false
    inputs:
      trait_id:
        type: str
        required: true
      question:
        type: str
        required: false
        default: ""
    returns:
      type: RuntimeSignalDefinition
    exceptions:
      - ValueError
    side_effects: none
  - name: normalize_runtime_definition
    description: Normalize a runtime signal-definition payload into the expected persisted shape.
    locked: false
    inputs:
      definition:
        type: dict[str, Any] | None
        required: true
      trait_id:
        type: str | None
        required: false
        default: null
      trait_name:
        type: str
        required: false
        default: ""
    returns:
      type: RuntimeSignalDefinition
    exceptions:
      - ValueError
    side_effects: none
  - name: runtime_trait_id_for_rubric_trait
    description: Convert a rubric trait id in trait_<number> or <prefix>_trait_<number> form into its runtime trait-id prefix.
    locked: false
    inputs:
      trait_id:
        type: str
        required: true
    returns:
      type: str
    exceptions:
      - ValueError
    side_effects: none
  - name: build_runtime_trait_id
    description: Build a persisted runtime trait id using the rubric trait id, trait name, and any existing runtime suffix.
    locked: false
    inputs:
      trait_id:
        type: str
        required: true
      trait_name:
        type: str
        required: true
      existing_runtime_trait_id:
        type: Any
        required: false
        default: ""
    returns:
      type: str
    exceptions:
      - ValueError
    side_effects: none
  - name: runtime_trait_id_prefix
    description: Return the runtime filename prefix used to locate a rubric trait's runtime JSON definition.
    locked: false
    inputs:
      trait_id:
        type: str
        required: true
    returns:
      type: str
    exceptions:
      - ValueError
    side_effects: none
  - name: slugify_trait_name
    description: Convert a trait name into a safe filesystem/runtime suffix.
    locked: false
    inputs:
      trait_name:
        type: str
        required: true
    returns:
      type: str
    exceptions: []
    side_effects: none
  - name: ensure_valid_trait_id
    description: Validate that a question-settings trait id can be owned by a runtime signal-definition file.
    locked: false
    inputs:
      trait_id:
        type: str
        required: true
    returns:
      type: str
    exceptions:
      - ValueError
    side_effects: none
  - name: next_trait_id
    description: Determine the next available numeric rubric trait id for coordinated rubric/runtime creation.
    locked: false
    inputs:
      rubric:
        type: dict[str, Any]
        required: true
    returns:
      type: str
    exceptions: []
    side_effects: none
  - name: list_signal_refs
    description: Return every signal ref across core and extended runtime signals for duplicate checks and tests.
    locked: false
    inputs:
      definition:
        type: dict[str, Any]
        required: true
    returns:
      type: list[str]
    exceptions:
      - ValueError
    side_effects: none
classes:
  - name: QuestionRuntimeDefinitionService
    description: Reads, writes, validates, and mutates trait runtime signal-definition JSON files.
    locked: false
    attributes:
      traits_dir:
        type: Path
    methods:
      - name: load_definition
        inputs:
          trait_id:
            type: str
            required: true
        returns:
          type: RuntimeSignalDefinition
      - name: save_definition
        inputs:
          trait_id:
            type: str
            required: true
          trait_name:
            type: str
            required: true
          definition:
            type: dict[str, Any]
            required: true
        returns:
          type: RuntimeSignalDefinition
      - name: create_definition
        inputs:
          trait_id:
            type: str
            required: true
          trait_name:
            type: str
            required: true
          question:
            type: str
            required: true
        returns:
          type: RuntimeSignalDefinition
      - name: delete_definition
        inputs:
          trait_id:
            type: str
            required: true
        returns:
          type: None
      - name: add_core_signal
        inputs:
          definition:
            type: dict[str, Any]
            required: true
          signal:
            type: dict[str, Any]
            required: true
        returns:
          type: RuntimeSignalDefinition
      - name: delete_core_signal
        inputs:
          definition:
            type: dict[str, Any]
            required: true
          signal_ref:
            type: str
            required: true
        returns:
          type: RuntimeSignalDefinition
      - name: add_extended_group
        inputs:
          definition:
            type: dict[str, Any]
            required: true
          group:
            type: dict[str, Any]
            required: true
        returns:
          type: RuntimeSignalDefinition
      - name: add_group_signal
        inputs:
          definition:
            type: dict[str, Any]
            required: true
          group_id:
            type: str
            required: true
          signal:
            type: dict[str, Any]
            required: true
        returns:
          type: RuntimeSignalDefinition
      - name: update_group_signal
        inputs:
          definition:
            type: dict[str, Any]
            required: true
          group_id:
            type: str
            required: true
          signal_ref:
            type: str
            required: true
          updates:
            type: dict[str, Any]
            required: true
        returns:
          type: RuntimeSignalDefinition
      - name: delete_group_signal
        inputs:
          definition:
            type: dict[str, Any]
            required: true
          group_id:
            type: str
            required: true
          signal_ref:
            type: str
            required: true
        returns:
          type: RuntimeSignalDefinition
data_structures:
  - name: PREFIXED_TRAIT_ID_ALIAS_PATTERN
    description: Regex for rubric <prefix>_trait_<number> ids.
  - name: RUNTIME_TRAIT_ID_PATTERN
    description: Regex for runtime T<number> and PREFIX_T<number> ids.
  - name: RuntimeSignalDefinition
    description: Persisted runtime signal-definition payload for a trait.
    fields:
      trait_id:
        type: str
      question:
        type: str
      core_signals:
        type: list[RuntimeSignalRecord]
      extended_signal_groups:
        type: list[RuntimeSignalGroup]
  - name: RuntimeSignalRecord
    description: One checkbox signal persisted in a trait runtime definition.
    fields:
      ref:
        type: str
      label:
        type: str
      weight:
        type: float
      group:
        type: str
      is_critical:
        type: bool
  - name: RuntimeSignalGroup
    description: One extended signal group persisted in a trait runtime definition.
    fields:
      group_id:
        type: str
      group_label:
        type: str
      signals:
        type: list[RuntimeSignalRecord]
dependencies:
  - platform_services
  - scoring_reporting
