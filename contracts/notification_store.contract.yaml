module:
  name: notification_store
  language: python
  path: src/notification_store.py
  version: 1.8.0
  description: SQLite-backed system/editable notification rules with normalized structured condition rows, role recipients, persistent rollout metadata, pending schedules, and sanitized successful-send dedupe audit.
functions:
- name: utc_now_iso
  description: Return current UTC timestamp as ISO text without microseconds.
  locked: false
  inputs: {}
  returns:
    type: str
  exceptions: []
  side_effects: none
classes:
- name: NotificationStore
  description: Persists notification rules, ordered AND conditions, recipients, default examples, pending date-offset schedules, and send audit rows.
  locked: false
  methods:
  - name: list_rules
    inputs:
      event_type:
        type: str | None
        required: false
        default: null
    returns:
      type: list[NotificationRule]
    side_effects: Reads notification SQLite database.
  - name: ensure_default_rules
    inputs: {}
    returns:
      type: None
    side_effects: Creates inactive editable default notification rule examples when missing for staffing assignment status changes, permit updates, offer generated/approved/accepted, and custom reminders; seeds 50/90-day permit rules with editable permit-status and position-family conditions, and only upgrades missing default conditions without replacing later user edits or disablement.
  - name: save_rule
    inputs:
      rule:
        type: NotificationRule
        required: true
    returns:
      type: NotificationRule
    exceptions:
    - ValueError
    side_effects: Validates the structured rule, then writes notification rule, trigger timing/date-offset metadata, ordered condition rows, and explicit-email or role recipient rows; disabled incomplete rules retain warnings while active blocking issues fail closed.
  - name: get_rule
    inputs:
      rule_id:
        type: int
        required: true
    returns:
      type: NotificationRule
    exceptions:
    - ValueError
    side_effects: Reads notification SQLite database.
  - name: delete_rule
    inputs:
      rule_id:
        type: int
        required: true
    returns:
      type: None
    side_effects: Deletes one notification rule plus its condition and recipient rows.
  - name: set_rule_active
    inputs:
      rule_id:
        type: int
        required: true
      active:
        type: bool
        required: true
    returns:
      type: None
    side_effects: Updates notification rule active flag.
  - name: has_send_attempt
    inputs:
      rule_id:
        type: int
        required: true
      idempotency_key:
        type: str
        required: true
    returns:
      type: bool
    side_effects: Reads notification audit table.
  - name: record_send_attempt
    inputs:
      event_type:
        type: str
        required: true
      rule_id:
        type: int | None
        required: true
      idempotency_key:
        type: str
        required: true
      recipient_count:
        type: int
        required: true
      status:
        type: str
        required: true
      error:
        type: str
        required: false
        default: ''
    returns:
      type: None
    side_effects: Inserts one notification audit row.
  - name: list_audit
    inputs:
      rule_id:
        type: int | None
        required: false
        default: null
      limit:
        type: int
        required: false
        default: 25
    returns:
      type: list[dict[str, Any]]
    side_effects: Reads newest notification audit rows, optionally filtered by rule id, without exposing SMTP credentials.
  - name: schedule_notification
    inputs:
      event_type:
        type: str
        required: true
      rule_id:
        type: int
        required: true
      idempotency_key:
        type: str
        required: true
      due_date:
        type: date
        required: true
      payload:
        type: dict[str, Any]
        required: true
    returns:
      type: None
    side_effects: Upserts one pending notification_schedule row with JSON payload
      for a future date-offset notification.
  - name: list_due_scheduled_notifications
    inputs:
      current_date:
        type: date
        required: true
    returns:
      type: list[dict[str, Any]]
    side_effects: Reads pending notification_schedule rows due on or before current_date.
  - name: list_scheduled_notifications
    inputs:
      rule_id:
        type: int | None
        required: false
        default: null
      status:
        type: str | None
        required: false
        default: null
      limit:
        type: int
        required: false
        default: 25
    returns:
      type: list[dict[str, Any]]
    side_effects: Reads newest scheduled notification rows, optionally filtered by rule id and status, with decoded payload snapshots.
  - name: mark_scheduled_notification
    inputs:
      schedule_id:
        type: int
        required: true
      status:
        type: str
        required: true
    returns:
      type: None
    side_effects: Updates one notification_schedule row status and updated timestamp.
  - name: get_or_create_rollout_date
    inputs:
      today: {type: date, required: true}
    returns: {type: date}
    exceptions: [TypeError, ValueError]
    side_effects: Creates the permanent system notification rollout date once, then reads it on later launches to prevent retroactive sends.
  - name: activate_system_rule
    inputs:
      rule_id: {type: int, required: true}
    returns: {type: None}
    exceptions: []
    side_effects: Activates a validated system rule without clearing intentional user-disable metadata.
data_structures:
- name: STAFFING_NOTIFICATION_ROLE_RECIPIENTS
  type: list[NotificationRecipient]
- name: HIRING_MANAGER_NOTIFICATION_ROLE_RECIPIENTS
  type: list[NotificationRecipient]
- name: OFFER_APPROVED_NOTIFICATION_ROLE_RECIPIENTS
  type: list[NotificationRecipient]
- name: OFFER_ACCEPTED_NOTIFICATION_ROLE_RECIPIENTS
  type: list[NotificationRecipient]
dependencies:
- notification_models
- notification_templates
- email_security
