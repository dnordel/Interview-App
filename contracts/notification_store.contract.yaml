module:
  name: notification_store
  language: python
  path: src/notification_store.py
  version: 1.2.1
  description: SQLite-backed notification rule, recipient, pending date-offset schedule, and sanitized send-audit persistence.
functions:
- name: utc_now_iso
  description: Return current UTC timestamp as ISO text without microseconds.
  locked: false
  inputs: {}
  returns:
    type: str
  exceptions: []
  side_effects: none
classes:
- name: NotificationStore
  description: Persists notification rules, recipients, default examples, pending date-offset schedules, and send audit rows.
  locked: false
  methods:
  - name: list_rules
    inputs:
      event_type:
        type: str | None
        required: false
        default: null
    returns:
      type: list[NotificationRule]
    side_effects: Reads notification SQLite database.
  - name: ensure_default_rules
    inputs: {}
    returns:
      type: None
    side_effects: Creates inactive default notification rule examples when missing, including offer.generated so offer creation can trigger immediate or cloned date-offset notifications.
  - name: save_rule
    inputs:
      rule:
        type: NotificationRule
        required: true
    returns:
      type: NotificationRule
    exceptions:
    - ValueError
    side_effects: Writes notification rule, trigger timing/date-offset metadata, and recipient rows.
  - name: get_rule
    inputs:
      rule_id:
        type: int
        required: true
    returns:
      type: NotificationRule
    exceptions:
    - ValueError
    side_effects: Reads notification SQLite database.
  - name: delete_rule
    inputs:
      rule_id:
        type: int
        required: true
    returns:
      type: None
    side_effects: Deletes one notification rule and its recipients through SQLite cascading delete.
  - name: set_rule_active
    inputs:
      rule_id:
        type: int
        required: true
      active:
        type: bool
        required: true
    returns:
      type: None
    side_effects: Updates notification rule active flag.
  - name: has_send_attempt
    inputs:
      rule_id:
        type: int
        required: true
      idempotency_key:
        type: str
        required: true
    returns:
      type: bool
    side_effects: Reads notification audit table.
  - name: record_send_attempt
    inputs:
      event_type:
        type: str
        required: true
      rule_id:
        type: int | None
        required: true
      idempotency_key:
        type: str
        required: true
      recipient_count:
        type: int
        required: true
      status:
        type: str
        required: true
      error:
        type: str
        required: false
        default: ''
    returns:
      type: None
    side_effects: Inserts one notification audit row.
  - name: schedule_notification
    inputs:
      event_type:
        type: str
        required: true
      rule_id:
        type: int
        required: true
      idempotency_key:
        type: str
        required: true
      due_date:
        type: date
        required: true
      payload:
        type: dict[str, Any]
        required: true
    returns:
      type: None
    side_effects: Upserts one pending notification_schedule row with JSON payload
      for a future date-offset notification.
  - name: list_due_scheduled_notifications
    inputs:
      current_date:
        type: date
        required: true
    returns:
      type: list[dict[str, Any]]
    side_effects: Reads pending notification_schedule rows due on or before current_date.
  - name: mark_scheduled_notification
    inputs:
      schedule_id:
        type: int
        required: true
      status:
        type: str
        required: true
    returns:
      type: None
    side_effects: Updates one notification_schedule row status and updated timestamp.
data_structures: []
dependencies:
- notification_models
- email_security
