module:
  name: interview_app_bootstrap
  language: python
  path: src/interview_app/bootstrap.py
  version: 1.3.0
  description: Contracts for bootstrap module.
functions:
- name: build_default_settings
  description: Build default Tk app settings, including local Ollama deepseek-r1:8b summary
    defaults for finalize-time executive summary, interview highlights, and answer
    summaries plus editable DeepSeek prompt templates and per-question prompt override
    maps persisted through the app settings JSON.
  locked: false
  inputs: {}
  returns:
    type: dict[str, Any]
  exceptions: []
  side_effects: none
- name: create_fonts
  description: create_fonts function.
  locked: false
  inputs:
    root:
      type: tk.Tk
      required: true
  returns:
    type: IntroFonts
  exceptions: []
  side_effects: none
- name: wire_controllers
  description: wire_controllers function.
  locked: false
  inputs:
    app:
      type: Any
      required: true
    shared_state:
      type: AppSharedState
      required: true
  returns:
    type: None
  exceptions: []
  side_effects: none
- name: wire_views
  description: wire_views function.
  locked: false
  inputs:
    app:
      type: Any
      required: true
  returns:
    type: None
  exceptions: []
  side_effects: initializes view renderer instances on app
classes:
- name: IntroFonts
  description: IntroFonts class.
  locked: false
  attributes:
    intro_body_font:
      type: tkfont.Font
    intro_heading_font:
      type: tkfont.Font
  methods: []
data_structures:
- name: IntroFonts
  type: dataclass
dependencies:
- module: platform_services
- module: interview_app_audio_runtime
- module: interview_app_dashboard_controller
- module: interview_app_finalize_pipeline
- module: interview_app_flow_controller
- module: interview_app_history_controller
- module: interview_runtime
- module: interview_app_transcript_writer
- module: ui_composition
- module: interview_app_views
- module: scoring_reporting
