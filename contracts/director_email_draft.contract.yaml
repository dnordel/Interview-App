module:
  name: director_email_draft
  language: python
  path: src/director_email_draft.py
  version: 1.0.0
  description: Outlook-draft and mailto fallback helpers for director and offer email workflows.
functions:
- name: open_outlook_draft
  description: Opens an Outlook draft on Windows and attaches only existing files from the provided attachment list.
  locked: false
  inputs:
    subject:
      type: str
      required: true
    body:
      type: str
      required: true
    attachments:
      type: list[str]
      required: true
    to_recipients:
      type: str
      required: false
      default: ""
  returns:
    type: None
  exceptions:
  - DirectorEmailDraftError
  side_effects: launches Outlook via PowerShell COM automation on Windows
- name: build_mailto_url
  description: Builds a sanitized mailto URL for fallback email draft flows.
  locked: false
  inputs:
    subject:
      type: str
      required: true
    body:
      type: str
      required: true
    to_recipients:
      type: str
      required: false
      default: ""
  returns:
    type: str
  exceptions: []
  side_effects: none
classes:
- name: DirectorEmailDraftError
  description: Raised when Outlook draft automation cannot be completed.
  locked: false
  attributes: {}
  methods: []
data_structures: []
dependencies:
- email_security
