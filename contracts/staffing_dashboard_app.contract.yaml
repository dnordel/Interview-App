module:
  name: staffing_dashboard_app
  language: python
  path: src/staffing_dashboard_app.py
  version: 1.0.0
  description: Director-facing PySide staffing dashboard entrypoint that opens directly to staffing metrics and workbook-style classroom positions without importing interview runtime, document/reporting, Admin Studio, audio, transformer, or local AI modules.
functions:
- name: staffing_status_color
  description: Map a staffing assignment status to the dashboard row color.
  locked: false
  inputs:
    status:
      type: str
      required: true
  returns:
    type: str
  exceptions: []
  side_effects: none
- name: permit_color
  description: Map a permit status to the dashboard person-cell color.
  locked: false
  inputs:
    status:
      type: str
      required: true
  returns:
    type: str
  exceptions: []
  side_effects: none
- name: slot_label
  description: Build the readable role/slot label for a staffing metric row.
  locked: false
  inputs:
    row:
      type: Any
      required: true
  returns:
    type: str
  exceptions: []
  side_effects: none
- name: school_summary
  description: Summarize open, coming, and filled assignment counts for one school tab.
  locked: false
  inputs:
    rows:
      type: list[Any]
      required: true
  returns:
    type: str
  exceptions: []
  side_effects: none
- name: seed_assignment_count
  description: Count assignment slots in the local staffing seed JSON before deciding whether to top up an existing database.
  locked: false
  inputs:
    seed_path:
      type: Path
      required: true
  returns:
    type: int
  exceptions:
  - OSError
  - JSONDecodeError
  side_effects: reads local seed JSON
- name: apply_styles
  description: Apply the director staffing dashboard PySide stylesheet.
  locked: false
  inputs:
    app:
      type: QApplication
      required: true
  returns:
    type: None
  exceptions: []
  side_effects: mutates QApplication stylesheet
- name: launch_staffing_dashboard_app
  description: Launch the director staffing dashboard app.
  locked: false
  inputs: {}
  returns:
    type: int
  exceptions: []
  side_effects: Creates a QApplication and opens the director staffing dashboard window.
- name: main
  description: Command-line entry point for the director staffing dashboard.
  locked: false
  inputs: {}
  returns:
    type: int
  exceptions: []
  side_effects: Launches the PySide staffing dashboard UI.
classes:
- name: StaffingDashboardWindow
  description: Main director staffing PySide window with metrics, school selector, workbook-style staffing tabs, position detail editing, and service-backed status transitions.
  locked: false
  attributes:
    db_path:
      type: Path
    seed_path:
      type: Path
    store:
      type: StaffingStore
    window:
      type: QMainWindow
    status_label:
      type: QLabel
    metrics_label:
      type: QLabel
    school_selector:
      type: QComboBox
    tabs:
      type: QTabWidget
  methods:
  - name: show
    description: Show the director staffing dashboard window.
    locked: false
    inputs: {}
    returns:
      type: None
    exceptions: []
    side_effects: Displays the QMainWindow.
  - name: refresh
    description: Initialize staffing storage, import or top up seed data when needed, recompute metrics, and rebuild school tabs.
    locked: false
    inputs: {}
    returns:
      type: None
    exceptions:
    - OSError
    - ValueError
    side_effects: May write staffing SQLite rows from seed and updates visible widgets.
data_structures: []
dependencies:
- module: staffing_service
- module: staffing_store
- module: PySide6
