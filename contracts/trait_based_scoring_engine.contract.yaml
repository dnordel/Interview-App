module:
  name: trait_based_scoring_engine
  language: python
  path: Trait-Based Scoring/trait_based_scoring_engine.py
  version: 1.3.2
  description: Trait scoring engine with contract-relative runtime bundle loading
    and preflight path validation.
functions: []
classes:
- name: ScoringEngine
  description: Loads trait scoring configuration and evaluates trait/session signal
    selections.
  locked: false
  attributes: {}
  methods:
  - name: __init__
    description: Initialize the scoring engine with validated configuration and a
      shared signal dictionary.
    locked: false
    inputs:
      config:
        type: dict
        required: true
      signal_dictionary:
        type: dict
        required: true
    returns:
      type: Any
    exceptions:
    - TypeError
    - KeyError
    - FileNotFoundError
    - PermissionError
    side_effects: none
  - name: _path
    description: Join config path parts into a dotted string for diagnostics.
    locked: false
    inputs:
      parts:
        type: list[str]
        required: true
    returns:
      type: str
    exceptions: []
    side_effects: none
  - name: _contract_base_dir
    description: Resolve the containing directory for a contract file path.
    locked: false
    inputs:
      contract_path:
        type: str | Path
        required: true
    returns:
      type: Path
    exceptions: []
    side_effects: none
  - name: resolve_configured_path
    description: Resolve a configured path relative to the contract file when it is
      not absolute.
    locked: false
    inputs:
      contract_path:
        type: str | Path
        required: true
      configured_path:
        type: str
        required: true
    returns:
      type: Path
    exceptions: []
    side_effects: none
  - name: validate_configured_paths
    description: Preflight validate required configured paths and return resolved
      filesystem locations.
    locked: false
    inputs:
      config:
        type: dict
        required: true
      contract_path:
        type: str | Path
        required: true
    returns:
      type: dict[str, Path]
    exceptions:
    - TypeError
    - KeyError
    - FileNotFoundError
    - PermissionError
    side_effects: Reads filesystem metadata.
  - name: _assert_path_accessible
    description: Ensure a configured file or directory exists and is readable.
    locked: false
    inputs:
      path:
        type: Path
        required: true
      key:
        type: str
        required: true
    returns:
      type: None
    exceptions:
    - FileNotFoundError
    - PermissionError
    - ValueError
    side_effects: Reads filesystem metadata.
  - name: _require_dict_static
    description: Validate that nested config sections are present and mappings.
    locked: false
    inputs:
      payload:
        type: dict
        required: true
      parts:
        type: list[str]
        required: true
    returns:
      type: dict
    exceptions:
    - TypeError
    - KeyError
    side_effects: none
  - name: _require_value
    description: Validate that a required key exists in a mapping.
    locked: false
    inputs:
      payload:
        type: dict
        required: true
      key:
        type: str
        required: true
      parts:
        type: list[str]
        required: true
    returns:
      type: Any
    exceptions:
    - KeyError
    side_effects: none
  - name: load_runtime_bundle
    description: Load config, shared signal dictionary, trait definitions, and resolved
      paths from the contract location, normalizing traits for scoring use.
    locked: false
    inputs:
      contract_path:
        type: str | Path
        required: true
    returns:
      type: tuple[dict, dict, list[dict], dict[str, Path]]
    exceptions:
    - FileNotFoundError
    - PermissionError
    - json.JSONDecodeError
    - yaml.YAMLError
    side_effects: Reads configuration and trait files from disk.
  - name: load_traits_from_dir
    description: Load all trait JSON payloads from the configured traits directory without mutating their source structure.
    locked: false
    inputs:
      traits_dir:
        type: str | Path
        required: true
    returns:
      type: list[dict]
    exceptions:
    - json.JSONDecodeError
    - OSError
    side_effects: Reads trait files from disk.
  - name: _require_dict
    description: Instance wrapper around static mapping validation helper.
    locked: false
    inputs:
      payload:
        type: dict
        required: true
      parts:
        type: list[str]
        required: true
    returns:
      type: dict
    exceptions:
    - TypeError
    - KeyError
    side_effects: none
  - name: _require_bool
    description: Validate a nested boolean configuration setting.
    locked: false
    inputs:
      payload:
        type: dict
        required: true
      parts:
        type: list[str]
        required: true
    returns:
      type: bool
    exceptions:
    - TypeError
    - KeyError
    side_effects: none
  - name: _optional_dict
    description: Return an optional nested mapping when every path segment exists.
    locked: false
    inputs:
      payload:
        type: dict
        required: true
      parts:
        type: list[str]
        required: true
    returns:
      type: dict | None
    exceptions:
    - TypeError
    side_effects: none
  - name: _require_number
    description: Validate a nested numeric configuration setting.
    locked: false
    inputs:
      payload:
        type: dict
        required: true
      parts:
        type: list[str]
        required: true
    returns:
      type: int | float
    exceptions:
    - TypeError
    - KeyError
    side_effects: none
  - name: _assert_startup_schema
    description: Validate required scoring configuration structure and signal dictionary
      schema.
    locked: false
    inputs:
      config:
        type: dict
        required: true
      signal_dictionary:
        type: dict
        required: true
    returns:
      type: None
    exceptions:
    - TypeError
    - KeyError
    - FileNotFoundError
    - PermissionError
    side_effects: Reads configured path metadata.
  - name: resolve_signal
    description: Resolve a trait signal reference against the shared dictionary and
      trait overrides.
    locked: false
    inputs:
      signal:
        type: dict
        required: true
    returns:
      type: dict | None
    exceptions:
    - ValueError
    side_effects: none
  - name: score_trait
    description: Score a single trait using selected signal references.
    locked: false
    inputs:
      trait:
        type: dict
        required: true
      selected_refs:
        type: list[str]
        required: true
    returns:
      type: dict
    exceptions: []
    side_effects: none
  - name: score_session
    description: Score all configured traits, compute non-skipped critical selection
      state, and return session decision metadata.
    locked: false
    inputs:
      traits:
        type: list[dict]
        required: true
      selections:
        type: dict[str, list[str]]
        required: true
    returns:
      type: dict[str, Any]
    exceptions: []
    side_effects: none
  - name: make_decision
    description: Resolve the threshold-based session decision label without applying
      override metadata.
    locked: false
    inputs:
      final_score:
        type: int | float
        required: true
      critical_flag:
        type: bool
        required: true
    returns:
      type: str
    exceptions: []
    side_effects: none
  - name: debug_trait
    description: Print a detailed scoring trace for a single trait.
    locked: false
    inputs:
      trait:
        type: dict
        required: true
      selected_refs:
        type: list[str]
        required: true
    returns:
      type: None
    exceptions: []
    side_effects: Writes debug output to stdout.
  - name: build_decision_summary
    description: Apply contract override settings before thresholds and return explicit
      decision metadata for session scoring output.
    locked: false
    inputs:
      final_score:
        type: int | float
        required: true
      critical_flag:
        type: bool
        required: true
    returns:
      type: dict[str, Any]
    exceptions: []
    side_effects: none
data_structures: []
dependencies:
- json
- pathlib
- yaml
