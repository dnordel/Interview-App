system_name: Preschool Teacher Interview Guide
layers:
- ui
- application_services
- domain_logic
- infrastructure
services:
  interview_runtime_service:
    description: Interview flow orchestration, state transitions, transcription, and
      finalization that produces one merged interview-notes document (interview_notes_document_path)
      including transcription content.
    modules:
    - interview_runtime
    - interview_app
    - interview_app___init__
    - interview_app_audio_runtime
    - interview_app_bootstrap
    - interview_app_dashboard_controller
    - interview_app_finalize_context
    - interview_app_finalize_gateways
    - interview_app_finalize_pipeline
    - interview_app_flow_controller
    - interview_app_history_actions
    - interview_app_history_controller
    - interview_app_state
    - interview_app_transcript_writer
    - interview_app_transcript_processor
    - interview_app_transcription_executor
    - interview_app_transcription_queue
    - interview_app_types
    - interview_app_ui_router
    - interview_app_view_protocols
    - interview_app_ui_shell
    - interview_app_whisper_runtime_policy
    - interview_audio_recorder
    - runtime_wrapper
    - interview_app_views
    - interview_app_views_candidate_setup_view
    - interview_app_views_signal_reference_view
    - interview_app_views_start_screen_view
    - interview_app_session_context
    - interview_app_session_manager
    - deepseek_finalize_worker
  onboarding_operations_service:
    description: Onboarding scheduling, reminders, dashboard actions, notifications,
      and storage.
    modules:
    - onboarding_operations
    - onboarding_app
  ui_composition_service:
    description: Tkinter windows, routed shells, top-level desktop UI switching,
      validation feedback surfaces, and keyboard telemetry.
    modules:
    - ui_composition
    - initial_teacher_interview_guide
    - interview_app
    - interview_app_ui_router
    - interview_app_view_protocols
    - interview_app_ui_shell
    - onboarding_app
    - ui_windows
    - tk_theme
    - interview_app_views
    - interview_app_views_candidate_setup_view
    - interview_app_views_signal_reference_view
    - interview_app_views_start_screen_view
    - ui_mode_switch
  web_scored_question_service:
    description: Static browser prototype for scored competency question UI, reading
      local rubric and merged weighted trait-signal JSON for teacher and Behavior
      Support Specialist roles without changing desktop session persistence.
    modules:
    - web_scored_question
  web_app_migration_service:
    description: Static browser migration shell for start, candidate setup, interview,
      onboarding, settings, question editor, and history surfaces. It reads local
      JSON config, user_artifacts history/settings, and merged weighted trait-signal
      data when served from the repository and keeps Tk as the main production
      entry point.
    modules:
    - web_app
    - web_app_backend
  pyside_interview_redesign_service:
    description: PySide6 workflow-first desktop redesign shell for interviews, candidates,
      offers, onboarding, guided Admin Studio, user-closable finalize progress with
      task/status rows, live history refresh, and single-surface parity documentation
      for desktop Tk contracts while reusing local rubric, question flow, history
      JSON, and Tk-owned finalize/document/DeepSeek runtime contracts. Admin Studio
      draft editing, validation, backups, and confirmed config writes are flattened
      into admin_studio.
    modules:
    - admin_studio
    - pyside_interview_app
  shared_platform_service:
    description: Shared content/configuration loading, logging, persistence helpers,
      and runtime wrappers.
    modules:
    - platform_services
    - app_logging
    - data_store
    - docx_compat
    - runtime_wrapper
    - storage_utils
    - check_contract_review
    - interview_app_session_context
    - ui_mode_switch
  deepseek_finalize_worker_service:
    description: Detached local DeepSeek worker that refreshes generated interview
      notes and history status after finalize returns to the GUI. Workers use a
      per-deepseek_jobs lock file so local DeepSeek/Ollama finalize work is serialized
      per interview base directory and write sanitized task/status progress JSON for
      GUI polling.
    modules:
    - deepseek_finalize_worker
  shared_content_security_service:
    description: Cross-cutting shared utilities for logging, templating, exports,
      diagnostics, and email/input safety.
    modules:
    - scoring_reporting
    - app_logging
    - storage_utils
datastores:
  json_file_store:
    type: file_system_json
    description: Canonical mutable app JSON lives under user_artifacts; interview
      history also reads root-level interview_history.json as read-only legacy data
      so past interviews from older app versions remain visible. DeepSeek prompt
      templates live in config/deepseek_prompts.json for source-controlled prompt
      editing and per-question override maps; runtime role-context injection keeps
      executive prompts scoped to the selected job title instead of embedding all
      role-specific guidance in every request.
    used_by:
    - data_store
    - onboarding_operations
    - ui_composition
external_apis:
  openai_whisper_runtime:
    Purpose: Speech-to-text transcription for interview responses.
  director_referral_endpoint:
    Purpose: Submit referral payloads generated during interview finalization.
  local_docx_runtime:
    Purpose: Generate interview and onboarding document artifacts.
background_jobs:
- onboarding_operations
- deepseek_finalize_worker: serialized per interview base directory by
    deepseek-finalize.lock
trust_boundaries:
  user_input: Tkinter forms, free-text notes, and runtime settings are untrusted until
    validated/sanitized.
  filesystem: All read/write paths are constrained by guardrails and explicit user
    choices, with default generated artifacts grouped under the ignored user_artifacts
    directory and strict path validation for merged interview-notes artifacts before
    finalize/referral/integration writes.
  network: Referral/integration submission endpoints are treated as untrusted remote
    dependencies.
security_expectations:
  input_validation: Validation feedback surfaces must block finalize/send paths on
    invalid required fields and require merged-document sanitization before downstream
    handoff.
  side_effect_controls: Finalize/send actions must be idempotent or deduplicated before
    network calls.
  authz: High-risk automation toggles require explicit operator confirmation.
  idempotency: Referral sends should dedupe by deterministic key to avoid duplicate
    submissions.
  retry_controls: Onboarding reminder automation must enforce bounded retries for
    SMTP operations and surface non-retriable failures without silent loops.
  sensitive_output_redaction: Reminder and escalation failures must avoid logging
    SMTP credentials, raw auth artifacts, or full recipient dumps in operator-visible
    errors.
  diagnostic_path_redaction: Operator-visible runtime and transcription diagnostics
    must use shared path-redaction helpers before rendering or logging hints.
allowed_dependencies: []
