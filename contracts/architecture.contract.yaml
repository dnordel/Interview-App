system_name: Preschool Teacher Interview Guide
layers:
- ui
- application_services
- domain_logic
- infrastructure
services:
  interview_runtime_service:
    description: Interview flow orchestration, state transitions, transcription, and finalization that produces one basic merged interview-notes document (interview_notes_document_path) including transcription content without starting DeepSeek.
    modules:
    - interview_runtime
    - interview_app___init__
    - interview_app_audio_runtime
    - interview_app_dashboard_controller
    - interview_app_finalize_context
    - interview_app_finalize_gateways
    - interview_app_finalize_pipeline
    - interview_app_flow_controller
    - interview_app_history_actions
    - interview_app_history_controller
    - interview_app_state
    - interview_app_transcript_writer
    - interview_app_transcript_processor
    - interview_app_transcription_executor
    - interview_app_transcription_queue
    - interview_app_types
    - interview_app_whisper_runtime_policy
    - interview_audio_recorder
    - runtime_wrapper
    - interview_app_session_context
    - interview_app_session_manager
    - deepseek_finalize_worker
  onboarding_operations_service:
    description: Onboarding scheduling, reminders, dashboard actions, notifications, and storage.
    modules:
    - onboarding_operations
  notification_service:
    description: Generic checkpoint email notification rules, explicit-email and role recipients including Candidate, school Director, Hiring Manager, and Executive Director, selected-rule test sends, approved-offer PDF attachments, scheduled rows, idempotent send audit, and auto-send delivery through ignored local shared company SMTP settings.
    modules:
    - notification_models
    - notification_store
    - notification_service
  staffing_dashboard_service:
    description: Local SQLite staffing assignment state machine, workbook-style school/classroom/slot display metadata, assignment history, permit updates, metrics, seed import, post-commit checkpoint notification hooks, and parallel PySide Staffing v2 dashboard rewrite surface including notification rule management and test-send UI.
    modules:
    - staffing_models
    - staffing_store
    - staffing_service
    - staffing_dashboard_v2
    - candidate_report
    - candidate_report_dialog
  director_staffing_dashboard_service:
    description: Director-facing generated Windows launch paths, one per staffing seed school, for a minimal PySide Staffing v2 app; each launcher filters to its assigned school and avoids full interview, audio, transcription, DOCX, local AI, FFmpeg, VB-CABLE, OpenVINO, and GPU setup.
    modules:
    - director_staffing_launcher
    - director_staffing_app
    - staffing_service
    - staffing_store
    - candidate_report
    - candidate_report_dialog
  web_scored_question_service:
    description: Static browser prototype for scored competency question UI, reading local rubric and merged weighted trait-signal JSON for teacher and Behavior Support Specialist roles without changing desktop session persistence.
    modules:
    - web_scored_question
  web_app_migration_service:
    description: Static browser migration shell for start, candidate setup, interview, onboarding, settings, question editor, and history surfaces. It reads local JSON config, user_artifacts history/settings, and merged weighted trait-signal data while PySide remains the current desktop entry point.
    modules:
    - web_app
    - web_app_backend
  pyside_interview_redesign_service:
    description: PySide6 workflow-first desktop shell for interviews, candidates, school-routed full-time and part-time offers with editable shift defaults from exact Director Staffing v2 hire decisions, staffing, onboarding, guided Admin Studio, user-closable finalize progress with task/status rows, live history refresh, notification editing, basic finalize documents, and history-triggered DeepSeek document generation.
    modules:
    - admin_studio
    - pyside_interview_app
    - staffing_dashboard_v2
    - notification_service
    - staffing_service
    - staffing_store
    - candidate_report
    - candidate_report_dialog
  shared_platform_service:
    description: Shared content/configuration loading, logging, persistence helpers, and runtime wrappers.
    modules:
    - platform_services
    - app_logging
    - data_store
    - docx_compat
    - runtime_wrapper
    - storage_utils
    - check_contract_review
    - split_pytest_runner
    - pytest_duration_catalog
    - interview_app_session_context
    - ui_mode_switch
  deepseek_finalize_worker_service:
    description: Detached local DeepSeek worker launched from candidate history Generate that replaces basic interview notes with DeepSeek interview notes and updates history status. Workers use a per-deepseek_jobs lock file so local DeepSeek/Ollama work is serialized per interview base directory and write sanitized task/status progress JSON for GUI polling.
    modules:
    - deepseek_finalize_worker
  shared_content_security_service:
    description: Cross-cutting shared utilities for logging, templating, exports, diagnostics, and email/input safety.
    modules:
    - scoring_reporting
    - app_logging
    - storage_utils
    - notification_store
datastores:
  interview_history_db:
    type: sqlite
    description: Canonical finalized interview history lives in user_artifacts/interview_history.sqlite3; legacy JSON rows are imported when the database is empty.
    used_by:
    - data_store
    - pyside_interview_app
    - web_app_backend
    - candidate_report
  interview_ml_dataset_db:
    type: sqlite
    description: Derived normalized ML dataset lives outside Dropbox at G:\My Drive\Work\LaunchPad\Interview ML DB\interview_ml_dataset.sqlite3 by default, storing session/profile rows, exact per-answer prompt snapshots, human and AI scoring fields, DeepSeek prompt/output traces, signal evidence, export metadata, and pending-AI backlog rows. It is rebuilt or enriched from finalize, DeepSeek worker, history, job/session artifacts, and DOCX transcript recovery without making it canonical app history; INTERVIEW_ML_DATASET_DIR can override the directory for tests or alternate machines.
    used_by:
    - data_store
    - interview_runtime
    - deepseek_finalize_worker
    - tools/backfill_interview_ml_dataset.py
    - tools/export_interview_ml_dataset.py
  staffing_referral_queue_db:
    type: sqlite
    description: Canonical interview-to-staffing director referral bridge lives in user_artifacts/staffing_referrals.sqlite3; legacy staffing_referrals.pending.jsonl records are imported once when present.
    used_by:
    - staffing_referral_queue
    - pyside_interview_app
  json_file_store:
    type: file_system_json
    description: Canonical mutable app JSON lives under user_artifacts except finalized interview history and staffing referral queue events, which are SQLite-backed; interview_history.json files remain read-only migration sources so past interviews from older app versions remain visible. DeepSeek prompt templates live in config/deepseek_prompts.json for source-controlled prompt editing and per-question override maps; runtime role-context injection keeps executive prompts scoped to the selected job title instead of embedding all role-specific guidance in every request.
    used_by:
    - data_store
    - onboarding_operations
external_apis:
  openai_whisper_runtime:
    Purpose: Speech-to-text transcription for interview responses.
  director_referral_endpoint:
    Purpose: Submit referral payloads generated during interview finalization.
  local_docx_runtime:
    Purpose: Generate interview and onboarding document artifacts.
background_jobs:
- onboarding_operations
- deepseek_finalize_worker: serialized per interview base directory by deepseek-finalize.lock
trust_boundaries:
  user_input: PySide forms, browser prototypes, free-text notes, and runtime settings are untrusted until validated/sanitized.
  filesystem: All read/write paths are constrained by guardrails and explicit user choices, with default generated artifacts grouped under the ignored user_artifacts directory and strict path validation for merged interview-notes artifacts before finalize/referral/integration writes.
  network: Referral/integration submission endpoints are treated as untrusted remote dependencies.
security_expectations:
  input_validation: Validation feedback surfaces must block finalize/send paths on invalid required fields and require merged-document sanitization before downstream handoff.
  side_effect_controls: Finalize/send actions must be idempotent or deduplicated before network calls.
  authz: High-risk automation toggles require explicit operator confirmation.
  idempotency: Referral sends should dedupe by deterministic key to avoid duplicate submissions.
  retry_controls: Onboarding reminder automation must enforce bounded retries for SMTP operations and surface non-retriable failures without silent loops.
  sensitive_output_redaction: Reminder and escalation failures must avoid logging SMTP credentials, raw auth artifacts, or full recipient dumps in operator-visible errors.
  diagnostic_path_redaction: Operator-visible runtime and transcription diagnostics must use shared path-redaction helpers before rendering or logging hints.
allowed_dependencies: []
