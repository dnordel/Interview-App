system_name: Preschool Teacher Interview Guide
layers:
- ui
- application_services
- domain_logic
- infrastructure
services:
  hiring_pipeline_service:
    description: Canonical seven-stage candidate application pipeline, audit timeline, Staffing v2 decision synchronization, immutable numbered offers with pre-generated DOCX/PDF artifacts, notification-settings-backed approval previews, approval dates, delivery recovery, negotiation, acceptance, and archive controls.
    modules:
    - dashboard_v2_ui
    - hiring_pipeline
    - hiring_migration
    - hiring_workspace_v2
    - pyside_interview_app
    - scoring_reporting
    - notification_service
    - notification_templates
  interview_runtime_service:
    description: Interview flow orchestration, state transitions, transcription, and finalization that produces one basic merged interview-notes document (interview_notes_document_path) including candidate-response transcription content while keeping the live-only introduction out of notes and completed-overview surfaces.
    modules:
    - interview_runtime
    - interview_app___init__
    - interview_app_finalize_pipeline
    - interview_app_history_actions
    - interview_audio_recorder
    - runtime_wrapper
  onboarding_operations_service:
    description: Role-authorized encrypted onboarding workflows, portable Windows replicas, immutable cross-device sync, digest-bound legacy migration, shared reminders, guarded close/restart, and evidence-gated Director-school rollout in the Staffing v2 shell.
    modules:
    - onboarding_operations
    - onboarding_store
    - onboarding_paths
    - onboarding_service
    - onboarding_workspace_v2
    - cross_database_change_stage
    - onboarding_vault
    - onboarding_pdf_fill
    - onboarding_pdf_mapper_v2
    - onboarding_package_editor
    - onboarding_attachments
    - onboarding_staffing_bridge
    - onboarding_sync
    - onboarding_reminders_v2
    - onboarding_scheduler_v2
    - onboarding_migrations
    - onboarding_pilot_gate
    - onboarding_pilot_gate_cli
  notification_service:
    description: Ten editable system workflow notifications with visible safe AND condition rows over curated DB/event fields, school role/name directory, shared IMAP/POP and SMTP verification, admin-managed Dropbox-wide or DPAPI password storage, one shared safe-recipient helper and editable confirmation dialog for Candidate notification tests, required attachments, permanent success dedupe, rollout gating, and five-minute exact-date/noon/permit scheduling.
    modules:
    - notification_models
    - notification_store
    - notification_service
    - notification_templates
  staffing_dashboard_service:
    description: Lock-isolated SQLite staffing assignment state machines synchronized through immutable per-user JSON event outboxes, predecessor chains that tolerate delayed/out-of-order Dropbox delivery, and per-database receipts with causal conflict prompts, plus the shared Staffing v2 shell, theme, cards, overlays, navigation, and dashboard surfaces including notification rule management and test-send UI.
    modules:
    - dashboard_v2_ui
    - staffing_models
    - staffing_store
    - staffing_change_stage
    - cross_database_change_stage
    - staffing_service
    - staffing_dashboard_v2
    - staffing_dashboard_host
    - candidate_report
    - candidate_report_dialog
  director_staffing_dashboard_service:
    description: Director-facing generated Windows launch paths, one per staffing seed school, for a minimal PySide Staffing v2 app with basic DOCX interview-note generation; each launcher filters to its assigned school and avoids full interview, audio, transcription, FFmpeg, VB-CABLE, OpenVINO, and GPU setup.
    modules:
    - app_branding
    - director_staffing_launcher
    - director_staffing_app
    - staffing_dashboard_host
    - staffing_service
    - staffing_store
    - staffing_change_stage
    - candidate_report
    - candidate_report_dialog
    - source_update_monitor
  source_update_reload_service:
    description: Single-developer source deployment stamp regenerated by full-suite preflight, five-second desktop polling, digest readiness checks only after stamp changes, persistent reload banner, and detached restart path shared by admin and director apps.
    modules:
    - update_source_version
    - source_update_monitor
    - pyside_interview_app
    - director_staffing_app
  web_scored_question_service:
    description: Static browser prototype for scored competency question UI, reading local rubric and merged weighted trait-signal JSON for teacher and Behavior Support Specialist roles without changing desktop session persistence.
    modules:
    - web_scored_question
  web_app_migration_service:
    description: Static browser migration shell for start, candidate setup, interview, onboarding, settings, question editor, and history surfaces. It reads local JSON config, user_artifacts history/settings, and merged weighted trait-signal data while PySide remains the current desktop entry point.
    modules:
    - web_app
    - web_app_backend
  pyside_interview_redesign_service:
    description: PySide6 Staffing v2-native mockup-driven New Interview setup/live flow, Candidates-owned pipeline/history, Offers, staffing, onboarding, and admin-only Settings content inside the shared Staffing v2 shell, with a cancellable 5-second manual audio test, serialized 15-second post-Begin validation, semantic status colors, capture state, live history refresh, reporting, and Director Review handoff.
    modules:
    - app_branding
    - admin_studio
    - dashboard_v2_ui
    - pyside_interview_app
    - interview_audio_preflight
    - pyside_completed_interview
    - pyside_interview_components
    - pyside_live_interview
    - hiring_pipeline
    - hiring_workspace_v2
    - staffing_dashboard_v2
    - staffing_settings_v2
    - staffing_dashboard_host
    - notification_service
    - staffing_service
    - staffing_store
    - staffing_change_stage
    - candidate_report
    - candidate_report_dialog
  shared_platform_service:
    description: Shared content/configuration loading, logging, persistence helpers, and runtime wrappers.
    modules:
    - app_branding
    - platform_services
    - app_logging
    - data_store
    - runtime_wrapper
    - check_contract_review
    - gui_action_behavior_coverage
    - split_pytest_runner
    - full_pytest_runner
    - pytest_duration_catalog
    - ui_mode_switch
    - source_update_monitor
    - update_source_version
  shared_content_security_service:
    description: Cross-cutting shared utilities for logging, templating, exports, diagnostics, and email/input safety.
    modules:
    - scoring_reporting
    - app_logging
    - notification_store
datastores:
  onboarding_pilot_evidence:
    type: file_system_jsonl
    description: PII-safe hash-chained business-day evidence and ordered rollout approvals under user_artifacts/onboarding/pilot; corrupted state fails closed to Palmdale.
    used_by:
    - onboarding_pilot_gate
    - onboarding_pilot_gate_cli
    - staffing_dashboard_host
  staffing_change_event_files:
    type: file_system_json
    description: Immutable UUID-named, predecessor-linked cross-database staffing events in separate per-user outbox directories plus immutable per-database delivery receipts, stored beside staffing_dashboard.sqlite3 and merged safely by Dropbox without shared DB locks or out-of-order applies.
    used_by:
    - staffing_change_stage
    - staffing_service
    - pyside_interview_app
    - director_staffing_app
  interview_history_db:
    type: sqlite
    description: Canonical finalized interview history lives in user_artifacts/interview_history.sqlite3; legacy JSON rows are imported when the database is empty.
    used_by:
    - data_store
    - pyside_interview_app
    - hiring_pipeline
    - hiring_workspace_v2
    - web_app_backend
    - candidate_report
  staffing_referral_queue_db:
    type: sqlite
    description: Canonical interview-to-staffing director referral bridge lives in user_artifacts/staffing_referrals.sqlite3; legacy staffing_referrals.pending.jsonl records are imported once when present.
    used_by:
    - staffing_referral_queue
    - pyside_interview_app
  json_file_store:
    type: file_system_json
    description: Canonical mutable app JSON lives under user_artifacts except finalized interview history and staffing referral queue events, which are SQLite-backed; interview_history.json files remain read-only migration sources so past interviews from older app versions remain visible.
    used_by:
    - data_store
    - onboarding_operations
external_apis:
  whisper_transcription_runtime:
    Purpose: Speech-to-text transcription for interview responses.
  director_referral_endpoint:
    Purpose: Submit referral payloads generated during interview finalization.
  local_docx_runtime:
    Purpose: Generate interview and onboarding document artifacts.
  microsoft_word_automation:
    Purpose: Convert approved DOCX offer artifacts to exact-review PDFs through the Windows pywin32 COM bridge.
background_jobs:
- onboarding_operations
trust_boundaries:
  user_input: PySide forms, browser prototypes, free-text notes, and runtime settings are untrusted until validated/sanitized.
  filesystem: All read/write paths are constrained by guardrails and explicit user choices, with default generated artifacts grouped under the ignored user_artifacts directory and strict path validation for merged interview-notes artifacts before finalize/referral/integration writes.
  network: Referral/integration submission endpoints are treated as untrusted remote dependencies.
security_expectations:
  input_validation: Validation feedback surfaces must block finalize/send paths on invalid required fields and require merged-document sanitization before downstream handoff.
  side_effect_controls: Finalize/send actions must be idempotent or deduplicated before network calls.
  authz: High-risk automation toggles require explicit operator confirmation.
  idempotency: Referral sends should dedupe by deterministic key to avoid duplicate submissions.
  retry_controls: Onboarding reminder automation must enforce bounded retries for SMTP operations and surface non-retriable failures without silent loops.
  sensitive_output_redaction: Reminder and escalation failures must avoid logging SMTP credentials, raw auth artifacts, or full recipient dumps in operator-visible errors.
  diagnostic_path_redaction: Operator-visible runtime and transcription diagnostics must use shared path-redaction helpers before rendering or logging hints.
allowed_dependencies: []
