module:
  name: config_adapters
  language: python
  path: src/config_adapters.py
  version: 1.0.0
  description: Schema-aware config parsing/validation adapters for config JSON assets.
functions:
- name: inventory_config_assets
  description: Returns config asset inventory metadata including owner and consuming modules.
  locked: false
  inputs:
    config_dir:
      type: Path
      required: true
  returns:
    type: list[dict[str, Any]]
  exceptions: []
  side_effects: none
- name: load_json_dict
  description: Loads JSON as object with size limits and safe parse errors.
  locked: false
  inputs:
    path:
      type: Path
      required: true
    required:
      type: bool
      required: true
    context:
      type: str
      required: true
    default:
      type: dict[str, Any] | None
      required: false
      default: null
    max_bytes:
      type: int
      required: false
      default: 2000000
  returns:
    type: dict[str, Any]
  exceptions:
  - FileNotFoundError
  - ConfigValidationError
  side_effects: reads file system
- name: validate_rubric_config
  description: Enforces required rubric keys, field types, and trait ranges.
  locked: false
  inputs:
    payload:
      type: dict[str, Any]
      required: true
  returns:
    type: None
  exceptions:
  - ConfigValidationError
  side_effects: none
- name: validate_disqualifier_config
  description: Enforces disqualifier question object shape and trait_id presence.
  locked: false
  inputs:
    payload:
      type: dict[str, Any]
      required: true
  returns:
    type: None
  exceptions:
  - ConfigValidationError
  side_effects: none
- name: normalize_question_overrides_config
  description: Normalizes question override payload to known keys and typed values.
  locked: false
  inputs:
    payload:
      type: dict[str, Any]
      required: true
  returns:
    type: dict[str, Any]
  exceptions:
  - ConfigValidationError
  side_effects: none
classes:
- name: ConfigValidationError
  description: Raised when untrusted config payload validation fails.
  locked: false
  attributes: {}
  methods: []
data_structures:
- name: CONFIG_ASSET_REGISTRY
  description: Static map of config filenames to owners, consumers, and schema summaries.
  type: dict[str, dict[str, Any]]
dependencies: []
