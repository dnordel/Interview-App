module:
  name: admin_studio
  language: python
  path: src/admin_studio.py
  version: 2.0.1
  description: Single admin boundary for local configuration review, draft editing,
    dirty tracking, validation, backup creation, and review-then-apply persistence
    for Staffing v2 Settings, including contractor offer templates and draft-only
    rubric trait duplication/deletion. Shared email persistence remains independent;
    notification management is owned exclusively by Staffing v2 Notifications.
functions:
- name: _trait_has_linked_question
  description: Return whether a rubric trait appears as a trait question in any
    applicable track question flow.
  locked: false
  inputs:
    question_flow:
      type: dict[str, Any]
      required: true
    trait_id:
      type: str
      required: true
    tracks:
      type: Any
      required: true
  returns:
    type: bool
classes:
- name: AdminStudioPaths
  type: dataclass
  description: Files and backup location used by Admin Studio.
  locked: false
  attributes:
    rubric_path:
      type: Path
    overrides_path:
      type: Path
    school_settings_path:
      type: Path
    prompts_path:
      type: Path
    app_settings_path:
      type: Path
    backup_dir:
      type: Path | None
- name: AdminSection
  type: dataclass
  description: One core configuration section exposed by Staffing v2 Settings.
  locked: false
  attributes:
    group:
      type: str
    key:
      type: str
    title:
      type: str
    description:
      type: str
    item_count:
      type: int
- name: AdminStudioSummary
  type: dataclass
  description: Section list, counts, dirty count, and validation state for the current
    admin draft.
  locked: false
- name: AdminChangeSummary
  type: dataclass
  description: Changed filenames and human-readable before/after admin edit lines.
  locked: false
- name: AdminApplyResult
  type: dataclass
  description: Result of a review-then-apply attempt, including changed files, backups,
    and validation errors.
  locked: false
- name: AdminStudioDraft
  description: In-memory editable admin configuration draft. No file writes occur
    from draft mutation methods; prompt version notes are kept in memory to gate
    publish validation for changed DeepSeek prompt templates.
  locked: false
  methods:
  - name: from_payloads
    inputs:
      rubric:
        type: dict[str, Any]
        required: true
      overrides:
        type: dict[str, Any]
        required: true
      school_settings:
        type: dict[str, dict[str, str]]
        required: true
      prompts:
        type: dict[str, Any]
        required: true
      app_settings:
        type: dict[str, Any]
        required: false
        default: None
    returns:
      type: AdminStudioDraft
  - name: changed_payloads
    inputs: {}
    returns:
      type: dict[str, tuple[Any, Any]]
  - name: change_summary
    inputs: {}
    returns:
      type: AdminChangeSummary
  - name: discard
    inputs: {}
    returns:
      type: AdminStudioDraft
  - name: update_trait
    inputs:
      trait_id:
        type: str
        required: true
      updates:
        type: dict[str, Any]
        required: true
    returns:
      type: None
    exceptions:
    - ValueError
  - name: duplicate_trait
    description: Duplicate an existing rubric trait inside the draft only, assigning
      the next valid numeric trait id for the same prefix and preserving validated
      descriptors, sample answers, track applicability, weight, priority, and primary
      question.
    inputs:
      trait_id:
        type: str
        required: true
    returns:
      type: str
    exceptions:
    - ValueError
  - name: delete_trait
    description: Delete an existing rubric trait inside the draft only through
      the same validated rubric service used by the settings editor.
    inputs:
      trait_id:
        type: str
        required: true
    returns:
      type: None
    exceptions:
    - ValueError
  - name: add_track
    description: Draft a new interview track with validated key, label, description,
      active state, and empty question flow without writing files.
    inputs:
      track_key:
        type: str
        required: true
      label:
        type: str
        required: true
      description:
        type: str
        required: false
        default: ""
      active:
        type: bool
        required: false
        default: true
    returns:
      type: None
    exceptions:
    - ValueError
  - name: update_question_text
    description: Draft a custom question text edit or trait question override without
      writing files.
    inputs:
      track_key:
        type: str
        required: true
      question_type:
        type: str
        required: true
      question_id:
        type: str
        required: true
      text:
        type: str
        required: true
    returns:
      type: None
    exceptions:
    - ValueError
  - name: add_custom_question
    description: Draft a new custom question for a track, add it to custom question
      overrides, and insert it into the track question flow without writing files.
    inputs:
      track_key:
        type: str
        required: true
      question_id:
        type: str
        required: true
      label:
        type: str
        required: true
      text:
        type: str
        required: true
      section:
        type: str
        required: false
        default: Qualification
      position:
        type: int | None
        required: false
        default: None
    returns:
      type: None
    exceptions:
    - ValueError
  - name: move_question
    description: Draft a question reorder inside one track question flow without
      changing the moved question type or id and without writing files.
    inputs:
      track_key:
        type: str
        required: true
      from_index:
        type: int
        required: true
      to_index:
        type: int
        required: true
    returns:
      type: None
    exceptions:
    - ValueError
  - name: delete_question
    description: Draft removal of a selected custom or trait question from one
      track question flow without writing files; custom questions are also removed
      from that track's custom-question overrides and remaining custom orders are
      compacted.
    inputs:
      track_key:
        type: str
        required: true
      question_type:
        type: str
        required: true
      question_id:
        type: str
        required: true
    returns:
      type: None
    exceptions:
    - ValueError
  - name: duplicate_question
    description: Draft a duplicate of a selected custom or trait question as a new
      custom question inserted immediately after the source flow card, using a
      unique copy id and without writing files.
    inputs:
      track_key:
        type: str
        required: true
      question_type:
        type: str
        required: true
      question_id:
        type: str
        required: true
    returns:
      type: str
    exceptions:
    - ValueError
  - name: update_school_settings
    description: Update one school folder/template setting draft, preserving full-time,
      part-time, contractor, offer output, and interview notes keys.
    inputs:
      school:
        type: str
        required: true
      updates:
        type: dict[str, str]
        required: true
    returns:
      type: None
    exceptions:
    - ValueError
  - name: update_prompt
    inputs:
      key:
        type: str
        required: true
      value:
        type: str
        required: true
    returns:
      type: None
    exceptions:
    - ValueError
  - name: update_prompt_version_note
    description: Store or clear the in-memory version note required before a changed
      DeepSeek prompt template can be published.
    inputs:
      key:
        type: str
        required: true
      note:
        type: str
        required: true
    returns:
      type: None
    exceptions:
    - ValueError
  - name: update_deepseek_model
    description: Draft an allowed local Ollama DeepSeek model selection for app settings
      without writing files.
    inputs:
      model:
        type: str
        required: true
    returns:
      type: None
  - name: validate
    description: Validate prompt payloads, required version notes for changed DeepSeek
      prompt templates, school folder and offer-template path safety, allowlisted DeepSeek model selection,
      and rubric trait links to Questions & Flow before any apply writes.
    inputs: {}
    returns:
      type: list[str]
- name: AdminStudio
  description: Loads local admin config, creates drafts, summarizes draft state,
    validates and applies confirmed changes with backups.
  locked: false
  methods:
  - name: load
    inputs:
      paths:
        type: AdminStudioPaths | None
        required: false
        default: None
    returns:
      type: AdminStudio
    side_effects: Reads rubric, question override, school settings, prompt JSON,
      and app settings.
  - name: create_draft
    inputs: {}
    returns:
      type: AdminStudioDraft
  - name: summary
    inputs:
      draft:
        type: AdminStudioDraft | None
        required: false
        default: None
    returns:
      type: AdminStudioSummary
  - name: apply_draft
    inputs:
      draft:
        type: AdminStudioDraft
        required: true
      confirm:
        type: bool
        required: true
    returns:
      type: AdminApplyResult
    side_effects: When confirm is true and validation passes, writes changed JSON
      files after creating backups.
data_structures: []
dependencies:
- data_store
- interview_runtime
- platform_services
- question_settings_service
- email_security
