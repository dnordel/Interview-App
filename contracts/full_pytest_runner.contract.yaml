module:
  name: full_pytest_runner
  language: python
  path: tools/full_pytest_runner.py
  version: 1.3.0
  description: Source-version-and-metadata preflight full-suite runner that updates the deployment stamp, validates every duration/scenario metatest, then runs both non-GUI and duration-sorted fresh GUI batches with 24 workers.
functions:
- name: build_gui_test_batches
  locked: false
  inputs:
    entries: {type: 'list[dict[str, Any]]', required: true}
    gui_workers: {type: int, required: false, default: 24}
  returns: {type: 'list[list[str]]'}
  exceptions: [ValueError]
  side_effects: none
- name: build_full_suite_commands
  locked: false
  inputs:
    python_executable: {type: str, required: false}
    metadata_workers: {type: int, required: false}
    full_workers: {type: int, required: false}
    gui_workers: {type: int, required: false, default: 24}
    catalog_entries: {type: 'list[dict[str, Any]] | None', required: false}
  returns: {type: 'tuple[list[str], list[str], list[list[str]]]'}
  exceptions: []
  side_effects: none
- name: run_full_suite
  locked: false
  inputs:
    python_executable: {type: str, required: false}
    metadata_workers: {type: int, required: false}
    full_workers: {type: int, required: false}
    gui_workers: {type: int, required: false, default: 24}
    call: {type: 'Callable[[list[str]], int]', required: false}
  returns: {type: int}
  exceptions: []
  side_effects: Runs tools/update_source_version.py first, then metadata and non-GUI phases followed by duration-sorted GUI batches with fresh xdist workers; stops before later work after failure.
classes: []
data_structures:
- name: GUI_TIMING_PREFLIGHT_PATH
  type: str
  description: Whole metadata preflight file; using the file path automatically includes newly added metatests.
dependencies:
- module: update_source_version
- module: pytest
- module: pytest-xdist
