module:
  name: full_pytest_runner
  language: python
  path: tools/full_pytest_runner.py
  version: 2.2.2
  description: Metadata-first full-suite runner that preflights timing, GUI action coverage, and contract behavior coverage before isolating GUI tests and managing a reversible current-source stamp.
functions:
- name: build_gui_test_batches
  locked: false
  inputs:
    entries: {type: 'list[dict[str, Any]]', required: true}
    gui_workers: {type: int, required: false, default: 8}
  returns: {type: 'list[list[str]]'}
  exceptions: [ValueError]
  side_effects: none
- name: build_full_suite_commands
  locked: false
  inputs:
    python_executable: {type: str, required: false}
    metadata_workers: {type: int, required: false}
    full_workers: {type: int, required: false}
    gui_workers: {type: int, required: false, default: 8}
    catalog_entries: {type: 'list[dict[str, Any]] | None', required: false}
  returns: {type: 'tuple[list[str], list[str], list[list[str]]]'}
  exceptions: []
  side_effects: none
- name: run_full_suite
  locked: false
  inputs:
    python_executable: {type: str, required: false}
    metadata_workers: {type: int, required: false}
    full_workers: {type: int, required: false}
    gui_workers: {type: int, required: false, default: 8}
    call: {type: 'Callable[[list[str]], int]', required: false}
    source_version_path: {type: Path, required: false, default: SOURCE_VERSION_PATH}
  returns: {type: int}
  exceptions: []
  side_effects: Runs timing and behavior-coverage metadata preflights, writes a reversible test stamp, executes isolated non-GUI and GUI phases, restores the prior stamp on failure, then regenerates the retained deployment stamp only after success.
classes: []
data_structures:
- name: GUI_TIMING_PREFLIGHT_PATH
  type: str
  description: Duration and GUI scheduling metadata preflight file.
- name: GUI_ACTION_PREFLIGHT_PATH
  type: str
  description: GUI button/action behavioral-coverage metadata preflight file.
- name: CONTRACT_COVERAGE_PREFLIGHT_PATH
  type: str
  description: Contract symbol behavior-coverage matrix preflight file.
- name: METADATA_PREFLIGHT_PATHS
  type: tuple[str, str, str]
  description: Ordered metadata files run before any full-suite phase and excluded from the later non-GUI phase.
- name: SOURCE_VERSION_PATH
  type: Path
  description: Repository deployment stamp temporarily snapshotted during full validation.
dependencies:
- module: update_source_version
- module: gui_action_behavior_coverage
- module: pytest
- module: pytest-xdist
