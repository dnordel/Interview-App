module:
  name: pytest_duration_catalog
  language: python
  path: tools/pytest_duration_catalog.py
  version: 1.2.0
  description: Maintains collected pytest node ids, full setup/call/teardown durations, measured/default duration source, GUI-heavy classification, and scheduler placement metadata; duration_seconds_n2 remains the legacy storage key.
functions:
- name: build_gui_benchmark_command
  description: Build a GUI-only benchmark command using item-level xdist load scheduling, one-item chunks, complete duration output, and short tracebacks.
  locked: false
  inputs:
    workers: {type: int, required: false, default: 2}
    python_executable: {type: str, required: false}
  returns: {type: 'list[str]'}
  exceptions: [ValueError]
  side_effects: none
- name: benchmark_gui_catalog
  description: Refresh collection metadata and benchmark only GUI tests with deterministic cleanup and item-level worker distribution.
  locked: false
  inputs:
    path: {type: Path, required: false}
    workers: {type: int, required: false, default: 2}
    python_executable: {type: str, required: false}
    call: {type: 'Callable[..., int]', required: false}
  returns: {type: int}
  exceptions: [ValueError]
  side_effects: Launches offscreen GUI pytest with src on PYTHONPATH and updates complete measured durations through PYTEST_DURATION_CATALOG_OUT.
- name: build_benchmark_commands
  description: Build an n-worker non-GUI phase and duration-sorted fresh GUI batches so Qt state cannot accumulate during catalog measurement.
  locked: false
  inputs:
    entries: {type: 'list[dict[str, Any]]', required: true}
    workers: {type: int, required: false, default: 8}
    python_executable: {type: str, required: false}
  returns: {type: 'list[list[str]]'}
  exceptions: [ValueError]
  side_effects: none
- name: benchmark_catalog
  description: Refresh collection coverage, then measure every test with the configured worker count using a clean non-GUI phase and fresh GUI batches.
  locked: false
  inputs:
    path: {type: Path, required: false}
    workers: {type: int, required: false, default: 8}
    python_executable: {type: str, required: false}
    call: {type: 'Callable[..., int]', required: false}
  returns: {type: int}
  exceptions: [ValueError]
  side_effects: Launches pytest phases and updates measured duration catalog through PYTEST_DURATION_CATALOG_OUT.
- name: determine_placement
  description: Classify a test into a scheduler placement bucket from measured duration and GUI-heavy status.
  locked: false
  inputs:
    duration_seconds_n2:
      type: float
      required: true
    gui_heavy:
      type: bool
      required: true
  returns:
    type: str
  exceptions: []
  side_effects: none
- name: load_catalog
  description: Load the pytest duration catalog payload.
  locked: false
  inputs:
    path:
      type: Path
      required: false
  returns:
    type: dict[str, Any]
  exceptions: []
  side_effects: reads docs/pytest_duration_catalog.yaml
- name: catalog_entries_by_nodeid
  description: Return catalog entries keyed by collected pytest node id.
  locked: false
  inputs:
    path:
      type: Path
      required: false
  returns:
    type: dict[str, dict[str, Any]]
  exceptions: []
  side_effects: reads docs/pytest_duration_catalog.yaml
- name: collect_nodeids
  description: Collect current pytest node ids through pytest collect-only.
  locked: false
  inputs:
    python_executable:
      type: str
      required: false
  returns:
    type: list[str]
  exceptions:
  - RuntimeError
  side_effects: launches pytest collect-only subprocess
- name: normalize_catalog
  description: Build a normalized catalog payload from collected node ids and existing entries, preserving duration_source metadata so GUI scenario timing guards can distinguish measured durations from collection defaults.
  locked: false
  inputs:
    nodeids:
      type: list[str]
      required: true
    existing_entries:
      type: dict[str, dict[str, Any]]
      required: true
  returns:
    type: dict[str, Any]
  exceptions: []
  side_effects: none
- name: write_catalog
  description: Write a normalized pytest duration catalog.
  locked: false
  inputs:
    payload:
      type: dict[str, Any]
      required: true
    path:
      type: Path
      required: false
  returns:
    type: None
  exceptions: []
  side_effects: writes docs/pytest_duration_catalog.yaml
- name: refresh_catalog_from_collection
  description: Refresh catalog coverage from current pytest collection while preserving known metadata.
  locked: false
  inputs:
    path:
      type: Path
      required: false
  returns:
    type: None
  exceptions: []
  side_effects: launches pytest collect-only and writes docs/pytest_duration_catalog.yaml
- name: main
  description: Parse CLI options for collection refresh, full benchmarking, or reliable GUI-only benchmarking.
  locked: false
  inputs:
    argv:
      type: list[str] | None
      required: false
  returns:
    type: int
  exceptions: []
  side_effects: optionally refreshes or benchmarks docs/pytest_duration_catalog.yaml
classes: []
data_structures: []
dependencies:
- module: docs/pytest_duration_catalog.yaml
- module: pytest
