- name: QuestionSettingsWindow
  description: Renders the question settings window, validates trait/signal/group
    edits, and persists rubric/runtime changes.
  locked: false
  attributes:
    app:
      type: InterviewApp
    runtime_service:
      type: QuestionRuntimeDefinitionService
    service:
      type: QuestionSettingsService
    signal_definition:
      type: dict[str, Any]
    core_signal_list:
      type: tk.Listbox
      description: Lists core runtime trait signals for selected scored trait.
    group_signal_list:
      type: tk.Listbox
      description: Lists extended runtime trait signals for selected group/trait.
    group_list:
      type: tk.Listbox
      description: Lists extended signal groups for selected scored trait.
  methods:
  - name: refresh_trait_list
    description: Refresh rendered trait rows for the selected track.
    locked: false
    inputs: {}
    returns:
      type: None
    exceptions: []
    side_effects: Updates Tk listbox.
  - name: load_selected_trait
    description: Load selected trait fields into the editor.
    locked: false
    inputs: {}
    returns:
      type: None
    exceptions: []
    side_effects: Updates Tk editor variables/widgets and loads runtime signal definition
      lists for selected trait.
  - name: save_trait
    description: Validate current trait edits, including canonical id, name, primary
      question, weight, sample answers, descriptors, and track membership; then save.
    locked: false
    inputs: {}
    returns:
      type: None
    exceptions: []
    side_effects: Writes rubric JSON, syncs runtime trait definition question/name,
      updates app rubric state, may show validation dialog.
  - name: add_trait
    description: Add current editor values as a new rated question using a canonical
      trait_<number> id with default descriptor/sample-answer anchors and current-track
      membership.
    locked: false
    inputs: {}
    returns:
      type: None
    exceptions: []
    side_effects: Writes rubric JSON, creates runtime trait definition, and updates
      app rubric state.
  - name: delete_trait
    description: Confirm and delete selected trait.
    locked: false
    inputs: {}
    returns:
      type: None
    exceptions: []
    side_effects: May show confirmation dialog, writes rubric JSON, deletes runtime
      trait definition, updates app rubric state.
  - name: refresh_signal_lists
    description: Refresh core signal, extended group, and group signal list controls
      from the selected trait runtime definition.
    locked: false
    inputs: {}
    returns:
      type: None
    exceptions: []
    side_effects: Updates Tk listboxes for runtime trait signal definitions.
  - name: save_core_signal
    description: Add current signal fields to core signal definition and persist runtime
      definition.
    locked: false
    inputs: {}
    returns:
      type: None
    exceptions: []
    side_effects: Writes runtime signal definition JSON or shows validation dialog.
  - name: save_group_signal
    description: Add current signal fields to selected group and persist runtime definition.
    locked: false
    inputs: {}
    returns:
      type: None
    exceptions: []
    side_effects: Writes runtime signal definition JSON or shows validation dialog.
  - name: delete_core_signal
    description: Delete current core signal reference and persist runtime definition.
    locked: false
    inputs: {}
    returns:
      type: None
    exceptions: []
    side_effects: Writes runtime signal definition JSON or shows validation dialog.
  - name: delete_group_signal
    description: Delete current group signal reference and persist runtime definition.
    locked: false
    inputs: {}
    returns:
      type: None
    exceptions: []
    side_effects: Writes runtime signal definition JSON or shows validation dialog.
  - name: add_group
    description: Add current group fields as an extended signal group.
    locked: false
    inputs: {}
    returns:
      type: None
    exceptions: []
    side_effects: Writes runtime signal definition JSON or shows validation dialog.
  - name: save_group
    description: Save current group fields as an extended signal group.
    locked: false
    inputs: {}
    returns:
      type: None
    exceptions: []
    side_effects: Writes runtime signal definition JSON or shows validation dialog.
  - name: delete_group
    description: Delete current extended signal group and persist runtime definition.
    locked: false
    inputs: {}
    returns:
      type: None
    exceptions: []
    side_effects: Writes runtime signal definition JSON or shows validation dialog.
