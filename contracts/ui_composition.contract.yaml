module:
  name: ui_composition
  language: python
  path: src/ui_composition.py
  version: 0.11.4
  description: Flattened public interface for Tkinter windows, question screens, validation
    feedback, routed views, keyboard telemetry, and reusable UI widgets; only active
    legacy adapters remain in the compatibility module inventory.
functions:
- name: render_question_footer
  description: Render the persistent interview question footer shared by scored and
    custom question screens.
  locked: false
  inputs:
    app:
      type: InterviewApp
      required: true
    flow_idx:
      type: int
      required: true
    is_last:
      type: bool
      required: true
    go_back:
      type: Callable[[], None]
      required: true
    skip_question:
      type: Callable[[], None]
      required: true
    save_draft:
      type: Callable[[], None]
      required: true
    continue_or_finalize:
      type: Callable[[], None]
      required: true
    persist_for_exit:
      type: Callable[[], None] | None
      required: false
      default: None
  returns:
    type: None
  exceptions: []
  side_effects: Updates active footer actions; Exit delegates to app early-exit handling
    when available.
- name: render_qualification_box
  description: Renders candidate qualification controls for scored and custom question
    screens.
  locked: false
  inputs:
    parent:
      type: ttk.Frame
      required: true
    app:
      type: InterviewApp
      required: true
  returns:
    type: dict[str, Any]
  exceptions: []
  side_effects: Creates tkinter widgets and variable bindings.
- name: validate_and_store_qualification
  description: Validates candidate education details and stores normalized qualification
    state.
  locked: false
  inputs:
    app:
      type: InterviewApp
      required: true
    vars_map:
      type: dict[str, Any]
      required: true
  returns:
    type: bool
  exceptions: []
  side_effects: Updates inline validation state and interview qualification data.
- name: should_display_modal
  description: Determines whether validation should be shown as a modal dialog.
  locked: false
  inputs:
    severity:
      type: str
      required: true
    irreversible_action:
      type: bool
      required: false
      default: false
  returns:
    type: bool
  exceptions: []
  side_effects: none
- name: sanitize_user_error
  description: Redacts technical fragments from user-facing error text.
  locked: false
  inputs:
    message:
      type: str
      required: true
  returns:
    type: str
  exceptions: []
  side_effects: none
- name: format_guidance
  description: Builds a standardized issue + next-step guidance sentence.
  locked: false
  inputs:
    issue:
      type: str
      required: true
    next_step:
      type: str
      required: true
  returns:
    type: str
  exceptions: []
  side_effects: none
- name: create_main_gui_warning_presenter
  description: Builds a dismissible non-blocking warning presenter for top-level GUI
    alerts.
  locked: false
  inputs:
    parent:
      type: tk.Misc
      required: true
    on_dismiss:
      type: Callable[[], None] | None
      required: false
      default: null
  returns:
    type: MainGuiWarningPresenter
  exceptions: []
  side_effects: Creates Tk widgets and binds dismiss behavior.
- name: present_transcription_partial_warning
  description: Presents standardized partial-transcript warning copy through the main
    GUI warning presenter.
  locked: false
  inputs:
    presenter:
      type: MainGuiWarningPresenter | None
      required: true
    auto_expire_ms:
      type: int | None
      required: false
      default: 12000
  returns:
    type: str
  exceptions: []
  side_effects: May render non-blocking warning banner in the main GUI.
- name: create_inline_validation_message
  description: Create a packed inline validation message widget.
  locked: false
  inputs:
    parent:
      type: tk.Misc
      required: true
    pady:
      type: tuple[int, int]
      required: false
      default: (0, 8)
  returns:
    type: InlineValidationMessage
  exceptions: []
  side_effects: Creates and packs Tk widgets.
- name: create_inline_validation_message_grid
  description: Create a gridded inline validation message widget.
  locked: false
  inputs:
    parent:
      type: tk.Misc
      required: true
    row:
      type: int
      required: true
    column:
      type: int
      required: false
      default: 0
    columnspan:
      type: int
      required: false
      default: 1
    padx:
      type: int | tuple[int, int]
      required: false
      default: 8
    pady:
      type: tuple[int, int]
      required: false
      default: (0, 8)
    sticky:
      type: str
      required: false
      default: w
  returns:
    type: InlineValidationMessage
  exceptions: []
  side_effects: Creates and grids Tk widgets.
- name: show_inline_field_error
  description: Formats and displays field-level inline validation feedback.
  locked: false
  inputs:
    inline_validation:
      type: InlineValidationMessage
      required: true
    field_label:
      type: str
      required: true
    cause:
      type: str
      required: true
    corrective_action:
      type: str
      required: true
    focus_widget:
      type: tk.Widget | None
      required: false
      default: null
    severity:
      type: str
      required: false
      default: error
  returns:
    type: None
  exceptions: []
  side_effects: Updates inline validation state and may move UI focus.
- name: associate_label_with_control
  description: Provide keyboard and pointer affordances between label and input control.
  locked: false
  inputs:
    label:
      type: ttk.Label | tk.Label
      required: true
    control:
      type: tk.Widget
      required: true
  returns:
    type: None
  exceptions: []
  side_effects: Configures widget focus/cursor and binds label click behavior.
- name: append_error_log
  description: Append timestamped technical details to an error log.
  locked: false
  inputs:
    log_path:
      type: Path
      required: true
    title:
      type: str
      required: true
    technical_details:
      type: str
      required: true
  returns:
    type: None
  exceptions:
  - OSError
  side_effects: Creates parent dirs and appends to filesystem log.
- name: show_actionable_error
  description: Show user-facing guidance and optionally allow copying technical details.
  locked: false
  inputs:
    parent:
      type: tk.Misc
      required: true
    title:
      type: str
      required: true
    issue:
      type: str
      required: true
    next_step:
      type: str
      required: true
    technical_details:
      type: str | None
      required: false
      default: null
  returns:
    type: None
  exceptions: []
  side_effects: Shows Tk messagebox or modal copy-details dialog.
- name: default_runtime_definition
  description: Build an empty normalized runtime definition payload for a rubric trait.
  locked: false
  inputs:
    trait_id:
      type: str
      required: true
    question:
      type: str
      required: false
      default: ''
  returns:
    type: RuntimeSignalDefinition
  exceptions:
  - ValueError
  side_effects: none
- name: normalize_runtime_definition
  description: Normalize a runtime signal-definition payload into the expected persisted
    shape.
  locked: false
  inputs:
    definition:
      type: dict[str, Any] | None
      required: true
    trait_id:
      type: str | None
      required: false
      default: null
    trait_name:
      type: str
      required: false
      default: ''
  returns:
    type: RuntimeSignalDefinition
  exceptions:
  - ValueError
  side_effects: none
- name: normalize_runtime_signal
  description: Normalize one runtime signal record for editor validation and persistence,
    accepting negative weighted scoring signals while rejecting nonnumeric weights.
  locked: false
  inputs:
    signal:
      type: dict[str, Any]
      required: true
    default_group:
      type: str
      required: true
  returns:
    type: RuntimeSignalRecord
  exceptions:
  - ValueError
  side_effects: none
- name: normalize_runtime_group
  description: Normalize one extended signal group payload for editor validation and
    persistence.
  locked: false
  inputs:
    group:
      type: dict[str, Any]
      required: true
  returns:
    type: RuntimeSignalGroup
  exceptions:
  - ValueError
  side_effects: none
- name: runtime_trait_id_for_rubric_trait
  description: Convert a rubric trait id in trait_<number> or bss_trait_<number> form
    into its runtime trait-id prefix.
  locked: false
  inputs:
    trait_id:
      type: str
      required: true
  returns:
    type: str
  exceptions:
  - ValueError
  side_effects: none
- name: build_runtime_trait_id
  description: Build a persisted runtime trait id using rubric trait id, trait name,
    and any existing runtime suffix.
  locked: false
  inputs:
    trait_id:
      type: str
      required: true
    trait_name:
      type: str
      required: true
    existing_runtime_trait_id:
      type: Any
      required: false
      default: ''
  returns:
    type: str
  exceptions:
  - ValueError
  side_effects: none
- name: runtime_trait_id_prefix
  description: Return runtime filename prefix used to locate a rubric trait runtime
    JSON definition.
  locked: false
  inputs:
    trait_id:
      type: str
      required: true
  returns:
    type: str
  exceptions:
  - ValueError
  side_effects: none
- name: slugify_trait_name
  description: Convert a trait name into a safe filesystem/runtime suffix.
  locked: false
  inputs:
    trait_name:
      type: str
      required: true
  returns:
    type: str
  exceptions: []
  side_effects: none
- name: ensure_valid_trait_id
  description: Validate that a question-settings trait id can be owned by a runtime
    signal-definition file.
  locked: false
  inputs:
    trait_id:
      type: str
      required: true
  returns:
    type: str
  exceptions:
  - ValueError
  side_effects: none
- name: next_trait_id
  description: Determine the next available numeric rubric trait id.
  locked: false
  inputs:
    rubric:
      type: dict[str, Any]
      required: true
  returns:
    type: str
  exceptions: []
  side_effects: none
- name: list_signal_refs
  description: Return every signal ref across core and extended runtime signals.
  locked: false
  inputs:
    definition:
      type: dict[str, Any]
      required: true
  returns:
    type: list[str]
  exceptions:
  - ValueError
  side_effects: none
- name: available_modules
  description: Return remaining legacy UI modules still exposed through this flattened
    facade.
  locked: false
  inputs: {}
  returns:
    type: tuple[str, ...]
  exceptions: []
  side_effects: none
- name: load_compat_module
  description: Import a remaining legacy module that belongs to the UI composition
    facade.
  locked: false
  inputs:
    module_name:
      type: str
      required: true
  returns:
    type: ModuleType
  exceptions:
  - AttributeError
  side_effects: Imports the requested module.
- name: module_ownership
  description: Return the ownership map from each remaining legacy UI module to the
    flattened ui_composition module.
  locked: false
  inputs: {}
  returns:
    type: dict[str, str]
  exceptions: []
  side_effects: none
- name: wrapper_policy
  description: Return the compatibility wrapper policy for remaining legacy UI modules
    during flattening cleanup.
  locked: false
  inputs: {}
  returns:
    type: str
  exceptions: []
  side_effects: none
- name: public_symbols
  description: Return public symbols exposed by one remaining legacy UI module or
    by all remaining UI modules.
  locked: false
  inputs:
    module_name:
      type: str | None
      required: false
      default: None
  returns:
    type: tuple[str, ...]
  exceptions:
  - AttributeError
  side_effects: Imports remaining UI compatibility modules.
- name: resolve_compat_symbol
  description: Resolve a public symbol from the remaining legacy modules owned by
    this facade.
  locked: false
  inputs:
    symbol_name:
      type: str
      required: true
  returns:
    type: Any
  exceptions:
  - AttributeError
  side_effects: Imports legacy modules until the symbol is found.
- name: __dir__
  description: Return module attributes plus flattened public compatibility symbols
    for editor and agent discovery.
  locked: false
  inputs: {}
  returns:
    type: list[str]
  exceptions: []
  side_effects: Imports remaining UI compatibility modules.
classes:
- name: TraitScreenUI
  description: Renders scored competency screens and enforces scoring/disqualifier
    validation rules. The shared persistent question footer is installed before
    scored body rendering so malformed optional rubric/reference content cannot remove
    navigation. Manual trait observation checkboxes are not rendered; model signal
    suggestions remain advisory state supplied by DeepSeek/runtime scoring.
  locked: false
  attributes:
    signal_selection_vars:
      type: dict[str, BooleanVar]
      description: Compatibility-only mapping retained for old tests/adapters; normal
        runtime rendering leaves it empty because human signal checkboxes were removed.
    model_signal_suggestions:
      type: dict[str, dict[str, Any]]
      description: Model-suggested trait observation metadata keyed by signal id;
        suggestions do not create human-selected signal ids.
  methods:
  - name: _render_trait_signal_checkboxes
    description: Compatibility helper for model suggestion hints from runtime signal
      UI definitions; must not render human-selectable trait signal checkboxes.
    locked: false
    inputs:
      parent:
        type: ttk.Frame
        required: true
    returns:
      type: None
    exceptions: []
    side_effects: May create Tk labels for model suggestions; clears manual signal
      selection state.
  - name: _selected_signal_ids
    description: Return no manual trait observation signal ids because checkbox input
      was removed from the interview UI.
    locked: false
    inputs: {}
    returns:
      type: list[str]
    exceptions: []
    side_effects: none
  - name: persist_state
    description: Validate and persist current screen state, clearing manual trait
      observation selected_signal_ids while preserving model suggestions.
    inputs: {}
    returns:
      type: bool
  - name: persist_state_for_exit
    description: Best-effort current scored question persistence for early exit; does
      not require all validation fields to pass.
    inputs: {}
    returns:
      type: None
- name: CustomQuestionScreenUI
  description: Renders non-scored custom question screens and uses the shared persistent
    question footer.
  locked: false
  attributes: {}
  methods:
  - name: persist_custom
    inputs: {}
    returns:
      type: bool
  - name: persist_custom_for_exit
    description: Best-effort current custom question persistence for early exit.
    inputs: {}
    returns:
      type: None
- name: KeyboardPathSession
  description: Tracks keyboard navigation activity for one flow/screen and logs completion
    metadata.
  locked: false
  attributes:
    logger:
      type: Any
    flow_id:
      type: str
    screen_id:
      type: str
    keyboard_step_count:
      type: int
    _last_keyboard_at:
      type: float
  methods:
  - name: bind
    description: Bind keypress tracking to a Tk widget.
    locked: false
    inputs:
      widget:
        type: tk.Misc
        required: true
    returns:
      type: None
    exceptions: []
    side_effects: Binds keypress callback on the widget.
  - name: mark_step
    description: Increment keyboard navigation step count and refresh recency timestamp.
    locked: false
    inputs:
      step_count:
        type: int
        required: false
        default: 1
    returns:
      type: None
    exceptions: []
    side_effects: Updates in-memory keyboard tracking state.
  - name: complete
    description: Log keyboard completion telemetry when a logger is available.
    locked: false
    inputs:
      abandoned:
        type: bool
        required: false
        default: false
      screen_id:
        type: str | None
        required: false
        default: null
    returns:
      type: None
    exceptions: []
    side_effects: May write telemetry through provided logger.
- name: InlineValidationMessage
  description: Reusable inline validation presenter that supports severity styling.
  locked: false
  attributes:
    message_var:
      type: tk.StringVar
    message_label:
      type: ttk.Label
  methods:
  - name: show
    description: Render sanitized guidance and optionally focus a widget.
    locked: false
    inputs:
      issue:
        type: str
        required: true
      next_step:
        type: str
        required: true
      focus_widget:
        type: tk.Widget | None
        required: false
        default: null
      severity:
        type: str
        required: false
        default: error
    returns:
      type: None
    exceptions: []
    side_effects: Updates Tk label state and may move focus.
  - name: clear
    description: Clear inline validation text.
    locked: false
    inputs: {}
    returns:
      type: None
    exceptions: []
    side_effects: Updates Tk string variable.
- name: MainGuiWarningPresenter
  description: Reusable main-GUI warning banner presenter with dismiss and auto-expire
    behavior.
  locked: false
  attributes:
    parent:
      type: tk.Misc
    frame:
      type: ttk.Frame
    message_var:
      type: tk.StringVar
    message_label:
      type: ttk.Label
    dismiss_button:
      type: ttk.Button
  methods:
  - name: _find_pack_before_widget
    description: Locate first packed sibling widget for banner insertion.
    locked: false
    inputs: {}
    returns:
      type: tk.Widget | None
    exceptions: []
    side_effects: none
  - name: show
    description: Show sanitized warning banner and optional expiry timer.
    locked: false
    inputs:
      message:
        type: str
        required: true
      auto_expire_ms:
        type: int | None
        required: false
        default: 12000
    returns:
      type: None
    exceptions: []
    side_effects: Updates/packs Tk widgets and schedules optional timer.
  - name: _pack_frame_with_optional_before
    description: Pack banner frame, falling back when before target is invalid.
    locked: false
    inputs:
      pack_kwargs:
        type: dict[str, object]
        required: true
      before_widget:
        type: tk.Widget | None
        required: true
    returns:
      type: None
    exceptions: []
    side_effects: Packs Tk frame.
  - name: dismiss
    description: Hide warning banner and cancel pending expiry timer.
    locked: false
    inputs: {}
    returns:
      type: None
    exceptions: []
    side_effects: Updates Tk widgets and timer state.
- name: QuestionSettingsService
  description: Manages rubric edits, undo state, import/export, and trait CRUD for
    question settings.
  locked: false
  attributes:
    rubric_path:
      type: Path
    _defaults:
      type: dict[str, Any]
    _undo_stack:
      type: list[dict[str, Any]]
  methods:
  - name: checkpoint
    description: Save a deep-copy checkpoint for undo.
    locked: false
    inputs:
      rubric:
        type: dict[str, Any]
        required: true
    returns:
      type: None
    exceptions: []
    side_effects: Updates in-memory undo stack.
  - name: undo
    description: Return and remove the most recent checkpoint.
    locked: false
    inputs: {}
    returns:
      type: dict[str, Any] | None
    exceptions: []
    side_effects: Updates in-memory undo stack.
  - name: restore_defaults
    description: Return a deep copy of initial rubric defaults.
    locked: false
    inputs: {}
    returns:
      type: dict[str, Any]
    exceptions: []
    side_effects: none
  - name: save_rubric
    description: Persist rubric JSON atomically.
    locked: false
    inputs:
      rubric:
        type: dict[str, Any]
        required: true
    returns:
      type: None
    exceptions:
    - OSError
    - TypeError
    - ValueError
    side_effects: Writes rubric JSON to filesystem.
  - name: export_questions
    description: Export track and trait question settings to JSON.
    locked: false
    inputs:
      rubric:
        type: dict[str, Any]
        required: true
      path:
        type: Path
        required: true
    returns:
      type: None
    exceptions:
    - OSError
    - TypeError
    - ValueError
    side_effects: Writes question export JSON to filesystem.
  - name: import_questions
    description: Import trait list and optional tracks from JSON into a rubric copy,
      validating scored trait shape, descriptors, sample answers, and track membership.
    locked: false
    inputs:
      rubric:
        type: dict[str, Any]
        required: true
      path:
        type: Path
        required: true
    returns:
      type: dict[str, Any]
    exceptions:
    - OSError
    - json.JSONDecodeError
    - ValueError
    side_effects: Reads question import JSON from filesystem.
  - name: update_trait
    description: Return rubric copy with one existing trait updated; trait ids must
      use the canonical trait_<number> format and the merged trait must pass descriptor,
      sample-answer, and track-membership validation.
    locked: false
    inputs:
      rubric:
        type: dict[str, Any]
        required: true
      trait_id:
        type: str
        required: true
      updates:
        type: dict[str, Any]
        required: true
    returns:
      type: dict[str, Any]
    exceptions:
    - ValueError
    side_effects: none
  - name: add_trait
    description: Return rubric copy with a new scored trait appended; trait ids must
      use the canonical trait_<number> format and be unique, with valid descriptors,
      sample answers, and applicable track membership.
    locked: false
    inputs:
      rubric:
        type: dict[str, Any]
        required: true
      trait:
        type: dict[str, Any]
        required: true
    returns:
      type: dict[str, Any]
    exceptions:
    - ValueError
    side_effects: none
  - name: delete_trait
    description: Return rubric copy with one scored trait removed by canonical trait
      id.
    locked: false
    inputs:
      rubric:
        type: dict[str, Any]
        required: true
      trait_id:
        type: str
        required: true
    returns:
      type: dict[str, Any]
    exceptions:
    - ValueError
    side_effects: none
- name: QuestionRuntimeDefinitionService
  description: Reads, writes, validates, and mutates trait runtime signal-definition
    JSON files.
  locked: false
  attributes:
    traits_dir:
      type: Path
  methods:
  - name: load_definition
    description: Load and normalize one runtime definition by rubric trait id.
    locked: false
    inputs:
      trait_id:
        type: str
        required: true
    returns:
      type: RuntimeSignalDefinition
    exceptions:
    - ValueError
    side_effects: Reads runtime definition JSON when present.
  - name: save_definition
    description: Normalize and atomically save one runtime definition.
    locked: false
    inputs:
      trait_id:
        type: str
        required: true
      trait_name:
        type: str
        required: true
      definition:
        type: dict[str, Any]
        required: true
    returns:
      type: RuntimeSignalDefinition
    exceptions:
    - ValueError
    - OSError
    side_effects: Writes runtime definition JSON and removes stale renamed file.
  - name: create_definition
    description: Create and save an empty runtime definition for a trait.
    locked: false
    inputs:
      trait_id:
        type: str
        required: true
      trait_name:
        type: str
        required: true
      question:
        type: str
        required: true
    returns:
      type: RuntimeSignalDefinition
    exceptions:
    - ValueError
    - OSError
    side_effects: Writes runtime definition JSON.
  - name: delete_definition
    description: Delete runtime definition file for a trait when present.
    locked: false
    inputs:
      trait_id:
        type: str
        required: true
    returns:
      type: None
    exceptions:
    - ValueError
    - OSError
    side_effects: Deletes runtime definition JSON when found.
  - name: sync_with_trait
    description: Sync runtime definition question text and trait name with rubric
      trait.
    locked: false
    inputs:
      trait_id:
        type: str
        required: true
      trait_name:
        type: str
        required: true
      question:
        type: str
        required: true
    returns:
      type: RuntimeSignalDefinition
    exceptions:
    - ValueError
    - OSError
    side_effects: Writes runtime definition JSON.
  - name: add_core_signal
    description: Return definition copy with a normalized core signal appended.
    locked: false
    inputs:
      definition:
        type: dict[str, Any]
        required: true
      signal:
        type: dict[str, Any]
        required: true
    returns:
      type: RuntimeSignalDefinition
    exceptions:
    - ValueError
    side_effects: none
  - name: update_core_signal
    description: Return definition copy with a core signal updated.
    locked: false
    inputs:
      definition:
        type: dict[str, Any]
        required: true
      signal_ref:
        type: str
        required: true
      updates:
        type: dict[str, Any]
        required: true
    returns:
      type: RuntimeSignalDefinition
    exceptions:
    - ValueError
    side_effects: none
  - name: delete_core_signal
    description: Return definition copy with a core signal removed.
    locked: false
    inputs:
      definition:
        type: dict[str, Any]
        required: true
      signal_ref:
        type: str
        required: true
    returns:
      type: RuntimeSignalDefinition
    exceptions:
    - ValueError
    side_effects: none
