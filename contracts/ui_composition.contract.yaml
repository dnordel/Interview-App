- name: HistoryDataGrid
  description: Treeview-based history grid widget with sorting, filtering, tooltip,
    action callback dispatch, and school/position metadata columns placed after primary
    offer and notes actions so Generate Offer remains visible; transcript and retranscription
    actions are no longer shown, while interview notes show Processing during detached
    DeepSeek work.
  locked: false
  attributes:
    sort_column:
      type: str
    sort_desc:
      type: bool
    filter_text:
      type: str
  methods:
  - name: __init__
    description: Initializes widget callbacks, sorting/filtering state, and treeview
      UI; transcript and retranscription callbacks remain accepted for compatibility
      but are not displayed or invoked.
    locked: false
    inputs:
      parent:
        type: ttk.Frame
        required: true
      on_offer_action:
        type: RowCallback
        required: true
      on_retranscribe_action:
        type: RowCallback
        required: true
      on_open_transcript_link:
        type: RowCallback
        required: true
      on_open_notes_link:
        type: RowCallback
        required: true
      on_row_selected:
        type: RowCallback
        required: true
      on_sort_changed:
        type: SortCallback | None
        required: false
        default: None
      sort_column:
        type: str
        required: false
        default: interview_date
      sort_desc:
        type: bool
        required: false
        default: true
    returns:
      type: None
    exceptions: []
    side_effects: initializes tkinter child widgets
  - name: set_rows
    description: Replaces the full row set and refreshes the tree.
    locked: false
    inputs:
      rows:
        type: list[HistoryRow]
        required: true
    returns:
      type: None
    exceptions: []
    side_effects: updates in-memory state
  - name: set_filter_text
    description: Updates filter text and refreshes visible rows.
    locked: false
    inputs:
      value:
        type: str
        required: true
    returns:
      type: None
    exceptions: []
    side_effects: updates in-memory state
  - name: visible_rows
    description: Returns currently rendered rows in filter/sort order.
    locked: false
    inputs: {}
    returns:
      type: list[HistoryRow]
    exceptions: []
    side_effects: none
  - name: selected_row
    description: Returns the selected history row from the tree.
    locked: false
    inputs: {}
    returns:
      type: HistoryRow | None
    exceptions: []
    side_effects: none
  - name: toggle_sort
    description: Toggles sort direction or column and refreshes rendered rows.
    locked: false
    inputs:
      column:
        type: str
        required: true
    returns:
      type: None
    exceptions: []
    side_effects: updates in-memory state
  - name: refresh_rows
    description: Re-renders visible rows into the treeview.
    locked: false
    inputs: {}
    returns:
      type: None
    exceptions: []
    side_effects: updates tkinter widgets
  - name: _handle_click
    description: Dispatches row click actions for offer and notes columns.
    locked: false
    inputs:
      event:
        type: tk.Event
        required: true
    returns:
      type: None
    exceptions: []
    side_effects: invokes action callbacks
  - name: _handle_motion
    description: Shows or hides hover tooltips for offer and notes cells.
    locked: false
    inputs:
      event:
        type: tk.Event
        required: true
    returns:
      type: None
    exceptions: []
    side_effects: updates tkinter tooltip window
data_structures:
- name: SCORE_PANEL_BG
  description: Background color for score selection panels.
- name: DQ_PANEL_BG
  description: Background color for disqualifier panels.
- name: FOCUS_RING
  description: Focus highlight color for question-screen controls.
- name: VALIDATION_SEVERITY_INFO
  description: Inline validation info severity.
- name: VALIDATION_SEVERITY_WARNING
  description: Inline validation warning severity.
- name: VALIDATION_SEVERITY_ERROR
  description: Inline validation error severity.
- name: VALIDATION_SEVERITY_BLOCKING
  description: Blocking validation severity.
- name: VALIDATION_SEVERITIES
  description: Supported validation severities.
- name: VALIDATION_INLINE_COLORS
  description: Foreground colors for inline validation severities.
- name: TRANSCRIPTION_PARTIAL_WARNING_COPY
  description: Standard warning copy when transcript work is still pending.
- name: RuntimeSignalDefinition
  description: Persisted runtime signal-definition payload for a trait.
- name: RuntimeSignalRecord
  description: One checkbox signal persisted in a trait runtime definition.
- name: RuntimeSignalGroup
  description: One extended signal group persisted in a trait runtime definition.
- name: HistoryRow
  description: History row mapping used by HistoryDataGrid callbacks and rendering.
- name: RowCallback
  description: Callable alias for actions receiving one history row.
- name: SortCallback
  description: Callable alias for history sort changes.
- name: TRAIT_FILE_PATTERN
  description: Glob pattern used to locate runtime trait JSON files.
- name: TRAIT_ID_ALIAS_PATTERN
  description: Regex for rubric trait_<number> ids.
- name: BSS_TRAIT_ID_ALIAS_PATTERN
  description: Regex for rubric bss_trait_<number> ids.
- name: SIGNAL_ID_PATTERN
  description: Regex for runtime signal refs.
- name: GROUP_ID_PATTERN
  description: Regex for runtime extended group ids.
- name: _COMPAT_MODULES
  description: Ordered tuple of remaining legacy module import paths exposed by ui_composition.
- name: _WRAPPER_POLICY
  description: Human-readable wrapper policy for remaining UI compatibility modules.
dependencies:
- module: platform_services
- module: scoring_reporting
- module: ui_windows
- module: interview_app_ui_router
- module: interview_app_ui_shell
- module: interview_app_view_protocols
- module: interview_app_views
- module: tk_theme
