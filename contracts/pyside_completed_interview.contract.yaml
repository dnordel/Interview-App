module:
  name: pyside_completed_interview
  language: python
  path: src/pyside_completed_interview.py
  version: 1.0.2
  description: Reusable completed-interview overview excluding the live-only introduction from rows and step counts, deterministic score summary, bounded transcript browser with two-line excerpts and expanded details, and UTF-8 transcript export.
functions:
- name: build_completed_interview_view_model
  description: Derive dynamic score totals, transcript rows and step counts excluding the live-only introduction, finish gating, strengths from ratings of 5, and review items from ratings of 3 or below, skips, missing ratings, and canonical flags.
  locked: false
  inputs:
    candidate_name: {type: str, required: true}
    school: {type: str, required: true}
    position: {type: str, required: true}
    workflow: {type: 'Sequence[Any]', required: true}
    answers: {type: 'Mapping[str, Mapping[str, Any]]', required: true}
    transcripts: {type: 'Mapping[int, str]', required: true}
    scoring: {type: 'Mapping[str, Any]', required: true}
    completion_state: {type: CompletionState, required: true}
    warning: {type: str, required: false, default: ''}
  returns: {type: CompletedInterviewViewModel}
  exceptions: []
  side_effects: none
- name: build_completed_transcript_export
  description: Build a UTF-8 candidate transcript text payload excluding Introduction and hiding skipped-question details.
  locked: false
  inputs:
    model: {type: CompletedInterviewViewModel, required: true}
  returns: {type: str}
  exceptions: []
  side_effects: none
classes:
- name: CompletedInterviewPage
  description: Toolkit-injected processing, failure, and completed overview renderer with score summary, non-clipping trait headers, bounded transcript filtering and expansion, responsive layout, and injected actions.
  locked: false
  attributes: {}
  methods:
  - name: render
    description: Render current completed-interview view model.
    locked: false
    inputs:
      model: {type: CompletedInterviewViewModel, required: true}
    returns: {type: Any}
    exceptions: []
    side_effects: Creates and connects Qt widgets.
  - name: set_narrow
    description: Stack summary and transcript panels below logical content width threshold.
    locked: false
    inputs:
      narrow: {type: bool, required: true}
    returns: {type: None}
    exceptions: []
    side_effects: Updates shared adaptive Qt layout.
data_structures:
- name: CompletionState
  type: enum
  description: Processing, complete, or failed core-finalization state.
- name: CompletedQuestionRow
  type: dataclass
  description: One non-Introduction candidate-response question with transcript, notes, canonical flags, skip state, and optional scoring metadata.
- name: CompletedInterviewCallbacks
  type: dataclass
  description: Injected back, report, export, finish, retry, and question-detail callbacks.
- name: CompletedInterviewViewModel
  type: dataclass
  description: Render-ready identity, completion, dynamic scoring, deterministic summaries, and transcript rows.
dependencies:
- module: pyside_interview_components
- module: PySide6
