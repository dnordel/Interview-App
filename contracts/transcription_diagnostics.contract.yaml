module:
  name: transcription_diagnostics
  language: python
  path: src/transcription_diagnostics.py
  version: 1.1.1
  description: Deprecated compatibility wrapper for transcription diagnostic and redaction helpers implemented by interview_runtime.
functions:
- name: clip_diagnostic_text
  description: Normalize whitespace and clip diagnostic text to a maximum length.
  locked: false
  inputs:
    text:
      type: str
      required: true
    max_length:
      type: int
      required: true
  returns:
    type: str
  exceptions: []
  side_effects: none
- name: extract_diagnostic_filename
  description: Extract the diagnostic filename from a marker-delimited error string.
  locked: false
  inputs:
    text:
      type: str
      required: true
    marker:
      type: str
      required: false
      default: "Diagnostic log:"
  returns:
    type: str
  exceptions: []
  side_effects: none
- name: redact_paths
  description: Redact Windows, macOS, and Linux absolute filesystem paths from text.
  locked: false
  inputs:
    text:
      type: str
      required: true
  returns:
    type: str
  exceptions: []
  side_effects: none
- name: sanitize_transcription_error_reason
  description: Produce a clipped redacted error reason and preserve diagnostic filename hints.
  locked: false
  inputs:
    raw_reason:
      type: str
      required: true
    max_length:
      type: int
      required: false
      default: 300
  returns:
    type: str
  exceptions: []
  side_effects: none
- name: build_transcription_log_hint
  description: Build a redacted log-path hint for transcription troubleshooting copy.
  locked: false
  inputs:
    log_path:
      type: Path | str | None
      required: true
  returns:
    type: str
  exceptions: []
  side_effects: none
- name: format_transcription_health_summary
  description: Build joined question labels, redacted details, and a shared log hint.
  locked: false
  inputs:
    transcription_errors:
      type: Mapping[int, str]
      required: true
    question_labeler:
      type: Callable[[int], str]
      required: true
    log_path:
      type: Path | str | None
      required: true
  returns:
    type: tuple[str, str, str]
  exceptions: []
  side_effects: none
- name: format_runtime_init_error_message
  description: Build user-facing runtime initialization guidance with centralized redaction.
  locked: false
  inputs:
    log_path:
      type: Path | None
      required: true
  returns:
    type: str
  exceptions: []
  side_effects: none
- name: write_transcription_diagnostic
  description: Write exception diagnostics as JSON under a diagnostics directory.
  locked: false
  inputs:
    output_dir:
      type: Path
      required: true
    base_name:
      type: str
      required: true
    stage:
      type: str
      required: true
    error:
      type: Exception
      required: true
    context:
      type: Mapping[str, Any]
      required: true
  returns:
    type: Path
  exceptions:
  - OSError
  side_effects: Creates directories/files and writes diagnostic JSON to disk.
- name: probe_audio_file
  description: Probe audio file existence and metadata for diagnostics context.
  locked: false
  inputs:
    path:
      type: Path
      required: true
  returns:
    type: dict[str, Any]
  exceptions: []
  side_effects: Reads filesystem metadata.
classes: []
data_structures: []
dependencies:
- interview_runtime
