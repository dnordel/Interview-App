      type: Path | None
      required: true
    base_dir:
      type: Path | None
      required: true
  returns:
    type: dict[str, Any] | None
  exceptions:
  - OSError
  side_effects: Reads JSON files under interview_sessions roots.
- name: _session_deepseek_inputs
  description: Convert saved interview session question snapshots into flow transcript,
    trait input, and custom answer payloads suitable for DeepSeek finalize jobs.
  locked: false
  inputs:
    session:
      type: dict[str, Any]
      required: true
  returns:
    type: tuple[list[dict[str, Any]], dict[str, dict[str, Any]], list[dict[str, Any]]]
  exceptions: []
  side_effects: none
- name: _candidate_payload_from_history_row
