      type: dict[int, str]
    exceptions: []
    side_effects: none
- name: TranscriptionJobStatusEvent
  description: Immutable status event emitted for queue/UI progress updates.
  locked: false
  attributes:
    flow_idx:
      type: int
    status:
      type: str
    snapshot:
      type: dict[str, Any]
  methods: []
- name: BoundedTranscriptionExecutor
  description: Executes queued transcription jobs with bounded parallelism and status
    callbacks.
  locked: false
  attributes: {}
  methods:
  - name: __init__
    description: Configure queue state, worker function, bounded worker count, and
      optional status callback.
    locked: false
    inputs:
      queue_state:
        type: TranscriptionQueueState
        required: true
      worker_fn:
        type: Callable[..., None]
        required: true
      max_workers:
        type: int
        required: true
      on_status_change:
        type: Callable[[TranscriptionJobStatusEvent], None] | None
        required: false
        default: null
    returns:
      type: None
    exceptions: []
    side_effects: Initializes internal thread pool state.
  - name: submit
    description: Queue and dispatch a transcription job.
    locked: false
    inputs:
      flow_idx:
        type: int
        required: true
      payload:
        type: dict[str, Any]
        required: true
    returns:
      type: None
    exceptions: []
    side_effects: Updates queue state and submits async work.
  - name: shutdown
    description: Shut down the underlying executor.
    locked: false
    inputs:
      wait:
        type: bool
        required: true
    returns:
      type: None
    exceptions: []
    side_effects: Terminates background workers.
- name: TranscriptWriterController
  description: Controller adapter for transcript text synchronization. Standalone
    transcript DOCX writing is disabled; transcript text is merged into interview
    notes during final report export.
  locked: false
  attributes: {}
  methods:
  - name: __init__
    description: Configure app and shared runtime state references.
    locked: false
    inputs:
      app:
        type: Any
        required: true
      shared_state:
        type: Any
        required: true
    returns:
      type: None
    exceptions: []
    side_effects: none
  - name: append_live_segment
    description: Synchronize transcript content for one flow index through the app
      adapter without writing a standalone transcript document.
    locked: false
    inputs:
      flow_idx:
        type: int
        required: true
      segment_text:
        type: str
        required: true
    returns:
      type: None
    exceptions: []
    side_effects: Updates in-memory/session transcript state.
  - name: rewrite_from_flow
    description: Synchronize flow transcript state without writing a standalone transcript
      document.
    locked: false
    inputs: {}
    returns:
      type: None
    exceptions: []
    side_effects: none
- name: RuntimeConfig
  description: Immutable Whisper runtime model/device/compute-type selection.
  locked: false
  attributes:
    model:
      type: str
    device:
      type: str
    compute_type:
      type: str
  methods: []
- name: AudioRuntimeController
  description: Controller adapter for pending transcription waits, per-question background
    transcription, and Whisper runtime fallback.
  locked: false
  attributes: {}
  methods:
  - name: __init__
    description: Configure app and shared runtime state references.
    locked: false
    inputs:
      app:
        type: Any
        required: true
      shared_state:
        type: Any
        required: true
    returns:
      type: None
    exceptions: []
    side_effects: none
  - name: wait_for_pending_transcriptions
    description: Block until pending queue items complete.
    locked: false
    inputs: {}
    returns:
      type: None
    exceptions: []
    side_effects: Blocks on transcription queue state.
  - name: background_transcribe_question
    description: Stop/transcribe a question recording, persist transcript state, and
      handle cancellation/timeouts.
    locked: false
    inputs:
      flow_idx:
        type: int
        required: true
      session:
        type: Any
        required: true
      base_dir:
        type: Path
        required: true
      base_name:
        type: str
        required: true
      candidate_label:
        type: str
        required: true
      job_timeout_seconds:
        type: float
        required: false
        default: 180.0
    returns:
      type: None
    exceptions:
    - TimeoutError
    side_effects: Writes transcript state, emits timeout logs, deletes canceled artifacts,
      and persists snapshot data.
  - name: start_recording_session
    description: Start audio recording with the resolved OS, configured/default Windows
      microphone device, resolved Windows system device, Whisper runtime config, and
      current Whisper settings.
    locked: false
    inputs:
      start_recording:
        type: Any
        required: true
      base_dir:
        type: Path
        required: true
      base_name:
        type: str
        required: true
      runtime_config:
        type: RuntimeConfig
        required: true
    returns:
      type: Any
    exceptions: []
    side_effects: Starts audio recording subprocesses; may use DEFAULT_WINDOWS_MIC_DEVICE
      when app settings omit windows_microphone_device.
  - name: start_recording_with_runtime_fallback
    description: Start recording with preferred Whisper runtime and CPU fallback for
      device runtime errors.
    locked: false
    inputs:
      start_recording:
        type: Any
        required: true
      base_dir:
        type: Path
        required: true
      base_name:
        type: str
        required: true
    returns:
      type: Any
    exceptions:
    - Exception
    side_effects: Persists runtime choice and emits fallback warning.
- name: FlowController
  description: Controller adapter for interview question navigation and active-flow
    discovery.
  locked: false
  attributes: {}
  methods:
  - name: __init__
    description: Configure app and shared runtime state references.
    locked: false
    inputs:
      app:
        type: Any
        required: true
      shared_state:
        type: Any
        required: true
    returns:
      type: None
    exceptions: []
    side_effects: none
  - name: go_next
    description: Navigate to the next interview question.
    locked: false
    inputs: {}
    returns:
      type: None
    exceptions: []
    side_effects: Triggers UI navigation.
  - name: go_back
    description: Navigate to the previous interview question.
    locked: false
    inputs: {}
    returns:
      type: None
    exceptions: []
    side_effects: Triggers UI navigation.
  - name: active_flow
    description: Return a copy of the active interview flow.
    locked: false
    inputs: {}
    returns:
      type: list[dict[str, Any]]
    exceptions: []
    side_effects: none
- name: DashboardController
  description: Controller adapter for dashboard snapshot refreshes.
  locked: false
  attributes: {}
  methods:
  - name: __init__
    description: Configure app and shared runtime state references.
    locked: false
    inputs:
      app:
        type: Any
        required: true
      shared_state:
        type: Any
        required: true
    returns:
      type: None
    exceptions: []
    side_effects: none
  - name: refresh_dashboard
    description: Refresh dashboard snapshot data through the app adapter.
    locked: false
    inputs: {}
    returns:
      type: None
    exceptions: []
    side_effects: Updates in-memory dashboard state.
- name: HistoryController
  description: Coordinates history data loading, selected row state, and action callback
    routing.
  locked: false
  attributes: {}
  methods:
  - name: __init__
    description: Configure app, shared state, and an optional history grid factory.
    locked: false
    inputs:
      app:
        type: Any
        required: true
      shared_state:
        type: Any
        required: true
      grid_factory:
        type: Callable[..., Any] | None
        required: false
        default: null
    returns:
      type: None
    exceptions: []
    side_effects: none
  - name: build_history_table
    description: Create the history table section and mount the history grid widget.
    locked: false
    inputs:
      parent:
        type: Any
        required: true
    returns:
      type: None
    exceptions: []
    side_effects: Updates in-memory UI state.
  - name: refresh_history_tree
    description: Refresh row data and filtering for the history grid.
    locked: false
    inputs: {}
    returns:
      type: None
    exceptions: []
    side_effects: Updates in-memory row state.
  - name: selected_history_row
    description: Return the currently selected history row from the grid.
    locked: false
    inputs: {}
    returns:
      type: dict[str, Any] | None
    exceptions: []
    side_effects: none
- name: FinalizeContext
  description: Dataclass carrying finalize payload, scoring, transcript metadata,
    canonical interview notes path, and legacy transcript compatibility field through
    finalize gateways.
  locked: false
  attributes:
    payload:
      type: dict[str, Any]
    scoring:
      type: dict[str, Any]
    flow_transcript:
      type: list[dict[str, Any]]
    recording_metadata:
      type: list[dict[str, Any]]
    transcript_path:
      type: str
      description: Empty legacy transcript-only document path for new finalize output;
        use interview_notes_document_path.
    transcript_metadata:
      type: dict[str, Any]
    transcript_complete:
      type: bool
    remaining_question_indices:
      type: list[int]
    interview_notes_document_path:
      type: str
  methods: []
- name: DeepSeekSummaryConfig
  description: Dataclass carrying local DeepSeek summary settings for Ollama's OpenAI-compatible
    endpoint. API key defaults to the non-secret Ollama placeholder and must never
    contain hosted API secrets in local setup.
  locked: false
  attributes:
    enabled:
      type: bool
    api_key:
      type: str
    base_url:
      type: str
    model:
      type: str
    timeout_seconds:
      type: float
      description: Request timeout in seconds; defaults to 600 and accepts values
        up to 1800 for slow local Ollama DeepSeek runs.
    prompt_templates:
      type: dict[str, Any]
    debug_log_dir:
      type: Path | None
  methods: []
- name: FinalizeGateways
  description: Finalize output gateway adapter for report export, integration export,
    referral send, and history persistence.
  locked: false
  attributes:
    sent_referral_keys:
      type: set[str]
  methods:
  - name: export_report
    description: Export merged interview notes and store the canonical interview notes
      path, using app._interview_notes_output_dir() when a caller provides that
      hook and otherwise falling back to base_dir/Indeed Interview Notes.
    locked: false
    inputs:
      app:
        type: Any
        required: true
      context:
        type: FinalizeContext
        required: true
    returns:
      type: str
    exceptions: []
    side_effects: Writes report document and updates referral packet state.
  - name: export_integration
    description: Build and serialize integration payload including flow slices.
    locked: false
    inputs:
      app:
        type: Any
        required: true
      context:
        type: FinalizeContext
        required: true
    returns:
      type: Path
    exceptions: []
    side_effects: Writes integration export file.
  - name: persist_finalize_history
    description: Append finalized interview history entry with generated notes path
      flow recording metadata, and DeepSeek processing status; returns row id used
      by detached worker updates.
    locked: false
    inputs:
      app:
        type: Any
        required: true
      context:
        type: FinalizeContext
        required: true
      out_path:
        type: str
        required: true
    returns:
      type: str
    exceptions: []
    side_effects: Updates persistent history storage.
  - name: send_referral
    description: Build and optionally send director referral packet with dedupe protection.
    locked: false
    inputs:
      app:
        type: Any
        required: true
      context:
        type: FinalizeContext
        required: true
      out_path:
        type: str
        required: true
      integration_path:
        type: Path
        required: true
    returns:
      type: tuple[dict[str, Any], Path | None]
    exceptions: []
    side_effects: May send referral and append communication log.
- name: FinalizePipelineController
  description: Orchestrates interview finalization, scoring, transcript completeness
    metadata, export/referral gateways, and operator feedback.
  locked: false
  attributes: {}
  methods:
  - name: __init__
    description: Configure app, shared runtime state, and optional finalize gateways.
    locked: false
    inputs:
      app:
        type: Any
        required: true
      shared_state:
        type: Any
        required: true
      gateways:
        type: FinalizeGateways | None
        required: false
        default: null
    returns:
      type: None
    exceptions: []
    side_effects: none
  - name: finalize_interview
    description: Validate and dispatch finalize work, surfacing validation/runtime
      failures to the operator.
    locked: false
    inputs: {}
    returns:
      type: None
    exceptions: []
    side_effects: Updates UI state and may show operator dialogs.
  - name: run_finalize_pipeline
    description: Run synchronous finalize scoring, stop/split the continuous interview
      recording when active, merge transcript text, export processing-placeholder
      report/integration artifacts, build/send referral, persist history, and enqueue
      detached DeepSeek work.
    locked: false
    inputs: {}
    returns:
      type: dict[str, Any]
    exceptions: []
    side_effects: May stop the active recording session, writes documents/exports,
      mutates app state, and may append communication/history logs.
  - name: poll_finalize_worker
    description: Poll async finalize worker queue and route success or failure handling.
    locked: false
    inputs:
      q:
        type: queue.Queue[dict[str, Any]]
        required: true
    returns:
      type: None
    exceptions: []
    side_effects: Updates UI finalize state.
data_structures:
- name: CURRENT_SCHEMA_VERSION
  description: Current persisted interview session snapshot schema version.
- name: InterviewState
  type: dataclass
- name: InterviewSessionContext
  type: class
- name: InterviewSessionRecordingContext
  type: dataclass
- name: AppSharedState
  type: dataclass
- name: TranscriptionRuntimeState
  type: dataclass
- name: FlowItem
  type: TypedDict
- name: RecordingTranscriptionPayload
  type: TypedDict
- name: TranscriptionQueuePayload
  type: TypedDict
- name: TranscriptionQueueSnapshot
  type: TypedDict
- name: HistoryRowKey
  description: String key alias for history row identifiers.
- name: OfferTransitionResult
  type: TypedDict
- name: FinalizePipelineResult
  type: TypedDict
- name: FinalizeTranscriptMetadata
  type: TypedDict
- name: TranscriptionJobStatusEvent
  type: dataclass
- name: RuntimeConfig
  type: dataclass
- name: FinalizeContext
  type: dataclass
- name: FinalizeGateways
  type: dataclass
- name: LEGACY_FINALIZE_GUARDRAIL_MESSAGE
  description: Operator-facing validation message used when legacy finalize scoring
    is blocked.
- name: PENDING_TRANSCRIPTION_WARNING
  description: Warning copy shown when finalization starts with incomplete transcription
    work.
- name: TRANSCRIPTION_TIMEOUT_REASON
  description: Stable reason code for transcription timeout failures.
- name: DEFAULT_WINDOWS_MIC_DEVICE
  description: Default Windows DirectShow microphone device used when app settings
    omit windows_microphone_device.
- name: _WINDOWS_AUDIO_DEVICE_ALIASES
  description: Known VB-CABLE DirectShow device aliases used during Windows system-audio
    capture.
- name: DIAGNOSTIC_LOG_MARKER
  description: Marker used to preserve diagnostic filenames while redacting paths.
- name: _COMPAT_MODULES
  description: Ordered tuple of remaining legacy module import paths exposed by interview_runtime.
- name: _WRAPPER_POLICY
  description: Human-readable wrapper policy for remaining interview runtime compatibility
    modules.
