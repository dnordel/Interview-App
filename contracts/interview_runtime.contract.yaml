  description: Preserve path order while removing duplicate path strings.
  locked: false
  inputs:
    paths:
      type: list[Path]
      required: true
  returns:
    type: list[Path]
  exceptions: []
  side_effects: none
- name: _coerce_flow_index
  description: Convert saved flow index values to integers, using fallback when invalid.
  locked: false
  inputs:
    value:
      type: Any
      required: true
    fallback:
      type: int
      required: true
  returns:
    type: int
  exceptions: []
  side_effects: none
- name: _session_question_title
  description: Derive a readable title for saved session flow transcript entries.
  locked: false
  inputs:
    item_type:
      type: str
      required: true
    item_id:
      type: str
      required: true
  returns:
    type: str
  exceptions: []
  side_effects: none
- name: retry_deepseek_finalize_job
  description: Relaunch an existing persisted DeepSeek finalize job from its saved
    job JSON, mark the matching history row back to processing, seed retry progress,
    recover a failed same-job DeepSeek queue lock when progress metadata proves the
    prior attempt failed, and return the progress JSON path used by GUI polling.
    Worker resume behavior is driven by checkpointed payload and scoring already
    persisted in the job file.
  locked: false
  inputs:
    job_path:
      type: Path
      required: true
  returns:
    type: Path
  exceptions:
  - ValueError
  - OSError
  side_effects: Reads a local job JSON/progress/lock file, may remove a failed same-job
    lock, updates interview history JSON when identifiers are present, writes sanitized
    retry progress JSON, and starts a detached Python worker without shell interpolation.
- name: regenerate_interview_notes_job
  description: Relaunch an existing persisted DeepSeek finalize job in either full
    local-DeepSeek-plus-document mode or document-only mode; full mode resets saved
    DeepSeek checkpoint payload fields and refreshes prompt templates from current
    config before worker launch, while document-only mode preserves saved DeepSeek
    output and only rebuilds the interview notes DOCX.
  locked: false
  inputs:
    job_path:
      type: Path
      required: true
    mode:
      type: str
      required: true
  returns:
    type: Path
  exceptions:
  - ValueError
  - OSError
  side_effects: Reads and rewrites local job JSON with rerun mode, may reset saved
    DeepSeek payload checkpoint fields and current prompt templates, updates interview
    history JSON to processing, seeds sanitized progress JSON, may remove a failed
    same-job lock, and starts a detached Python worker without shell interpolation.
- name: _mark_deepseek_history_processing
  description: Mark the history row referenced by a persisted DeepSeek job as processing,
    clearing warning and completion timestamp fields when both history path and history
    id are available.
  locked: false
  inputs:
    job:
      type: dict[str, Any]
      required: true
  returns:
    type: None
  exceptions:
  - OSError
  side_effects: May update interview history JSON on disk.
- name: raise_legacy_finalize_guardrail
  description: Fail closed when the disabled legacy finalize path is invoked.
  locked: false
  inputs: {}
  returns:
    type: None
  exceptions:
  - ReportingValidationError
  side_effects: none
- name: validate_before_finalize
  description: Validate candidate, qualification, track, and required trait scoring
    state before finalization.
  locked: false
  inputs:
    app:
      type: Any
      required: true
  returns:
    type: None
  exceptions:
  - ValueError
  side_effects: none
