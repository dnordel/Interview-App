module:
  name: interview_runtime
  language: python
  path: src/interview_runtime.py
  version: 3.0.0
  description: Flattened public interface for interview state, session management,
    audio/transcription runtime, controllers, history, and
    finalize pipeline; only active legacy adapters remain in the compatibility module
    inventory.
functions:
- name: _safe_token
  description: Return a filesystem-safe token for interview session filenames, using
    a fallback when the input is empty after sanitization.
  locked: false
  inputs:
    value:
      type: str
      required: true
    fallback:
      type: str
      required: true
  returns:
    type: str
  exceptions: []
  side_effects: none
- name: available_modules
  description: Return remaining legacy interview modules still exposed through this
    flattened facade.
  locked: false
  inputs: {}
  returns:
    type: tuple[str, ...]
  exceptions: []
  side_effects: none
- name: load_compat_module
  description: Import a remaining legacy module that belongs to the interview runtime
    facade.
  locked: false
  inputs:
    module_name:
      type: str
      required: true
  returns:
    type: ModuleType
  exceptions:
  - AttributeError
  side_effects: Imports the requested module.
- name: module_ownership
  description: Return the ownership map from each remaining legacy interview runtime
    module to the flattened interview_runtime module.
  locked: false
  inputs: {}
  returns:
    type: dict[str, str]
  exceptions: []
  side_effects: none
- name: wrapper_policy
  description: Return the compatibility wrapper policy for remaining legacy interview
    runtime modules during flattening cleanup.
  locked: false
  inputs: {}
  returns:
    type: str
  exceptions: []
  side_effects: none
- name: public_symbols
  description: Return public symbols exposed by one remaining legacy interview runtime
    module or by all remaining interview runtime modules.
  locked: false
  inputs:
    module_name:
      type: str | None
      required: false
      default: None
  returns:
    type: tuple[str, ...]
  exceptions:
  - AttributeError
  side_effects: Imports remaining interview runtime compatibility modules.
- name: resolve_compat_symbol
  description: Resolve a public symbol from the remaining legacy modules owned by
    this facade.
  locked: false
  inputs:
    symbol_name:
      type: str
      required: true
  returns:
    type: Any
  exceptions:
  - AttributeError
  side_effects: Imports legacy modules until the symbol is found.
- name: __dir__
  description: Return module attributes plus flattened public compatibility symbols
    for editor and agent discovery.
  locked: false
  inputs: {}
  returns:
    type: list[str]
  exceptions: []
  side_effects: Imports remaining interview runtime compatibility modules.
- name: append_candidate_segment_text
  description: Append candidate-only text segments while preserving existing transcript
    content.
  locked: false
  inputs:
    existing_text:
      type: str
      required: true
    segments:
      type: list[Any]
      required: true
    candidate_label:
      type: str
      required: true
  returns:
    type: str
  exceptions: []
  side_effects: none
- name: sanitize_transcription_error_reason
  description: Produce a clipped redacted error reason and preserve diagnostic filename
    hints.
  locked: false
  inputs:
    raw_reason:
      type: str
      required: true
    max_length:
      type: int
      required: false
      default: 300
  returns:
    type: str
  exceptions: []
  side_effects: none
- name: build_transcription_log_hint
  description: Build a redacted log-path hint for transcription troubleshooting copy.
  locked: false
  inputs:
    log_path:
      type: Path | str | None
      required: true
  returns:
    type: str
  exceptions: []
  side_effects: none
- name: format_transcription_health_summary
  description: Build joined question labels, redacted details, and a shared log hint.
  locked: false
  inputs:
    transcription_errors:
      type: Mapping[int, str]
      required: true
    question_labeler:
      type: Callable[[int], str]
      required: true
    log_path:
      type: Path | str | None
      required: true
  returns:
    type: tuple[str, str, str]
  exceptions: []
  side_effects: none
- name: write_transcription_diagnostic
  description: Write exception diagnostics as JSON under a diagnostics directory.
  locked: false
  inputs:
    output_dir:
      type: Path
      required: true
    base_name:
      type: str
      required: true
    stage:
      type: str
      required: true
    error:
      type: Exception
      required: true
    context:
      type: Mapping[str, Any]
      required: true
  returns:
    type: Path
  exceptions:
  - OSError
  side_effects: Creates directories/files and writes diagnostic JSON to disk.
- name: probe_audio_file
  description: Probe audio file existence and metadata for diagnostics context.
  locked: false
  inputs:
    path:
      type: Path
      required: true
  returns:
    type: dict[str, Any]
  exceptions: []
  side_effects: Reads filesystem metadata.
- name: build_flow_time_windows
  description: Build flow index start/end windows from recorded flow time marks.
  locked: false
  inputs:
    flow_time_marks:
      type: list[dict[str, Any]]
      required: true
  returns:
    type: list[tuple[int, float, float]]
  exceptions: []
  side_effects: none
- name: map_segments_to_flow_indices
  description: Map candidate segments into flow indices by windowed start-time membership.
  locked: false
  inputs:
    segments:
      type: list[dict[str, Any]]
      required: true
    windows:
      type: list[tuple[int, float, float]]
      required: true
  returns:
    type: dict[int, str]
  exceptions: []
  side_effects: none
- name: parse_indeed_transcript_text
  description: Parse an Indeed-generated plain-text transcript into ordered speaker turns, accepting Speaker N labels and rejecting oversized or label-free input without echoing transcript text in errors.
  locked: false
  inputs:
    text:
      type: str
      required: true
    max_chars:
      type: int
      required: false
      default: 750000
  returns:
    type: list[IndeedTranscriptTurn]
  exceptions:
  - ValueError
  side_effects: none
- name: infer_indeed_interviewer_speaker
  description: Infer which Indeed speaker is the interviewer by matching speaker turns against configured interview question prompts.
  locked: false
  inputs:
    turns:
      type: Sequence[IndeedTranscriptTurn]
      required: true
    questions:
      type: Sequence[Mapping[str, Any]]
      required: true
  returns:
    type: str
  exceptions:
  - ValueError
  side_effects: none
- name: map_indeed_transcript_to_questions
  description: Map parsed Indeed speaker turns onto the active track's configured interview questions in configured order, using fuzzy prompt markers while retaining unmatched interviewer follow-ups and repeated prompts inside the active answer, and return candidate answer transcripts, inferred speakers, and unmatched question ids that callers should treat as skipped.
  locked: false
  inputs:
    turns:
      type: Sequence[IndeedTranscriptTurn]
      required: true
    questions:
      type: Sequence[Mapping[str, Any]]
      required: true
    interviewer_speaker:
      type: str | None
      required: false
      default: null
    min_question_score:
      type: float
      required: false
      default: 0.45
  returns:
    type: IndeedTranscriptImportResult
  exceptions:
  - ValueError
  side_effects: none
- name: write_merged_timestamped_transcript
  description: Write a timestamped interleaved transcript text file from segment records.
  locked: false
  inputs:
    transcript_path:
      type: Path
      required: true
    segments:
      type: list[dict[str, Any]]
      required: true
  returns:
    type: Path
  exceptions: []
  side_effects: writes filesystem
- name: recommended_max_workers
  description: Return a hardware-aware default max worker count for transcription
    jobs.
  locked: false
  inputs:
    cpu_count:
      type: int | None
      required: false
      default: null
  returns:
    type: int
  exceptions: []
  side_effects: none
- name: resolve_transcription_max_workers
  description: Resolve configured transcription worker count with safe fallback bounds.
  locked: false
  inputs:
    settings:
      type: dict[str, Any]
      required: true
  returns:
    type: int
  exceptions: []
  side_effects: none
- name: resolve_transcription_job_timeout_seconds
  description: Resolve per-job transcription timeout from settings with bounded fallback
    values.
  locked: false
  inputs:
    settings:
      type: dict[str, Any]
      required: true
  returns:
    type: float
  exceptions: []
  side_effects: none
- name: resolve_runtime
  description: Resolve configured Whisper runtime model, device, compute type, and
    backend with defaults, preferring installed OpenVINO GenAI for startup defaults
    while preserving explicit backend/runtime overrides, configured whisper.cpp,
    and CPU-safe fallback.
  locked: false
  inputs:
    settings:
      type: dict[str, Any]
      required: true
  returns:
    type: RuntimeConfig
  exceptions: []
  side_effects: none
- name: _openvino_genai_available
  description: Return whether the OpenVINO GenAI Python package is importable.
  locked: false
  inputs: {}
  returns:
    type: bool
  exceptions: []
  side_effects: none
- name: fallback_from_exception
  description: Return a CPU fallback runtime for CUDA/NVIDIA, AMD ROCm/HIP, Intel
    GPU, or other device-related Whisper runtime errors.
  locked: false
  inputs:
    exc:
      type: Exception
      required: true
    preferred:
      type: RuntimeConfig
      required: true
    settings:
      type: dict[str, Any]
      required: true
  returns:
    type: RuntimeConfig | None
  exceptions: []
  side_effects: none
- name: persist_runtime_choice
  description: Persist resolved Whisper runtime settings and selection mode.
  locked: false
  inputs:
    settings:
      type: dict[str, Any]
      required: true
    runtime_config:
      type: RuntimeConfig
      required: true
    mode:
      type: str
      required: true
  returns:
    type: None
  exceptions: []
  side_effects: Mutates runtime settings.
- name: list_windows_dshow_audio_devices
  description: Probe ffmpeg DirectShow devices once per ffmpeg executable path and
    return cached detected audio device names on later calls.
  locked: false
  inputs:
    ffmpeg_exe:
      type: str | None
      required: false
      default: null
  returns:
    type: list[str]
  exceptions: []
  side_effects: Executes ffmpeg subprocess for device enumeration on first use per
    ffmpeg executable path and caches detected names in memory.
- name: resolve_preferred_windows_audio_device
  description: Resolve the best available Windows audio device using preferred name
    and alias candidates.
  locked: false
  inputs:
    preferred_name:
      type: str
      required: true
    aliases:
      type: Sequence[str] | None
      required: false
      default: null
    available_devices:
      type: Sequence[str] | None
      required: false
      default: null
  returns:
    type: str
  exceptions: []
  side_effects: none
- name: resolve_default_windows_system_device
  description: Resolve VB-CABLE system capture device using probing and known aliases.
  locked: false
  inputs: {}
  returns:
    type: str
  exceptions: []
  side_effects: Probes local ffmpeg audio devices when available.
- name: resolve_default_windows_microphone_device
  description: Resolve the default local Windows microphone using probing and known
    microphone aliases so interview recordings keep a mic backup alongside system
    capture.
  locked: false
  inputs: {}
  returns:
    type: str
  exceptions: []
  side_effects: Probes local ffmpeg audio devices when available.
- name: build_finalize_context
  description: Build finalize payload, timestamp-split flow transcript, transcript
    metadata, human trait inputs, and legacy empty transcript path from app state.
  locked: false
  inputs:
    app:
      type: Any
      required: true
    scoring:
      type: dict[str, Any]
      required: true
    warnings:
      type: list[str]
      required: true
    transcript_metadata:
      type: dict[str, Any]
      required: true
  returns:
    type: FinalizeContext
  exceptions: []
  side_effects: Applies candidate transcript text to flow payloads and clears the
    legacy referral transcript path for new finalize output.
- name: finalize_progress_status_label
  description: Normalize internal progress states to the four operator-facing finalize
    statuses Processing, Finished, Timed-out, or Queued.
  locked: false
  inputs:
    status:
      type: Any
      required: true
  returns:
    type: str
  exceptions: []
  side_effects: none
- name: build_finalize_progress_tasks
  description: Merge queued, existing, and current finalize progress steps into an
    ordered task/status list, marking ordered prior Queued/Processing tasks Finished
    when later work is reached and marking every remaining Queued/Processing task
    Finished when the final status is complete.
  locked: false
  inputs:
    step:
      type: Any
      required: true
    status:
      type: Any
      required: false
      default: processing
    existing_tasks:
      type: Any
      required: false
      default: null
    queued_steps:
      type: Any
      required: false
      default: null
  returns:
    type: list[dict[str, str]]
  exceptions: []
  side_effects: none
- name: format_finalize_progress_tasks
  description: Format finalize task/status rows for compact two-column popup display
    where task names appear left and the normalized status appears on the right.
  locked: false
  inputs:
    tasks:
      type: Any
      required: true
    fallback:
      type: str
      required: false
      default: ''
  returns:
    type: str
  exceptions: []
  side_effects: none
- name: raise_legacy_finalize_guardrail
  description: Fail closed when the disabled legacy finalize path is invoked.
  locked: false
  inputs: {}
  returns:
    type: None
  exceptions:
  - ReportingValidationError
  side_effects: none
- name: validate_before_finalize
  description: Validate candidate, qualification, track, and required trait scoring
    state before finalization.
  locked: false
  inputs:
    app:
      type: Any
      required: true
  returns:
    type: None
  exceptions:
  - ValueError
  side_effects: none
classes:
- name: InterviewState
  description: Dataclass storing candidate fields, per-flow response state, and referral
    metadata.
  locked: false
  attributes:
    candidate_name:
      type: str
    interview_date:
      type: str
    school:
      type: str
    track:
      type: str
    qualification:
      type: CandidateQualification
    current_index:
      type: int
    trait_inputs:
      type: dict[str, dict[str, Any]]
    custom_inputs:
      type: dict[str, dict[str, Any]]
    flow_time_marks:
      type: list[dict[str, Any]]
    flow_candidate_transcripts:
      type: dict[int, str]
    flow_recordings:
      type: dict[int, dict[str, Any]]
    referral_packet:
      type: dict[str, str]
    communication_log:
      type: list[dict[str, Any]]
  methods:
  - name: to_dict
    description: Serialize interview state to persistence-friendly dictionary structure.
    locked: false
    inputs: {}
    returns:
      type: dict[str, Any]
    exceptions: []
    side_effects: none
- name: InterviewSessionContext
  description: Provides sanitized naming, session key composition, and runtime path/log
    helpers.
  locked: false
  attributes: {}
  methods:
  - name: __init__
    description: Initializes runtime context providers and path anchors.
    locked: false
    inputs:
      app_root:
        type: Path
        required: true
      default_base_dir:
        type: Path
        required: true
      today_provider:
        type: Callable[[], date] | None
        required: false
      now_provider:
        type: Callable[[], datetime] | None
        required: false
    returns:
      type: None
    exceptions: []
    side_effects: none
  - name: safe_interview_date
    description: Returns an explicit interview date or a current-date fallback.
    locked: false
    inputs:
      raw_date:
        type: str
        required: true
    returns:
      type: str
    exceptions: []
    side_effects: none
  - name: safe_base_name
    description: Builds a filesystem-safe interview base name from candidate and date
      values.
    locked: false
    inputs:
      candidate_name:
        type: str
        required: true
      interview_date:
        type: str
        required: true
    returns:
      type: str
    exceptions: []
    side_effects: none
  - name: active_session_key
    description: Composes deterministic session key tuple values for session storage.
    locked: false
    inputs:
      interview_session_id:
        type: str
        required: true
      candidate_name:
        type: str
        required: true
      interview_date:
        type: str
        required: true
    returns:
      type: tuple[str, str, str]
    exceptions: []
    side_effects: none
  - name: validate_runtime_base_dir
    description: Resolves and validates base directory policy with optional write-probe.
    locked: false
    inputs:
      raw_base_dir:
        type: str
        required: true
      write_probe:
        type: bool
        required: false
        default: true
    returns:
      type: Path
    exceptions:
    - OSError
    side_effects: creates base directory and performs write probe when enabled
  - name: runtime_init_log_path
    description: Returns deterministic runtime initialization log path under app logs.
    locked: false
    inputs: {}
    returns:
      type: Path
    exceptions: []
    side_effects: none
- name: InterviewSessionRecordingContext
  description: Dataclass carrying active recording/session identity values used by
    shared interview app state.
  locked: false
  attributes:
    interview_session_id:
      type: str
    recording_base_name:
      type: str
    recording_flow_idx:
      type: int | None
    recording_started_monotonic:
      type: float | None
    recording_candidate_label:
      type: str
    live_transcript_docx:
      type: Path | None
  methods: []
- name: AppSharedState
  description: Shared controller state for active recording session, transcription
    queue status, and history rows.
  locked: false
  attributes:
    session:
      type: InterviewSessionRecordingContext
    transcription:
      type: TranscriptionRuntimeState
    history_rows:
      type: list[dict[str, Any]]
  methods: []
- name: FlowItem
  description: Flow item TypedDict for normalized interview flow entries.
  locked: false
  attributes:
    id:
      type: str
    flow_index:
      type: int
    question_type:
      type: str
    trait_id:
      type: str
    trait_name:
      type: str
    prompt:
      type: str
    raw:
      type: dict[str, Any]
  methods: []
- name: RecordingTranscriptionPayload
  description: TypedDict for completed per-question recording/transcription output
    paths and text.
  locked: false
  attributes:
    flow_index:
      type: int
    base_name:
      type: str
    output_dir:
      type: str
    mic_wav:
      type: str
    sys_wav:
      type: str
    transcript_txt:
      type: str
    transcript_jsonl:
      type: str
    candidate_label:
      type: str
    candidate_transcript:
      type: str
  methods: []
- name: TranscriptionQueuePayload
  description: TypedDict for queued per-flow transcription work.
  locked: false
  attributes:
    flow_idx:
      type: int
    session:
      type: Any
    base_dir:
      type: Path
    base_name:
      type: str
    candidate_label:
      type: str
    job_timeout_seconds:
      type: float
    job_uuid:
      type: str
    retry_count:
      type: int
    interview_session_id:
      type: str
    finalize_correlation_id:
      type: str
  methods: []
- name: TranscriptionQueueSnapshot
  description: TypedDict snapshot of transcription queue state for one flow.
  locked: false
  attributes:
    flow_index:
      type: int
    is_pending:
      type: bool
    is_canceled:
      type: bool
    queued_count:
      type: int
    pending_count:
      type: int
    error_reason:
      type: str | None
  methods: []
- name: OfferTransitionResult
  description: TypedDict result for offer-status transitions.
  locked: false
  attributes:
    next_status:
      type: str
    done_message:
      type: str
  methods: []
- name: FinalizePipelineResult
  description: TypedDict for finalize worker outputs and downstream artifact paths.
  locked: false
  attributes:
    scoring:
      type: dict[str, Any]
    out_path:
      type: str
    integration_path:
      type: str
    transcript_path:
      type: str
      description: '[DEPRECATED] Legacy transcript-only DOCX path retained as an
        empty compatibility field for new finalize results. Use interview_notes_document_path.'
    director_packet:
      type: dict[str, Any]
    warnings:
      type: list[str]
    communication_log_path:
      type: str | None
    transcript_complete:
      type: bool
    transcript_completeness_status:
      type: str
    remaining_question_indices:
      type: list[int]
  methods: []
- name: FinalizeTranscriptMetadata
  description: TypedDict for finalize transcript completeness metadata.
  locked: false
  attributes:
    transcript_complete:
      type: bool
    transcript_completeness_status:
      type: str
    remaining_question_indices:
      type: list[int]
  methods: []
- name: TranscriptionRuntimeState
  description: Dataclass tracking pending, canceled, queued, and failed per-flow transcription
    work.
  locked: false
  attributes:
    pending_flow_transcriptions:
      type: set[int]
    canceled_flow_transcriptions:
      type: set[int]
    queued_flow_transcriptions:
      type: list[dict[str, Any]]
    question_transcription_errors:
      type: dict[int, str]
  methods: []
- name: InterviewSessionStore
  description: File-backed interview session snapshot store with schema migration
    and path-safe session keys.
  locked: false
  attributes: {}
  methods:
  - name: __init__
    description: Configure the store root under an interview_sessions folder and create
      it when needed.
    locked: false
    inputs:
      base_dir:
        type: Path
        required: true
    returns:
      type: None
    exceptions: []
    side_effects: Creates the interview session directory when missing.
  - name: session_path
    description: Return the JSON path for an interview session identity.
    locked: false
    inputs:
      interview_id:
        type: str
        required: true
      candidate_name:
        type: str
        required: true
      interview_date:
        type: str
        required: true
    returns:
      type: Path
    exceptions: []
    side_effects: none
  - name: load
    description: Load an interview session payload, returning a default payload when
      missing or unreadable.
    locked: false
    inputs:
      interview_id:
        type: str
        required: true
      candidate_name:
        type: str
        required: true
      interview_date:
        type: str
        required: true
    returns:
      type: dict[str, Any]
    exceptions: []
    side_effects: Reads a JSON session file when present.
  - name: save_question_snapshot
    description: Persist a normalized per-question snapshot and return the session
      file path.
    locked: false
    inputs:
      interview_id:
        type: str
        required: true
      candidate_name:
        type: str
        required: true
      interview_date:
        type: str
        required: true
      flow_idx:
        type: int
        required: true
      item_type:
        type: str
        required: true
      item_id:
        type: str
        required: true
      notes:
        type: dict[str, Any] | None
        required: true
      candidate_transcript:
        type: str
        required: true
    returns:
      type: Path
    exceptions: []
    side_effects: Writes the interview session JSON file.
- name: SessionPayloadValidationError
  description: Raised when persisted payload structures are invalid for hydration.
  locked: false
  attributes: {}
  methods: []
- name: ResumeInstruction
  description: Instruction object describing where the UI should resume.
  locked: false
  attributes:
    target:
      type: str
    flow_index:
      type: int | None
  methods: []
- name: InterviewSessionManager
  description: Service for loading persisted sessions, hydrating InterviewState, and
    building resume targets.
  locked: false
  attributes: {}
  methods:
  - name: __init__
    description: Configure draft/session data providers and date provider.
    locked: false
    inputs:
      draft_manager:
        type: DraftManager
        required: true
      session_store:
        type: InterviewSessionStore | None
        required: false
      today_provider:
        type: Callable[[], date]
        required: false
    returns:
      type: None
    exceptions: []
    side_effects: none
  - name: load_session_payload
    description: Load and normalize persisted interview session payload.
    locked: false
    inputs:
      interview_id:
        type: str
        required: true
      candidate_name:
        type: str
        required: true
      interview_date:
        type: str
        required: true
    returns:
      type: dict[str, Any]
    exceptions:
    - SessionPayloadValidationError
    side_effects: Reads session file from disk.
  - name: normalize_payload
    description: Validate and normalize draft payload schema.
    locked: false
    inputs:
      payload:
        type: dict[str, Any]
        required: true
    returns:
      type: dict[str, Any]
    exceptions:
    - SessionPayloadValidationError
    side_effects: none
  - name: normalize_session_payload
    description: Validate and normalize interview session payload schema.
    locked: false
