        type: Any
        required: true
      shared_state:
        type: Any
        required: true
    returns:
      type: None
    exceptions: []
    side_effects: none
  - name: background_transcribe_question
    description: Stop/transcribe a question recording, persist transcript state, and
      handle cancellation/timeouts.
    locked: false
    inputs:
      flow_idx:
        type: int
        required: true
      session:
        type: Any
        required: true
      base_dir:
