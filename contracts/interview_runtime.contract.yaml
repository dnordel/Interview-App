- name: FinalizeContext
  description: Dataclass carrying finalize payload, scoring, transcript metadata,
    canonical interview notes path, and legacy transcript compatibility field through
    finalize gateways.
  locked: false
  attributes:
    payload:
      type: dict[str, Any]
    scoring:
      type: dict[str, Any]
    flow_transcript:
      type: list[dict[str, Any]]
    recording_metadata:
      type: list[dict[str, Any]]
    transcript_path:
      type: str
      description: Empty legacy transcript-only document path for new finalize output;
        use interview_notes_document_path.
    transcript_metadata:
      type: dict[str, Any]
    transcript_complete:
      type: bool
    remaining_question_indices:
      type: list[int]
    interview_notes_document_path:
      type: str
  methods: []
- name: FinalizeGateways
  description: Finalize output gateway adapter for report export, integration export,
    referral send, and history persistence.
  locked: false
  attributes:
    sent_referral_keys:
      type: set[str]
  methods:
  - name: export_report
    description: Export merged interview notes and store the canonical interview notes
      path, using app._interview_notes_output_dir() when a caller provides that
      hook and otherwise falling back to base_dir/Indeed Interview Notes.
    locked: false
    inputs:
      app:
        type: Any
        required: true
      context:
        type: FinalizeContext
        required: true
    returns:
      type: str
    exceptions: []
    side_effects: Writes report document and updates referral packet state.
  - name: export_basic_report
    description: Export basic interview notes and store
      the canonical interview notes path, using app._interview_notes_output_dir()
      when available and otherwise falling back to base_dir/Indeed Interview Notes.
    locked: false
    inputs:
      app:
        type: Any
        required: true
      context:
        type: FinalizeContext
        required: true
    returns:
      type: str
    exceptions: []
    side_effects: Writes a basic interview notes document and updates referral packet
      state.
  - name: export_integration
    description: Build and serialize integration payload including flow slices.
    locked: false
    inputs:
      app:
        type: Any
        required: true
      context:
        type: FinalizeContext
        required: true
    returns:
      type: Path
    exceptions: []
    side_effects: Writes integration export file.
  - name: persist_finalize_history
    description: Atomically append finalized history plus initial structured candidate report when supported, including basic notes path, full finalized snapshot, and recording metadata; compatibility stores retain append-only behavior.
    locked: false
    inputs:
      app:
        type: Any
        required: true
      context:
        type: FinalizeContext
        required: true
      out_path:
        type: str
        required: true
    returns:
      type: str
    exceptions: []
    side_effects: Updates persistent history and structured candidate-report version/audit storage.
  - name: send_referral
    description: Build and optionally send director referral packet with dedupe protection.
    locked: false
    inputs:
      app:
        type: Any
        required: true
      context:
        type: FinalizeContext
        required: true
      out_path:
        type: str
        required: true
      integration_path:
        type: Path
        required: true
    returns:
      type: tuple[dict[str, Any], Path | None]
    exceptions: []
    side_effects: May send referral and append communication log.
- name: FinalizePipelineController
  description: Orchestrates interview finalization, scoring, transcript completeness
    metadata, export/referral gateways, and operator feedback.
  locked: false
  attributes: {}
  methods:
  - name: __init__
    description: Configure app, shared runtime state, and optional finalize gateways.
    locked: false
    inputs:
      app:
        type: Any
        required: true
      shared_state:
        type: Any
        required: true
      gateways:
        type: FinalizeGateways | None
        required: false
        default: null
    returns:
      type: None
    exceptions: []
    side_effects: none
  - name: finalize_interview
    description: Validate and dispatch finalize work, surfacing validation/runtime
      failures to the operator.
    locked: false
    inputs: {}
    returns:
      type: None
    exceptions: []
    side_effects: Updates UI state and may show operator dialogs.
  - name: run_finalize_pipeline
    description: Run synchronous finalize scoring, stop/split the continuous interview
      recording when active, merge transcript text, export basic notes/integration
      artifacts, build/send referral, and persist history.
    locked: false
    inputs: {}
    returns:
      type: dict[str, Any]
    exceptions: []
    side_effects: May stop the active recording session, writes documents/exports,
      mutates app state, and may append communication/history logs.
  - name: poll_finalize_worker
    description: Poll async finalize worker queue and route success or failure handling.
    locked: false
    inputs:
      q:
        type: queue.Queue[dict[str, Any]]
        required: true
    returns:
      type: None
    exceptions: []
    side_effects: Updates UI finalize state.
data_structures:
- name: CURRENT_SCHEMA_VERSION
  description: Current persisted interview session snapshot schema version.
- name: InterviewState
  type: dataclass
- name: InterviewSessionContext
  type: class
- name: InterviewSessionRecordingContext
  type: dataclass
- name: AppSharedState
  type: dataclass
- name: TranscriptionRuntimeState
  type: dataclass
- name: FlowItem
  type: TypedDict
- name: RecordingTranscriptionPayload
  type: TypedDict
- name: TranscriptionQueuePayload
  type: TypedDict
- name: TranscriptionQueueSnapshot
  type: TypedDict
- name: HistoryRowKey
  description: String key alias for history row identifiers.
- name: OfferTransitionResult
  type: TypedDict
- name: FinalizePipelineResult
  type: TypedDict
- name: FinalizeTranscriptMetadata
  type: TypedDict
- name: IndeedTranscriptTurn
  type: dataclass
  description: One parsed Indeed transcript speaker turn with normalized Speaker N label and joined text.
- name: IndeedTranscriptQuestionMatch
  type: dataclass
  description: One mapped Indeed transcript answer for a configured interview flow question.
- name: IndeedTranscriptImportResult
  type: dataclass
  description: Result of Indeed transcript import mapping, including inferred speakers, mapped answer count, unmatched skipped question ids, and mapped question matches.
- name: TranscriptionJobStatusEvent
  type: dataclass
- name: RuntimeConfig
  type: dataclass
- name: FinalizeContext
  type: dataclass
- name: FinalizeGateways
  type: dataclass
- name: LEGACY_FINALIZE_GUARDRAIL_MESSAGE
  description: Operator-facing validation message used when legacy finalize scoring
    is blocked.
- name: PENDING_TRANSCRIPTION_WARNING
  description: Warning copy shown when finalization starts with incomplete transcription
    work.
- name: TRANSCRIPTION_TIMEOUT_REASON
  description: Stable reason code for transcription timeout failures.
- name: DEFAULT_WINDOWS_MIC_DEVICE
  description: Default Windows DirectShow microphone device used when app settings
    omit windows_microphone_device.
- name: _WINDOWS_AUDIO_DEVICE_ALIASES
  description: Known VB-CABLE DirectShow device aliases used during Windows system-audio
    capture.
- name: _WINDOWS_MIC_DEVICE_ALIASES
  description: Known local microphone DirectShow device aliases used for microphone
    backup capture.
- name: DIAGNOSTIC_LOG_MARKER
  description: Marker used to preserve diagnostic filenames while redacting paths.
- name: _COMPAT_MODULES
  description: Ordered tuple of remaining legacy module import paths exposed by interview_runtime.
- name: _WRAPPER_POLICY
  description: Human-readable wrapper policy for remaining interview runtime compatibility
    modules.
dependencies:
- module: data_store
- module: platform_services
- module: ui_feedback
- module: scoring_reporting
- module: interview_audio_recorder
- module: interview_app_audio_devices
- module: interview_app_audio_runtime
- module: interview_app_finalize_pipeline
- module: interview_app_history_actions
- module: interview_app_session_manager
- module: interview_app_transcription_queue
