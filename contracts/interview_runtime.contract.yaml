  exceptions: []
  side_effects: none
- name: _synthesize_deepseek_job_from_session
  description: Create a persisted DeepSeek finalize job from a matching saved interview
    session transcript and history row when no original job JSON exists.
  locked: false
  inputs:
    job_path:
      type: Path
      required: true
    row:
      type: dict[str, Any]
      required: true
    history_path:
      type: Path | None
      required: true
    base_dir:
      type: Path | None
      required: true
  returns:
    type: Path | None
  exceptions:
  - OSError
  side_effects: May read session JSON, create job directories, write a synthesized
    job JSON, and update interview history with job/progress paths.
- name: _load_matching_interview_session
  description: Find newest saved interview session JSON matching candidate name and
    interview date under configured artifact roots, requiring at least one candidate
    transcript.
  locked: false
  inputs:
    row:
      type: dict[str, Any]
      required: true
