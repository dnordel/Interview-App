  side_effects: Reads config/rubric.json when available.
- name: _local_deepseek_settings_source
  description: Return local Ollama DeepSeek settings for synthesized or full-regenerated
    jobs, preserving existing non-empty values while filling missing local defaults
    and current prompt templates.
  locked: false
  inputs:
    settings:
      type: dict[str, Any] | None
      required: false
  returns:
    type: dict[str, Any]
  exceptions: []
  side_effects: Reads current DeepSeek prompt templates from config.
- name: _normalize_session_match_text
  description: Normalize candidate names for saved-session matching without exposing
    raw transcript data.
  locked: false
  inputs:
    value:
      type: Any
      required: true
  returns:
    type: str
  exceptions: []
  side_effects: none
