- name: TranscriptionQueueState
  description: Thread-safe queue state for per-question transcription jobs, cancellation,
    timeout, and error tracking.
  locked: false
  attributes: {}
  methods:
  - name: enqueue
    description: Queue a transcription payload unless the flow is already pending.
    locked: false
    inputs:
      flow_idx:
        type: int
        required: true
      payload:
        type: dict[str, Any]
        required: true
    returns:
      type: dict[str, Any]
    exceptions: []
    side_effects: Updates queue state and logs queue metadata.
  - name: mark_started
    description: Mark a queued flow as running and capture elapsed-time baseline.
    locked: false
    inputs:
      flow_idx:
        type: int
        required: true
    returns:
      type: dict[str, Any]
    exceptions: []
    side_effects: Updates in-memory queue state.
  - name: mark_completed
    description: Mark a flow as completed and clear pending/canceled tracking.
    locked: false
    inputs:
      flow_idx:
        type: int
        required: true
      terminal_status:
        type: str
        required: false
        default: completed
    returns:
      type: dict[str, Any]
    exceptions: []
    side_effects: Updates in-memory queue state.
  - name: mark_failed
    description: Mark a flow as failed and preserve a normalized error reason unless
      canceled.
    locked: false
    inputs:
      flow_idx:
        type: int
        required: true
      reason:
        type: str
        required: true
      terminal_status:
        type: str
        required: false
        default: failed
    returns:
      type: dict[str, Any]
    exceptions: []
    side_effects: Updates in-memory queue state.
  - name: mark_timed_out
    description: Mark a flow as timed out and preserve a normalized timeout reason
      unless canceled.
    locked: false
    inputs:
      flow_idx:
        type: int
        required: true
      reason:
        type: str
        required: false
        default: transcription_timeout
    returns:
      type: dict[str, Any]
    exceptions: []
    side_effects: Updates in-memory queue state.
  - name: cancel
    description: Cancel queued/pending work for a flow and clear stored errors.
    locked: false
    inputs:
      flow_idx:
        type: int
        required: true
    returns:
      type: dict[str, Any]
    exceptions: []
    side_effects: Updates in-memory queue state.
  - name: next_payload
    description: Pop the next non-canceled queued payload.
    locked: false
    inputs: {}
    returns:
      type: tuple[int, dict[str, Any]] | None
    exceptions: []
    side_effects: Updates in-memory queue state.
  - name: wait_for_pending
    description: Block until no flow transcriptions are pending.
    locked: false
    inputs: {}
    returns:
      type: None
    exceptions: []
    side_effects: Waits on queue condition.
  - name: pending_count
    description: Return count of pending transcription flows.
    locked: false
    inputs: {}
    returns:
      type: int
    exceptions: []
    side_effects: none
  - name: clear
    description: Clear all queue, cancellation, error, and job tracking state.
    locked: false
    inputs: {}
    returns:
      type: None
    exceptions: []
    side_effects: Updates in-memory queue state.
  - name: is_canceled
    description: Return whether a flow has been canceled.
    locked: false
    inputs:
      flow_idx:
        type: int
        required: true
    returns:
      type: bool
    exceptions: []
    side_effects: none
  - name: error_reasons
    description: Return a copy of stored transcription error reasons.
    locked: false
    inputs: {}
    returns:
      type: dict[int, str]
    exceptions: []
    side_effects: none
- name: TranscriptionJobStatusEvent
  description: Immutable status event emitted for queue/UI progress updates.
  locked: false
  attributes:
    flow_idx:
      type: int
    status:
      type: str
    snapshot:
      type: dict[str, Any]
  methods: []
- name: BoundedTranscriptionExecutor
  description: Executes queued transcription jobs with bounded parallelism and status
    callbacks.
  locked: false
  attributes: {}
  methods:
  - name: __init__
    description: Configure queue state, worker function, bounded worker count, and
      optional status callback.
    locked: false
    inputs:
      queue_state:
        type: TranscriptionQueueState
        required: true
      worker_fn:
        type: Callable[..., None]
        required: true
      max_workers:
        type: int
        required: true
      on_status_change:
        type: Callable[[TranscriptionJobStatusEvent], None] | None
        required: false
        default: null
    returns:
      type: None
    exceptions: []
    side_effects: Initializes internal thread pool state.
  - name: submit
    description: Queue and dispatch a transcription job.
    locked: false
    inputs:
      flow_idx:
        type: int
        required: true
      payload:
        type: dict[str, Any]
        required: true
    returns:
      type: None
    exceptions: []
    side_effects: Updates queue state and submits async work.
  - name: shutdown
    description: Shut down the underlying executor.
    locked: false
    inputs:
      wait:
        type: bool
        required: true
    returns:
      type: None
    exceptions: []
    side_effects: Terminates background workers.
