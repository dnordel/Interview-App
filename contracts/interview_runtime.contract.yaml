module:
  name: interview_runtime
  language: python
  path: src/interview_runtime.py
  version: 0.27.0
  description: Flattened public interface for interview state, session management,
    audio/transcription runtime, transcript summary seam, controllers, history, and
    finalize pipeline; only active legacy adapters remain in the compatibility module
    inventory.
functions:
- name: _safe_token
  description: Return a filesystem-safe token for interview session filenames, using
    a fallback when the input is empty after sanitization.
  locked: false
  inputs:
    value:
      type: str
      required: true
    fallback:
      type: str
      required: true
  returns:
    type: str
  exceptions: []
  side_effects: none
- name: available_modules
  description: Return remaining legacy interview modules still exposed through this
    flattened facade.
  locked: false
  inputs: {}
  returns:
    type: tuple[str, ...]
  exceptions: []
  side_effects: none
- name: load_compat_module
  description: Import a remaining legacy module that belongs to the interview runtime
    facade.
  locked: false
  inputs:
    module_name:
      type: str
      required: true
  returns:
    type: ModuleType
  exceptions:
  - AttributeError
  side_effects: Imports the requested module.
- name: module_ownership
  description: Return the ownership map from each remaining legacy interview runtime
    module to the flattened interview_runtime module.
  locked: false
  inputs: {}
  returns:
    type: dict[str, str]
  exceptions: []
  side_effects: none
- name: wrapper_policy
  description: Return the compatibility wrapper policy for remaining legacy interview
    runtime modules during flattening cleanup.
  locked: false
  inputs: {}
  returns:
    type: str
  exceptions: []
  side_effects: none
- name: public_symbols
  description: Return public symbols exposed by one remaining legacy interview runtime
    module or by all remaining interview runtime modules.
  locked: false
  inputs:
    module_name:
      type: str | None
      required: false
      default: None
  returns:
    type: tuple[str, ...]
  exceptions:
  - AttributeError
  side_effects: Imports remaining interview runtime compatibility modules.
- name: resolve_compat_symbol
  description: Resolve a public symbol from the remaining legacy modules owned by
    this facade.
  locked: false
  inputs:
    symbol_name:
      type: str
      required: true
  returns:
    type: Any
  exceptions:
  - AttributeError
  side_effects: Imports legacy modules until the symbol is found.
- name: __dir__
  description: Return module attributes plus flattened public compatibility symbols
    for editor and agent discovery.
  locked: false
  inputs: {}
  returns:
    type: list[str]
  exceptions: []
  side_effects: Imports remaining interview runtime compatibility modules.
- name: append_candidate_segment_text
  description: Append candidate-only text segments while preserving existing transcript
    content.
  locked: false
  inputs:
    existing_text:
      type: str
      required: true
    segments:
      type: list[Any]
      required: true
    candidate_label:
      type: str
      required: true
  returns:
    type: str
  exceptions: []
  side_effects: none
- name: sanitize_transcription_error_reason
  description: Produce a clipped redacted error reason and preserve diagnostic filename
    hints.
  locked: false
  inputs:
    raw_reason:
      type: str
      required: true
    max_length:
      type: int
      required: false
      default: 300
  returns:
    type: str
  exceptions: []
  side_effects: none
- name: build_transcription_log_hint
  description: Build a redacted log-path hint for transcription troubleshooting copy.
  locked: false
  inputs:
    log_path:
      type: Path | str | None
      required: true
  returns:
    type: str
  exceptions: []
  side_effects: none
- name: format_transcription_health_summary
  description: Build joined question labels, redacted details, and a shared log hint.
  locked: false
  inputs:
    transcription_errors:
      type: Mapping[int, str]
      required: true
    question_labeler:
      type: Callable[[int], str]
      required: true
    log_path:
      type: Path | str | None
      required: true
  returns:
    type: tuple[str, str, str]
  exceptions: []
  side_effects: none
- name: write_transcription_diagnostic
  description: Write exception diagnostics as JSON under a diagnostics directory.
  locked: false
  inputs:
    output_dir:
      type: Path
      required: true
    base_name:
      type: str
      required: true
    stage:
      type: str
      required: true
    error:
      type: Exception
      required: true
    context:
      type: Mapping[str, Any]
      required: true
  returns:
    type: Path
  exceptions:
  - OSError
  side_effects: Creates directories/files and writes diagnostic JSON to disk.
- name: probe_audio_file
  description: Probe audio file existence and metadata for diagnostics context.
  locked: false
  inputs:
    path:
      type: Path
      required: true
  returns:
    type: dict[str, Any]
  exceptions: []
  side_effects: Reads filesystem metadata.
- name: build_flow_time_windows
  description: Build flow index start/end windows from recorded flow time marks.
  locked: false
  inputs:
    flow_time_marks:
      type: list[dict[str, Any]]
      required: true
  returns:
    type: list[tuple[int, float, float]]
  exceptions: []
  side_effects: none
- name: map_segments_to_flow_indices
  description: Map candidate segments into flow indices by windowed start-time membership.
  locked: false
  inputs:
    segments:
      type: list[dict[str, Any]]
      required: true
    windows:
      type: list[tuple[int, float, float]]
      required: true
  returns:
    type: dict[int, str]
  exceptions: []
  side_effects: none
- name: write_merged_timestamped_transcript
  description: Write a timestamped interleaved transcript text file from segment records.
  locked: false
  inputs:
    transcript_path:
      type: Path
      required: true
    segments:
      type: list[dict[str, Any]]
      required: true
  returns:
    type: Path
  exceptions: []
  side_effects: writes filesystem
- name: summarize_transcript
  description: Transcript summary seam that accepts an injected summarizer adapter
    and gracefully falls back when local model runtime is unavailable.
  locked: false
  inputs:
    transcript_text:
      type: Any
      required: true
    summarizer:
      type: Optional[Callable[..., Any]]
      required: false
      default: None
    max_chars:
      type: int
      required: false
      default: 2600
  returns:
    type: str
  exceptions: []
  side_effects: May initialize cached transformers pipeline.
- name: build_deepseek_summary_config
  description: Build local DeepSeek interview summary config from environment values,
    defaulting to Ollama at 127.0.0.1 and the configured local 8b DeepSeek model while
    rejecting non-local base URLs, resolving the model-output debug log directory,
    and loading prompt templates from config/deepseek_prompts.json when no explicit
    prompt map is supplied.
  locked: false
  inputs:
    env:
      type: Mapping[str, Any] | None
      required: false
      default: null
  returns:
    type: DeepSeekSummaryConfig
  exceptions: []
  side_effects: Reads process environment when env is null and may read config/deepseek_prompts.json.
- name: load_deepseek_prompt_templates
  description: Load and normalize DeepSeek prompt templates from config/deepseek_prompts.json,
    falling back to built-in defaults when the file is missing or invalid.
  locked: false
  inputs:
    path:
      type: Path | None
      required: false
      default: null
  returns:
    type: dict[str, Any]
  exceptions: []
  side_effects: Reads a local prompt config JSON file when present.
- name: save_deepseek_prompt_templates
  description: Normalize and atomically persist global and per-question DeepSeek prompt
    templates to config/deepseek_prompts.json or a supplied path.
  locked: false
  inputs:
    templates:
      type: Mapping[str, Any]
      required: true
    path:
      type: Path | None
      required: false
      default: null
  returns:
    type: dict[str, Any]
  exceptions:
  - OSError
  side_effects: Writes a local prompt config JSON file.
- name: normalize_deepseek_prompt_templates
  description: Merge global and per-question DeepSeek prompt template settings with
    defaults, accepting string global prompts and JSON-object per-question override
    maps while dropping blank keys or blank override prompts. Default user prompts
    include explicit JSON output templates for answer summaries, executive summary
    sections, trait suggestions, and trait scoring.
  locked: false
  inputs:
    value:
      type: Any
      required: true
  returns:
    type: dict[str, Any]
  exceptions: []
  side_effects: none
- name: format_deepseek_question_prompt_overrides
  description: Convert per-question DeepSeek prompt override maps into human-readable
    Question/Prompt blocks for Settings UI editing instead of raw JSON.
  locked: false
  inputs:
    value:
      type: Any
      required: true
  returns:
    type: str
  exceptions: []
  side_effects: none
- name: parse_deepseek_question_prompt_overrides
  description: Parse human-readable Question/Prompt blocks or legacy JSON maps into
    normalized per-question DeepSeek prompt override dictionaries.
  locked: false
  inputs:
    value:
      type: Any
      required: true
  returns:
    type: dict[str, str]
  exceptions:
  - ValueError
  - json.JSONDecodeError
  side_effects: none
- name: _render_deepseek_prompt_template
  description: Render a DeepSeek prompt template by replacing supported named tokens
    such as payload_json while leaving unrelated JSON-schema braces intact.
  locked: false
  inputs:
    template:
      type: str
      required: true
    values:
      type: Mapping[str, Any]
      required: true
  returns:
    type: str
  exceptions: []
  side_effects: none
- name: _deepseek_question_keys
  description: Return candidate per-question prompt lookup keys from a transcript
    or trait item, preferring id, trait_id, then flow_index.
  locked: false
  inputs:
    item:
      type: Mapping[str, Any]
      required: true
  returns:
    type: list[str]
  exceptions: []
  side_effects: none
- name: _deepseek_progress_label
  description: Build an operator-facing DeepSeek progress label that includes processing
    action, question number or trait id, and section/question title when present.
  locked: false
  inputs:
    action:
      type: str
      required: true
    item:
      type: Mapping[str, Any]
      required: true
    fallback:
      type: str
      required: false
      default: ""
  returns:
    type: str
  exceptions: []
  side_effects: none
- name: _resolve_deepseek_question_prompt
  description: Select a per-question DeepSeek user prompt override from the configured
    map, falling back to the global prompt template for that DeepSeek task.
  locked: false
  inputs:
    prompt_templates:
      type: Mapping[str, Any]
      required: true
    map_key:
      type: str
      required: true
    default_key:
      type: str
      required: true
    item:
      type: Mapping[str, Any]
      required: true
  returns:
    type: str
  exceptions: []
  side_effects: none
- name: _request_local_ollama_json_completion
  description: Send a local Ollama native /api/generate request with JSON format enabled
    and adapt the response into the chat-completion shape used by DeepSeek parsing;
    local Ollama requests use the configured HTTP read timeout and a bounded response
    token cap so malformed or overlong local generations cannot block detached finalize
    export indefinitely.
  locked: false
  inputs:
    config:
      type: DeepSeekSummaryConfig
      required: true
    messages:
      type: list[dict[str, str]]
      required: true
  returns:
    type: dict[str, Any]
  exceptions:
  - OSError
  - json.JSONDecodeError
  side_effects: Sends transcript-bearing prompt text only to a local Ollama host.
- name: _request_deepseek_content
  description: Request one DeepSeek completion through an injected callable or the
    configured local request path and return extracted message content.
  locked: false
  inputs:
    config:
      type: DeepSeekSummaryConfig
      required: true
    messages:
      type: list[dict[str, str]]
      required: true
    chat_completion:
      type: Optional[Callable[[DeepSeekSummaryConfig, list[dict[str, str]]], dict[str, Any]]]
      required: false
      default: null
  returns:
    type: str
  exceptions:
  - OSError
  - json.JSONDecodeError
  side_effects: May send transcript-bearing prompt text to local Ollama.
- name: _deepseek_debug_log_path
  description: Resolve the JSONL debug log path for raw DeepSeek model output when
    debug logging is configured.
  locked: false
  inputs:
    config:
      type: DeepSeekSummaryConfig
      required: true
  returns:
    type: Path | None
  exceptions: []
  side_effects: none
- name: _write_deepseek_debug_log
  description: Append one raw DeepSeek model-output debug event with prompt name,
    response text, validation outcome, candidate name, job title, and timestamp.
  locked: false
  inputs:
    config:
      type: DeepSeekSummaryConfig
      required: true
    prompt_name:
      type: str
      required: true
    model_response:
      type: str
      required: true
    parse_success:
      type: bool
      required: true
    validation_errors:
      type: list[str]
      required: true
    candidate_name:
      type: str
      required: false
      default: ''
    job_title:
      type: str
      required: false
      default: ''
  returns:
    type: None
  exceptions: []
  side_effects: May create a local log directory and append one JSONL event.
- name: _normalize_deepseek_completion_until_valid
  description: Request one DeepSeek prompt, parse only the first valid JSON object,
    validate it through the provided normalizer, log raw model output and validation
    status, then retry once with a strict repair prompt when parsing or validation fails.
  locked: false
  inputs:
    config:
      type: DeepSeekSummaryConfig
      required: true
    messages:
      type: list[dict[str, str]]
      required: true
    normalizer:
      type: Callable[[str], dict[str, Any] | list[dict[str, Any]]]
      required: true
    chat_completion:
      type: Optional[Callable[[DeepSeekSummaryConfig, list[dict[str, str]]], dict[str, Any]]]
      required: false
      default: null
    progress_callback:
      type: Optional[Callable[[str], None]]
      required: false
      default: null
    step_label:
      type: str
      required: false
      default: DeepSeek prompt
    max_attempts:
      type: int
      required: false
      default: 2
    prompt_name:
      type: str
      required: false
      default: ''
    candidate_name:
      type: str
      required: false
      default: ''
    job_title:
      type: str
      required: false
      default: ''
  returns:
    type: dict[str, Any] | list[dict[str, Any]]
  exceptions:
  - OSError
  - ValueError
  side_effects: May repeat local Ollama requests for the same prompt and may append
    JSONL debug events containing prompt name, raw response, validation outcome,
    candidate name, job title, and timestamp.
- name: generate_deepseek_interview_summaries
  description: >-
    Generate degraded, failed, or DeepSeek-backed finalize summaries using one
    configurable prompt per transcripted answer plus a separate configurable
    executive summary prompt; per-question answer prompts may override the global
    answer prompt by question id, trait id, or flow index. Executive-summary
    prompts include transcript, candidate, answer-summary, selected job title,
    matching role context, and optional scoring context. Prompts are evidence-first,
    role-aware, reject generic/invented claims, preserve usable question/prompt
    labels for answer summaries, require non-scored answers to leave rubric
    alignment empty, request and require an explicit
    executive_summary_sections JSON object matching
    the director-scan template order of recommendation, overall fit,
    role-specific match, score pattern, paired strengths/concerns, four follow-up
    questions, and final hiring notes, synthesize compatible executive_summary
    text when structured sections are returned without summary text, and retry
    invalid JSON responses once with a repair prompt, validate JSON object responses
    against required top-level keys, remove unsupported generated evidence quotes,
    preserve confidence values, and return a manual-review placeholder when an
    executive section fails so document export can continue. Optional progress callbacks receive operator-facing step labels
    such as "Summarizing Q1: Classroom routines" and "Generating Executive
    Summary".
  locked: false
  inputs:
    flow_transcript:
      type: list[dict[str, Any]]
      required: true
    candidate:
      type: dict[str, Any]
      required: true
    config:
      type: DeepSeekSummaryConfig | None
      required: false
      default: null
    chat_completion:
      type: Optional[Callable[[DeepSeekSummaryConfig, list[dict[str, str]]], dict[str, Any]]]
      required: false
      default: null
    scoring:
      type: dict[str, Any] | None
      required: false
      default: null
    progress_callback:
      type: Optional[Callable[[str], None]]
      required: false
      default: null
  returns:
    type: dict[str, Any]
    description: Contains answer_summaries, executive_summary,
      executive_summary_sections, interview_highlights, confidence when supplied,
      summary_status, and summary_warnings; normalization preserves full generated
      section prose without character clipping.
  exceptions: []
  side_effects: May send transcript text to local Ollama when enabled and no injected
    chat_completion is provided.
- name: generate_deepseek_trait_signal_suggestions
  description: >-
    Generate degraded, failed, or DeepSeek-backed model trait observation
    suggestions and advisory 1-5 raw trait scores keyed by trait id without
    changing human raw scores or compatibility selected_signal_ids; each trait is
    requested independently with configurable per-trait prompt overrides for
    question-and-answer-first signal suggestions and advisory raw scoring, with
    preschool employee readiness and emotional intelligence emphasized over
    rubric-wording matches for the signal suggestion prompt. Role context from
    transcript items is included when available. Local Ollama calls use the configured timeout and
    invalid JSON responses are retried once with a repair prompt; responses are
    validated against required top-level keys, unsupported generated evidence quotes
    are removed, confidence values and risk_flag_evidence values are preserved, and failed traits remain advisory
    partial output. Optional progress callbacks receive operator-facing step labels such as
    "Analyzing Traits Q1: Empathy" and "Scoring Q1: Empathy". Status values may
    be generated, partial, failed, disabled, or no_transcript.
  locked: false
  inputs:
    flow_transcript:
      type: list[dict[str, Any]]
      required: true
    trait_state:
      type: dict[str, dict[str, Any]]
      required: true
    rubric:
      type: dict[str, Any] | None
      required: false
      default: null
    config:
      type: DeepSeekSummaryConfig | None
      required: false
      default: null
    chat_completion:
      type: Optional[Callable[[DeepSeekSummaryConfig, list[dict[str, str]]], dict[str, Any]]]
      required: false
      default: null
    progress_callback:
      type: Optional[Callable[[str], None]]
      required: false
      default: null
  returns:
    type: dict[str, Any]
    description: Contains model_signal_suggestions_by_trait, model_suggestion_status,
      model_suggestion_warnings, model_trait_scores_by_trait including
      risk_flag_evidence when supplied, model_scoring_status,
      and model_scoring_warnings. A trait_suggestions item with an empty suggestions
      list is a generated empty advisory result, not a failed generation.
  exceptions: []
  side_effects: May send transcript text to local Ollama when enabled and no injected
    chat_completion is provided.
- name: recommended_max_workers
  description: Return a hardware-aware default max worker count for transcription
    jobs.
  locked: false
  inputs:
    cpu_count:
      type: int | None
      required: false
      default: null
  returns:
    type: int
  exceptions: []
  side_effects: none
- name: resolve_transcription_max_workers
  description: Resolve configured transcription worker count with safe fallback bounds.
  locked: false
  inputs:
    settings:
      type: dict[str, Any]
      required: true
  returns:
    type: int
  exceptions: []
  side_effects: none
- name: resolve_transcription_job_timeout_seconds
  description: Resolve per-job transcription timeout from settings with bounded fallback
    values.
  locked: false
  inputs:
    settings:
      type: dict[str, Any]
      required: true
  returns:
    type: float
  exceptions: []
  side_effects: none
- name: resolve_runtime
  description: Resolve configured Whisper runtime model, device, and compute type
    with defaults.
  locked: false
  inputs:
    settings:
      type: dict[str, Any]
      required: true
  returns:
    type: RuntimeConfig
  exceptions: []
  side_effects: none
- name: fallback_from_exception
  description: Return a CPU fallback runtime for device-related Whisper runtime errors.
  locked: false
  inputs:
    exc:
      type: Exception
      required: true
    preferred:
      type: RuntimeConfig
      required: true
    settings:
      type: dict[str, Any]
      required: true
  returns:
    type: RuntimeConfig | None
  exceptions: []
  side_effects: none
- name: persist_runtime_choice
  description: Persist resolved Whisper runtime settings and selection mode.
  locked: false
  inputs:
    settings:
      type: dict[str, Any]
      required: true
    runtime_config:
      type: RuntimeConfig
      required: true
    mode:
      type: str
      required: true
  returns:
    type: None
  exceptions: []
  side_effects: Mutates runtime settings.
- name: list_windows_dshow_audio_devices
  description: Probe ffmpeg DirectShow devices and return detected audio device names.
  locked: false
  inputs:
    ffmpeg_exe:
      type: str | None
      required: false
      default: null
  returns:
    type: list[str]
  exceptions: []
  side_effects: Executes ffmpeg subprocess for device enumeration.
- name: resolve_preferred_windows_audio_device
  description: Resolve the best available Windows audio device using preferred name
    and alias candidates.
  locked: false
  inputs:
    preferred_name:
      type: str
      required: true
    aliases:
      type: Sequence[str] | None
      required: false
      default: null
    available_devices:
      type: Sequence[str] | None
      required: false
      default: null
  returns:
    type: str
  exceptions: []
  side_effects: none
- name: resolve_default_windows_system_device
  description: Resolve VB-CABLE system capture device using probing and known aliases.
  locked: false
  inputs: {}
  returns:
    type: str
  exceptions: []
  side_effects: Probes local ffmpeg audio devices when available.
- name: build_finalize_context
  description: Build finalize payload, timestamp-split flow transcript, transcript
    metadata, model trait suggestions, advisory model trait scores, DeepSeek answer-summary/executive-summary
    fields or processing placeholders, and legacy empty transcript path from app state;
    local DeepSeek executive-summary prompts receive scoring context after advisory
    model scoring is processed.
  locked: false
  inputs:
    app:
      type: Any
      required: true
    scoring:
      type: dict[str, Any]
      required: true
    warnings:
      type: list[str]
      required: true
    transcript_metadata:
      type: dict[str, Any]
      required: true
    run_deepseek:
      type: bool
      required: false
      default: true
  returns:
    type: FinalizeContext
  exceptions: []
  side_effects: Applies candidate transcript text to flow payloads, may invoke local
    DeepSeek when requested and enabled, and clears the legacy referral transcript
    path for new finalize output.
- name: finalize_progress_status_label
  description: Normalize internal progress states to the four operator-facing finalize
    statuses Processing, Finished, Timed-out, or Queued.
  locked: false
  inputs:
    status:
      type: Any
      required: true
  returns:
    type: str
  exceptions: []
  side_effects: none
- name: build_finalize_progress_tasks
  description: Merge queued, existing, and current finalize progress steps into an
    ordered task/status list, marking ordered prior Queued/Processing tasks Finished
    when later work is reached and marking every remaining Queued/Processing task
    Finished when the final status is complete.
  locked: false
  inputs:
    step:
      type: Any
      required: true
    status:
      type: Any
      required: false
      default: processing
    existing_tasks:
      type: Any
      required: false
      default: null
    queued_steps:
      type: Any
      required: false
      default: null
  returns:
    type: list[dict[str, str]]
  exceptions: []
  side_effects: none
- name: format_finalize_progress_tasks
  description: Format finalize task/status rows for compact two-column popup display
    where task names appear left and the normalized status appears on the right.
  locked: false
  inputs:
    tasks:
      type: Any
      required: true
    fallback:
      type: str
      required: false
      default: ''
  returns:
    type: str
  exceptions: []
  side_effects: none
- name: _write_deepseek_launch_progress
  description: Seed sanitized detached DeepSeek progress JSON before starting the
    worker process so GUI polling has an immediate operator-facing task/status list.
  locked: false
  inputs:
    progress_path:
      type: Path
      required: true
    step:
      type: str
      required: true
    status:
      type: str
      required: false
      default: processing
  returns:
    type: None
  exceptions:
  - OSError
  side_effects: Writes or replaces a local progress JSON file containing only status,
    step, task/status rows, and timestamp metadata.
- name: enqueue_deepseek_finalize_job
  description: Persist a detached DeepSeek finalize job and launch the worker process
    so interview notes can be refreshed after the GUI finalize flow returns or exits;
    launched workers serialize execution through the DeepSeek finalize lock in the
    job directory. Each job includes a sibling progress JSON path for GUI polling of
    exact DeepSeek steps.
  locked: false
  inputs:
    app:
      type: Any
      required: true
    context:
      type: FinalizeContext
      required: true
    out_path:
      type: str
      required: true
    history_id:
      type: str
      required: true
