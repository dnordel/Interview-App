  side_effects: Writes a local job JSON file, stores deepseek_job_path and deepseek_progress_path
    on the matching history row, seeds sanitized progress JSON, and starts a detached
    Python worker when a persistent history path is available; the worker later creates/removes
    the per-directory DeepSeek finalize lock before local Ollama, DOCX, and history work.
- name: resolve_deepseek_regeneration_job_path
  description: Resolve an existing DeepSeek finalize job for a history row, or synthesize
    a replacement job from a matching saved interview_sessions JSON transcript when
    legacy rows predate persisted DeepSeek job files.
  locked: false
  inputs:
    row:
      type: dict[str, Any]
      required: true
    history_path:
      type: Path | None
      required: false
    base_dir:
      type: Path | None
      required: false
  returns:
    type: Path | None
  exceptions:
  - OSError
  side_effects: May read interview history/session JSON, create a deepseek_jobs directory,
    write a synthesized job JSON, and update the matching history row with job/progress
    paths.
- name: _deepseek_job_path_candidates
  description: Build ordered candidate DeepSeek job paths from a history row, history
    store path, and configured interview artifact base directory.
  locked: false
  inputs:
    row:
